<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#18345b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AtlasQuant" />
  <meta name="description" content="AtlasQuant — inteligência macro, técnica e institucional para Forex." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <title>AtlasQuant</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: #0d1728; font-family: Arial, sans-serif; }
    #bar {
      height: 48px; display:flex; align-items:center; gap:10px; padding:0 12px;
      background:#0d1728; color:#fff; border-bottom:1px solid rgba(255,255,255,.12);
    }
    #brand { font-weight: 700; flex: 1; white-space: nowrap; }
    #status {
      border:1px solid rgba(255,255,255,.16); border-radius:999px; padding:5px 8px;
      font-size:11px; font-weight:700; color:#dbe9ff; background:rgba(255,255,255,.06);
    }
    #status.offline { color:#ffd7a8; border-color:rgba(255,180,90,.35); }
    button, a.btn {
      border:0; border-radius:8px; padding:8px 11px; font-weight:700; cursor:pointer;
      background:#1f6feb; color:#fff; text-decoration:none; font-size:13px;
    }
    #installBtn { display:none; background:#2ea043; }
    #frame {
      width:100%; height:calc(100vh - 48px); border:0; background:#fff;
    }
    #iosHint {
      display:none; position:fixed; left:12px; right:12px; bottom:16px; z-index:50;
      background:#fff; color:#111; border-radius:12px; padding:12px 14px; box-shadow:0 8px 28px rgba(0,0,0,.35);
      font-size:14px;
    }
    @media (max-width: 520px) {
      #bar { gap:6px; padding:0 8px; }
      #brand { font-size:14px; overflow:hidden; text-overflow:ellipsis; }
      button, a.btn { padding:7px 9px; font-size:12px; }
    }
  </style>
</head>
<body>
  <div id="bar">
    <div id="brand">🦅 AtlasQuant</div>
    <div id="status" aria-live="polite">Conectando…</div>
    <button id="installBtn">Instalar app</button>
    <a class="btn" href="https://atlasquant-private.onrender.com/" target="_blank" rel="noopener">Abrir direto</a>
  </div>

  <iframe
    id="frame"
    src="https://atlasquant-private.onrender.com/?embed=true"
    title="AtlasQuant"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer"
    loading="eager"
  ></iframe>

  <div id="iosHint">
    No iPhone/iPad: toque em <b>Compartilhar</b> → <b>Adicionar à Tela de Início</b>.
    <button onclick="this.parentElement.style.display='none'" style="float:right;background:#555;">Fechar</button>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
    }

    let deferredPrompt = null;
    const installBtn = document.getElementById("installBtn");
    const frame = document.getElementById("frame");
    const statusBadge = document.getElementById("status");

    function updateNetworkStatus() {
      if (navigator.onLine) {
        statusBadge.textContent = "Online";
        statusBadge.classList.remove("offline");
      } else {
        statusBadge.textContent = "Sem conexão";
        statusBadge.classList.add("offline");
      }
    }
    window.addEventListener("online", updateNetworkStatus);
    window.addEventListener("offline", updateNetworkStatus);
    frame.addEventListener("load", updateNetworkStatus);
    updateNetworkStatus();

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = "inline-block";
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.style.display = "none";
    });

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
    if (isIOS && !isStandalone) {
      document.getElementById("iosHint").style.display = "block";
    }
  </script>
</body>
</html>
