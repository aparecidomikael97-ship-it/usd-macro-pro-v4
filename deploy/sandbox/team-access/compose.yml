name: atlasquant-team-access-sandbox

services:
  keycloak-db:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: "no"
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME:?KC_DB_USERNAME required}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - team_access_sandbox

  registry-db:
    image: ${POSTGRES_IMAGE:-postgres:18.6}
    restart: "no"
    environment:
      POSTGRES_DB: atlasquant_registry
      POSTGRES_USER: ${REGISTRY_DB_USERNAME:?REGISTRY_DB_USERNAME required}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?REGISTRY_DB_PASSWORD required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${REGISTRY_DB_USERNAME} -d atlasquant_registry"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${REGISTRY_DB_PORT:-15432}:5432"
    volumes:
      - registry_db_data:/var/lib/postgresql/data
    networks:
      - team_access_sandbox

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.7.5}
    restart: "no"
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?KC_BOOTSTRAP_ADMIN_USERNAME required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?KC_BOOTSTRAP_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: ${KC_DB_USERNAME:?KC_DB_USERNAME required}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?KC_DB_PASSWORD required}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    depends_on:
      keycloak-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-18080}:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro
    networks:
      - team_access_sandbox

networks:
  team_access_sandbox:
    driver: bridge

volumes:
  keycloak_db_data:
  registry_db_data:
