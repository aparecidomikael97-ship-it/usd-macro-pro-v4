name: A190 G43 Outbox JSON projection audit and dry-run LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g43_outbox_projection_dryrun_lab.py'
      - '.github/workflows/aion-a190-g43-projection-dryrun-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g43-projection:
    name: G43 projection dry-run / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only crypto
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G43 JSON projection invariants and conditional one-row LAB repair
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g43_*.py' -v 2>&1 | tee g43.log
          grep -F 'Ran 22 tests' g43.log
          grep -F 'G43_READONLY_PLAN_GREEN=NO_HISTORICAL_WRITE' g43.log
          grep -F 'G43_EXPLICIT_ONE_ROW_GREEN=ATOMIC_JSON_COLUMN_CAS' g43.log
          grep -F 'G43_NEW_CONFIRM_GREEN=PROJECTION_AND_LEDGER_SAME_COMMIT' g43.log
          grep -F 'G43_LEDGER_IMMUTABLE_GREEN=NO_RECEIPT_OR_TIMESTAMP_REWRITE' g43.log
          grep -F 'G43_STALE_PLAN_GREEN=CONCURRENT_STATE_CHANGE_DENIED' g43.log
          grep -F 'G43_TAMPER_GREEN=FOREIGN_IDENTITY_REFUSED' g43.log
          grep -F 'G43_NO_RECEIPT_RED=CONFIRMED_WITHOUT_LEDGER_REFUSED' g43.log
          grep -F 'G43_LEGACY_JSON_RED=OLD_WRITER_RETAINS_PENDING_FIELD' g43.log
          grep -F 'G43_REOPEN_GREEN=NO_IMPLICIT_BACKFILL_OR_TRIGGER' g43.log
          grep -F 'G43_HOST_ROLLBACK_RED=NO_EXTERNAL_ANTIROLLBACK_FROM_JSON_SYNC' g43.log
          grep -F 'G43_SCHEMA_GREEN=NO_UNREVIEWED_TRIGGER_VIEW_OR_USER_VERSION_CHANGE' g43.log
      - name: G42-G30 inherited adversarial regression
        shell: bash
        run: |
          set -o pipefail
          for n in 42 41 40 39 38 37 36 35 34 33 32 31 30; do
            python -B -m unittest discover -s labs/a190 -p "test_g${n}_*.py" -v 2>&1 | tee "g${n}.log"
          done
          grep -F 'Ran 28 tests' g42.log
          grep -F 'Ran 18 tests' g41.log
          grep -F 'Ran 36 tests' g40.log
          grep -F 'Ran 28 tests' g39.log
          grep -F 'Ran 24 tests' g38.log
          grep -F 'Ran 34 tests' g37.log
          grep -F 'Ran 20 tests' g36.log
          grep -F 'Ran 18 tests' g35.log
          grep -F 'Ran 16 tests' g34.log
          grep -F 'Ran 24 tests' g33.log
          grep -F 'Ran 20 tests' g32.log
          grep -F 'Ran 18 tests' g31.log
          grep -F 'Ran 23 tests' g30.log
      - name: Mandatory hard no-go
        shell: bash
        run: |
          echo 'G43 repairs require explicit LAB opt-in + approved single-row plan.'
          echo 'No silent historical backfill, triggers, views or schema migration.'
          echo 'JSON sync does not independently authenticate external effect.'
          echo 'No Worker/provider, main/merge/deploy, customers, secrets, spending.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
