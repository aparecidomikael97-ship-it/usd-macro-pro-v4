permissions:
  contents: read

jobs:
  pilot-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install B2B test dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2

      - name: Compile bounded B2B modules
        run: |
          python -m py_compile \
            atlasquant_aion_managed_operations_simulation.py \
            atlasquant_aion_b2b_pilot_readiness.py \
            atlasquant_aion_b2b_pilot_operating_contract.py \
