name: AION A95 LAB credential-key staging denial (no provider)

on:
  pull_request:
    branches: [lab/aion-v16-a90-historical-quality-security-rebaseline-20261015]
    paths:
      - "atlasquant_aion_action_payload_gate.py"
      - "test_atlasquant_aion_a95_credential_key_staging.py"
      - ".github/workflows/aion-a95-credential-key-denial-lab.yml"
      - ".github/workflows/quality-tests.yml"
      - "test_atlasquant_aion_convergence.py"

permissions:
  contents: read

jobs:
  credential_staging:
    name: A95 credential key fail closed (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install existing pinned test dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A95 and A89/A88/Saga/Outbox regressions (failures remain red)
        run: >-
          python -m unittest -q
          test_atlasquant_aion_a95_credential_key_staging
          test_atlasquant_aion_a89_canonical_action_payload
          test_atlasquant_aion_a88_redacted_payload_identity
          test_atlasquant_aion_saga_plan_integrity_a50
          test_atlasquant_aion_outbox_fifo_local_terminal_denial
          test_atlasquant_aion_outbox_missing_predecessor_denial
          test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_enqueue_is_transactional_idempotent_and_collision_safe
      - name: Existing manifest and immutable origin/main convergence
        run: >-
          python -m unittest -q
          test_quality_workflow_coverage
          test_atlasquant_aion_convergence
