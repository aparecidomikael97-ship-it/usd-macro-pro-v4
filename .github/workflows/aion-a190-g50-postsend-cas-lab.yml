name: A190 G50 synthetic post-send stale reply CAS LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g50_postsend_stale_reply_lab.py'
      - '.github/workflows/aion-a190-g50-postsend-cas-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g50-postsend:
    name: G50 post-send CAS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install minimal LAB-only dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G50 adversarial post-send stale reply tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g50_*.py' -v 2>&1 | tee g50.log
          grep -F 'Ran 7 tests' g50.log
          grep -F 'G50_POSTSEND_CONFIRMED_GREEN=LEDGER_NOT_DOWNGRADED' g50.log
          grep -F 'G50_POSTSEND_REVOKED_GREEN=NO_RESURRECTION' g50.log
          grep -F 'G50_POSTSEND_EPOCH_GREEN=NO_STALE_TRANSITION' g50.log
          grep -F 'G50_POSTSEND_EXCEPTION_GREEN=NO_OVERWRITE' g50.log
      - name: G49-G39 inherited synthetic regression
        shell: bash
        run: |
          set -o pipefail
          for entry in 'g49 7' 'g48 11' 'g47 18' 'g46 10' 'g45 7' 'g44 39' 'g43 32' 'g42 28' 'g41 18' 'g40 36' 'g39 28'; do
            set -- $entry
            pattern="test_$1_*.py"
            count="$2"
            python -B -m unittest discover -s labs/a190 -p "$pattern" -v 2>&1 | tee "$1.log"
            grep -F "Ran $count tests" "$1.log"
          done
      - name: Safety boundary (mandatory)
        shell: bash
        run: |
          echo 'G50 does not enable provider SEND, trusted receipt or external authority.'
          echo 'Synthetic callbacks and local CAS do not prove real exactly-once effects.'
          echo 'No merge, main, deploy, Worker, customer, secrets or spend.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
