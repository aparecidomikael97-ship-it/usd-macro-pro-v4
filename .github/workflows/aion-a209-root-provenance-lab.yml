name: AION A209 Offline Root Provenance Failclosed LAB

on:
  pull_request:
    paths:
      - "labs/a209_root_provenance_gate.py"
      - "labs/test_a209_root_provenance_failclosed.py"
      - "docs/lab/aion_a209_root_provenance_failclosed.md"
      - ".github/workflows/aion-a209-root-provenance-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-provenance:
    name: A209 host root claims grant no authority / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install minimal import dependency
        run: python -m pip install requests==2.34.2
      - name: Test A209 denial, A208 structural contract and A206 SQLite regression
        run: python -B -m unittest -v labs.test_a209_root_provenance_failclosed labs.test_a208_independent_receipt_preflight labs.test_a206_late_send_outcome_cas
