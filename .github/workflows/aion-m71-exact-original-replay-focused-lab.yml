name: AION M71 exact stale READY replay resolved (FOCUSED LAB)

on:
  push:
    branches: [lab/aion-m71-fresh-incident-execution-hardstop-20261019]
    paths:
      - atlasquant_aion_global_worker_reactivation_gate.py
      - test_aion_m71_execution_fresh_source_denial_lab.py
      - test_aion_p0_m71_original_stale_gate_safety_negative_lab.py
      - .github/workflows/aion-m71-exact-original-replay-focused-lab.yml

permissions:
  contents: read

jobs:
  m71_strict_negative:
    name: No incident witness = no execution READY (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 85
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Pin A118 gate original and unmodified final activation boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c62fab663c6349d7320f7843c8d09587c514426b:atlasquant_aion_global_worker_reactivation_gate.py)" = "8412ada82761de37a72a8f29af7f8672cfb5b082"
          test "$(git hash-object atlasquant_aion_global_worker_reactivation_gate.py)" = "8533ae3c1720d4230dace6478a40f9f11b9677d4"
          test "$(git hash-object atlasquant_aion_global_worker_activation.py)" = "df43bb4371c784396069f4ede51205b0aa19cc0a"
          echo "M71_ORIGINAL_RED_SOURCE_AND_LAB_PATCH_PINNED"
      - name: Install tracked existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Run 12 unmodified M71 property contracts and 1 ORIGINAL negative replay
        run: |
          python -B -c "import unittest; s=unittest.defaultTestLoader.loadTestsFromNames(['test_aion_m71_execution_fresh_source_denial_lab','test_aion_p0_m71_original_stale_gate_safety_negative_lab']); assert s.countTestCases()==13, s.countTestCases(); print('M71_RED_TO_GREEN_ORIGINAL_PLUS_NEW_13_CASES')"
          python -B -m unittest -v test_aion_m71_execution_fresh_source_denial_lab test_aion_p0_m71_original_stale_gate_safety_negative_lab
      - name: Record independent No-Go authority controls unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object atlasquant_aion_global_worker.py)" = "f4cd9f358aee285747321e96be3db82691e02fe8"
          test "$(git hash-object atlasquant_aion_execution_outbox.py)" = "cd78ed43ad63888408eb599e28379c193c541de2"
          echo "M71_WRITER_OUTBOX_HARD_NO_GO_INTACT"
