name: AION G95 G94 SQLite Windows historical errors recheck LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_durable_execution_kernel.py'
      - '.github/workflows/aion-g95-durable-sqlite-windows-quality-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-b2b-windows:
    name: G95 historical 17 B2B modules / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact patched G90 dependencies
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run all 17 historically Windows-locked B2B test modules
        shell: bash
        run: |
          set -o pipefail
          python -B - 2>&1 <<'PY' | tee g95-b2b-windows.log
          import socket
          import unittest
          from unittest.mock import Mock
          def no_network(*_a, **_kw):
              raise AssertionError("G95_NETWORK_EGRESS_DENIED")
          socket.socket.connect = Mock(side_effect=no_network)
          socket.socket.connect_ex = Mock(side_effect=no_network)
          socket.create_connection = Mock(side_effect=no_network)
          names = (
              'test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_offline_v1',
              'test_atlasquant_aion_b2b_terminal_certificate_read_model_runtime_projection_offline_v1',
              'test_atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1',
              'test_atlasquant_aion_b2b_terminal_certificate_read_model_ui_runtime_binding_offline_v1',
              'test_atlasquant_aion_b2b_terminal_certificate_panel_component_offline_v1',
              'test_atlasquant_aion_b2b_pilot_owner_decision',
              'test_atlasquant_aion_b2b_pilot_activation_ceremony',
              'test_atlasquant_aion_b2b_pilot_activation_execution_ceremony',
              'test_atlasquant_aion_b2b_owner_renewal_signature',
              'test_atlasquant_aion_b2b_owner_renewal_action_ceremony',
              'test_atlasquant_aion_b2b_owner_renewal_action_writer_attestation',
              'test_atlasquant_aion_b2b_owner_renewal_action_execution_ceremony',
              'test_atlasquant_aion_b2b_pilot_checkpoint_writer_attestation',
              'test_atlasquant_aion_b2b_pilot_activation_writer_attestation',
              'test_atlasquant_aion_b2b_pilot_activation_execution_writer_attestation',
              'test_atlasquant_aion_b2b_owner_renewal_writer_attestation',
              'test_atlasquant_aion_b2b_owner_renewal_action_execution_writer_attestation',
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          count = suite.countTestCases()
          print("G95_B2B_MODULES=17 TESTS=" + str(count), flush=True)
          if count < 1:
              raise SystemExit("G95_EMPTY_SUITE_DENIED")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          grep -F 'G95_B2B_MODULES=17 TESTS=' g95-b2b-windows.log
  canonical-quality:
    name: G95 exact canonical Quality / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install identical G90 canonical pinned dependencies
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
          python -m pip check
      - name: Full original 6449-case Quality with A183 LAB socket guard
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/run_a183_canonical_lab.py quality 2>&1 | tee g95-canonical-quality.log
          grep -F 'Ran 6449 tests' g95-canonical-quality.log
  canonical-security-ubuntu:
    name: G95 original canonical Security / Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install identical G90 canonical pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
          python -m pip check
      - name: Original core Security unittest
        run: python -B scripts/run_a183_canonical_lab.py security-unittest
      - name: Original core Security pytest
        run: python -B scripts/run_a183_canonical_lab.py security-pytest
