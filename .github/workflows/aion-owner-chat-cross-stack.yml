name: AION Owner Chat Cross-Stack Security (offline only)

on:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_owner_experience_v1.py"
      - "atlasquant_aion_chat_product_bridge.py"
      - "tests/test_aion_owner_chat_cross_stack_security.py"
      - "tests/test_atlasquant_aion_owner_experience_v1.py"
      - ".github/workflows/aion-owner-chat-cross-stack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-negative:
    name: Owner/chat trust and handoff / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - name: Checkout exact PR source HEAD without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned CI-only dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and tests
        run: python -m py_compile atlasquant_aion_owner_experience_v1.py tests/test_aion_owner_chat_cross_stack_security.py tests/test_atlasquant_aion_owner_experience_v1.py
      - name: Run original owner contract + new real-login cross-stack negative tests
        shell: bash
        run: |
          python -B -m unittest discover -v -s tests -p 'test_atlasquant_aion_owner_experience_v1.py'
          python -B -m unittest discover -v -s tests -p 'test_aion_owner_chat_cross_stack_security.py'
      - name: Assert no execution/network/credential lookup was introduced in owner plan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("atlasquant_aion_owner_experience_v1.py").read_text(encoding="utf-8")
          for forbidden in ("subprocess.", "socket.", "requests.", "os.getenv(", "os.environ", "streamlit.secrets"):
              assert forbidden not in p, forbidden
          for gate in ('"automatic_app_launch": False', '"microphone_started": False',
                       '"worker_armed": False', '"deploy_executed": False',
                       '"external_action_executed": False'):
              assert gate in p, gate
          print("OWNER_PLAN_EXECUTION_REMAINS_DISABLED")
          PY
