name: AION G100 Windows asyncio regression LAB
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'labs/a190/test_g100_windows_internal_socketpair_guard_lab.py'
      - '.github/workflows/aion-g100-windows-asyncio-fixture-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: G100 focused regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run focused synthetic regression tests
        shell: bash
        run: python -B -m unittest -v labs.a190.test_g100_windows_internal_socketpair_guard_lab
  windows-canonical:
    name: G100 canonical Quality Security Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0'
          python -m pip check
      - name: Full canonical Quality
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py quality
      - name: Canonical security unittest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-unittest
      - name: Canonical security pytest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-pytest
