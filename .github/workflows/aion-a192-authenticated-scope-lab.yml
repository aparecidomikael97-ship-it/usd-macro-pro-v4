name: AION A192 Authenticated SQLite Chat LAB

on:
  pull_request:
    paths:
      - "labs/a192_authenticated_owner_chat_read_lab.py"
      - "labs/test_a192_authenticated_owner_chat_read_lab.py"
      - "docs/lab/aion_a192_authenticated_scope_bridge.md"
      - ".github/workflows/aion-a192-authenticated-scope-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-sqlite-lab:
    name: A192 trusted-scope simulation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Authenticated read LAB / real SQLite, stdlib only
        run: python -B -m unittest -v labs.test_a192_authenticated_owner_chat_read_lab
