name: AION P0 H0 LAB Two Role Vendor Custodian Evidence Gate

on:
  push:
    branches: [lab/aion-p0-h0-vendor-custodian-two-role-contract-20261021]

permissions:
  contents: read

jobs:
  documentary_gate:
    name: Provider versus custodian fail-closed LAB - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked requirements for original H0 suite
        run: python -m pip install -r requirements.txt
      - name: All 6 provider/custodian combinations must remain HARD NO-GO
        run: python -B tools/aion_p0_h0_vendor_custodian_documentary_gate.py
      - name: 28 adversarial two-role provider/custodian tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_vendor_custodian_two_role_documentary_lab.py -v
      - name: 17 current producer 32 error crosswalk checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_provider_32_current_crosswalk_lab.py -v
      - name: 14 canonical Quality 85 ledger checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_quality_red_ledger_audit_lab.py -v
      - name: 64 original H0 A79 causal denials
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
