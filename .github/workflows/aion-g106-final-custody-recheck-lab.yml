name: AION G106 final signed-post custody recheck LAB
on:
  pull_request:
    paths:
      - 'aion_chat/pinned_external_enrollment_g102_lab.py'
      - 'labs/a190/test_g106_final_custody_after_postproof_lab.py'
      - '.github/workflows/aion-g106-final-custody-recheck-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g106-postproof:
    name: G106 postproof local custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install same synthetic crypto prerequisites
        shell: bash
        run: python -m pip install 'cryptography==50.0.2' 'requests==2.34.2'
      - name: Execute G106 red-first cases and inherited G104 contracts
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v \
            labs.a190.test_g106_final_custody_after_postproof_lab \
            labs.a190.test_g104_post_reservation_attestation_lab \
            2>&1 | tee g106.log
          grep -F 'Ran 54 tests' g106.log
          grep -Fx 'OK' g106.log
          grep -F 'G106_ROLLBACK_DURING_POST=NO_SEND' g106.log
          grep -F 'G106_LOCAL_CUSTODY_MISSING_AT_RELEASE=DENIED' g106.log
          grep -F 'G106_EXTRA_LOCAL_RESERVATION_DURING_POST=DENIED' g106.log
          grep -F 'G106_FINAL_CUSTODY_READ_FAILURE=DENIED_SPENT' g106.log
          grep -F 'G106_STABLE_CUSTODY=FINAL_RECHECK_GREEN' g106.log
