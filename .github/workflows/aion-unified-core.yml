permissions:
  contents: read

concurrency:
  group: aion-unified-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Unified core contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile AION chat and unified runtime
        run: |
          python -m compileall -q aion_chat
          python -m py_compile atlasquant_aion_chat_ui.py atlasquant_aion_unified_runtime.py atlasquant_aion_chat_checkpoint_adapter.py atlasquant_aion_chat_library_adapter.py atlasquant_aion_unified_journal.py atlasquant_aion_unified_durable_bridge.py atlasquant_aion_unified_journal_store.py atlasquant_aion_unified_mission.py atlasquant_aion_role_authority.py atlasquant_aion_truth_mapping.py atlasquant_aion_unified_taskgraph.py atlasquant_aion_unified_taskgraph_store.py atlasquant_aion_memory_contract.py atlasquant_aion_checkpoint_master.py atlasquant_aion_observability.py atlasquant_aion_core_health_adapter.py atlasquant_aion_provenance_trust_lifecycle.py atlasquant_aion_trusted_readiness_authority.py atlasquant_aion_trust_root.py atlasquant_aion_nonce_registry.py atlasquant_aion_authority_verifier.py atlasquant_aion_trusted_authority_bridge.py atlasquant_aion_durable_execution_kernel.py atlasquant_aion_capability_isolation_gate.py atlasquant_aion_operational_resilience_kernel.py atlasquant_aion_multiagent_memory_governor.py atlasquant_aion_policy_kernel.py atlasquant_aion_model_gateway_v2.py atlasquant_aion_core_certification.py atlasquant_aion_core_completion_review.py atlasquant_aion_core_freeze_preflight.py atlasquant_aion_external_persistence_attestation.py atlasquant_aion_owner_signature_ceremony.py atlasquant_aion_owner_decision_record.py atlasquant_aion_owner_decision_persistence_attestation.py atlasquant_aion_status_board.py test_atlasquant_aion_core_v23_memory_checkpoint.py test_atlasquant_aion_v26_memory_recovery_redteam.py test_atlasquant_aion_core_hardening_v24.py test_atlasquant_aion_v26_core_health_adapter.py test_atlasquant_aion_v26_evidence_wiring_status_truth.py test_atlasquant_aion_v27_health_attestation_redteam.py test_atlasquant_aion_v27_durable_store_crash_isolation_redteam.py test_atlasquant_aion_v28_system_invariants_integration_audit.py test_atlasquant_aion_v28_runtime_persistence_cas_recovery_redteam.py test_atlasquant_aion_v28_cross_contract_readiness_redteam.py test_atlasquant_aion_v28_global_snapshot_consistency_redteam.py test_atlasquant_aion_v29_provenance_truth_redteam.py test_atlasquant_aion_v210_trust_root_readiness_redteam.py test_atlasquant_aion_v210_trust_readiness_independent_redteam.py test_atlasquant_aion_v211_provenance_trust_lifecycle_redteam.py test_atlasquant_aion_v212_trusted_readiness_authority_boundary_redteam.py test_atlasquant_aion_v213_real_trust_authority_redteam.py test_atlasquant_aion_v214_durable_execution_redteam.py test_atlasquant_aion_v215_capability_isolation_redteam.py
      - name: Run chat foundation, load and unified runtime tests
        run: python -m pytest -q -s test_atlasquant_aion_chat_foundation.py test_atlasquant_aion_chat_load.py test_atlasquant_aion_unified_runtime.py test_atlasquant_aion_chat_checkpoint_adapter.py test_atlasquant_aion_chat_library_adapter.py test_atlasquant_aion_unified_hardening_v21.py test_atlasquant_aion_unified_journal_store.py test_atlasquant_aion_unified_journal_store_governance.py test_atlasquant_aion_unified_mission.py test_atlasquant_aion_unified_taskgraph.py test_atlasquant_aion_core_v23_memory_checkpoint.py test_atlasquant_aion_v26_memory_recovery_redteam.py test_atlasquant_aion_observability.py test_atlasquant_aion_core_hardening_v24.py test_atlasquant_aion_v26_core_health_adapter.py test_atlasquant_aion_v26_evidence_wiring_status_truth.py test_atlasquant_aion_v27_health_attestation_redteam.py test_atlasquant_aion_v27_durable_store_crash_isolation_redteam.py test_atlasquant_aion_v28_system_invariants_integration_audit.py test_atlasquant_aion_v28_runtime_persistence_cas_recovery_redteam.py test_atlasquant_aion_v28_cross_contract_readiness_redteam.py test_atlasquant_aion_v28_global_snapshot_consistency_redteam.py test_atlasquant_aion_v29_provenance_truth_redteam.py test_atlasquant_aion_v210_trust_root_readiness_redteam.py test_atlasquant_aion_v210_trust_readiness_independent_redteam.py test_atlasquant_aion_v211_provenance_trust_lifecycle_redteam.py test_atlasquant_aion_v212_trusted_readiness_authority_boundary_redteam.py test_atlasquant_aion_v213_real_trust_authority_redteam.py test_atlasquant_aion_v214_durable_execution_redteam.py test_atlasquant_aion_v215_capability_isolation_redteam.py test_atlasquant_aion_v216_operational_resilience_redteam.py test_atlasquant_aion_v217_multiagent_memory_governance_redteam.py test_atlasquant_aion_v218_policy_kernel_redteam.py test_atlasquant_aion_v219_provider_neutral_gateway_redteam.py test_atlasquant_aion_v220_core_certification.py test_atlasquant_aion_v221_core_completion_review.py test_atlasquant_aion_v222_core_freeze_preflight.py test_atlasquant_aion_v223_external_persistence_attestation.py test_atlasquant_aion_v224_owner_signature_ceremony.py test_atlasquant_aion_v225_explicit_owner_decision_record.py test_atlasquant_aion_v226_owner_decision_persistence_attestation.py

  browser:
    name: Chat browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Run real Chromium chat test five times
        run: |
          for attempt in 1 2 3 4 5; do
            echo "AION chat browser stability attempt $attempt/5"
            python -m pytest -q -s test_atlasquant_aion_chat_browser.py
          done
