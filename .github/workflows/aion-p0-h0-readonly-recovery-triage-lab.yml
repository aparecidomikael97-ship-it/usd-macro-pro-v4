name: AION P0 H0 LAB Real Outbox Readonly Recovery Triage (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-readonly-recovery-triage-outbox-20261021]

permissions:
  contents: read

jobs:
  readonly_triage:
    name: Outbox read-only rollback triage - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: 44 REAL Outbox SQLite recovery and rollback characterization tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 60 simulated signed provider effect fence negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_seven_signed_provider_receipt_lab.py -v
      - name: 44 five signed-envelope linkage tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_linked_five_envelopes_lab.py -v
      - name: 56 enrollment revocation signed nonce negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_enrollment_revocation_nonce_lab.py -v
      - name: 38 administrative authority graph negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_authority_graph_lab.py -v
      - name: 34 signed witness negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_dual_signed_witness_transcript_lab.py -v
      - name: 55 external evidence admission tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_external_evidence_admission_lab.py -v
      - name: 28 third anchor negative tests
        run: python -B -m unittest -v test_aion_p0_h0_third_anchor_design_review_lab
      - name: 20 custody dual-domain rollback negatives
        run: python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: 64 A79 causal denials
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
      - name: 8 actual Outbox restore claim negatives
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
