name: AION First Install V2 Offline Reference
on:
  pull_request:
    branches:
      - codex/aion-first-install-master-preparation-v1-20261011
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-v2:
    name: V2 assertions recovery dossiers / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Pinned CI dependencies only
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --require-hashes -r requirements-aion-webauthn-reference.txt
      - name: Offline suites with network forbidden
        run: python -B tools/aion_first_install_v2_ci.py
      - name: Original twenty blocked gates
        run: python -B atlasquant_aion_first_install_plan_v1.py
      - name: Compile candidate
        run: python -m compileall -q -x '(^|[\\/])\.git([\\/]|$)' .
      - name: Exact-base diff check
        run: git diff --check c79f525cb324d8ffa64c51a4b35a5dd7c4325c4d HEAD
  global-quality:
    name: Exact original Quality / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Original Quality without excluded tests
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
