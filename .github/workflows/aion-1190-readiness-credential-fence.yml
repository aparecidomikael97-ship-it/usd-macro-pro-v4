name: AION 1190 Readiness Credential Fence (negative tests only)
on:
  pull_request:
    paths:
      - "atlasquant_aion_global_worker_readiness.py"
      - "atlasquant_aion_memory.py"
      - "atlasquant_aion_global_worker_source_gate_v1.py"
      - "test_atlasquant_aion_readiness_credential_fence_1190.py"
      - "test_atlasquant_aion_global_worker_readiness_no_get_v1.py"
      - "test_atlasquant_aion_global_worker_readiness_source_gate_v1.py"
      - ".github/workflows/aion-1190-readiness-credential-fence.yml"
permissions:
  contents: read
jobs:
  credential-fence:
    name: Denied readiness without credentials / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile actual production CLI and offline regressions
        run: python -B -m py_compile atlasquant_aion_global_worker_readiness.py test_atlasquant_aion_readiness_credential_fence_1190.py test_atlasquant_aion_global_worker_readiness_no_get_v1.py
      - name: Verify denial, exit 1 and zero secret resolution (no Worker tick)
        run: python -B -m unittest test_atlasquant_aion_readiness_credential_fence_1190 test_atlasquant_aion_global_worker_readiness_no_get_v1 test_atlasquant_aion_global_worker_readiness_source_gate_v1 -v
