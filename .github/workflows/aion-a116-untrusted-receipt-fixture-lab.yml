name: AION A116 LAB reachable unsafe receipt denial (no external producer)

on:
  pull_request:
    branches: [lab/aion-v16-a115-windows-saga-sqlite-cleanup-20261016]
    paths:
      - "test_atlasquant_aion_global_worker_inflight_reconciliation.py"
      - ".github/workflows/aion-a116-untrusted-receipt-fixture-lab.yml"

permissions:
  contents: read

jobs:
  untrusted_receipt:
    name: A116 corrupt local receipt must deny (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: Reach the exact original failing test plus independent A58 A71 A83
        run: >-
          python -m unittest -q
          test_atlasquant_aion_global_worker_inflight_reconciliation.GlobalInflightReconciliationTests.test_unsafe_or_malformed_receipt_evidence_blocks_reconciliation
          test_atlasquant_aion_inflight_untrusted_receipts_a58
          test_atlasquant_aion_inflight_receipt_safety_a71
          test_atlasquant_aion_a83_untrusted_failed_receipt
