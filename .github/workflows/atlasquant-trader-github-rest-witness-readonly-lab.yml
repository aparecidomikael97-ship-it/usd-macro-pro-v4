name: AtlasQuant FX28 GitHub REST Witness Read-Only LAB

on:
  pull_request:
    paths:
      - "atlasquant_trader_fx28_github_rest_comment_inventory_lab.py"
      - "test_atlasquant_trader_fx28_github_rest_comment_inventory_lab.py"
      - "atlasquant_trader_fx28_sunday_rest_source_bridge_lab.py"
      - "test_atlasquant_trader_fx28_sunday_live_rest_cli_lab.py"
      - ".github/workflows/atlasquant-trader-github-rest-witness-readonly-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  inventory:
    name: Official issue 1884 REST + 672 slot preflight (NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Validate adversarial parser offline
        run: |
          python -m unittest -q \
            test_atlasquant_trader_fx28_github_rest_comment_inventory_lab \
            test_atlasquant_trader_fx28_sunday_live_rest_cli_lab
      - name: Read issue 1884 REST + frozen ledger (bounded; never publish a witness)
        env:
          # Built-in GitHub Actions token: issues READ only, never printed.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m atlasquant_trader_fx28_sunday_rest_source_bridge_lab --read-public-github

# No cron: a workflow added only in a draft PR cannot be relied on as a
# scheduled job on the default branch. No issue comment posting, secrets
# upload, live signals, trading, local AM12 actions or source backfilling.
