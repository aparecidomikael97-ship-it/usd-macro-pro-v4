name: AION G87 external first-send offline gate LAB
on:
  pull_request:
    paths:
      - 'atlasquant_external_first_send_gate.py'
      - 'atlasquant_aion_provider.py'
      - 'atlasquant_neural_tts.py'
      - 'labs/a190/test_g74_operational_first_send_red_lab.py'
      - 'labs/a190/test_g75_external_first_send_lab.py'
      - 'labs/a190/test_g76_offline_response_compatibility_lab.py'
      - '.github/workflows/aion-a190-g87-first-send-offline-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-send:
    name: G87 G74-G76 offline first-send / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned offline test dependency
        shell: bash
        run: python -m pip install 'requests==2.34.2'
      - name: Verify G74-G76 and legacy provider/voice with socket egress forbidden
        shell: bash
        run: |
          set -o pipefail
          python -B - 2>&1 <<'PY' | tee g87.log
          import socket
          import unittest
          from unittest.mock import Mock

          def no_network(*_args, **_kwargs):
              raise AssertionError("G87_EXTERNAL_NETWORK_FORBIDDEN")

          socket.socket.connect = Mock(side_effect=no_network)
          socket.socket.connect_ex = Mock(side_effect=no_network)
          socket.create_connection = Mock(side_effect=no_network)
          names = (
              "labs.a190.test_g74_operational_first_send_red_lab",
              "labs.a190.test_g75_external_first_send_lab",
              "labs.a190.test_g76_offline_response_compatibility_lab",
              "test_atlasquant_aion_provider",
              "test_atlasquant_voice_profile",
          )
          suite = unittest.defaultTestLoader.loadTestsFromNames(names)
          print("G87_NO_NETWORK_GUARD=ACTIVE", flush=True)
          print("G87_SUITE_EXPECTED=50 ACTUAL=" + str(suite.countTestCases()), flush=True)
          if suite.countTestCases() != 50:
              raise SystemExit("G87_TEST_COUNT_DRIFT_DENIED")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
          grep -F 'G87_NO_NETWORK_GUARD=ACTIVE' g87.log
          grep -F 'G87_SUITE_EXPECTED=50 ACTUAL=50' g87.log
          grep -F 'Ran 50 tests' g87.log
          grep -Fx 'OK' g87.log
