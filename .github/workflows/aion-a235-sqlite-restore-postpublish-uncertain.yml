name: AION A235 SQLite Post Publish Uncertainty HARD NO-GO Lab

on:
  pull_request:
    paths:
      - aion_chat/store.py
      - labs/test_a235_sqlite_restore_postpublish_uncertain.py
      - docs/lab/aion_a235_sqlite_restore_postpublish_uncertain.md
      - .github/workflows/aion-a235-sqlite-restore-postpublish-uncertain.yml
      - aion_chat/store.py
      - labs/test_a234_sqlite_restore_create_only.py
      - docs/lab/aion_a234_sqlite_restore_create_only.md
      - .github/workflows/aion-a234-sqlite-restore-create-only.yml
      - labs/a233_native_sqlite_p0_repro.py
      - labs/test_a233_native_sqlite_p0_repro.py
      - docs/lab/aion_a233_native_sqlite_p0_repro.md
      - .github/workflows/aion-a233-native-sqlite-repro-readonly.yml
      - labs/a232_six_p0_evidence_crosswalk.py
      - labs/test_a232_six_p0_evidence_crosswalk.py
      - docs/lab/aion_a232_six_p0_evidence_crosswalk.md
      - .github/workflows/aion-a232-six-p0-evidence-crosswalk-readonly.yml
      - labs/a231_external_control_proof_plan.py
      - labs/test_a231_external_control_proof_plan.py
      - docs/lab/aion_a231_external_control_proof_plan.md
      - .github/workflows/aion-a231-external-control-proof-plan-readonly.yml
      - labs/a230_host_label_rewrite.py
      - labs/test_a230_host_label_rewrite.py
      - docs/lab/aion_a230_host_label_rewrite.md
      - .github/workflows/aion-a230-host-label-rewrite-readonly.yml
      - labs/a229_common_control_domain_claims.py
      - labs/test_a229_common_control_domain_claims.py
      - docs/lab/aion_a229_common_control_claims.md
      - .github/workflows/aion-a229-common-control-claims-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-restore-postpublish-uncertain:
    name: SQLite staging restore must mark post-publication uncertainty (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.32.3
      - name: A235 post-publication uncertainty plus A234 and staged resilience regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a235_sqlite_restore_postpublish_uncertain
          labs.test_a234_sqlite_restore_create_only
          test_atlasquant_aion_chat_staged_runtime_resilience
          labs.test_a233_native_sqlite_p0_repro
          labs.test_a232_six_p0_evidence_crosswalk
          labs.test_a231_external_control_proof_plan
          labs.test_a230_host_label_rewrite
          labs.test_a229_common_control_domain_claims
          labs.test_a228_partial_evidence_failure_matrix
          labs.test_a227_independence_acceptance_contract
          labs.test_a226_claimed_source_independence
          labs.test_a225_untrusted_security_proof_rejection
          labs.test_a224_security_proof_test_catalog
          labs.test_a223_owner_security_priority
          labs.test_a222_owner_acceptance_matrix
          labs.test_a221_independent_evidence_blueprint
          labs.test_a220_synthetic_root_attack_boundaries
          labs.test_a219_root_custody_comparison
          labs.test_a218_source_portfolio_preflight
          labs.test_a217_outofhost_anchor_claims
          labs.test_a216_synthetic_key_custody
          labs.test_a215_synthetic_origin_bridge
          labs.test_a214_external_evidence_intake
          labs.test_a213_outbox_untrusted_positive_hard_nogo
          labs.test_a207_untrusted_confirmation_requires_receipt
          labs.test_a206_late_send_outcome_cas
          labs.test_a205_unverified_adapter_absence_no_resend
          labs.test_a204_outbox_stale_absence_confirmed
          labs.test_a203_outbox_stale_revocation_cas
          labs.test_a202_outbox_dispatch_atomic_cas
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign
          labs.test_a212_synthetic_signed_effect_preflight
          labs.test_a211_claimed_witness_coherence
          labs.test_a210_offline_root_rotation_proposal
          labs.test_a209_root_provenance_failclosed
          labs.test_a208_independent_receipt_preflight
