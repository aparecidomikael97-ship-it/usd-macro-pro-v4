name: AION G107 same-count reservation identity LAB
on:
  pull_request:
    paths:
      - 'aion_chat/pinned_external_enrollment_g102_lab.py'
      - 'aion_chat/separate_custody_a181_lab.py'
      - 'labs/a190/test_g107_same_count_reservation_identity_lab.py'
      - '.github/workflows/aion-g107-reservation-identity-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-reservation:
    name: G107 exact reservation record / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned synthetic cryptography dependencies
        shell: bash
        run: python -m pip install 'cryptography==50.0.2' 'requests==2.34.2'
      - name: Execute G107 adversarial SQLite identity tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g107_same_count_reservation_identity_lab 2>&1 | tee g107.log
          grep -Fx 'OK' g107.log
          grep -F 'G107_SAME_COUNT_OTHER_EFFECT=DENIED' g107.log
          grep -F 'G107_SAME_COUNT_OTHER_REQUEST=DENIED' g107.log
          grep -F 'G107_SAME_COUNT_MUTATED_DECISION=DENIED' g107.log
          grep -F 'G107_ORIGINAL_RECORD=ONE_SYNTHETIC_RESERVATION' g107.log
      - name: Run G106 inherited drift tests unchanged
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g106_final_custody_after_postproof_lab 2>&1 | tee g107-inherited.log
          grep -Fx 'OK' g107-inherited.log
