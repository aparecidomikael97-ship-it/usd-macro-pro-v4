name: AION P0 LAB Quality Root Coverage Backfill (NO-GO)

on:
  push:
    branches: [lab/aion-p0-quality-root-coverage-20261021]

permissions:
  contents: read

jobs:
  quality_root_backfill:
    name: Canonical root coverage P0 LAB - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Check complete Quality canonical file enumeration without waiver
        run: python -B -m unittest -v test_quality_workflow_coverage.py
      - name: Execute all 26 historically missing root P0 LAB modules
        run: |
          python -B -m unittest -q \
            test_aion_m71_execution_fresh_source_denial_lab.py \
            test_aion_p0_budget_saga_trust_boundary_lab.py \
            test_aion_p0_h0_boundary_drift_mutations_lab.py \
            test_aion_p0_h0_custody_two_domain_model_lab.py \
            test_aion_p0_h0_iam_finops_preflight_lab.py \
            test_aion_p0_h0_real_outbox_restore_claim_negative_lab.py \
            test_aion_p0_h0_sqlite_startup_observer_lab.py \
            test_aion_p0_h0_third_anchor_design_review_lab.py \
            test_aion_p0_m71_original_stale_gate_safety_negative_lab.py \
            test_aion_p0_original_six_evidence_matrix_lab.py \
            test_aion_p0_original_sqlite_compat_concurrency_restore_lab.py \
            test_aion_p0_outbox_saga_cas_retry_recovery_lab.py \
            test_aion_p0_outbox_saga_historical_reconcile_cas_lab.py \
            test_aion_p0_outbox_saga_internal_state_lab.py \
            test_aion_p0_quality_32_external_evidence_gates_lab.py \
            test_aion_p0_quality_85_causal_inventory_lab.py \
            test_aion_p0_quality_lab_coverage_governance_lab.py \
            test_aion_p0_sqlite_authority_budget_owner_thread_lab.py \
            test_aion_p0_sqlite_chat_store_owner_thread_lab.py \
            test_aion_p0_sqlite_execution_restore_hardstop_lab.py \
            test_aion_p0_sqlite_nested_transaction_denial_lab.py \
            test_aion_p0_sqlite_owner_thread_denial_lab.py \
            test_aion_p0_sqlite_saga_owner_thread_lab.py \
            test_aion_p0_staged_facade_latest_hardstops_lab.py \
            test_aion_p0_staged_facade_port_lifecycle_lab.py \
            test_aion_p0_staged_host_sqlite_cleanup_lab.py
