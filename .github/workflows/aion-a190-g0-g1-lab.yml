name: A190 G0 G1 Real OS Principal Boundary LAB
on:
  pull_request:
    paths:
      - 'test_atlasquant_aion_dual_delete_rebootstrap_a190_lab.py'
      - 'labs/a190/os_principal_probe.py'
      - '.github/workflows/aion-a190-g0-g1-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g0-dual-delete-rebootstrap:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Execute synthetic G0 with real SQLite files
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m unittest -v test_atlasquant_aion_dual_delete_rebootstrap_a190_lab 2>&1 | tee a190_g0.log
          grep -q 'Ran 3 tests' a190_g0.log
          grep -q 'A190_G0_DUAL_DELETE_REBOOTSTRAP=UNSAFE_READMISSION_REPRODUCED' a190_g0.log
          grep -q 'A190_G0_WITNESS_ONLY_DELETE=DENIED' a190_g0.log
          grep -q 'A190_G0_DB_ONLY_DELETE=DENIED' a190_g0.log
      - name: G0 security status
        shell: bash
        run: |
          echo 'GREEN means a local dual-delete security bypass was REPRODUCED, not resolved.'
          echo 'No external custodian, no H0 guarantee, no effect, 0/6 P0, HARD NO-GO.'
  g1-real-linux-uid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Two real unprivileged UIDs; owner succeeds and attacker fails
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin a190custodian
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin a190attacker
          lab_dir="$(mktemp -d)"
          sudo chown a190custodian:a190custodian "$lab_dir"
          sudo chmod 700 "$lab_dir"
          database="$lab_dir/intent.sqlite"
          echo "A190_OWNER_UID=$(id -u a190custodian)"
          echo "A190_ATTACK_UID=$(id -u a190attacker)"
          test "$(id -u a190custodian)" != "$(id -u a190attacker)"
          probe_file="$(mktemp -p /tmp a190_probe_XXXXXX.py)"
          cp labs/a190/os_principal_probe.py "$probe_file"
          chmod 644 "$probe_file"
          sudo -u a190custodian python -B "$probe_file" init "$database" 2>&1 | tee a190_owner.log
          sudo -u a190attacker python -B "$probe_file" attack "$database" 2>&1 | tee a190_attack.log
          grep -q 'A190_G1_LEGITIMATE_OWNER_SQLITE_READ_WRITE=SUCCESS' a190_owner.log
          grep -q 'A190_G1_DISTINCT_PRINCIPAL_DENIALS=4_OF_4' a190_attack.log
          grep -q 'A190_G1_WAL_SHM_SAME_INODE_ADMIN_ROOT=NOT_EXERCISED_OR_NOT_ATTESTED' a190_attack.log
      - name: G1 limitation
        run: |
          echo 'Protects synthetic directory only from a different unprivileged UID.'
          echo 'Root, WAL/SHM live pin, rollback and external effects NOT ATTESTED.'
  g1-real-windows-sid:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Two real local Windows SIDs with owner allow and app deny
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rev-parse HEAD
          $suffix = [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $owner = 'a190o' + $suffix
          $attacker = 'a190a' + $suffix
          $passOwner = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + 'zA!7') -AsPlainText -Force
          $passAttack = ConvertTo-SecureString ([Guid]::NewGuid().ToString('N') + 'zA!7') -AsPlainText -Force
          New-LocalUser -Name $owner -Password $passOwner -AccountNeverExpires -PasswordNeverExpires | Out-Null
          New-LocalUser -Name $attacker -Password $passAttack -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $ownerSid = (Get-LocalUser -Name $owner).SID
          $attackSid = (Get-LocalUser -Name $attacker).SID
          if ($ownerSid -eq $attackSid) { throw 'A190_PRINCIPALS_NOT_DISTINCT' }
          Write-Output "A190_OWNER_SID=$ownerSid"
          Write-Output "A190_ATTACKER_SID=$attackSid"
          $labDir = Join-Path $env:RUNNER_TEMP ('a190-' + $suffix)
          New-Item -Path $labDir -ItemType Directory -Force | Out-Null
          $acl = Get-Acl $labDir
          $acl.SetAccessRuleProtection($true, $false)
          $acl.SetOwner($ownerSid)
          $flags = [System.Security.AccessControl.InheritanceFlags]'ContainerInherit, ObjectInherit'
          foreach ($principal in @($ownerSid, (New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-18'), (New-Object System.Security.Principal.SecurityIdentifier 'S-1-5-32-544'))) {
            $rule = [System.Security.AccessControl.FileSystemAccessRule]::new($principal, [System.Security.AccessControl.FileSystemRights]::FullControl, $flags, [System.Security.AccessControl.PropagationFlags]::None, [System.Security.AccessControl.AccessControlType]::Allow)
            $acl.AddAccessRule($rule)
          }
          Set-Acl -Path $labDir -AclObject $acl
          $probe = Join-Path $env:PUBLIC ('a190_probe_' + $suffix + '.py')
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'labs\a190\os_principal_probe.py') $probe
          $python = (Get-Command python).Source
          $database = Join-Path $labDir 'intent.sqlite'
          function Invoke-Probe([string]$username, [securestring]$password, [string]$mode) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new()
            $psi.FileName = $python
            $psi.Arguments = '-B "' + $probe + '" ' + $mode + ' "' + $database + '"'
            $psi.WorkingDirectory = $env:PUBLIC
            $psi.UseShellExecute = $false
            $psi.UserName = $username
            $psi.Domain = $env:COMPUTERNAME
            $psi.Password = $password
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $proc = [System.Diagnostics.Process]::Start($psi)
            $out = $proc.StandardOutput.ReadToEnd()
            $err = $proc.StandardError.ReadToEnd()
            if (-not $proc.WaitForExit(30000)) { $proc.Kill(); throw "A190_PROCESS_TIMEOUT_$mode" }
            Write-Output $out
            if ($proc.ExitCode -ne 0) { throw "A190_PROCESS_FAIL_$mode code=$($proc.ExitCode) details=$err" }
            return $out
          }
          $legit = Invoke-Probe $owner $passOwner 'init'
          $hostile = Invoke-Probe $attacker $passAttack 'attack'
          Write-Output $legit
          Write-Output $hostile
          if (($legit -join ' ') -notmatch 'A190_G1_LEGITIMATE_OWNER_SQLITE_READ_WRITE=SUCCESS') { throw 'A190_OWNER_NOT_EXERCISED' }
          if (($hostile -join ' ') -notmatch 'A190_G1_DISTINCT_PRINCIPAL_DENIALS=4_OF_4') { throw 'A190_ATTACK_NOT_EXERCISED' }
          if (($legit -join ' ') -notmatch [regex]::Escape($ownerSid.Value)) { throw 'A190_OWNER_PROCESS_WRONG_SID' }
          if (($hostile -join ' ') -notmatch [regex]::Escape($attackSid.Value)) { throw 'A190_ATTACKER_PROCESS_WRONG_SID' }
          Write-Output 'A190_G1_REAL_WINDOWS_ACL_PROBE=OWNER_SUCCESS_ATTACKER_DENIED'
      - name: Windows G1 limitation
        shell: pwsh
        run: |
          Write-Output 'Uses temporary runner local accounts; Windows admin is NOT excluded.'
          Write-Output 'WAL/SHM, VFS, same-inode restore, H0 and external receipt remain NOT ATTESTED.'
