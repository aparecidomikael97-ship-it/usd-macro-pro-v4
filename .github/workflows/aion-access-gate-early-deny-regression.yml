name: AION Access Gate Early-Deny Regression

on:
  pull_request:
    branches:
      - audit/aion-global-worker-source-trust-failclosed-tests-20261011
    paths:
      - "test_atlasquant_access_panel.py"
      - ".github/workflows/aion-access-gate-early-deny-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  early-access-gate:
    name: Access denial and Worker fail-closed / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check actual access gate behavior in isolation
        run: python -B -m unittest -v test_atlasquant_access_panel
      - name: Verify prior Worker source trust and HTTP denial suite
        run: python -B -m unittest -v test_atlasquant_aion_global_worker_activation test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1
