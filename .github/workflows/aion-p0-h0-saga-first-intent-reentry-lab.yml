name: AION P0 H0 LAB Saga First Intent Reentry No Replay

on:
  push:
    branches: [lab/aion-p0-h0-saga-idempotent-first-intent-reentry-fence-20261021]

permissions:
  contents: read

jobs:
  first_intent_reentry:
    name: Saga first intent may not restage existing Outbox history - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked project dependencies
        run: python -m pip install -r requirements.txt
      - name: 14 RED-first Saga preexisting first attempt denial tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_saga_existing_first_intent_reentry_lab.py -v
      - name: 15 Outbox + Saga atomic post-insert integrity
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_enqueue_commit_integrity_lab.py -v
      - name: 16 expired lease local integrity fences
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_expired_lease_integrity_fence_lab.py -v
      - name: 26 Outbox forensic quarantine tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_read_integrity_hardstop_lab.py -v
      - name: 9 Outbox parent transaction hardstops
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_parent_transaction_denial_lab.py -v
      - name: 9 Saga staging atomic CAS
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_atomic_scoped_stage_cas_lab.py -v
      - name: 12 Saga internal scoped helpers
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: 16 Saga and Outbox local state
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: 11 Outbox SQL cross-scope fences
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: 44 real read-only Outbox H0 triage
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 64 H0 A79 causal denial
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
