name: Quality tests

on:
  push:
    paths:
      - "engine.py"
      - "calendar_core.py"
      - "calendar_panel.py"
      - "test_engine.py"
      - "test_calendar.py"
      - ".github/workflows/quality-tests.yml"
  pull_request:
    paths:
      - "engine.py"
      - "calendar_core.py"
      - "calendar_panel.py"
      - "test_engine.py"
      - "test_calendar.py"
      - ".github/workflows/quality-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pandas

      - name: Syntax check
        run: python -m py_compile engine.py calendar_core.py calendar_panel.py test_engine.py test_calendar.py

      - name: Unit tests
        run: python -m unittest -v test_engine.py test_calendar.py
