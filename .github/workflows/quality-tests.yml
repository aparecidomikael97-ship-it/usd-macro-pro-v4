name: Quality tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/autopilot-v107.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow
      - name: Run quality suite
        run: |
          python -m unittest -q \
            test_engine.py \
            test_calendar.py \
            test_market_map_v10.py \
            test_master_panel_v102.py \
            test_experience_v103.py \
            test_product_v104.py \
            test_evolution_v105.py \
            test_currency_news_v106.py \
            test_currency_news_v1061.py \
            test_currency_news_v1062.py \
            test_autopilot_v107.py \
            test_pandas_compat_v1072.py \
            test_legacy_nat_guard_v1073.py \
            test_scanner_freshness_v1074.py \
            test_autopilot_recovery_v1075.py \
            test_apptest_secrets_circuit_v1076.py \
            test_quota_guard_v1077.py \
            test_ict_execution_v108.py \
            test_pair_intelligence_v108.py \
            test_dtype_guard_v1081.py \
            test_institutional_engine_v110.py \
            test_decision_integrity_v110.py \
            test_pair_intelligence_v110.py \
            test_institutional_autopilot_v110.py \
            test_data_readiness_v1101.py \
            test_type_safety_v1102.py \
            test_freshness_integrity_v1103.py \
            test_evidence_integrity_v1104.py \
            test_strength_breakdown_v1104.py \
            test_strength_sync_v1105.py \
            test_audit_integrity_v1106.py \
            test_strength_attribution_v1106.py \
            test_pair_intelligence_v1101.py \
            test_strength_integrity_v1107.py
