name: Quality tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, atlasquant-dev, atlasquant-runtime, atlasquant-runtime-integration, atlasquant-integration, atlasquant-release-final, atlasquant-support-final, atlasquant-support-ui, atlasquant-brokers-guide, atlasquant-voice-readiness, atlasquant-academy-media, atlasquant-commercial-prep, atlasquant-final-release-prep, atlasquant-backup-workflow, atlasquant-home-radar, atlasquant-private-validation, atlasquant-fast-startup, atlasquant-startup-observability, atlasquant-voice-assistant-final, atlasquant-render-fast-home, atlasquant-mobile-dom-stability, atlasquant-natural-deep-voice]
    paths:
      - "*.py"
      - "render.yaml"
      - "tradingview/**"
      - "docs/**"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/autopilot-v107.yml"
      - ".github/workflows/atlasquant-integration-gate.yml"
      - ".github/workflows/atlasquant-source-parity.yml"
      - ".github/workflows/atlasquant-ui-smoke.yml"
      - ".github/workflows/mobile-dom-stability.yml"
      - ".github/workflows/production-health.yml"
      - ".github/workflows/production-browser-smoke.yml"
      - ".github/workflows/atlasquant-release-readiness.yml"
      - ".github/workflows/atlasquant-source-backup.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow
      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Run quality suite
        run: |
          python -m unittest -q \
            test_engine.py \
            test_calendar.py \
            test_market_map_v10.py \
            test_master_panel_v102.py \
            test_experience_v103.py \
