name: Quality tests

on:
  workflow_dispatch:
  push:
    branches: [main, atlasquant-dev, atlasquant-runtime, atlasquant-private-deploy]
    paths:
      - "*.py"
      - "*.ps1"
      - "*.bat"
      - "tradingview/**"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/autopilot-v107.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow
      - name: Compile Python sources
        run: |
          python -m compileall -q .

      - name: Validate PowerShell launcher syntax
        shell: pwsh
        run: |
          $files = @(
            "AtlasQuant_Windows_Privado.ps1",
            "AtlasQuant_Configurar_TwelveData.ps1",
            "AtlasQuant_Configurar_FRED.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file + ": " + $_.Message) }
              exit 1
            }
          }

      - name: Run quality suite
        run: |
          python -m unittest -q \
            test_engine.py \
            test_calendar.py \
            test_market_map_v10.py \
            test_master_panel_v102.py \
            test_experience_v103.py \
            test_product_v104.py \
            test_evolution_v105.py \
            test_currency_news_v106.py \
            test_currency_news_v1061.py \
            test_currency_news_v1062.py \
            test_autopilot_v107.py \
            test_pandas_compat_v1072.py \
            test_legacy_nat_guard_v1073.py \
            test_scanner_freshness_v1074.py \
            test_autopilot_recovery_v1075.py \
