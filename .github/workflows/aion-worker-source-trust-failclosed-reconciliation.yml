name: AION Global Worker Readiness & HTTP Status Fail Closed

on:
  pull_request:
    branches:
      - audit/aion-paper-journal-private-source-deny-20261011
    paths:
      - "test_atlasquant_aion_global_worker_activation.py"
      - ".github/workflows/aion-worker-source-trust-failclosed-reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-negative-contract:
    name: Global Worker read-only source trust & mocked HTTP / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete Worker activation test suite (mocked, no real activation)
        run: python -B -m unittest -v test_atlasquant_aion_global_worker_activation
      - name: Re-verify private read and source quarantine gates
        run: python -B -m unittest -v test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1
