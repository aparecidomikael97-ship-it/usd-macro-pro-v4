name: AION A200 Direct SEND Custody Containment LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_provider.py"
      - "atlasquant_neural_tts.py"
      - "atlasquant_neural_voice_ui.py"
      - "labs/test_a200_direct_send_containment.py"
      - "labs/test_a200_direct_send_ui.py"
      - "docs/lab/aion_a200_direct_send_containment_review.md"
      - ".github/workflows/aion-a200-direct-send-containment-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-send:
    name: A200 direct outbound denial / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned minimal requests client for offline import only
        run: python -m pip install requests==2.34.2
      - name: Compile touched production and test modules
        run: python -B -m compileall -q atlasquant_aion_provider.py atlasquant_neural_tts.py atlasquant_neural_voice_ui.py labs/test_a200_direct_send_containment.py labs/test_a200_direct_send_ui.py
      - name: Refuse every direct paid provider transport; concurrency, process restart, UI cache
        run: python -B -m unittest -v labs.test_a200_direct_send_containment labs.test_a200_direct_send_ui
