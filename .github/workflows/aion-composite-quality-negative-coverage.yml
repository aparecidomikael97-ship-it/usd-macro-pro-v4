name: AION Composite Quality Negative Coverage Audit

on:
  pull_request:
    branches:
      - audit/aion-owner-chat-worker-source-integration-20261011
    paths:
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/aion-composite-quality-negative-coverage.yml"
      - "test_*.py"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-negative:
    name: 17 negative suites + coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 22
    steps:
      - name: Checkout exact isolated candidate HEAD without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing repo-pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure coverage contract counts every root test
        run: python -B -m unittest -v test_quality_workflow_coverage
      - name: Exercise all 17 previously uncovered fail-closed tests
        run: >-
          python -B -m unittest -v
          test_atlasquant_access_fallback_fail_closed
          test_atlasquant_aion_checkpoint_dual_challenge_reference_v1
          test_atlasquant_aion_external_witness_cost_capacity_reference_v1
          test_atlasquant_aion_external_witness_workers_peak_v1
          test_atlasquant_aion_global_worker_readiness_no_get_v1
          test_atlasquant_aion_global_worker_readiness_source_gate_v1
          test_atlasquant_aion_global_worker_source_gate_v1
          test_atlasquant_aion_readiness_credential_fence_1190
          test_atlasquant_aion_runtime_source_boundary_ref_v1
          test_atlasquant_aion_witness_architecture_review_reference_v1
          test_atlasquant_aion_witness_external_enrollment_evidence_v1
          test_atlasquant_extra_shared_remote_readers_v1
          test_atlasquant_flight_recorder_private_containment_v1
          test_atlasquant_legacy_local_history_quarantine_v1
          test_atlasquant_legacy_private_cache_quarantine_v1
          test_atlasquant_legacy_remote_tenant_quarantine_v1
          test_atlasquant_private_read_gate_v1
      - name: Verify newly covered checks do not authorize Worker
        shell: bash
        run: |
          python - <<'PY'
          from atlasquant_aion_global_worker_source_gate_v1 import independent_worker_source_preflight
          for payload in ({}, {'source_verified': True, 'worker_authorized': True}, None):
              result = independent_worker_source_preflight(payload)
              assert result['status'] == 'BLOCKED'
              assert result['worker_authorized'] is False
              assert result['network_called'] is False
              assert result['safe_to_retry'] is False
          print('QUALITY_COVERAGE_FIXED_SOURCE_GATE_STILL_BLOCKED')
          PY
