name: A308-D1 bounded regression diagnosis LAB

on:
  pull_request:
    paths:
      - 'labs/a308_ci_bounded_diagnostics_lab.py'
      - 'labs/test_a308_ci_bounded_diagnostics_lab.py'
      - 'docs/lab/aion_a308_ci_bounded_diagnostics_lab.md'
      - '.github/workflows/aion-a308-d1-bounded-diagnostics-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-diagnostics:
    name: A308-D1 suite watchdog — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing open-source LAB cryptographic test dependency
        run: python -m pip install "cryptography==46.0.4"
      - name: Verify fail-closed suite watchdog
        run: python -m unittest -v labs.test_a308_ci_bounded_diagnostics_lab
      - name: Run each research suite with independent 90 second timeout
        run: python -u -m labs.a308_ci_bounded_diagnostics_lab --timeout 90
