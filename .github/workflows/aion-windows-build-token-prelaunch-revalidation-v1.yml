name: AION Windows Build Token Prelaunch Revalidation V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py"
      - "tests/test_atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py"
      - "docs/aion/AION_WINDOWS_BUILD_TOKEN_PRELAUNCH_REVALIDATION_V1.md"
      - ".github/workflows/aion-windows-build-token-prelaunch-revalidation-v1.yml"

permissions:
  contents: read

jobs:
  windows-build-token-prelaunch-revalidation-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.12"

      - name: Prepare exact crypto dependency
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import sys
          import cryptography
          assert sys.version_info[:3] == (3, 12, 12), sys.version
          assert cryptography.__version__ == "50.0.2", cryptography.__version__
          PY

      - name: Compile build-token prelaunch contract
        run: |
          python -m py_compile \
            atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py \
            tests/test_atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py

      - name: Run build-token prelaunch tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py'

      - name: Assert prelaunch layer cannot launch a build
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_windows_build_token_prelaunch_revalidation_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import sqlite3",
              "from sqlite3",
              "import subprocess",
              "from subprocess",
              "import socket",
              "import requests",
              "from requests",
              "urllib.request",
              "import httpx",
              "win32process",
              "win32job",
              "win32security",
              "winreg",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          forbidden_live_material = (
              "api.github.com",
              "GITHUB_TOKEN",
              "GH_TOKEN",
          )
          for marker in forbidden_live_material:
              assert marker not in source, marker

          required = (
              '"prelaunch_revalidation_required":True',
              '"final_pre_spawn_revalidation_required":True',
              '"safety_stop_armed_required":True',
              '"safety_stop_must_not_be_engaged":True',
              '"circuit_breaker_armed_required":True',
              '"circuit_breaker_healthy_required":True',
              '"token_single_use_required":True',
              '"token_signature_required":True',
              '"token_persistence_required":True',
              '"token_cas_required":True',
              '"token_read_after_write_required":True',
              '"token_reopen_required":True',
              '"token_nonce_single_use_required":True',
              '"atomic_owner_authorization_consumption_with_launch_required":True',
              '"atomic_token_consumption_with_launch_required":True',
              '"caller_prelaunch_claim_is_authority":False',
              '"caller_token_trust_claim_is_authority":False',
              '"generic_chat_is_launch_authority":False',
              '"prelaunch_revalidation_implemented":False',
              '"prelaunch_revalidation_executed":False',
              '"prelaunch_external_trust_verified":False',
              '"token_signer_implemented":False',
              '"build_token_implemented":False',
              '"build_token_issued":False',
              '"build_token_signed":False',
              '"build_token_persisted":False',
              '"build_token_consumed":False',
              '"owner_authorization_consumed":False',
              '"launch_authorized":False',
              '"build_authorized":False',
              '"build_started":False',
              '"package_built":False',
              '"package_installed":False',
              '"process_spawned":False',
              '"filesystem_modified":False',
              '"network_called":False',
              '"github_api_called":False',
              '"live_repository_mutation_authorized":False',
              '"live_repository_mutation_performed":False',
              '"production_repository_mutation_performed":False',
              '"deploy_executed":False',
              '"worker_activated":False',
              '"provider_activated":False',
              '"production_persistence_activated":False',
          )
          for marker in required:
              assert marker in source, marker
          PY
