name: AION Chat Render Production Composition CI V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - impl/aion-chat-migration-identity-lifecycle-ci-v1-20261007
    paths:
      - "atlasquant_aion_chat_render_production_composition_v1.py"
      - "tests/test_atlasquant_aion_chat_render_production_composition_v1.py"
      - "atlasquant_aion_chat_ephemeral_postgres_v1.py"
      - "atlasquant_aion_chat_postgres_migration_rls_restore_ci_v1.py"
      - "atlasquant_aion_chat_storage_audit_receipts_ci_v1.py"
      - "migrations/aion_chat_postgres_v1/0001_initial.sql"
      - ".github/workflows/aion-chat-render-production-composition-v1.yml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  render-production-composition-ci-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlasquant_aion_chat_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlasquant_aion_chat_prod"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned PostgreSQL driver
        run: |
          grep -Fx "psycopg[binary]==3.3.6" requirements.txt
          python -m pip install pip==26.2.1
          python -m pip install "psycopg[binary]==3.3.6"
          python -m pip check

      - name: Generate disposable CA and require PostgreSQL TLS
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="$RUNNER_TEMP/aion-chat-prod-composition-tls"
          mkdir -p "$TLS_DIR"

          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1             -subj "/CN=AtlasQuant Production Composition CI Root"             -keyout "$TLS_DIR/ca.key"             -out "$TLS_DIR/ca.crt"

          openssl req -newkey rsa:2048 -nodes -sha256             -subj "/CN=localhost"             -keyout "$TLS_DIR/server.key"             -out "$TLS_DIR/server.csr"

          cat > "$TLS_DIR/server.ext" <<'EOF'
          subjectAltName=DNS:localhost
          extendedKeyUsage=serverAuth
          EOF

          openssl x509 -req -sha256 -days 1             -in "$TLS_DIR/server.csr"             -CA "$TLS_DIR/ca.crt"             -CAkey "$TLS_DIR/ca.key"             -CAcreateserial             -extfile "$TLS_DIR/server.ext"             -out "$TLS_DIR/server.crt"

          CID="$(docker ps --filter ancestor=postgres:17-alpine --format '{{.ID}}' | head -n1)"
          test -n "$CID"

          docker cp "$TLS_DIR/server.crt" "$CID":/var/lib/postgresql/server.crt
          docker cp "$TLS_DIR/server.key" "$CID":/var/lib/postgresql/server.key

          docker exec -u root "$CID" sh -c '
            set -eu
            chown postgres:postgres               /var/lib/postgresql/server.crt               /var/lib/postgresql/server.key
            chmod 644 /var/lib/postgresql/server.crt
            chmod 600 /var/lib/postgresql/server.key

            printf "\nssl = on\nssl_cert_file = '\''/var/lib/postgresql/server.crt'\''\nssl_key_file = '\''/var/lib/postgresql/server.key'\''\n"               >> "$PGDATA/postgresql.conf"

            TMP_HBA="$(mktemp)"
            {
              echo "hostssl all all 0.0.0.0/0 scram-sha-256"
              echo "host all all 0.0.0.0/0 reject"
              echo "hostssl all all ::0/0 scram-sha-256"
              echo "host all all ::0/0 reject"
              cat "$PGDATA/pg_hba.conf"
            } > "$TMP_HBA"
            cat "$TMP_HBA" > "$PGDATA/pg_hba.conf"
            rm -f "$TMP_HBA"
          '

          docker restart "$CID" >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec "$CID" pg_isready -U postgres -d atlasquant_aion_chat_prod >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker exec "$CID" pg_isready -U postgres -d atlasquant_aion_chat_prod

          echo "AION_CHAT_RENDER_COMPOSITION_CI_ADMIN_DSN=postgresql://postgres:postgres@localhost:5432/atlasquant_aion_chat_prod?sslmode=verify-full&sslrootcert=$TLS_DIR/ca.crt"             >> "$GITHUB_ENV"

      - name: Compile production composition
        run: |
          python -m py_compile             atlasquant_aion_chat_render_production_composition_v1.py             tests/test_atlasquant_aion_chat_render_production_composition_v1.py

      - name: Verify frozen migration checksum
        run: |
          printf '%s  %s\n'             "7dd72d75365862f54c81110027430011f8ac8f81ce629f500cbbd9aa0c00c50c"             "migrations/aion_chat_postgres_v1/0001_initial.sql"             | sha256sum --check --strict

      - name: Run production composition tests
        run: |
          python -m unittest discover -v -s tests             -p 'test_atlasquant_aion_chat_render_production_composition_v1.py'

      - name: Assert production composition has no secret lookup or migration authority
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_chat_render_production_composition_v1.py"
          ).read_text(encoding="utf-8")

          for banned in (
              "os.getenv(",
              "os.environ",
              "streamlit.secrets",
              "DATABASE_URL",
              "aion_chat_migrator",
              "ALTER ROLE",
              "CREATE ROLE",
              "GRANT CREATE",
          ):
              assert banned not in source, banned

          for marker in (
              '"default_activation": False',
              '"database_url_supported": False',
              '"migration_execution": False',
              '"migration_authority_used": False',
              '"admin_credential_supported": False',
              '"worker_armed": False',
              '"external_action_executed": False',
              '"core_checkpoint_write": False',
          ):
              assert marker in source, marker
          PY
