name: AION H0 Cloudflare custody two-domain contract (OFFLINE LAB)

on:
  push:
    branches: [lab/aion-p0-h0-cloudflare-custody-contract-20261019]
    paths:
      - atlasquant_aion_p0_h0_custody_two_domain_model_lab.py
      - test_aion_p0_h0_custody_two_domain_model_lab.py
      - docs/aion/AION_P0_H0_CLOUDFLARE_DO_CUSTODY_GATE_PROPOSAL_20261019.md
      - .github/workflows/aion-p0-h0-cloudflare-custody-contract-lab.yml

permissions:
  contents: read

jobs:
  offline_two_domain:
    name: Two-domain rollback and CAS simulation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 80
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pin existing H0 and no-authority staging
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object atlasquant_aion_p0_h0_sqlite_startup_observer_lab.py)" = "2ea1b6c9a9c5faa75d677c4a57404513ad2d882a"
          test "$(git hash-object atlasquant_aion_global_worker.py)" = "f4cd9f358aee285747321e96be3db82691e02fe8"
          test "$(git hash-object atlasquant_aion_execution_outbox.py)" = "cd78ed43ad63888408eb599e28379c193c541de2"
          echo "P0_H0_CURRENT_NO_WITNESS_BARRIERS_PINNED"
      - name: Validate twenty two-domain CAS replay and rollback scenarios
        run: |
          python -B -c "import unittest; s=unittest.defaultTestLoader.loadTestsFromName('test_aion_p0_h0_custody_two_domain_model_lab'); assert s.countTestCases()==20, s.countTestCases(); print('P0_CUSTODY_TWO_DOMAINS_20_CASES')"
          python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: Install tracked dependencies for existing historical guards
        run: python -m pip install -r requirements.txt
      - name: Retain sixteen REAL H0 SQLite boot no-witness controls
        run: python -B -m unittest -v test_aion_p0_h0_sqlite_startup_observer_lab
      - name: Retain thirteen official-restore execution blockers
        run: python -B -m unittest -v test_aion_p0_sqlite_execution_restore_hardstop_lab
      - name: Retain fifteen boundary mutation drift tests
        run: python -B -m unittest -v test_aion_p0_h0_boundary_drift_mutations_lab
      - name: Retain A73 F1/T1 independent-source and A110 no-resend guards
        run: python -B -m unittest -v test_atlasquant_aion_readiness_source_witness_a73 test_atlasquant_aion_a110_outbox_ambiguous_block
