name: AION A201 Global Worker Enable Egress Deny LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_global_worker_activation.py"
      - "test_atlasquant_aion_global_worker_activation.py"
      - "labs/test_a201_global_worker_enable_egress_deny.py"
      - "docs/lab/aion_a201_global_worker_enable_egress_deny.md"
      - ".github/workflows/aion-a201-worker-enable-egress-deny-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-enable-denial:
    name: A201 denied remote ENABLE with safety stop preserved / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project-pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Worker enable containment with fake HTTP; 11 tests
        run: python -B -m unittest -v labs.test_a201_global_worker_enable_egress_deny test_atlasquant_aion_global_worker_activation
