name: AION Chat Postgres Store Adapter Contract V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "atlasquant_aion_chat_postgres_store_adapter_contract_v1.py"
      - "test_atlasquant_aion_chat_postgres_store_adapter_contract_v1.py"
      - "docs/aion/AION_CHAT_POSTGRES_STORE_ADAPTER_CONTRACT_V1.md"
      - ".github/workflows/aion-chat-postgres-store-adapter-contract-v1.yml"
      - ".github/workflows/quality-tests.yml"

permissions:
  contents: read

jobs:
  postgres-store-adapter-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile store adapter contract
        run: |
          python -m py_compile \
            atlasquant_aion_chat_postgres_store_adapter_contract_v1.py \
            test_atlasquant_aion_chat_postgres_store_adapter_contract_v1.py
      - name: Run store adapter design tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_chat_postgres_store_adapter_contract_v1.py
      - name: Assert zero DB/provider/network execution
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_chat_postgres_store_adapter_contract_v1.py").read_text(encoding="utf-8")
          for banned in (
              "import psycopg",
              "import sqlalchemy",
              "import sqlite3",
              "import requests",
              "import socket",
              "os.getenv(",
              ".connect(",
              "execute(",
              "CREATE TABLE",
              "INSERT INTO",
              "UPDATE ",
              "DELETE FROM",
              "subprocess",
          ):
              assert banned not in source, banned
          for marker in (
              '"READY_FOR_POSTGRES_STORE_ADAPTER_IMPLEMENTATION"',
              '"COMMIT_OUTCOME_UNKNOWN"',
              '"append_message"',
              '"scope_on_every_query"',
              '"postgres_client_imported"',
              '"external_action_executed"',
          ):
              assert marker in source, marker
          PY
