name: AION B2B Owner Renewal Review

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_review.py"
      - "test_atlasquant_aion_b2b_owner_renewal_review.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_REVIEW_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-review.yml"

permissions:
  contents: read

jobs:
  owner-renewal-review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile owner renewal review packet
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_value_bound_service_cycle.py \
            atlasquant_aion_b2b_owner_renewal_review.py
      - name: Run owner renewal review tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_value_bound_service_cycle.py \
            test_atlasquant_aion_b2b_owner_renewal_review.py
