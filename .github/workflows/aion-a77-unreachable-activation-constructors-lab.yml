name: AION A77 LAB unreachable activation constructor removal

on:
  pull_request:
    branches: [lab/aion-v16-a75-f1-t1-untrusted-witness-intake-20261014]
    paths:
      - "atlasquant_aion_global_worker_activation.py"
      - "test_atlasquant_aion_a77_no_dormant_activation_constructors.py"
      - ".github/workflows/aion-a77-unreachable-activation-constructors-lab.yml"

permissions:
  contents: read

jobs:
  a77:
    name: A77 dormant-constructor fence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Same pinned dependencies as A74
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: Compile changed files
        run: python -m py_compile atlasquant_aion_global_worker_activation.py test_atlasquant_aion_a77_no_dormant_activation_constructors.py
      - name: Static positive-constructor regression and A74 adversarial tests
        run: python -m unittest -v test_atlasquant_aion_a77_no_dormant_activation_constructors test_atlasquant_aion_activation_authority_a74 test_atlasquant_aion_readiness_source_witness_a73 test_atlasquant_aion_inflight_attempt_a72 test_atlasquant_aion_inflight_receipt_safety_a71 test_atlasquant_aion_inflight_untrusted_receipts_a58
