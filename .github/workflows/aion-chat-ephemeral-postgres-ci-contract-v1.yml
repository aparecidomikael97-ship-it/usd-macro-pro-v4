name: AION Chat Ephemeral Postgres CI Contract V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py"
      - "test_atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py"
      - "docs/aion/AION_CHAT_EPHEMERAL_POSTGRES_CI_CONTRACT_V1.md"
      - ".github/workflows/aion-chat-ephemeral-postgres-ci-contract-v1.yml"
      - ".github/workflows/quality-tests.yml"

permissions:
  contents: read

jobs:
  ephemeral-postgres-ci-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile CI integration contract
        run: |
          python -m py_compile \
            atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py \
            test_atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py
      - name: Run CI integration contract tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py
      - name: Assert zero DB network secret execution
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("atlasquant_aion_chat_ephemeral_postgres_ci_contract_v1.py").read_text(encoding="utf-8")
          for banned in (
              "import psycopg",
              "import socket",
              "import requests",
              "os.getenv(",
              "os.environ",
              "DATABASE_URL",
              ".connect(",
              "execute(",
              "subprocess",
          ):
              assert banned not in source,banned
          for marker in (
              '"READY_FOR_EPHEMERAL_POSTGRES_CI_IMPLEMENTATION_REVIEW"',
              '"EPHEMERAL_POSTGRES_SERVICE"',
              '"production_database_touched"',
              '"connection_opened"',
              '"external_action_executed"',
          ):
              assert marker in source,marker
          PY
