name: AION P0 A149 Authenticated Challenge CAS LAB (NO-GO)
on:
  pull_request:
    paths:
      - 'aion_p0_a145_checkpoint_verifier_lab.py'
      - 'aion_p0_a145_authenticated_checkpoint_lab.py'
      - 'aion_p0_a146_highwater_gate_lab.py'
      - 'aion_p0_a146_signed_highwater_lab.py'
      - 'aion_p0_a147_sqlite_crash_journal_lab.py'
      - 'aion_p0_a148_split_process_witness_lab.py'
      - 'aion_p0_a149_authenticated_cas_lab.py'
      - 'aion_p0_a149_broker_cli_lab.py'
      - 'tests/test_aion_p0_a145_rollback_threat_model_lab.py'
      - 'tests/test_aion_p0_a145_checkpoint_verifier_lab.py'
      - 'tests/test_aion_p0_a145_authenticated_checkpoint_lab.py'
      - 'tests/test_aion_p0_a146_highwater_gate_lab.py'
      - 'tests/test_aion_p0_a146_signed_highwater_lab.py'
      - 'tests/test_aion_p0_a147_sqlite_crash_reconcile_lab.py'
      - 'tests/test_aion_p0_a148_split_process_witness_lab.py'
      - 'tests/test_aion_p0_a149_authenticated_cas_lab.py'
      - 'tests/run_aion_a149_counted_lab.py'
      - '.github/workflows/aion-p0-a149-authenticated-cas-lab.yml'
  push:
    branches:
      - lab/aion-p0-a149-authenticated-witness-cas-20261022
permissions:
  contents: read
jobs:
  counted-synthetic-signed-publisher:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_LAB_MODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned test-only Ed25519 dependency
        run: python -m pip install "cryptography==44.0.3"
      - name: A145-A149 199 counted offline LAB tests, no skips
        run: python -B tests/run_aion_a149_counted_lab.py
