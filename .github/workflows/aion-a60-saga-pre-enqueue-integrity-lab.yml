name: AION A60 LAB Saga integrity admission RED GREEN

on:
  pull_request:
    branches: [lab/aion-v16-a59-live-self-reported-status-red-20261014]
    paths:
      - test_atlasquant_aion_saga_pre_enqueue_integrity_a60.py
      - atlasquant_aion_execution_saga.py
      - .github/workflows/aion-a60-saga-pre-enqueue-integrity-lab.yml

permissions:
  contents: read

jobs:
  saga-integrity-before-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install existing pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
      - name: Run A60 against actual Saga/Outbox modules (network forbidden)
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import socket, unittest
          def deny(*args, **kwargs):
              raise AssertionError("A60_LAB_EXTERNAL_NETWORK_DENIED")
          socket.socket.connect = deny
          cases = [
              "test_atlasquant_aion_saga_pre_enqueue_integrity_a60",
          ]
          result = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(cases)
          )
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
