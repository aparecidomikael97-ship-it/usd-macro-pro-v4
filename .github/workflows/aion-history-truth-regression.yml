name: AION History Truth Regression (Draft)

on:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_chat_product_bridge.py"
      - "aion_chat/web/command-chat.js"
      - "test_aion_history_truth_preparation.py"
      - "test_atlasquant_aion_chat_product_bridge.py"
      - "test_atlasquant_aion_chat_product_ui_browser_staged.py"
      - ".github/workflows/aion-history-truth-regression.yml"

permissions:
  contents: read

jobs:
  historical-truth:
    name: Scoped history + Chromium / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR HEAD (read-only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt pytest==9.1.1 playwright==1.63.0
      - name: Prepare Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Prepare Chromium (Windows)
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Test real SQLite, scoped history and staged browser
        run: |
          python -m pytest -q test_aion_history_truth_preparation.py test_atlasquant_aion_chat_product_bridge.py test_atlasquant_aion_chat_history_bridge.py test_atlasquant_aion_chat_product_ui_browser_staged.py
