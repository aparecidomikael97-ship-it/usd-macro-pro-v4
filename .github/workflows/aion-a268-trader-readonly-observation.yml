name: AION A268 Trader Read-Only Observation LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_trader_observation.py
      - atlasquant_trader_resident.py
      - labs/test_a268_trader_readonly_observation.py
      - docs/lab/aion_a268_trader_readonly_observation.md
      - .github/workflows/aion-a268-trader-readonly-observation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trader-observation:
    name: A268 existing FX data read model, NO-ORDER (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout source only, never invoke market providers or deploy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing application dependencies and test runner only
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: A268 isolated read-only, risk and AION capability unit contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a268_trader_readonly_observation
          test_atlasquant_risk_guardian
          test_atlasquant_aion_capabilities
      - name: Existing Trader resident and 28 FX coverage regressions (no provider requests)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
