name: AION A82 LAB integrated stack security rehearsal

on:
  pull_request:
    branches: [lab/aion-v16-a81-windows-a62-sqlite-cleanup-20261014]
    paths:
      - "atlasquant_aion_global_worker_activation.py"
      - "atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py"
      - "test_atlasquant_aion_a77_no_dormant_activation_constructors.py"
      - "test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py"
      - "test_atlasquant_aion_h0_causal_denial_a79.py"
      - "test_atlasquant_aion_convergence.py"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/aion-a82-core-stack-integration-lab.yml"

permissions:
  contents: read

jobs:
  targeted:
    name: A82 exact combined contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing pinned dependency set
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: Combined A77/A80/A79/A76/A74/A62 and provenance contracts
        run: >-
          python -m unittest -q
          test_atlasquant_aion_a77_no_dormant_activation_constructors.py
          test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py
          test_atlasquant_aion_activation_denial_coverage_a76.py
          test_atlasquant_aion_h0_causal_denial_a79.py
          test_atlasquant_aion_saga_outcome_local_trust_a62.py
          test_atlasquant_aion_activation_authority_a74.py
          test_atlasquant_aion_convergence.py
          test_quality_workflow_coverage.py

  historical_quality:
    name: A82 canonical Quality unittest portion retained RED (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing dependencies, without updating runtime
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Run actual current canonical unittest file selection, no waivers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          source=Path(".github/workflows/quality-tests.yml").read_text(encoding="utf-8")
          block=source.split("python -m unittest -q",1)[1].split("python -m pytest",1)[0]
          modules=re.findall(r"(?m)^\s+(test_[A-Za-z0-9_]+\.py)\s*\\?$",block)
          if not modules or len(modules)!=len(set(modules)):
              sys.exit("A82_CANONICAL_UNITTTEST_SELECTION_INVALID")
          print("A82_CANONICAL_FILE_COUNT",len(modules),flush=True)
          sys.exit(subprocess.call([sys.executable,"-B","-m","unittest","-q",*modules]))
          PY

  historical_security:
    name: A82 retained A74 Security 365 selection RED (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Original A74 historical Security exact selection (no waiver)
        run: python -B test_atlasquant_aion_activation_denial_coverage_a76.py --canonical --security
