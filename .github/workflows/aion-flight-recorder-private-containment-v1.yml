name: AION Flight Recorder Tenant Quarantine V1

on:
  pull_request:
    paths:
      - "atlasquant_flight_recorder_store.py"
      - "atlasquant_flight_recorder_panel.py"
      - "atlasquant_private_read_gate_v1.py"
      - "atlasquant_legacy_private_resource_gate_v1.py"
      - "test_atlasquant_flight_recorder_store.py"
      - "test_atlasquant_flight_recorder_private_containment_v1.py"
      - ".github/workflows/aion-flight-recorder-private-containment-v1.yml"

permissions:
  contents: read

jobs:
  private-flight-quarantine:
    name: Flight private no I/O / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source and new negative tests
        run: python -B -m py_compile atlasquant_flight_recorder_store.py atlasquant_flight_recorder_panel.py atlasquant_private_read_gate_v1.py test_atlasquant_flight_recorder_private_containment_v1.py
      - name: Verify real fail-closed flight paths, cache cleanup and historical protocol reference
        run: python -B -m unittest test_atlasquant_flight_recorder_private_containment_v1.py test_atlasquant_flight_recorder_store.py test_atlasquant_flight_recorder_panel.py -v
