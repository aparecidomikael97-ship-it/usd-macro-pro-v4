name: AION B2B Execution Terminal Certificate Durable Store Extension V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - design/aion-b2b-execution-terminal-certificate-runtime-reader-store-adapter-v1-20261006
    paths:
      - "atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py"
      - "test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py"
      - "docs/aion/AION_B2B_EXECUTION_TERMINAL_CERTIFICATE_DURABLE_STORE_EXTENSION_V1.md"
      - ".github/workflows/aion-b2b-execution-terminal-certificate-durable-store-extension-v1.yml"

permissions:
  contents: read

jobs:
  execution-terminal-certificate-durable-store-extension-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile durable-store-extension design contract
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py \
            test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py
      - name: Run durable-store-extension design tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py
      - name: Assert design-only migration and zero side effects
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_v1.py").read_text(encoding="utf-8")
          for banned in (
              "sqlite3.connect(",
              "DurableExecutionStore(",
              ".execute(",
              ".executescript(",
              ".commit(",
              ".rollback(",
              "ALTER TABLE",
              "CREATE TABLE",
              "DROP TABLE",
              "requests.get(",
              "requests.post(",
              "httpx.request(",
              "socket.socket(",
              "subprocess.Popen(",
              "subprocess.run(",
              "os.system(",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          for marker in (
              '"READY_FOR_EXECUTION_TERMINAL_CERTIFICATE_DURABLE_STORE_EXTENSION_DESIGN_REVIEW"',
              '"IMPLEMENT_EXECUTION_TERMINAL_CERTIFICATE_DURABLE_STORE_EXTENSION_OFFLINE_ONLY"',
              'EXTENSION_MODE = "ADDITIVE_SAME_DB_TERMINAL_EVIDENCE_EXTENSION"',
              'no_sidecar_database=True',
              'legacy_unscoped_execution_fails_closed=True',
              'timestamp_as_revision_forbidden=True',
              '"migration_executed"',
              '"external_action_executed"',
          ):
              assert marker in source, marker
          PY
