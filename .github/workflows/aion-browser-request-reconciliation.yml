name: AION Browser Request Reconciliation
on:
  pull_request:
    paths:
      - 'atlasquant_aion_chat_request_binding.py'
      - 'atlasquant_aion_chat_product_ui.py'
      - 'atlasquant_aion_chat_product_bridge.py'
      - 'atlasquant_aion_chat_history_bridge.py'
      - 'test_atlasquant_aion_chat_request_reconciliation.py'
      - 'tests/test_aion_browser_request_binding_units.py'
      - '.github/workflows/aion-browser-request-reconciliation.yml'
permissions:
  contents: read
jobs:
  reconcile:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: CI-only pinned dependencies; no owner-machine installation
        run: python -m pip install -r requirements.txt
      - name: Inverse PR1197 safety assertions and real SQLite adversarial tests
        run: >-
          python -B -c "import socket,unittest; from unittest.mock import Mock;
          socket.socket.connect=Mock(side_effect=AssertionError('network forbidden'));
          socket.socket.connect_ex=Mock(side_effect=AssertionError('network forbidden'));
          socket.create_connection=Mock(side_effect=AssertionError('network forbidden'));
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_atlasquant_aion_chat_request_reconciliation','tests.test_aion_browser_request_binding_units','test_atlasquant_aion_chat_product_ui_staged','test_aion_history_truth_preparation','test_atlasquant_aion_chat_sqlite_lifecycle','test_atlasquant_aion_chat_host_staging','test_atlasquant_aion_chat_staged_runtime_resilience','test_atlasquant_aion_execution_outbox','test_atlasquant_aion_supply_chain_pinning','test_quality_workflow_coverage','test_atlasquant_aion_chat_product_bridge','test_atlasquant_aion_chat_history_bridge','test_atlasquant_aion_chat_resume_bridge','test_atlasquant_aion_chat_golden_path']);
          result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
