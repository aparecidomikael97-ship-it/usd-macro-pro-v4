name: AION CI DSSE SLSA Independent Trust Preflight V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py"
      - "tests/test_atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py"
      - "docs/aion/AION_CI_DSSE_SLSA_INDEPENDENT_TRUST_PREFLIGHT_V1.md"
      - ".github/workflows/aion-ci-dsse-slsa-independent-trust-preflight-v1.yml"

permissions:
  contents: read

jobs:
  ephemeral-dsse-slsa-v1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify ephemeral CI-only dependency set
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import os,sys,cryptography
          assert sys.version_info[:2] == (3,12),sys.version
          assert cryptography.__version__ == "50.0.2"
          assert os.environ["GITHUB_ACTIONS"] == "true"
          assert os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          assert os.environ["RUNNER_OS"] in ("Windows","Linux")
          PY

      - name: Compile DSSE and in-toto SLSA fixture verifier
        run: |
          python -m py_compile \
            atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py \
            tests/test_atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py

      - name: Test DSSE PAE Ed25519, signed SLSA fixture and anti-tampering
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py'

      - name: Assert no external trusted identity or native effects
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1.py").read_text("utf-8")
          forbidden=(
              "Ed25519PrivateKey","generate_private_key",
              "import subprocess","from subprocess","import socket","from socket",
              "import requests","from requests","urllib.request","import httpx",
              "import winreg","from winreg","import ctypes","from ctypes",
              "import sqlite3","os.system(","os.exec","Path.write_bytes(",
              "Path.write_text(","open(","os.startfile(","Start-Process ",
          )
          for term in forbidden:
              assert term not in source,term
          from atlasquant_aion_ci_dsse_slsa_provenance_preflight_v1 import dsse_preflight_policy
          policy=dsse_preflight_policy()
          assert policy["ci_only"] and policy["ephemeral_keys_only"]
          assert policy["dsse_pae_implemented"]
          assert policy["in_toto_slsa_v1_fixture_subset_only"]
          for k,v in policy.items():
              if k not in ("schema","ci_only","ephemeral_keys_only","dsse_pae_implemented","in_toto_slsa_v1_fixture_subset_only"):
                  assert v is False,k
          PY
