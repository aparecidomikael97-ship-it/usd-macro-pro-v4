name: AION A282 Three Variant Comparison LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_three_variant_comparison_lab.py
      - labs/test_a282_three_variant_comparison.py
      - docs/lab/aion_a282_three_variant_comparison.md
      - .github/workflows/aion-a282-three-variant-comparison.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-comparison:
    name: A282 same CSV same holdout/no order (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing dependencies and test runner
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: A282 and earlier offline Lab guard regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a282_three_variant_comparison
          labs.test_a281_causal_ob_fvg_priority
          labs.test_a280_causal_structure_lab
          labs.test_a279_causal_fvg_research
          labs.test_a278_plan_journal_local_hash
          labs.test_a277_csv_backtest_holdout
          labs.test_a276_historical_csv
          labs.test_a275_nonfx_readonly_overlay
          labs.test_a269_trader_closed_mtf_evidence
          labs.test_a268_trader_readonly_observation
          test_atlasquant_risk_guardian
      - name: Existing simulator and scanner regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_operational_backtest.py
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
