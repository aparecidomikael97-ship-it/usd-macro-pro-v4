name: AION P0 LAB Canonical Quality RED Baseline Audit (No Waivers)

on:
  push:
    branches: [lab/aion-p0-quality-85-root-cause-ledger-20261021]

permissions:
  contents: read

jobs:
  evidence_audit:
    name: Immutable evidence manifest and parser contracts - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify all 85 historical failures are present and unwaived
        run: python -B tools/aion_p0_quality_red_ledger.py --check-ledger
      - name: Fourteen adversarial checks for fail-closed Quality log comparison
        run: python -B -m unittest discover -s tests -p test_aion_p0_quality_red_ledger_audit_lab.py -v
