name: AION A196 Signed Nonce Scope Collision LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_authority_verifier.py"
      - "labs/test_a196_signed_authority_nonce_scope_lab.py"
      - "docs/lab/aion_a196_signed_nonce_scope_collision.md"
      - ".github/workflows/aion-a196-signed-nonce-scope-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-scope:
    name: A196 signed identity scope / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install only pinned cryptography for local Ed25519 signature tests
        run: python -m pip install cryptography==50.0.2
      - name: Real Ed25519 verifier and SQLite replay tests, no provider
        run: python -B -m unittest -v labs.test_a196_signed_authority_nonce_scope_lab
