name: AION P0 H0 LAB Twilio Provider Capability NO-GO

on:
  push:
    branches: [lab/aion-p0-h0-twilio-evidence-based-provider-no-go-20261021]

permissions:
  contents: read

jobs:
  provider_no_go:
    name: Twilio capability evidence + real Outbox denial - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: Fourteen structural provider-fit denial checks without HTTP
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_twilio_provider_no_go_lab.py -v
      - name: Forty-four real ExecutionOutbox recovery and rollback tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: Eight real outbox restore claim negatives
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
      - name: Sixty-four independent H0 A79 negative checks
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
