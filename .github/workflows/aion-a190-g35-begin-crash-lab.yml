name: A190 G35 BEGIN acknowledgement and abrupt process exit LAB
on:
  pull_request:
    paths:
      - 'aion_chat/store.py'
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g35_begin_ack_process_crash_lab.py'
      - '.github/workflows/aion-a190-g35-begin-crash-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g35-begin-crash:
    name: G35 BEGIN and child crash / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: G35 SQLite BEGIN lost acknowledgement and disposable subprocess exit
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g35_*.py' -v 2>&1 | tee g35.log
          grep -F 'Ran 18 tests' g35.log
          grep -F 'G35_CHAT_BEGIN_BEFORE_GREEN=STORE_QUARANTINED' g35.log
          grep -F 'G35_CHAT_BEGIN_AFTER_RED=TRANSACTION_STARTED_ACK_LOST' g35.log
          grep -F 'G35_OUTBOX_BEGIN_AFTER_RED=LOCK_ACQUIRED_ACK_UNKNOWN_QUARANTINE' g35.log
          grep -F 'G35_CRASH_PRECOMMIT_GREEN=UNCOMMITTED_UPDATE_ROLLED_BACK' g35.log
          grep -F 'G35_CRASH_POSTCOMMIT_RED=UNCERTAIN_STATE_PERSISTED_AFTER_EXIT' g35.log
          grep -F 'G35_LOCAL_REOPEN_LIMIT=NOT_INDEPENDENT_FIRST_SEND_EVIDENCE' g35.log
      - name: G34, G33, G32, G31, G30 inherited regression gates
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g34_*.py' -v 2>&1 | tee g34.log
          grep -F 'Ran 16 tests' g34.log
          python -B -m unittest discover -s labs/a190 -p 'test_g33_*.py' -v 2>&1 | tee g33.log
          grep -F 'Ran 24 tests' g33.log
          python -B -m unittest discover -s labs/a190 -p 'test_g32_*.py' -v 2>&1 | tee g32.log
          grep -F 'Ran 20 tests' g32.log
          python -B -m unittest discover -s labs/a190 -p 'test_g31_*.py' -v 2>&1 | tee g31.log
          grep -F 'Ran 18 tests' g31.log
          python -B -m unittest discover -s labs/a190 -p 'test_g30_*.py' -v 2>&1 | tee g30.log
          grep -F 'Ran 23 tests' g30.log
      - name: Nonnegotiable safety scope
        shell: bash
        run: |
          echo 'os._exit invoked ONLY by isolated disposable child-process test code.'
          echo 'No actual power loss, external witness, real provider, main/merge/deploy.'
          echo 'No permission for Worker or P0 homologation.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
