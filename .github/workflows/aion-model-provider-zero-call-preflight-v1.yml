name: AION Model Provider Zero-Call Preflight CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_provider.py"
      - "test_atlasquant_aion_provider.py"
      - "docs/aion/AION_CHAT_PROVIDER_PREFLIGHT_HARDENING_V1.md"
      - ".github/workflows/aion-model-provider-zero-call-preflight-v1.yml"

permissions:
  contents: read

jobs:
  provider-preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned repository and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile guard and unit tests
        run: python -m py_compile atlasquant_aion_provider.py test_atlasquant_aion_provider.py
      - name: Test model adapter, route policy and gateway
        run: python -m pytest -q test_atlasquant_aion_provider.py test_atlasquant_aion_model_router.py test_atlasquant_aion_gateway.py
