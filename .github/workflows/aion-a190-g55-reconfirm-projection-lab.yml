name: A190 G55 strict confirmed projection replay LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g55_strict_projection_reconfirm_lab.py'
      - '.github/workflows/aion-a190-g55-reconfirm-projection-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-projection:
    name: G55 confirmed JSON integrity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Minimal synthetic LAB dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G55 strict idempotent confirmed-projection test
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g55_*.py' -v 2>&1 | tee g55.log
          grep -F 'Ran 11 tests' g55.log
          grep -F 'G55_CLEAN_RECONFIRM_GREEN=EXACTLY_ONE_LOCAL_RECEIPT' g55.log
          grep -F 'G55_PROJECTED_STATE_GREEN=DENY_NO_REPAIR' g55.log
          grep -F 'G55_INVALID_JSON_GREEN=NO_REPAIR' g55.log
          grep -F 'G55_LOCAL_TIMESTAMP_GREEN=ORIGINAL_PRESERVED' g55.log
          grep -F 'G55_NONCANONICAL_GREEN=NO_SILENT_REPAIR' g55.log
          grep -F 'G55_LEDGER_PRECEDENCE_GREEN=ORIGINAL_G42_GATE_FIRST' g55.log
          grep -F 'G55_FLAG_OFF_GREEN=NO_IMPLICIT_REPAIR' g55.log
      - name: Inherited G54-G30 regression
        shell: bash
        run: |
          set -o pipefail
          for entry in 'g54 9' 'g53 11' 'g52 10' 'g50 11' 'g49 7' 'g48 11' 'g47 18' 'g46 10' 'g45 7' 'g44 39' 'g43 32' 'g42 28' 'g41 18' 'g40 36' 'g39 28' 'g38 24' 'g37 34' 'g36 20' 'g35 18' 'g34 16' 'g33 24' 'g32 20' 'g31 18' 'g30 23'; do
            set -- $entry
            python -B -m unittest discover -s labs/a190 -p "test_$1_*.py" -v 2>&1 | tee "$1.log"
            grep -F "Ran $2 tests" "$1.log"
          done
      - name: Hard gate, no real authority
        shell: bash
        run: |
          echo 'No external receipt, HUMAN_OWNER proof, H0 antirollback or physical process-custody certification.'
          echo 'No main, merge, deploy, Worker, provider, customer data, secrets, real SEND or spending.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND'
