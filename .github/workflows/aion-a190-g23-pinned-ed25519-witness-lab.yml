name: A190 G23 pinned Ed25519 witness verifier LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g23_pinned_ed25519_witness_verifier_lab.py'
      - 'labs/a190/test_g23_pinned_ed25519_witness_verifier_lab.py'
      - '.github/workflows/aion-a190-g23-pinned-ed25519-witness-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g23-pinned-ed25519:
    name: G23 Ed25519 pinned witness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only cryptography dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Pinned Ed25519 synthetic witness tests, no provider
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g23_pinned_ed25519_witness_verifier_lab.py' -v 2>&1 | tee g23.log
          grep -F 'Ran 16 tests' g23.log
          grep -F 'G23_SIGNED_REPLAY_RED=VALID_OLD_SIGNATURE_NOT_FRESHNESS_PROOF' g23.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'Valid signature does NOT prove fresh independently held history.'
          echo 'Ephemeral synthetic private keys only; no trusted external root.'
          echo 'No provider dispatch, no first-attempt external reservation, no P0 closure.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
