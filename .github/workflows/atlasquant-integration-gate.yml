name: AtlasQuant Integration Gate

on:
  workflow_dispatch:
  push:
    branches: [atlasquant-integration]
    paths:
      - "*.py"
      - "docs/**"
      - "tradingview/**"
      - ".github/workflows/**"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: atlasquant-integration-gate
  cancel-in-progress: true

jobs:
  source-only-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate with history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow

      - name: Fetch current main
        run: git fetch origin main --prune

      - name: Compile candidate
        run: python -m compileall -q -x '(^|/)\\.git/' .

      - name: Evaluate source-only integration candidate
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import subprocess
          from pathlib import Path

          from atlasquant_dev_preflight import run_dev_preflight
          from atlasquant_integration_gate import (
              evaluate_integration_candidate,
              integration_manifest_json,
          )

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          candidate_sha=git("rev-parse","HEAD")
          base_sha=git("rev-parse","origin/main")
          ancestor=subprocess.run(
              ["git","merge-base","--is-ancestor","origin/main","HEAD"],
              check=False,
          ).returncode==0
          changed=[
              line.strip()
              for line in git("diff","--name-only","origin/main...HEAD").splitlines()
              if line.strip()
          ]
          preflight=run_dev_preflight()
          result=evaluate_integration_candidate(
              changed,
              main_is_ancestor=ancestor,
              compile_ok=True,
              preflight_ok=preflight.get("status")=="DEV_PREFLIGHT_OK" and int(preflight.get("failed",0) or 0)==0,
              candidate_sha=candidate_sha,
              base_sha=base_sha,
          )
          result["preflight_status"]=preflight.get("status")
          result["preflight_failed"]=preflight.get("failed")
          result["preflight_blockers"]=preflight.get("blockers",[])
          result["note"]="Quality suite and Source Checkpoint are separate required checks; this gate never merges."
          out=Path("integration-gate.json")
          out.write_text(integration_manifest_json(result),encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          if result["status"]!="REVIEWABLE_SOURCE_ONLY":
              raise SystemExit("Integration gate blocked candidate")
          PY

      - name: Integration gate summary
        if: always()
        shell: bash
        run: |
          echo "## AtlasQuant Integration Gate" >> "$GITHUB_STEP_SUMMARY"
          if [ -f integration-gate.json ]; then
            cat integration-gate.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Manifest was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlasquant-integration-gate-${{ github.sha }}
          path: integration-gate.json
          if-no-files-found: warn
          retention-days: 90
