name: AION Unknown Outcome Characterization (NOT acceptance)
on:
  pull_request:
    paths:
      - "diagnostics/aion_unknown_outcome_replay_characterization.py"
      - ".github/workflows/aion-unknown-outcome-characterization.yml"
permissions:
  contents: read
jobs:
  reproduce-not-approve:
    name: Confirm existing replay defect / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact PR HEAD without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only existing host dependency
        run: python -m pip install requests==2.34.2
      - name: Demonstrate duplicate side effect (GREEN means defect reproducible)
        run: python -B -m unittest -v diagnostics.aion_unknown_outcome_replay_characterization
