name: AION A117 LAB historic inflight Security deny-only contract

on:
  pull_request:
    branches: [lab/aion-v16-a116-inflight-corrupt-receipt-fixture-20261016]
    paths:
      - "test_atlasquant_aion_global_worker_inflight_reconciliation.py"
      - "test_atlasquant_aion_global_worker_inflight_resolution.py"
      - ".github/workflows/aion-a117-inflight-deny-lab.yml"

permissions:
  contents: read

jobs:
  deny_inflight:
    name: A117 no forged inflight clear (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A117 historic 4 and A58 A66 A71 A84 A109 negative controls
        run: >-
          python -m unittest -q
          test_atlasquant_aion_global_worker_inflight_reconciliation
          test_atlasquant_aion_global_worker_inflight_resolution
          test_atlasquant_aion_inflight_untrusted_receipts_a58
          test_atlasquant_aion_inflight_empty_witness_a66
          test_atlasquant_aion_inflight_receipt_safety_a71
          test_atlasquant_aion_a84_independent_inflight_staging
          test_atlasquant_aion_a109_negative_boundary_chain
