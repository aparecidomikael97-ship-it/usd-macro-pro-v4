name: AION A205 Untrusted Adapter Absence No Auto Resend LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_execution_outbox.py"
      - "test_atlasquant_aion_execution_outbox.py"
      - "labs/test_a205_unverified_adapter_absence_no_resend.py"
      - "labs/test_a204_outbox_stale_absence_confirmed.py"
      - "docs/lab/aion_a205_unverified_absence_no_resend.md"
      - ".github/workflows/aion-a205-unverified-absence-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-automatic-resend:
    name: A205 untrusted adapter cannot reopen effect / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install requests for real source import, no external SEND
        run: python -m pip install requests==2.34.2
      - name: Test fake adapter lying about effect and absence
        run: python -B -m unittest -v labs.test_a205_unverified_adapter_absence_no_resend labs.test_a204_outbox_stale_absence_confirmed labs.test_a203_outbox_stale_revocation_cas labs.test_a202_outbox_dispatch_atomic_cas
