name: "AION G142 Ecosystem Boundary LAB"

on:
  pull_request:
    paths:
      - "labs/aion_ecosystem_handoff_g142_lab.py"
      - "labs/test_aion_ecosystem_handoff_g142_lab.py"
      - "docs/lab/aion_g142_ecosystem_handoff_contract.md"
      - ".github/workflows/aion-g142-ecosystem-handoff-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary-lab:
    name: "G142 paper handoff / ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: "No deps, no provider, no credentials; pure stdlib LAB"
        run: python -B -m unittest -v labs.test_aion_ecosystem_handoff_g142_lab
