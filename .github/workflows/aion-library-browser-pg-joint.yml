name: AION Library actual AtlasQuant browser plus ephemeral PostgreSQL sandbox

on:
  workflow_dispatch:
  pull_request:
    branches:
      - review/aion-library-joint-reconciliation-v1-20261001
    paths:
      - 'scripts/aion_library_ci_joint_host.py'
      - 'scripts/aion_library_ci_instrumented_app.py'
      - 'scripts/test_aion_library_browser_pg_joint.py'
      - '.github/workflows/aion-library-browser-pg-joint.yml'
      - 'AION_LIBRARY_BROWSER_PG_JOINT_V1_README.md'

permissions:
  contents: read

jobs:
  actual-app-browser-pg-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: library_sandbox
          POSTGRES_PASSWORD: synthetic_ci_only_not_for_production
          POSTGRES_DB: aion_library_sandbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
      ATLASQUANT_ENV: 'SANDBOX'
      ATLASQUANT_REAL_APP_SYNTHETIC: '1'
      AION_LIB_BROWSER_PG_E2E: '1'
      AION_LIB_FULL_CHAIN_TEST: '1'
      AION_LIB_JOINT_E2E: '1'
      AION_LIB_TEST_PG_DSN: 'postgresql://library_sandbox:synthetic_ci_only_not_for_production@localhost:5432/aion_library_sandbox'
      PYTHONWARNINGS: 'error::ResourceWarning'
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - name: Checkout synthetic candidate only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned browser and database sandbox dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'playwright==1.63.0' 'psycopg[binary]==3.2.10'
          python -m playwright install --with-deps chromium
      - name: Compile isolated test harness and inherited backends
        run: |
          python -m compileall -q scripts/aion_library_ci_joint_host.py scripts/aion_library_ci_instrumented_app.py scripts/test_aion_library_browser_pg_joint.py
          python -m compileall -q aion_core atlasquant_aion_library_server_assembly.py atlasquant_aion_library_server_selection.py
      - name: Actual AtlasQuant authenticated browser plus PostgreSQL in one cycle
        run: python scripts/test_aion_library_browser_pg_joint.py
      - name: Independently recheck full-chain and mid-read adversarial PostgreSQL cases
        run: python -m unittest -v test_atlasquant_aion_library_fullchain_pg test_atlasquant_aion_library_server_selection_pg
      - name: Store synthetic browser evidence only, never private database or app logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aion-library-browser-pg-synthetic-evidence
          path: |
            aion-library-real-app-smoke/*.png
          retention-days: 7
