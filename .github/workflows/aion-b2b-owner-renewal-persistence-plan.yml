name: AION B2B Owner Renewal Persistence Plan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_signature.py"
      - "atlasquant_aion_b2b_owner_renewal_persistence_plan.py"
      - "test_atlasquant_aion_b2b_owner_renewal_persistence_plan.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_PERSISTENCE_PLAN_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-persistence-plan.yml"

permissions:
  contents: read

jobs:
  owner-renewal-persistence-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile owner renewal persistence plan
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_signature.py \
            atlasquant_aion_b2b_owner_renewal_persistence_plan.py \
            test_atlasquant_aion_b2b_owner_renewal_persistence_plan.py
      - name: Run owner renewal persistence-plan tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_persistence_plan.py
      - name: Assert planner never writes or executes
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_b2b_owner_renewal_persistence_plan.py"
          ).read_text(encoding="utf-8")
          assert "append_checkpoint_patch(" not in source
          for marker in (
              '"automatic_checkpoint_write": False',
              '"checkpoint_saved": False',
              '"owner_decision_recorded": False',
              '"decision_persisted": False',
              '"business_action_authorized": False',
          ):
              assert marker in source, marker
          for banned in (
              "requests.post(",
              "requests.put(",
              "httpx.post(",
              "subprocess.",
              "send_whatsapp(",
              "send_email(",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
