name: AION P0 A138 LAB Market Artifact Only (NO-GO)
on:
  push:
    branches:
      - lab/aion-p0-market-artifact-only-isolation-a138-20261021
permissions:
  contents: read
jobs:
  offline-market-artifact:
    name: Offline public snapshot only - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
      AION_LAB_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: A138 offline artifact-only security tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_market_artifact_only_a138_lab.py -v
      - name: Export public repository market data snapshots WITHOUT fetching data
        run: python -B tools/aion_p0_market_artifact_only_a138.py --source-root . --out "${{ runner.temp }}/aion-a138-market-artifact-only.zip" --source-sha ${{ github.sha }}
      - name: Inspect exported manifest and refuse checkpoint entries
        run: python -B tools/aion_p0_market_artifact_only_a138.py --inspect "${{ runner.temp }}/aion-a138-market-artifact-only.zip"
      - name: Upload offline market sample as short-lived Actions artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aion-a138-stored-market-sample-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/aion-a138-market-artifact-only.zip
          if-no-files-found: error
          retention-days: 3
