name: AION A88 LAB redacted payload identity never becomes authoritative

on:
  pull_request:
    branches: [lab/aion-v16-a84-inflight-staging-independent-proof-20261014]
    paths:
      - "atlasquant_aion_execution_outbox.py"
      - "test_atlasquant_aion_a88_redacted_payload_identity.py"
      - "test_atlasquant_aion_convergence.py"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/aion-a88-outbox-payload-identity-lab.yml"

permissions:
  contents: read

jobs:
  negative-contract:
    name: A88 redaction identity / no send (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing requirements
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A88 and established local outbox negative contracts
        run: >-
          python -m unittest -v
          test_atlasquant_aion_a88_redacted_payload_identity
          test_atlasquant_aion_outbox_missing_predecessor_denial
          test_atlasquant_aion_outbox_fifo_local_terminal_denial
          test_atlasquant_aion_convergence
          test_quality_workflow_coverage
          test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_enqueue_is_transactional_idempotent_and_collision_safe
