name: A190 G21 real AION Outbox witness bridge LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g21_real_outbox_witness_recovery_bridge_lab.py'
      - 'labs/a190/test_g21_real_outbox_witness_recovery_bridge_lab.py'
      - '.github/workflows/aion-a190-g21-real-outbox-witness-bridge-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g21-real-outbox:
    name: G21 real outbox witness bridge / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Real AION outbox read-only recovery bridge, synthetic witness
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g21_real_outbox_witness_recovery_bridge_lab.py' -v 2>&1 | tee g21.log
          grep -F 'Ran 12 tests' g21.log
          grep -E '^OK$' g21.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'Real Outbox read only; fake witness NOT cryptographic/external.'
          echo 'No provider dispatch, no first attempt authorization, no P0 closure.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
