# Research-only validation; does not deploy or send orders.
name: AtlasQuant Trader LAB FX28 FVG OB precision
on:
  pull_request:
    paths:
      - 'atlasquant_trader_precision_lab.py'
      - 'test_atlasquant_trader_precision_lab.py'
      - 'docs/TRADER_FX28_FVG_OB_PRECISION_LAB_20261027.md'
      - '.github/workflows/trader-precision-fx28-fvg-ob-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trader-precision-research:
    name: FX28 and zone resolution / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 23 isolated research tests, zero orders or network
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v test_atlasquant_trader_precision_lab 2>&1 | tee trader_precision_lab.log
          grep -F 'Ran 23 tests' trader_precision_lab.log
          grep -Fx 'OK' trader_precision_lab.log
