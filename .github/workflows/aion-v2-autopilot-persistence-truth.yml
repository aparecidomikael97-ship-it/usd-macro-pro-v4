name: AION V2 Autopilot persistence truth reference

on:
  pull_request:
    paths:
      - "atlasquant_aion_v2_autopilot_persistence_truth_reference.py"
      - "tests/test_atlasquant_aion_v2_autopilot_persistence_truth_reference.py"
      - "docs/aion/AION_V2_AUTOPILOT_PERSISTENCE_TRUTH_REFERENCE.md"
      - "autopilot_v107.py"
      - ".github/workflows/aion-v2-autopilot-persistence-truth.yml"

permissions:
  contents: read

jobs:
  offline:
    name: No-network truth model / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile reference and tests without importing runtime
        run: python -B -m py_compile atlasquant_aion_v2_autopilot_persistence_truth_reference.py tests/test_atlasquant_aion_v2_autopilot_persistence_truth_reference.py
      - name: Synthetic offline truth semantics
        run: python -B -m unittest discover -s tests -p test_atlasquant_aion_v2_autopilot_persistence_truth_reference.py
