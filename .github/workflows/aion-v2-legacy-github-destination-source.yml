name: AION V2 Legacy GitHub Destination Provenance CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_v2_legacy_github_destination_source_review.py"
      - "tests/test_atlasquant_aion_v2_legacy_github_destination_source_review.py"
      - "docs/aion/AION_V2_LEGACY_GITHUB_DESTINATION_SOURCE_REVIEW.md"
      - ".github/workflows/aion-v2-legacy-github-destination-source.yml"

permissions:
  contents: read

jobs:
  github-write-destination:
    name: 21 GitHub write URL origins, routes and inherited security / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 23
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile destination audit and mutation tests
        run: |
          python -m py_compile atlasquant_aion_v2_legacy_github_destination_source_review.py tests/test_atlasquant_aion_v2_legacy_github_destination_source_review.py
      - name: Fail closed on any mutated legacy HTTP write URL origin
        run: |
          python atlasquant_aion_v2_legacy_github_destination_source_review.py
      - name: Fail closed on provider/TTS and alternate Python network sends
        run: |
          python atlasquant_aion_v2_repository_paid_egress_static_audit.py
      - name: GitHub destination mutation tests and inherited AION security
        run: |
          python -m pytest -q tests/test_atlasquant_aion_v2_legacy_github_destination_source_review.py tests/test_atlasquant_aion_v2_repository_paid_egress_static_audit.py tests/test_atlasquant_neural_tts_paid_post_hard_deny_v2.py tests/test_atlasquant_aion_provider_paid_post_production_lock_v2.py tests/test_atlasquant_aion_v2_host_session_attested_preclaim_reference.py tests/test_atlasquant_aion_v2_persisted_chat_owner_one_shot_reference.py tests/test_atlasquant_aion_v2_owner_signed_one_shot_admission_reference.py tests/test_atlasquant_aion_chat_signed_full_request_review_v2.py tests/test_atlasquant_aion_provider_tls_loopback_integration_v2.py tests/test_atlasquant_aion_provider_real_loopback_http_integration_v1.py tests/test_atlasquant_aion_provider_post_transport_hardening_v2.py tests/test_atlasquant_aion_v2_http_retry_redirect_boundary_reference.py tests/test_atlasquant_aion_v2_captured_id_dual_witness_reference.py tests/test_atlasquant_aion_v2_readonly_recovery_id_capture_reference.py tests/test_atlasquant_aion_v2_provider_recovery_capability_reference.py tests/test_atlasquant_aion_v2_unknown_outcome_reconciliation_reference.py tests/test_atlasquant_aion_v2_dispatch_journal_dual_witness_reference.py tests/test_atlasquant_aion_v2_one_shot_unknown_outcome_journal_reference.py tests/test_atlasquant_aion_v2_registry_dual_generation_reference.py tests/test_atlasquant_aion_v2_four_role_key_enrollment_reference.py tests/test_atlasquant_aion_v2_secondary_anchor_reference.py tests/test_atlasquant_aion_v2_isolated_sqlite_witness_cas_reference.py tests/test_atlasquant_aion_v2_authenticated_witness_read_cas_reference.py tests/test_atlasquant_aion_v2_external_witness_rollback_reference.py tests/test_atlasquant_aion_chat_reference_v2_nonce_cost_hold.py tests/test_atlasquant_aion_chat_reference_nonce_budget_hold_v1.py tests/test_atlasquant_aion_chat_signed_turn_review_v1.py tests/test_atlasquant_aion_chat_pending_model_turn_v1.py tests/test_atlasquant_aion_provider_full_request_binding_v1.py test_atlasquant_aion_provider.py
