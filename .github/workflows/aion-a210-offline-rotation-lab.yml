name: AION A210 Offline Root Rotation Ceremony LAB

on:
  pull_request:
    paths:
      - "labs/a210_offline_root_rotation_proposal.py"
      - "labs/test_a210_offline_root_rotation_proposal.py"
      - "docs/lab/aion_a210_offline_root_rotation_ceremony.md"
      - ".github/workflows/aion-a210-offline-rotation-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rotation-proposal:
    name: A210 proposal is not owner approval / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install minimal import dependency
        run: python -m pip install requests==2.34.2
      - name: Run A210 proposal tests plus A209 A208 and A206 regressions
        run: python -B -m unittest -v labs.test_a210_offline_root_rotation_proposal labs.test_a209_root_provenance_failclosed labs.test_a208_independent_receipt_preflight labs.test_a206_late_send_outcome_cas
