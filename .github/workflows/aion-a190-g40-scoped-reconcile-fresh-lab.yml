name: A190 G40 scoped reconciliation and fresh clock LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g40_reconcile_scoped_authority_lab.py'
      - 'labs/a190/test_g40_post_witness_fresh_clock_lab.py'
      - '.github/workflows/aion-a190-g40-scoped-reconcile-fresh-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g40-authority-clock:
    name: G40 reconciliation and fresh clock / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only cryptography
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G40 strict scoped reconciliation and post-witness freshness
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g40_*.py' -v 2>&1 | tee g40.log
          grep -F 'Ran 36 tests' g40.log
          grep -F 'G40_LOOKUP_AUTH_GREEN=SCOPED_RECONCILIATION_ONLY' g40.log
          grep -F 'G40_RECONCILE_DENY_GREEN=NO_ADAPTER_PROPERTY_ACCESS' g40.log
          grep -F 'G40_EXPIRED_SEND_GREEN=RECONCILE_LOOKUP_SEPARATE_AUTHORITY' g40.log
          grep -F 'G40_TTL_AFTER_CALLBACK_GREEN=UNCERTAIN_ZERO_SEND' g40.log
          grep -F 'G40_LEASE_AFTER_CALLBACK_GREEN=UNCERTAIN_ZERO_SEND' g40.log
          grep -F 'G40_CLOCK_ROLLBACK_GREEN=UNCERTAIN_ZERO_SEND' g40.log
          grep -F 'G40_GETTER_DELAY_GREEN=EXPIRED_AFTER_PROPERTY_NO_SEND' g40.log
          grep -F 'G40_GETTER_REENTRY_GREEN=CLAIM_CHANGED_AFTER_PROPERTY_NO_SEND' g40.log
          grep -F 'G40_LOCAL_CLOCK_RED=UNTRUSTED_HOST_CAN_SUPPLY_FALSE_FRESH_TIME' g40.log
          grep -F 'G40_SYNTHETIC_CONFIRM_LIMIT=LOCAL_VERIFIER_NOT_PROVIDER_RECEIPT' g40.log
      - name: Inherited G39–G30 regression and RED gates
        shell: bash
        run: |
          set -o pipefail
          for n in 39 38 37 36 35 34 33 32 31 30; do
            python -B -m unittest discover -s labs/a190 -p "test_g${n}_*.py" -v 2>&1 | tee "g${n}.log"
          done
          grep -F 'Ran 28 tests' g39.log
          grep -F 'Ran 24 tests' g38.log
          grep -F 'Ran 34 tests' g37.log
          grep -F 'Ran 20 tests' g36.log
          grep -F 'Ran 18 tests' g35.log
          grep -F 'Ran 16 tests' g34.log
          grep -F 'Ran 24 tests' g33.log
          grep -F 'Ran 20 tests' g32.log
          grep -F 'Ran 18 tests' g31.log
          grep -F 'Ran 23 tests' g30.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'Both G40 protections are explicit LAB opt-ins; default denies SEND.'
          echo 'Synthetic clock is host-controlled and not trusted physical time.'
          echo 'Synthetic reconciliation receipts are not real provider proofs.'
          echo 'Origin authentication, external high-water custody, migration remain open.'
          echo 'No Worker, provider, main/merge/deploy, customers, credentials or spending.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
