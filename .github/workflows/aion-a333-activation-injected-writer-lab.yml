name: A333 LAB injected activation writer denied

on:
  pull_request:
    paths:
      - 'atlasquant_aion_global_worker_activation.py'
      - 'labs/test_a333_activation_injected_writer_denial_lab.py'
      - '.github/workflows/aion-a333-activation-injected-writer-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation-no-custody:
    name: A333 inert activation writer boundary — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Test activation denial and safe-disable controls, sockets denied
        run: |
          python -c "import socket,unittest; socket.socket.connect=lambda *a,**k: (_ for _ in ()).throw(AssertionError('A333_EXTERNAL_NETWORK_DENIED')); root='test_atlasquant_aion_global_worker_activation.GlobalWorkerActivationCeremonyTests.'; names=['labs.test_a333_activation_injected_writer_denial_lab','labs.test_a332_global_worker_cas_hard_stop_lab','labs.test_a331_direct_executor_admission_lab','test_atlasquant_aion_background_executor']+[root+n for n in ['test_worker_enable_writer_denies_unset_and_disabled_without_any_http_mutation','test_safety_disabler_falls_back_to_create_disabled_when_missing','test_activation_requires_final_confirmation_before_any_reads_or_writes','test_deactivation_requires_exact_phrase_and_confirms_disabled_state']]; tests=unittest.defaultTestLoader.loadTestsFromNames(names); result=unittest.TextTestRunner(verbosity=2).run(tests); raise SystemExit(0 if result.wasSuccessful() else 1)"
