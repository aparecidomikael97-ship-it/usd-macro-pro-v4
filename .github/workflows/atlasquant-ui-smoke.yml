name: AtlasQuant Integration UI Smoke

on:
  workflow_dispatch:
  push:
    branches: [atlasquant-integration, atlasquant-release-final, atlasquant-support-final, atlasquant-support-ui, atlasquant-brokers-guide, atlasquant-voice-readiness, atlasquant-academy-media, atlasquant-commercial-prep, atlasquant-final-release-prep, atlasquant-home-radar, atlasquant-private-validation, atlasquant-academy-video-blueprints]
    paths:
      - "usd_macro_pro_v4_cloud.py"
      - "atlasquant_ui_v1.py"
      - "atlasquant_dashboard_v1.py"
      - "atlasquant_home_radar.py"
      - "atlasquant_setup_validation.py"
      - "atlasquant_setup_journal.py"
      - "pair_intelligence_v108.py"
      - "pair_intelligence_v110.py"
      - "atlasquant_academy.py"
      - "atlasquant_academy_media.py"
      - "atlasquant_academy_video_blueprints.py"
      - "atlasquant_support_center.py"
      - "atlasquant_brokers_guide.py"
      - "atlasquant_sales_center.py"
      - "atlasquant_commercial_prep.py"
      - "atlasquant_billing_contract.py"
      - "atlasquant_data_licensing_inventory.py"
      - "atlasquant_public_launch_readiness.py"
      - "atlasquant_native_packaging.py"
      - "atlasquant_finalization_audit.py"
      - "native/**"
      - "docs/commercial/**"
      - "atlasquant_voice_readiness.py"
      - "experience_v103.py"
      - ".github/workflows/atlasquant-ui-smoke.yml"

permissions:
  contents: read

concurrency:
  group: atlasquant-${{ github.ref_name }}-ui-smoke
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ATLASQUANT_ENV: "LOCAL"
      ATLASQUANT_AUTH_REQUIRED: "false"
      ATLASQUANT_OFFLINE_SMOKE: "true"
      CHAVE_FRED: ""
      CHAVE_NEWSAPI: ""
      CHAVE_EODHD: ""
      CHAVE_TWELVE_DATA: ""
      GITHUB_TOKEN_HISTORICO: ""
      GITHUB_REPO_HISTORICO: ""
      GITHUB_DATA_BRANCH: ""
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install UI smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow playwright
          python -m playwright install --with-deps chromium

      - name: Start local AtlasQuant
        shell: bash
        run: |
          set -euo pipefail
          nohup streamlit run usd_macro_pro_v4_cloud.py             --server.headless true             --server.address 127.0.0.1             --server.port 8501             > /tmp/atlasquant-streamlit.log 2>&1 &
          echo $! > /tmp/atlasquant-streamlit.pid

          code="000"
          for attempt in $(seq 1 60); do
            code=$(curl -sS --connect-timeout 2 --max-time 5               -o /tmp/atlasquant-local-health.txt               -w "%{http_code}"               http://127.0.0.1:8501/_stcore/health || true)
            echo "local health attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$code" = "200"

      - name: Validate desktop and mobile UI
        shell: bash
        run: |
          cat > /tmp/atlasquant_ui_smoke.py <<'PY'
          import json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url="http://127.0.0.1:8501"
          out=Path("ui-smoke")
          out.mkdir(exist_ok=True)
          profiles={
              "desktop":{"viewport":{"width":1440,"height":1000},"is_mobile":False},
              "mobile":{"viewport":{"width":390,"height":844},"is_mobile":True},
          }
          report={"url":url,"profiles":{}}
          failures=[]

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,cfg in profiles.items():
                  context=browser.new_context(
                      viewport=cfg["viewport"],
                      is_mobile=cfg["is_mobile"],
                      device_scale_factor=1,
                  )
                  page=context.new_page()
                  console_errors=[]
                  page_errors=[]
                  page.on("console",lambda msg: console_errors.append(msg.text) if msg.type=="error" else None)
                  page.on("pageerror",lambda exc: page_errors.append(str(exc)))

                  response=page.goto(url,wait_until="domcontentloaded",timeout=180_000)
                  status=response.status if response else None
                  page.locator('[data-testid="stAppViewContainer"]').wait_for(timeout=90_000)

                  rendered=False
                  body_text=""
                  title=""
                  hero_count=0
                  loading_macro=False
                  for attempt in range(1,13):
                      title=page.title()
                      body_text=page.locator("body").inner_text(timeout=30_000)
                      main_count=page.locator('[data-testid="stMainBlockContainer"]').count()
                      hero_count=page.locator(".aq-hero").count()
                      loading_macro="Carregando dados macroeconômicos globais" in body_text
                      radar_home="Radar de Oportunidades" in body_text
                      visible_tab_count=page.locator('[data-testid="stTabs"] [role="tab"]:visible').count()
                      rendered=(
                          hero_count>=1
                          and "ATLASQUANT" in body_text
                          and main_count>=1
                          and not loading_macro
                          and radar_home
                      )
                      if rendered:
                          break
                      page.wait_for_timeout(2_000)

                  exception_count=page.locator('[data-testid="stException"]').count()
                  viewport_width=page.evaluate("window.innerWidth")
                  document_width=page.evaluate("document.documentElement.scrollWidth")
                  horizontal_overflow=max(0,int(document_width)-int(viewport_width))
                  screenshot=out/f"{name}.png"
                  page.screenshot(path=str(screenshot),full_page=True)

                  info={
                      "http_status":status,
                      "title":title,
                      "body_chars":len(body_text),
                      "rendered":rendered,
                      "hero_count":hero_count,
                      "loading_macro":loading_macro,
                      "radar_home":radar_home,
                      "visible_tab_count":visible_tab_count,
                      "streamlit_exceptions":exception_count,
                      "viewport_width":viewport_width,
                      "document_width":document_width,
                      "horizontal_overflow_px":horizontal_overflow,
                      "console_errors":console_errors[-10:],
                      "page_errors":page_errors[-10:],
                      "screenshot":str(screenshot),
                  }
                  report["profiles"][name]=info

                  if status is None or status>=400:
                      failures.append(f"{name}: HTTP {status}")
                  if not rendered:
                      failures.append(
                          f"{name}: AtlasQuant hero não renderizou "
                          f"(hero={hero_count}, loading_macro={loading_macro})"
                      )
                  if visible_tab_count!=6:
                      failures.append(f"{name}: modo Iniciante deveria mostrar 6 abas, encontrou {visible_tab_count}")
                  if exception_count:
                      failures.append(f"{name}: {exception_count} stException")
                  if page_errors:
                      failures.append(f"{name}: {len(page_errors)} pageerror")
                  if horizontal_overflow>8:
                      failures.append(f"{name}: overflow horizontal {horizontal_overflow}px")
                  context.close()
              browser.close()

          (out/"report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if failures:
              raise SystemExit(" | ".join(failures))
          PY
          python /tmp/atlasquant_ui_smoke.py

      - name: Preserve Streamlit log
        if: always()
        shell: bash
        run: |
          mkdir -p ui-smoke
          if [ -f /tmp/atlasquant-streamlit.log ]; then
            cp /tmp/atlasquant-streamlit.log ui-smoke/streamlit.log
          fi

      - name: UI smoke summary
        if: always()
        shell: bash
        run: |
          echo "## AtlasQuant Integration UI Smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ui-smoke/report.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat ui-smoke/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UI smoke report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlasquant-integration-ui-smoke-${{ github.sha }}
          path: ui-smoke/
          if-no-files-found: warn
          retention-days: 30
