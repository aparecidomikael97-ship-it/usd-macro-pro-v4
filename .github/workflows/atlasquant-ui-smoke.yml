name: AtlasQuant Integration UI Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "usd_macro_pro_v4_cloud.py"
      - "atlasquant_ui_v1.py"
      - "atlasquant_dashboard_v1.py"
      - "atlasquant_home_radar.py"
      - "atlasquant_fast_startup.py"
      - "atlasquant_sales_center.py"
      - "atlasquant_platform_center.py"
      - "atlasquant_academy.py"
      - "atlasquant_academy_media.py"
      - "atlasquant_support_center.py"
      - "atlasquant_brokers_guide.py"
      - "atlasquant_commercial_prep.py"
      - "atlasquant_billing_contract.py"
      - "atlasquant_data_licensing_inventory.py"
      - "atlasquant_public_launch_readiness.py"
      - "atlasquant_native_packaging.py"
      - "atlasquant_finalization_audit.py"
      - "atlasquant_voice_readiness.py"
      - "atlasquant_voice_assistant.py"
      - "experience_v103.py"
      - "native/**"
      - "docs/commercial/**"
      - ".github/workflows/atlasquant-ui-smoke.yml"
  push:
    branches: [atlasquant-integration, atlasquant-release-final, atlasquant-support-final, atlasquant-support-ui, atlasquant-brokers-guide, atlasquant-voice-readiness, atlasquant-academy-media, atlasquant-commercial-prep, atlasquant-final-release-prep, atlasquant-home-radar, atlasquant-private-validation, atlasquant-fast-startup, atlasquant-voice-assistant-final, atlasquant-mobile-dom-stability]
    paths:
      - "usd_macro_pro_v4_cloud.py"
      - "atlasquant_ui_v1.py"
      - "atlasquant_dashboard_v1.py"
      - "atlasquant_home_radar.py"
      - "atlasquant_fast_startup.py"
      - "atlasquant_setup_validation.py"
      - "atlasquant_setup_journal.py"
      - "pair_intelligence_v108.py"
      - "pair_intelligence_v110.py"
      - "atlasquant_academy.py"
      - "atlasquant_academy_media.py"
      - "atlasquant_support_center.py"
      - "atlasquant_brokers_guide.py"
      - "atlasquant_sales_center.py"
      - "atlasquant_commercial_prep.py"
      - "atlasquant_billing_contract.py"
      - "atlasquant_data_licensing_inventory.py"
      - "atlasquant_public_launch_readiness.py"
      - "atlasquant_native_packaging.py"
      - "atlasquant_finalization_audit.py"
      - "native/**"
      - "docs/commercial/**"
      - "atlasquant_voice_readiness.py"
      - "atlasquant_voice_assistant.py"
      - "experience_v103.py"
      - ".github/workflows/atlasquant-ui-smoke.yml"

permissions:
  contents: read

concurrency:
  group: atlasquant-${{ github.ref_name }}-ui-smoke
  cancel-in-progress: true

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      ATLASQUANT_ENV: "LOCAL"
      ATLASQUANT_AUTH_REQUIRED: "false"
      ATLASQUANT_OFFLINE_SMOKE: "true"
      CHAVE_FRED: ""
      CHAVE_NEWSAPI: ""
      CHAVE_EODHD: ""
      CHAVE_TWELVE_DATA: ""
      GITHUB_TOKEN_HISTORICO: ""
      GITHUB_REPO_HISTORICO: ""
      GITHUB_DATA_BRANCH: ""
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"

    steps:
      - name: Checkout integration candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install UI smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamlit pandas numpy requests altair pyarrow playwright
          python -m playwright install --with-deps chromium

      - name: Start local AtlasQuant
        shell: bash
        run: |
          set -euo pipefail
          nohup streamlit run usd_macro_pro_v4_cloud.py             --server.headless true             --server.address 127.0.0.1             --server.port 8501             > /tmp/atlasquant-streamlit.log 2>&1 &
          echo $! > /tmp/atlasquant-streamlit.pid

          code="000"
          for attempt in $(seq 1 60); do
            code=$(curl -sS --connect-timeout 2 --max-time 5               -o /tmp/atlasquant-local-health.txt               -w "%{http_code}"               http://127.0.0.1:8501/_stcore/health || true)
            echo "local health attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 2
          done
          test "$code" = "200"

      - name: Validate desktop and mobile UI
        shell: bash
        run: |
          cat > /tmp/atlasquant_ui_smoke.py <<'PY'
          import json
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url="http://127.0.0.1:8501"
          out=Path("ui-smoke")
          out.mkdir(exist_ok=True)
          profiles={
              "desktop":{"viewport":{"width":1440,"height":1000},"is_mobile":False},
              "mobile":{"viewport":{"width":390,"height":844},"is_mobile":True},
          }
          report={"url":url,"profiles":{}}
          failures=[]

          def select_area(page,label):
              last=""
              for attempt in range(1,4):
                  nav=page.locator('[data-testid="stSelectbox"]').filter(has_text="Área avançada").first
                  if nav.count()<1:
                      page.wait_for_timeout(500)
                      continue
                  combo=nav.get_by_role("combobox")
                  try:
                      current=combo.input_value(timeout=5_000).strip()
                  except Exception:
                      current=""
                  if current==label:
                      return True
                  try:
                      combo.click()
                      combo.fill(label)
                      page.wait_for_timeout(180)
                      combo.press("Enter")
                      page.wait_for_timeout(900)
                      nav=page.locator('[data-testid="stSelectbox"]').filter(has_text="Área avançada").first
                      combo=nav.get_by_role("combobox")
                      last=combo.input_value(timeout=15_000).strip()
                      if last==label:
                          return True
                  except Exception:
                      last=""
                  page.wait_for_timeout(500*attempt)
              return False

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              for name,cfg in profiles.items():
                  context=browser.new_context(
                      viewport=cfg["viewport"],
                      is_mobile=cfg["is_mobile"],
                      device_scale_factor=1,
                  )
                  page=context.new_page()
                  console_errors=[]
                  page_errors=[]
                  page.on("console",lambda msg: console_errors.append(msg.text) if msg.type=="error" else None)
                  page.on("pageerror",lambda exc: page_errors.append(str(exc)))

                  response=page.goto(url,wait_until="domcontentloaded",timeout=180_000)
                  status=response.status if response else None
                  page.locator('[data-testid="stAppViewContainer"]').wait_for(timeout=90_000)

                  rendered=False
                  body_text=""
                  title=""
                  hero_count=0
                  loading_macro=False
                  for attempt in range(1,13):
                      title=page.title()
                      body_text=page.locator("body").inner_text(timeout=30_000)
                      main_count=page.locator('[data-testid="stMainBlockContainer"]').count()
                      hero_count=page.locator(".aq-hero").count()
                      loading_macro="Carregando dados macroeconômicos globais" in body_text
                      radar_home="Radar de Oportunidades" in body_text
                      radar_wait="O Radar aguarda a Matriz dos 7 pares nesta execução." in body_text
                      stable_nav_count=page.locator('[data-testid="stSelectbox"]').filter(has_text="Área").count()
                      rendered=(
                          hero_count>=1
                          and "ATLASQUANT" in body_text
                          and main_count>=1
                          and not loading_macro
                          and (radar_home or radar_wait)
                          and stable_nav_count>=1
                      )
                      if rendered:
                          break
                      page.wait_for_timeout(2_000)

                  contrast_checks={}
                  for label,selector in {
                      "context_label":".aq-context-strip span",
                      "context_value":".aq-context-strip strong",
                      "focus_label":".aq-focus-card small",
                      "focus_detail":".aq-focus-card span",
                  }.items():
                      locator=page.locator(selector)
                      if not locator.count():
                          contrast_checks[label]={"present":False,"readable":False}
                          continue
                      style=locator.first.evaluate(
                          """el => {
                              const s=getComputedStyle(el);
                              return {color:s.color,opacity:parseFloat(s.opacity || "1")};
                          }"""
                      )
                      import re
                      match=re.search(r"rgba?\((\d+),\s*(\d+),\s*(\d+)",str(style.get("color","")))
                      rgb=tuple(int(x) for x in match.groups()) if match else (0,0,0)
                      brightness=sum(rgb)/3.0
                      readable=brightness>=200 and float(style.get("opacity",1))>=0.95
                      contrast_checks[label]={
                          "present":True,
                          "color":style.get("color"),
                          "opacity":style.get("opacity"),
                          "brightness":round(brightness,1),
                          "readable":readable,
                      }

                  desktop_workspace_trace=[]
                  if name=="desktop" and rendered:
                      try:
                          experience=page.locator('[data-testid="stRadio"]').filter(has_text="Experiência").first
                          advanced=experience.get_by_text("Avançado",exact=True)
                          if advanced.count()<1:
                              advanced=page.get_by_text("Avançado",exact=True)
                          if advanced.count()<1:
                              failures.append("desktop: controle Avançado não encontrado")
                          else:
                              advanced.first.click()
                              deadline=time.time()+45
                              while time.time()<deadline:
                                  if page.locator('[data-testid="stSelectbox"]').filter(has_text="Área avançada").count():
                                      break
                                  page.wait_for_timeout(500)
                              sequence=[
                                  "🎯 Radar","🧭 Painel mestre","💱 Moedas","🇺🇸 EUA","🔀 Pares",
                                  "🏦 Fed","🗂️ Histórico","🧪 Backtest","⚡ Decisão","🗺️ Market Map",
                                  "🎙️ Macro Briefing","🎓 Aprender","🧩 Produto","🛠️ Melhorias",
                                  "📰 Notícias","🤖 Autopilot","👤 Conta","📱 Instalar","💼 Vendas",
                                  "💰 Investir","🛟 Suporte",
                              ]
                              for label in sequence:
                                  before_errors=len(page_errors)
                                  selected=select_area(page,label)
                                  page.wait_for_timeout(350)
                                  exception_now=page.locator('[data-testid="stException"]').count()
                                  new_page_errors=max(0,len(page_errors)-before_errors)
                                  desktop_workspace_trace.append({
                                      "area":label,
                                      "selected":selected,
                                      "streamlit_exceptions":exception_now,
                                      "new_page_errors":new_page_errors,
                                  })
                                  if not selected:
                                      failures.append(f"desktop: área não selecionada: {label}")
                                      break
                                  if exception_now:
                                      failures.append(f"desktop: {label} abriu com {exception_now} stException")
                                      break
                                  if new_page_errors:
                                      failures.append(f"desktop: {label} gerou {new_page_errors} pageerror")
                                      break
                              select_area(page,"🎯 Radar")
                      except Exception as exc:
                          failures.append(f"desktop workspace sweep: {type(exc).__name__}: {exc}")

                  exception_count=page.locator('[data-testid="stException"]').count()
                  viewport_width=page.evaluate("window.innerWidth")
                  document_width=page.evaluate("document.documentElement.scrollWidth")
                  horizontal_overflow=max(0,int(document_width)-int(viewport_width))
                  screenshot=out/f"{name}.png"
                  page.screenshot(path=str(screenshot),full_page=True)

                  info={
                      "http_status":status,
                      "title":title,
                      "body_chars":len(body_text),
                      "rendered":rendered,
                      "hero_count":hero_count,
                      "loading_macro":loading_macro,
                      "radar_home":radar_home,
                      "radar_wait":radar_wait,
                      "stable_nav_count":stable_nav_count,
                      "contrast_checks":contrast_checks,
                      "desktop_workspace_trace":desktop_workspace_trace,
                      "streamlit_exceptions":exception_count,
                      "viewport_width":viewport_width,
                      "document_width":document_width,
                      "horizontal_overflow_px":horizontal_overflow,
                      "console_errors":console_errors[-10:],
                      "page_errors":page_errors[-10:],
                      "screenshot":str(screenshot),
                  }
                  report["profiles"][name]=info

                  if status is None or status>=400:
                      failures.append(f"{name}: HTTP {status}")
                  if not rendered:
                      failures.append(
                          f"{name}: AtlasQuant hero não renderizou "
                          f"(hero={hero_count}, loading_macro={loading_macro})"
                      )
                  if stable_nav_count<1:
                      failures.append(f"{name}: seletor de área estável não apareceu no modo Iniciante")
                  bad_contrast=[key for key,value in contrast_checks.items() if not bool(value.get("readable"))]
                  if bad_contrast:
                      failures.append(f"{name}: texto de cartões com contraste insuficiente: {','.join(bad_contrast)}")
                  if exception_count:
                      failures.append(f"{name}: {exception_count} stException")
                  if page_errors:
                      failures.append(f"{name}: {len(page_errors)} pageerror")
                  if horizontal_overflow>8:
                      failures.append(f"{name}: overflow horizontal {horizontal_overflow}px")
                  context.close()
              browser.close()

          (out/"report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          if failures:
              raise SystemExit(" | ".join(failures))
          PY
          python /tmp/atlasquant_ui_smoke.py

      - name: Preserve Streamlit log
        if: always()
        shell: bash
        run: |
          mkdir -p ui-smoke
          if [ -f /tmp/atlasquant-streamlit.log ]; then
            cp /tmp/atlasquant-streamlit.log ui-smoke/streamlit.log
          fi

      - name: UI smoke summary
        if: always()
        shell: bash
        run: |
          echo "## AtlasQuant Integration UI Smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ -f ui-smoke/report.json ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat ui-smoke/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "UI smoke report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlasquant-integration-ui-smoke-${{ github.sha }}
          path: ui-smoke/
          if-no-files-found: warn
          retention-days: 30