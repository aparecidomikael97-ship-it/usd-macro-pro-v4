name: AION V2 Second Independent Anchor Reference CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_v2_secondary_anchor_reference.py"
      - "tests/test_atlasquant_aion_v2_secondary_anchor_reference.py"
      - "docs/aion/AION_V2_SECOND_DOMAIN_ANCHOR_DECISION.md"
      - ".github/workflows/aion-v2-secondary-domain-anchor-reference.yml"

permissions:
  contents: read

jobs:
  second-domain-anchor:
    name: Two signed domains + rollback + CAS race / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned repository + test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile; forbid network/private signer/live execution inside verifier
        run: |
          python -m py_compile atlasquant_aion_v2_secondary_anchor_reference.py tests/test_atlasquant_aion_v2_secondary_anchor_reference.py
          python -c "from pathlib import Path; s=Path('atlasquant_aion_v2_secondary_anchor_reference.py').read_text(); assert all(x not in s for x in ['requests.post(', 'execute_openai_answer(', 'Ed25519PrivateKey(', 'subprocess.Popen(', 'socket.socket(', 'httpx.post(', 'urllib.request.urlopen('])"
      - name: Two-domain controls, persisted primary CAS, signed witness and provider regressions
        run: |
          python -m pytest -q tests/test_atlasquant_aion_v2_secondary_anchor_reference.py tests/test_atlasquant_aion_v2_isolated_sqlite_witness_cas_reference.py tests/test_atlasquant_aion_v2_authenticated_witness_read_cas_reference.py tests/test_atlasquant_aion_v2_external_witness_rollback_reference.py tests/test_atlasquant_aion_chat_reference_v2_nonce_cost_hold.py tests/test_atlasquant_aion_chat_signed_full_request_review_v2.py tests/test_atlasquant_aion_chat_reference_nonce_budget_hold_v1.py tests/test_atlasquant_aion_chat_signed_turn_review_v1.py tests/test_atlasquant_aion_chat_pending_model_turn_v1.py tests/test_atlasquant_aion_provider_full_request_binding_v1.py test_atlasquant_aion_provider.py
