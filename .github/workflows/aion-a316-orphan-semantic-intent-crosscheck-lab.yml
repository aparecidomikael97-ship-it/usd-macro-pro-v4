name: A316 local semantic orphan receipt crosscheck LAB

on:
  pull_request:
    paths:
      - 'aion_chat/store.py'
      - 'labs/test_a316_orphan_intent_crosscheck_lab.py'
      - 'labs/test_a315_semantic_intent_atomic_commit_lab.py'
      - 'docs/lab/aion_a316_orphan_semantic_intent_crosscheck_lab.md'
      - '.github/workflows/aion-a316-orphan-semantic-intent-crosscheck-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orphan-intent-crosscheck-lab:
    name: A316 SQLite intent orphan crosscheck — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A316 intent crosscheck and A315-A299 regressions
        env:
          A313_REQUIRE_DIFFERENT_UID: ${{ runner.os == 'Linux' && '1' || '0' }}
          A314_REQUIRE_CROSS_UID_SOCKET: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: |
          python -m unittest -v labs.test_a316_orphan_intent_crosscheck_lab labs.test_a315_semantic_intent_atomic_commit_lab labs.test_a314_cross_uid_sqlite_socket_lab labs.test_a313_distinct_uid_access_denial_lab labs.test_a312_os_principal_file_boundary_lab labs.test_a311_process_isolated_sqlite_lab labs.test_a310_optin_sqlite_authorizer_composition_lab labs.test_a309_optin_private_helper_write_fence_lab labs.test_a246_chat_commit_uncertainty labs.test_a247_commit_pending_restart_veto labs.test_a292_staged_chat_write_inventory_lab labs.test_a293_host_sqlite_boundary_lab labs.test_a299_sqlite_native_p0_5_6_gap_lab
