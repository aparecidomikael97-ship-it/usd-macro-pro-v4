name: AION G84 direct SQLite constructor interruption LAB
on:
  pull_request:
    paths:
      - 'aion_chat/store.py'
      - 'labs/a190/test_g84_direct_constructor_interrupt_lab.py'
      - '.github/workflows/aion-g84-direct-constructor-interrupt-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g84-constructor:
    name: G84 direct startup interrupts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing pinned synthetic witness dependency
        shell: bash
        run: python -m pip install 'cryptography==50.0.2'
      - name: G84 direct interrupts and G77-G83 focused regressions
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v \
            labs.a190.test_g84_direct_constructor_interrupt_lab \
            labs.a190.test_g83_constructor_cleanup_interruption_lab \
            labs.a190.test_g82_close_failure_lock_lab \
            labs.a190.test_g81_chat_body_interrupt_lab \
            labs.a190.test_g80_chat_rollback_interrupt_lab.G80ChatRollbackInterrupt \
            labs.a190.test_g79_chat_begin_interrupt_lab.G79ChatBeginInterrupt \
            labs.a190.test_g78_chat_commit_interrupt_lab.G78ChatCommitInterrupt \
            labs.a190.test_g33_chat_ambiguous_commit_lab \
            labs.a190.test_g32_chat_store_rollback_quarantine_lab \
            test_atlasquant_aion_first_attempt_witness_a180_lab \
            labs.a190.test_g77_commit_interrupt_quarantine_lab.G77CommitInterruptQuarantine 2>&1 | tee g84.log
          grep -F 'Ran 111 tests' g84.log
          grep -Fx 'OK' g84.log
          grep -F 'G84_DIRECT_KI_GREEN=FAILED_AND_DETACHED' g84.log
          grep -F 'G84_DIRECT_EXIT_GREEN=FAILED_AND_DETACHED' g84.log
          grep -F 'G84_SECONDARY_BEFORE_GREEN=PRIMARY_PRESERVED_LOCK_UNCERTAIN' g84.log
          grep -F 'G84_SECONDARY_AFTER_GREEN=PRIMARY_PRESERVED_NATIVE_CLOSED' g84.log
          grep -F 'G84_FACTORY_KI_GREEN=FAILED_NO_RETRY' g84.log
          grep -F 'G84_FACTORY_EXIT_GREEN=FAILED_NO_RETRY' g84.log
