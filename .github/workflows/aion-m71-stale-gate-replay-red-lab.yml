name: AION M71 stale READY gate replay adversarial RED (READ ONLY)

on:
  push:
    branches: [lab/aion-m71-reopened-ready-gate-replay-red-20261019]
    paths:
      - "test_aion_m71_stale_gate_replay_negative.py"
      - ".github/workflows/aion-m71-stale-gate-replay-red-lab.yml"

permissions:
  contents: read

jobs:
  replay_negative:
    name: M71 reopened-gate stale replay RED (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Check original A118 hashes are unchanged
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "SOURCE_DRIFT $1"; exit 1; }
          }
          check_blob test_atlasquant_aion_global_worker_reactivation_gate.py 6c66e11b4c29b2bef1ff277a0c47740cdb0bf220
          check_blob atlasquant_aion_global_worker_activation.py df43bb4371c784396069f4ede51205b0aa19cc0a
          check_blob atlasquant_aion_global_worker_reactivation_gate.py 8412ada82761de37a72a8f29af7f8672cfb5b082
          check_blob atlasquant_aion_global_worker_incident_reconciliation.py 85541bb2d10f0b97b096df10b5184851160cfec9
          echo "A118_ORIGINAL_4_BLOBS_MATCH"
      - name: Install original dependencies
        run: python -m pip install -r requirements.txt
      - name: Control M68 negative cases first
        run: python -B -m unittest -v test_aion_m68_original_a118_negative
      - name: Run one adversarial M71 safety contract - fail on any READY replay
        run: python -B -m unittest -v test_aion_m71_stale_gate_replay_negative
