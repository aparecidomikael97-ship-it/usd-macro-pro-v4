name: AION First Install Master Offline Preparation

on:
  pull_request:
    branches:
      - audit/aion-first-install-readonly-plan-v1-20261011
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preparation:
    name: Offline contracts and real SQLite faults / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: CI-only existing pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile all candidate Python
        run: python -m compileall -q -x '(^|/)\.git(/|$)' .
      - name: Offline contracts, process crashes, unchanged reference negatives
        run: python -B tools/aion_first_install_preparation_ci.py
      - name: Original 20 gates still unresolved
        run: python -B atlasquant_aion_first_install_plan_v1.py
      - name: Diff whitespace
        run: git diff --check HEAD^ HEAD

  global-quality:
    name: Exact global root Quality / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate and production-main comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Original Quality CI dependencies only
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Exact official Quality without removed tests or skips
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
