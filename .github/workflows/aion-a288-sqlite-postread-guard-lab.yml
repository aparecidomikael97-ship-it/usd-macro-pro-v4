name: AION A288 SQLite Post-read Version Guard LAB

on:
  pull_request:
    paths:
      - aion_chat/store.py
      - labs/a287_sqlite_read_race_probe.py
      - labs/test_a288_sqlite_postread_guard.py
      - docs/lab/aion_a288_sqlite_postread_guard.md
      - .github/workflows/aion-a288-sqlite-postread-guard-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postread-local-guard:
    name: A288 post-read local data_version regression (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native SQLite interleaving and core-security regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a288_sqlite_postread_guard
          labs.test_a287_sqlite_read_race_probe
          labs.test_a286_sqlite_store_data_version_guard
          labs.test_a285_sqlite_live_data_version_lab
          labs.test_a233_native_sqlite_p0_repro
          labs.test_a240_sqlite_pathname_fence
          labs.test_a245_sqlite_connect_path_fence
          labs.test_a248_cross_process_message_lock
          labs.test_a249_lock_path_identity
          labs.test_a267_no_host_auth_dispatch
          test_atlasquant_risk_guardian
