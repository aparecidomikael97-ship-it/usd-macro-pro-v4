name: AtlasQuant - Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [atlasquant-private-deploy]
    paths:
      - "mobile/android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: mobile/android
        run: |
          gradle --no-daemon :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AtlasQuant_Android_TEST.apk
          test -s dist/AtlasQuant_Android_TEST.apk
          ls -lh dist/AtlasQuant_Android_TEST.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AtlasQuant_Android_TEST
          path: mobile/android/dist/AtlasQuant_Android_TEST.apk
          if-no-files-found: error
          retention-days: 14
