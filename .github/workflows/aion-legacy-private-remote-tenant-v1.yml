name: AION Legacy Private Remote Tenant Quarantine V1

on:
  pull_request:
    paths:
      - "atlasquant_legacy_private_resource_gate_v1.py"
      - "atlasquant_shadow_store.py"
      - "atlasquant_research_evidence_store.py"
      - "atlasquant_paper_setup_bridge.py"
      - "usd_macro_pro_v4_cloud.py"
      - "test_atlasquant_legacy_remote_tenant_quarantine_v1.py"
      - ".github/workflows/aion-legacy-private-remote-tenant-v1.yml"

permissions:
  contents: read

jobs:
  offline-tenant-deny:
    name: Tenant provenance zero I/O / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile modified source and tests
        run: python -B -m py_compile atlasquant_legacy_private_resource_gate_v1.py atlasquant_shadow_store.py atlasquant_research_evidence_store.py atlasquant_paper_setup_bridge.py usd_macro_pro_v4_cloud.py test_atlasquant_legacy_remote_tenant_quarantine_v1.py
      - name: Verify tenant A to B no private remote access
        run: python -B -m unittest test_atlasquant_legacy_remote_tenant_quarantine_v1.py -v
