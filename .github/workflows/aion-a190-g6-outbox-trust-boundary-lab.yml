name: A190 G6 Real Outbox Callback Authority Trust LAB
on:
  pull_request:
    paths:
      - 'test_atlasquant_aion_a190_g6_outbox_callback_trust_boundary_lab.py'
      - '.github/workflows/aion-a190-g6-outbox-trust-boundary-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g6-existing-outbox-real-sqlite-untrusted-callbacks:
    name: G6 real Outbox callback trust negative controls (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing minimal pinned AION LAB dependencies
        run: python -m pip install cryptography==50.0.2 requests==2.34.2
      - name: Run Outbox G6 and previous adversarial gates against original modules
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m unittest -v test_atlasquant_aion_a190_g6_outbox_callback_trust_boundary_lab test_atlasquant_aion_a190_g5_real_process_crash_h0_lab test_atlasquant_aion_a190_g4_sqlite_native_files_lab test_atlasquant_aion_a190_g3_first_intent_contract_lab test_atlasquant_aion_local_witness_a189_lab test_atlasquant_aion_live_connection_boundary_a185_lab 2>&1 | tee a190_g6.log
          grep -q 'A190_G6_NO_FIRST_ATTEMPT_GUARD=REAL_OUTBOX_NO_SEND' a190_g6.log
          grep -q 'A190_G6_A183_SIGNED_FIXTURE_PERMITS_SEND_FALSE=REAL_OUTBOX_NO_SEND' a190_g6.log
          grep -q 'A190_G6_CALLER_TRUE_GUARD_AND_RECEIPT=IN_MEMORY_SEND_CONFIRMED_RED' a190_g6.log
          grep -q 'A190_G6_CALLER_TRUE_GUARD_WITHOUT_RECEIPT=ADAPTER_CROSSED_RED' a190_g6.log
          grep -q 'A190_G6_FIRST_ATTEMPT_WITNESS_TIMEOUT=UNCERTAIN_NO_SEND' a190_g6.log
          grep -q 'A190_G6_VERIFIER_REPLACED_AFTER_SEND=FORGED_LOCAL_CONFIRMATION_RED' a190_g6.log
          grep -q 'A190_G6_DIFFERENT_INTENT_REFS_SAME_SEMANTIC_EVENT=TWO_MEMORY_SENDS_RED' a190_g6.log
          grep -q 'A190_G6_A183_LAB_VERIFIED_MISWIRED_AS_AUTHORITY=SEND_BYPASS_RED' a190_g6.log
          grep -q 'A190_G5_HOST_ROLLBACK_AFTER_REAL_PROCESS_CRASH=UNSAFE_READMISSION_RED' a190_g6.log
          grep -q 'A190_G4_REAL_AION_SQLITE_CHAT_STORE_MAIN_ONLY_COPY=STALE_RED' a190_g6.log
          grep -q 'A190_G3_SIGNED_DIFFERENT_IDS_SAME_ORIGINAL=DOUBLE_LOCAL_RESERVATION_RED' a190_g6.log
          echo 'A190_G6_REAL_OUTBOX_CALLER_CONTROLLED_AUTHORITY_BYPASS=REPRODUCED_NO_EXTERNAL_EFFECT'
      - name: Explicit trust and production NO-GO boundary
        run: |
          echo 'Fake adapter actions are only in-memory counters; no outgoing provider/network.'
          echo 'The operational Outbox was exercised read-only via tests, NOT modified.'
          echo 'A183 lab_verified is NOT authorization; permits_send remains false.'
          echo 'Untrusted caller can pass lambda True to the current LAB callback seam.'
          echo 'External issuer and independently immutable pin/root are absent.'
          echo '38 tests per SO if both jobs pass; CI success proves RED paths.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
