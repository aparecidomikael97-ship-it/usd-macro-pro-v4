name: AION Chat Ephemeral Postgres Binding V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - design/aion-chat-real-postgres-driver-binding-contract-v1-20261007
    paths:
      - "requirements.txt"
      - "atlasquant_aion_chat_postgres_store_adapter_fake_v1.py"
      - "atlasquant_aion_chat_ephemeral_postgres_v1.py"
      - "tests/test_atlasquant_aion_chat_ephemeral_postgres_v1.py"
      - "docs/aion/AION_CHAT_EPHEMERAL_POSTGRES_BINDING_V1.md"
      - ".github/workflows/aion-chat-ephemeral-postgres-v1.yml"

permissions:
  contents: read

jobs:
  ephemeral-postgres-binding-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aion_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aion_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      AION_CHAT_EPHEMERAL_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/aion_chat_test?sslmode=disable

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip check

      - name: Compile ephemeral Postgres implementation
        run: |
          python -m py_compile \
            atlasquant_aion_chat_postgres_store_adapter_fake_v1.py \
            atlasquant_aion_chat_ephemeral_postgres_v1.py \
            tests/test_atlasquant_aion_chat_ephemeral_postgres_v1.py

      - name: Run fake-adapter regression
        run: |
          python -m unittest -q \
            test_atlasquant_aion_chat_postgres_store_adapter_fake_v1.py

      - name: Run real ephemeral PostgreSQL contract tests
        run: |
          python -m unittest discover -v -s tests -p 'test_atlasquant_aion_chat_ephemeral_postgres_v1.py'

      - name: Assert production authority remains absent
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_chat_ephemeral_postgres_v1.py").read_text(encoding="utf-8")
          requirements = Path("requirements.txt").read_text(encoding="utf-8")
          assert "psycopg[binary]==3.3.6" in requirements
          for banned in (
              "DATABASE_URL",
              "os.getenv(",
              "os.environ",
              "streamlit.secrets",
              "render.com",
              "api.openai.com",
          ):
              assert banned not in source, banned
          for marker in (
              '"production_allowed": False',
              '"provider_called": False',
              '"billing_executed": False',
              '"deploy_executed": False',
              '"worker_armed": False',
              '"external_action_executed": False',
              '"core_checkpoint_write": False',
          ):
              assert marker in source, marker
          PY
