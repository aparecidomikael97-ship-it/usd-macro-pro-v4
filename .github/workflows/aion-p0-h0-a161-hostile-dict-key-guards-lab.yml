name: AION P0 H0 A161 Hostile Dictionary Key Guards LAB (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-a161-hostile-dict-key-guard-20261022]

permissions:
  contents: read

jobs:
  hostile_dictionary_key_lab:
    name: A161 strict foreign-key denial - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependency pins
        run: python -m pip install -r requirements.txt
      - name: Assert resolved dependencies
        run: python -m pip check
      - name: A161 five hostile-key negative controls
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_a161_hostile_dict_key_guard_lab.py -v
      - name: Parent thirty-four Ed25519 witness controls
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_dual_signed_witness_transcript_lab.py -v
      - name: Parent thirty-eight authority graph controls
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_authority_graph_lab.py -v
