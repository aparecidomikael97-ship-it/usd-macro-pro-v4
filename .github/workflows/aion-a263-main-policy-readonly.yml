name: AION A263 Main Policy REAL BLOCKER and Offline Lab

on:
  pull_request:
    paths:
      - labs/a263_main_policy_readonly.py
      - labs/test_a263_main_policy_readonly.py
      - docs/lab/aion_a263_main_policy_readonly.md
      - .github/workflows/aion-a263-main-policy-readonly.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-unit:
    name: A263 pure negative tests (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout source (NO deployment)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install LAB test dependencies only
        run: python -m pip install cryptography==44.0.3 requests==2.32.3 PyYAML==6.0.2
      - name: A263 policy negatives and previous route regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a263_main_policy_readonly
          labs.test_a262_publication_surface_hard_stop
          labs.test_a261_offline_release_preflight
          labs.test_a260_offline_runtime_bundle
          labs.test_a259_synthetic_callback_isolation
          labs.test_a258_external_proof_admission
          labs.test_a257_monotonic_origin_gate
          labs.test_a256_one_time_challenge_lab
          labs.test_a255_two_party_reservation_binding
          labs.test_a254_synthetic_origin_event_identity
          labs.test_a243_signed_first_attempt
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign

  live-observation-blocker:
    name: A263 live GitHub main policy HARD NO-GO (expected RED)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout (read-only, no deploy)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Fetch two read-only main protection endpoints; NO-GO exit 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B -m labs.a263_main_policy_readonly --live
