name: AION Owner Stack Merge Rollback Recovery V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py"
      - "tests/test_atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py"
      - "docs/aion/AION_OWNER_STACK_MERGE_ROLLBACK_RECOVERY_V1.md"
      - ".github/workflows/aion-owner-stack-merge-rollback-recovery-v1.yml"

permissions:
  contents: read

jobs:
  owner-stack-merge-rollback-recovery-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile rollback recovery contract
        run: |
          python -m py_compile \
            atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py \
            tests/test_atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py

      - name: Run rollback recovery tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py'

      - name: Assert non-mutating recovery boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_owner_stack_merge_rollback_recovery_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import git",
              "from git",
              "import requests",
              "urllib.request",
              "import socket",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"force_push_allowed": False',
              '"remote_main_reset_allowed": False',
              '"history_rewrite_allowed": False',
              '"automatic_revert_allowed": False',
              '"automatic_branch_delete_allowed": False',
              '"automatic_deploy_rollback_allowed": False',
              '"automatic_production_data_rollback_allowed": False',
              '"merge_authorized": False',
              '"rollback_authorized": False',
              '"revert_authorized": False',
              '"deploy_authorized": False',
              '"worker_activation_authorized": False',
              '"provider_activation_authorized": False',
              '"repository_mutation_performed": False',
              '"external_action_executed": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
