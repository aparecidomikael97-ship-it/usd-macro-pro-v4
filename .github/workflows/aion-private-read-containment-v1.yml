name: AION Private Read Containment V1

on:
  pull_request:
    paths:
      - "atlasquant_private_read_gate_v1.py"
      - "test_atlasquant_private_read_gate_v1.py"
      - "atlasquant_access_panel.py"
      - "atlasquant_shadow_capture.py"
      - "atlasquant_shadow_store.py"
      - "atlasquant_research_evidence_capture.py"
      - "atlasquant_research_evidence_store.py"
      - "atlasquant_admin_research_panel.py"
      - "usd_macro_pro_v4_cloud.py"
      - ".github/workflows/aion-private-read-containment-v1.yml"

permissions:
  contents: read

jobs:
  offline-private-read:
    name: Private Read / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile modified Python code
        run: python -B -m py_compile atlasquant_private_read_gate_v1.py test_atlasquant_private_read_gate_v1.py atlasquant_shadow_capture.py atlasquant_research_evidence_capture.py atlasquant_shadow_store.py atlasquant_research_evidence_store.py atlasquant_admin_research_panel.py atlasquant_access_panel.py usd_macro_pro_v4_cloud.py
      - name: Synthetic authorization and zero-I/O regressions
        run: python -B -m unittest test_atlasquant_private_read_gate_v1.py
