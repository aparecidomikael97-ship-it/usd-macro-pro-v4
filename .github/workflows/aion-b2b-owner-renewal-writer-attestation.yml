name: AION B2B Owner Renewal Writer Attestation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_persistence_attestation.py"
      - "atlasquant_aion_b2b_owner_renewal_writer_attestation.py"
      - "test_atlasquant_aion_b2b_owner_renewal_writer_attestation.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_WRITER_ATTESTATION_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-writer-attestation.yml"

permissions:
  contents: read

jobs:
  owner-renewal-writer-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile writer-attestation chain
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_persistence_attestation.py \
            atlasquant_aion_b2b_owner_renewal_writer_attestation.py \
            test_atlasquant_aion_b2b_owner_renewal_writer_attestation.py
      - name: Run writer-attestation tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_persistence_attestation.py \
            test_atlasquant_aion_b2b_owner_renewal_writer_attestation.py
      - name: Assert writer proof is not business authority
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_b2b_owner_renewal_writer_attestation.py"
          ).read_text(encoding="utf-8")
          for marker in (
              '"writer_identity_verified": True',
              '"writer_authority_verified": True',
              '"receipt_binding_verified": True',
              '"checkpoint_write_performed": False',
              '"business_action_authorized": False',
              '"renewal_authorized": False',
              '"termination_authorized": False',
              '"executes_action": False',
          ):
              assert marker in source, marker

          for banned in (
              "append_checkpoint_patch(",
              "save_runtime_checkpoint(",
              "requests.post(",
              "requests.put(",
              "httpx.post(",
              "subprocess.",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
