name: AION Repository Mutation Offline Runtime V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_repository_mutation_offline_runtime_v1.py"
      - "tests/test_atlasquant_aion_repository_mutation_offline_runtime_v1.py"
      - "docs/aion/AION_REPOSITORY_MUTATION_OFFLINE_RUNTIME_V1.md"
      - ".github/workflows/aion-repository-mutation-offline-runtime-v1.yml"

permissions:
  contents: read

jobs:
  repository-mutation-offline-runtime-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned crypto runtime dependency
        run: |
          python -m pip install --disable-pip-version-check "cryptography==50.0.2"

      - name: Compile offline repository mutation runtime
        run: |
          python -m py_compile \
            atlasquant_aion_repository_mutation_offline_runtime_v1.py \
            tests/test_atlasquant_aion_repository_mutation_offline_runtime_v1.py

      - name: Run offline repository mutation runtime tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_repository_mutation_offline_runtime_v1.py'

      - name: Assert runtime is synthetic-only and network-free
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_repository_mutation_offline_runtime_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import requests",
              "from requests",
              "urllib.request",
              "import socket",
              "import httpx",
              "from github",
              "import github",
              "import git",
              "from git",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          forbidden_live_material = (
              "api.github.com",
              "Authorization: Bearer",
              "GITHUB_TOKEN",
              "GH_TOKEN",
          )
          for marker in forbidden_live_material:
              assert marker not in source, marker

          required = (
              '"real_owner_private_signer_implemented": False',
              '"kill_switch_implemented": True',
              '"kill_switch_default_enabled": True',
              '"synthetic_provider_implemented": True',
              '"live_github_state_reader_implemented": False',
              '"live_github_adapter_implemented": False',
              '"runtime_credential_broker_implemented": False',
              '"live_github_transport_executor_implemented": False',
              '"live_authoritative_postcondition_reader_implemented": False',
              '"live_reconciliation_evidence_collector_implemented": False',
              '"github_endpoint_material_included": False',
              '"credential_material_included": False',
              '"real_github_credentials_loaded": False',
              '"real_github_network_path_enabled": False',
              '"github_api_called": False',
              '"network_called": False',
              '"live_repository_mutation_authorized": False',
              '"live_repository_mutation_performed": False',
              '"production_repository_mutation_performed": False',
              '"automatic_retry_allowed": False',
              '"deploy_executed": False',
              '"worker_activated": False',
              '"provider_activated": False',
              '"production_persistence_activated": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
