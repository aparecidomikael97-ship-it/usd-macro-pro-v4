name: AION B2B Pilot Activation Ceremony

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_pilot_activation_preflight.py"
      - "atlasquant_aion_b2b_pilot_activation_ceremony.py"
      - "test_atlasquant_aion_b2b_pilot_activation_ceremony.py"
      - "atlasquant_aion_b2b_pilot_activation_persistence_plan.py"
      - "test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py"
      - "docs/aion/AION_B2B_PILOT_ACTIVATION_CEREMONY_V1.md"
      - "docs/aion/AION_B2B_PILOT_ACTIVATION_PERSISTENCE_PLAN_V1.md"
      - ".github/workflows/aion-b2b-pilot-activation-ceremony.yml"

permissions:
  contents: read

jobs:
  activation-ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile activation ceremony chain
        run: |
          python -m py_compile \
            atlasquant_aion_trust_root.py \
            atlasquant_aion_nonce_registry.py \
            atlasquant_aion_b2b_pilot_activation_preflight.py \
            atlasquant_aion_b2b_pilot_activation_ceremony.py \
            atlasquant_aion_b2b_pilot_activation_persistence_plan.py \
            test_atlasquant_aion_b2b_pilot_activation_ceremony.py \
            test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py
      - name: Run activation ceremony tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_pilot_activation_ceremony.py \
            test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py \
            test_atlasquant_aion_b2b_pilot_activation_preflight.py
      - name: Assert signature, persistence and execution separation
        run: |
          python - <<'PY'
          from pathlib import Path

          ceremony = Path(
              "atlasquant_aion_b2b_pilot_activation_ceremony.py"
          ).read_text(encoding="utf-8")
          for marker in (
              'DECISIONS = (',
              '"AUTHORIZE_PILOT_ACTIVATION"',
              '"DENY_PILOT_ACTIVATION"',
              '"activation_record_persisted": False',
              '"pilot_activation_authorized": False',
              '"pilot_activated": False',
              '"generic_chat_instruction_accepted_as_activation": False',
              '"executes_action": False',
          ):
              assert marker in ceremony, marker

          persist = Path(
              "atlasquant_aion_b2b_pilot_activation_persistence_plan.py"
          ).read_text(encoding="utf-8")
          assert "append_checkpoint_patch(" not in persist
          for marker in (
              '"automatic_checkpoint_write": False',
              '"activation_record_persisted": False',
              '"pilot_activation_authorized": False',
              '"pilot_activated": False',
              '"executes_action": False',
          ):
              assert marker in persist, marker

          for source in (ceremony, persist):
              for banned in (
                  "save_runtime_checkpoint(",
                  "requests.post(",
                  "requests.put(",
                  "subprocess.",
                  "deploy_to_production(",
              ):
                  assert banned not in source, banned
          PY
