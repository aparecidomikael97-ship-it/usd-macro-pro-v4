name: AION B2B Pilot Activation Ceremony\n\non:\n  workflow_dispatch:\n  pull_request:\n    branches: [main]\n    paths:\n      - "atlasquant_aion_b2b_pilot_activation_preflight.py"\n      - "atlasquant_aion_b2b_pilot_activation_ceremony.py"\n      - "test_atlasquant_aion_b2b_pilot_activation_ceremony.py"\n      - "atlasquant_aion_b2b_pilot_activation_persistence_plan.py"\n      - "test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py"\n      - "docs/aion/AION_B2B_PILOT_ACTIVATION_CEREMONY_V1.md"\n      - "docs/aion/AION_B2B_PILOT_ACTIVATION_PERSISTENCE_PLAN_V1.md"\n      - ".github/workflows/aion-b2b-pilot-activation-ceremony.yml"\n\npermissions:\n  contents: read\n\njobs:\n  activation-ceremony:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7\n        with:\n          python-version: "3.12"\n      - name: Install pinned crypto dependency\n        run: python -m pip install --disable-pip-version-check cryptography==50.0.2\n      - name: Compile activation ceremony chain\n        run: |\n          python -m py_compile \\n            atlasquant_aion_trust_root.py \\n            atlasquant_aion_nonce_registry.py \\n            atlasquant_aion_b2b_pilot_activation_preflight.py \\n            atlasquant_aion_b2b_pilot_activation_ceremony.py \\n            atlasquant_aion_b2b_pilot_activation_persistence_plan.py \\n            test_atlasquant_aion_b2b_pilot_activation_ceremony.py \\n            test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py\n      - name: Run activation ceremony tests\n        run: |\n          python -m unittest -q \\n            test_atlasquant_aion_b2b_pilot_activation_ceremony.py \\n            test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py \\n            test_atlasquant_aion_b2b_pilot_activation_preflight.py\n      - name: Assert signature, persistence and execution separation\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          ceremony = Path("atlasquant_aion_b2b_pilot_activation_ceremony.py").read_text(encoding="utf-8")\n          for marker in (\n              'DECISIONS = (',\n              '"AUTHORIZE_PILOT_ACTIVATION"',\n              '"DENY_PILOT_ACTIVATION"',\n              '"activation_record_persisted": False',\n              '"pilot_activation_authorized": False',\n              '"pilot_activated": False',\n              '"generic_chat_instruction_accepted_as_activation": False',\n              '"executes_action": False',\n          ):\n              assert marker in ceremony, marker\n          persist = Path("atlasquant_aion_b2b_pilot_activation_persistence_plan.py").read_text(encoding="utf-8")\n          assert "append_checkpoint_patch(" not in persist\n          for marker in (\n              '"automatic_checkpoint_write": False',\n              '"activation_record_persisted": False',\n              '"pilot_activation_authorized": False',\n              '"pilot_activated": False',\n              '"executes_action": False',\n          ):\n              assert marker in persist, marker\n          for source in (ceremony, persist):\n              for banned in (\n                  "save_runtime_checkpoint(",\n                  "requests.post(",\n                  "requests.put(",\n                  "subprocess.",\n                  "deploy_to_production(",\n              ):\n                  assert banned not in source, banned\n          PY\n