name: AION Provider Full Request Binding CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_provider.py"
      - "test_atlasquant_aion_provider.py"
      - "tests/test_atlasquant_aion_provider_full_request_binding_v1.py"
      - "docs/aion/AION_PROVIDER_FULL_REQUEST_BINDING_PREFLIGHT_V1.md"
      - ".github/workflows/aion-provider-full-request-binding-v1.yml"

permissions:
  contents: read

jobs:
  full-request-binding:
    name: Exact resolved HTTP contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install repository and pinned test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile offline request-boundary modules
        run: |
          python -m py_compile atlasquant_aion_provider.py test_atlasquant_aion_provider.py tests/test_atlasquant_aion_provider_full_request_binding_v1.py
      - name: Run real provider adapter and new zero-call mismatch regressions
        run: |
          python -m pytest -q test_atlasquant_aion_provider.py tests/test_atlasquant_aion_provider_full_request_binding_v1.py test_atlasquant_aion_model_router.py test_atlasquant_aion_gateway.py
