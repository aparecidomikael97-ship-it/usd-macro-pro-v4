name: AION B2B Owner Renewal Action Command Plan

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_action_execution_persistence_attestation.py"
      - "atlasquant_aion_b2b_owner_renewal_action_execution_writer_attestation.py"
      - "atlasquant_aion_b2b_owner_renewal_action_execution_preflight.py"
      - "atlasquant_aion_b2b_owner_renewal_action_command_plan.py"
      - "test_atlasquant_aion_b2b_owner_renewal_action_command_plan.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_ACTION_COMMAND_PLAN_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-action-command-plan.yml"

permissions:
  contents: read

jobs:
  owner-renewal-action-command-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile abstract command-plan chain
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_action_execution_preflight.py \
            atlasquant_aion_b2b_owner_renewal_action_execution_persistence_attestation.py \
            atlasquant_aion_b2b_owner_renewal_action_execution_writer_attestation.py \
            atlasquant_aion_b2b_owner_renewal_action_command_plan.py \
            test_atlasquant_aion_b2b_owner_renewal_action_command_plan.py
      - name: Run abstract command-plan tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_action_execution_persistence_attestation.py \
            test_atlasquant_aion_b2b_owner_renewal_action_execution_writer_attestation.py \
            test_atlasquant_aion_b2b_owner_renewal_action_command_plan.py
      - name: Assert command plan is non executable
        run: |
          python - <<'PY'
          from pathlib import Path
          source=Path("atlasquant_aion_b2b_owner_renewal_action_command_plan.py").read_text(encoding="utf-8")
          for marker in (
              '"READY_FOR_BUSINESS_ACTION_COMMAND_ADAPTER_REVIEW"',
              '"provider_operation_materialized": False',
              '"provider_adapter_selected": False',
              '"provider_endpoint_included": False',
              '"http_method_included": False',
              '"executable_payload_included": False',
              '"credential_material_included": False',
              '"execution_token_issued": False',
              '"shell_command_generated": False',
              '"execution_command_generated": False',
              '"execution_command_executed": False',
              '"business_action_authorized",',
              '"executes_action",',
          ):
              assert marker in source, marker
          for banned in (
              "requests.post(","requests.put(","httpx.post(","subprocess.",
              "send_whatsapp(","send_email(","deploy_to_production(",
              "append_checkpoint_patch(","save_runtime_checkpoint(",
          ):
              assert banned not in source,banned
          PY
