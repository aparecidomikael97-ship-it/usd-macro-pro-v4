name: AION P0 LAB Owner Signature Strict Encoding and Nonce Rollback (NO-GO)

on:
  push:
    branches: [lab/aion-p0-owner-signature-canonical-replay-characterization-20261020]

permissions:
  contents: read

jobs:
  owner_signature_regressions:
    name: Actual owner V224 encoding and nonce rollback - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies and historical pytest runner
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Fourteen real V224 strict signature and local replay examples
        run: python -B -m unittest discover -s tests -p test_aion_p0_owner_signature_canonical_nonce_restore_lab.py -v
      - name: Original V224 owner ceremony and signature authorization regression
        run: python -m pytest -q test_atlasquant_aion_v224_owner_signature_ceremony.py
      - name: Original V225 V226 owner decision and persistence
        run: python -m pytest -q test_atlasquant_aion_v225_explicit_owner_decision_record.py test_atlasquant_aion_v226_owner_decision_persistence_attestation.py
      - name: Fourteen actual canonical public trust root admission cases
        run: python -B -m unittest discover -s tests -p test_aion_p0_trust_root_strict_file_admission_lab.py -v
      - name: Signed incident envelopes never authorize external issuer
        run: python -B -m unittest discover -s tests -p test_aion_p0_signed_incident_envelope_cryptographic_lab.py -v
      - name: External producer still denied on actual Outbox
        run: python -B -m unittest -v test_atlasquant_aion_a110_outbox_ambiguous_block
