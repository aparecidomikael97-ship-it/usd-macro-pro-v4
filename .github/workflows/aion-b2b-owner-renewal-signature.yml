name: AION B2B Owner Renewal Signature

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_decision_request.py"
      - "atlasquant_aion_b2b_owner_renewal_signature.py"
      - "test_atlasquant_aion_b2b_owner_renewal_signature.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_SIGNATURE_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-signature.yml"

permissions:
  contents: read

jobs:
  owner-renewal-signature:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile owner renewal signature chain
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_decision_request.py \
            atlasquant_aion_b2b_owner_renewal_signature.py \
            test_atlasquant_aion_b2b_owner_renewal_signature.py
      - name: Run owner renewal signature tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_decision_request.py \
            test_atlasquant_aion_b2b_owner_renewal_signature.py
      - name: Assert verification and execution separation
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_b2b_owner_renewal_signature.py"
          ).read_text(encoding="utf-8")
          for marker in (
              '"state": "OWNER_RENEWAL_DECISION_VERIFIED_PENDING_PERSISTENCE"',
              '"owner_decision_recorded": False',
              '"decision_persisted": False',
              '"renewal_authorized": False',
              '"expansion_authorized": False',
              '"termination_authorized": False',
              '"billing_authorized": False',
              '"external_action_executed": False',
              '"executes_action",',
              '"generic_chat_instruction_accepted_as_decision": False',
          ):
              assert marker in source, marker

          for banned in (
              "requests.post(",
              "requests.put(",
              "httpx.post(",
              "subprocess.",
              "send_whatsapp(",
              "send_email(",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
