name: AION A80 LAB F1 T1 signature shape hardening

on:
  pull_request:
    branches: [lab/aion-v16-a78-pinned-lab-base-and-quality-coverage-20261014]
    paths:
      - "atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py"
      - "test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py"
      - "docs/aion/a75_untrusted_witness_intake_scope_and_limits.md"
      - ".github/workflows/aion-a80-f1-t1-signature-shape-lab.yml"

permissions:
  contents: read

jobs:
  a80:
    name: A80 untrusted signature shape stays non-authoritative (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile exact untrusted intake and unit suite
        run: python -m py_compile atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75.py
      - name: Negative signature-shape tests and original A75 suite
        run: python -m unittest -v test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75
