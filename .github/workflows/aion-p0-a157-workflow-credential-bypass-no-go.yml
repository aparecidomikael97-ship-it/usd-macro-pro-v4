name: AION P0 A157 GitHub Workflow Credential Bypass Fence (LAB NO-GO)
on:
  pull_request:
    paths:
      - 'tools/aion_p0_a157_workflow_yaml_policy_lab.py'
      - 'tests/test_aion_p0_a157_workflow_yaml_policy_lab.py'
      - 'tests/run_aion_a157_workflow_policy_counted_lab.py'
      - '.github/workflows/autopilot-v107.yml'
      - '.github/workflows/coleta_automatica.yml'
      - '.github/workflows/aion-runtime-checkpoint-bootstrap.yml'
      - '.github/workflows/aion-runtime-checkpoint-migrate.yml'
      - '.github/workflows/atlasquant-checkpoint.yml'
      - '.github/workflows/atlasquant-source-backup.yml'
      - 'docs/aion/A157_WORKFLOW_JOB_YAML_AMBIGUITY_AND_TOKEN_BOUNDARY_NO_GO_20261022.md'
      - '.github/workflows/aion-p0-a157-workflow-credential-bypass-no-go.yml'
  push:
    branches:
      - lab/aion-p0-a157-github-workflow-credential-bypass-fence-20261022
permissions:
  contents: read
jobs:
  verify-guarded-credential-surface:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_LAB_MODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned offline LAB test dependencies
        run: python -m pip install "PyYAML==6.0.2" "cryptography==44.0.3" "requests==2.32.3"
      - name: A157 RED-first 67 workflow YAML policy and A137 regression checks
        run: python -B tests/run_aion_a157_workflow_policy_counted_lab.py
      - name: A157 six-workflow strict YAML source-only enforcement
        run: python -B tools/aion_p0_a157_workflow_yaml_policy_lab.py --enforce
      - name: A137 legacy workflow token inventory remains enforced
        run: python -B tools/aion_p0_workflow_credential_surface_a137.py --enforce
      - name: A145-A150 259 synthetic checkpoint baseline regressions
        run: python -B tests/run_aion_a150_counted_lab.py
      - name: A151 16 LAB-to-runtime import fence tests
        run: python -B tests/run_aion_a151_no_go_gate.py
      - name: A152 55 documentary evidence and FinOps checks
        run: python -B tests/run_aion_a152_decision_counted_lab.py
      - name: A153 48 IAM proposal abuse cases
        run: python -B tests/run_aion_a153_counted_lab.py
      - name: A154 73 Checkpoint Mestre direct-writer deny cases
        run: python -B tests/run_aion_a154_checkpoint_deny_counted_lab.py
      - name: A155 78 Autopilot path and generic writer tests
        run: python -B tests/run_aion_a155_autopilot_destinations_counted_lab.py
      - name: A156 90 historical restore NO-GO and disabled job tests
        run: python -B tests/run_aion_a156_restore_deny_counted_lab.py
      - name: A156 real recovery route cannot approve restoration
        run: python -B tools/aion_p0_a156_recovery_restore_deny_ast_lab.py
      - name: A154 real writer source continues deny-only
        run: python -B tools/aion_p0_a154_runtime_writer_deny_ast_lab.py
      - name: A136 earlier broad writer inventory still enforced
        run: python -B tools/aion_p0_checkpoint_write_surface_audit.py --enforce
      - name: A152 external evidence E0-E5 remains HARD NO-GO
        run: python -B tools/aion_p0_a152_external_evidence_decision_gate.py
      - name: Historic 32 producer proof blockers remain open
        run: python -B tools/aion_p0_h0_provider_32_crosswalk_audit.py --check-crosswalk
