name: AION B2B Pilot Activation Persistence Attestation\n\non:\n  workflow_dispatch:\n  pull_request:\n    branches: [main]\n    paths:\n      - "atlasquant_aion_b2b_pilot_activation_persistence_plan.py"\n      - "atlasquant_aion_b2b_pilot_activation_persistence_attestation.py"\n      - "test_atlasquant_aion_b2b_pilot_activation_persistence_attestation.py"\n      - "docs/aion/AION_B2B_PILOT_ACTIVATION_PERSISTENCE_ATTESTATION_V1.md"\n      - ".github/workflows/aion-b2b-pilot-activation-persistence-attestation.yml"\n\npermissions:\n  contents: read\n\njobs:\n  activation-persistence-attestation:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7\n      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7\n        with:\n          python-version: "3.12"\n      - name: Compile activation persistence chain\n        run: |\n          python -m py_compile \\n            atlasquant_aion_checkpoint_master.py \\n            atlasquant_aion_b2b_pilot_activation_persistence_plan.py \\n            atlasquant_aion_b2b_pilot_activation_persistence_attestation.py \\n            test_atlasquant_aion_b2b_pilot_activation_persistence_attestation.py\n      - name: Run activation persistence attestation tests\n        run: |\n          python -m unittest -q \\n            test_atlasquant_aion_b2b_pilot_activation_persistence_attestation.py \\n            test_atlasquant_aion_b2b_pilot_activation_persistence_plan.py\n      - name: Assert attestation is verification only\n        run: |\n          python - <<'PY'\n          from pathlib import Path\n          source = Path("atlasquant_aion_b2b_pilot_activation_persistence_attestation.py").read_text(encoding="utf-8")\n          for marker in (\n              '"activation_record_persisted": True',\n              '"persistence_attested": True',\n              '"receipt_consistency_verified": True',\n              '"writer_identity_verified": False',\n              '"pilot_activation_authorized": False',\n              '"pilot_activated": False',\n              '"storage_write_performed": False',\n              '"executes_action": False',\n          ):\n              assert marker in source, marker\n          for banned in (\n              "save_runtime_checkpoint(",\n              "requests.post(",\n              "requests.put(",\n              "subprocess.",\n              "deploy_to_production(",\n          ):\n              assert banned not in source, banned\n          PY\n