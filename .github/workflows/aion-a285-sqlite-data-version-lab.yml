name: AION A285 Native SQLite Data Version LAB

on:
  pull_request:
    paths:
      - labs/a285_sqlite_live_data_version_lab.py
      - labs/test_a285_sqlite_live_data_version_lab.py
      - docs/lab/aion_a285_sqlite_live_data_version_lab.md
      - .github/workflows/aion-a285-sqlite-data-version-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-local-limit:
    name: A285 live SQLite data_version no-trust (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing dependencies and test runner
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Real SQLite and security regression in isolated LAB
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a285_sqlite_live_data_version_lab
          labs.test_a233_native_sqlite_p0_repro
          labs.test_a240_sqlite_pathname_fence
          labs.test_a245_sqlite_connect_path_fence
          labs.test_a248_cross_process_message_lock
          labs.test_a249_lock_path_identity
          labs.test_a267_no_host_auth_dispatch
          labs.test_a284_mt5_bars_bridge_lab
          labs.test_a283_historical_csv_readiness
          labs.test_a282_three_variant_comparison
          test_atlasquant_risk_guardian
      - name: Existing simulator and scanner regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_operational_backtest.py
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
