name: AION A267 No Host Authorization Callbacks HARD NO-GO LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_execution_outbox.py
      - labs/a259_synthetic_outbox_fixture.py
      - labs/test_a266_send_adapter_property_boundary.py
      - labs/test_a267_no_host_auth_dispatch.py
      - docs/lab/aion_a267_no_host_auth_callback.md
      - .github/workflows/aion-a267-no-host-auth-callback.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-callback-denial:
    name: A267 no authorizer or budget callback (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout source, no Worker or deploy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline test dependencies only
        run: python -m pip install cryptography==44.0.3 requests==2.32.3 PyYAML==6.0.2
      - name: A267 no host callbacks + A266-A202 LAB and Outbox/Saga/Chaos
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a267_no_host_auth_dispatch
          labs.test_a266_send_adapter_property_boundary
          labs.test_a265_outbox_reconcile_adapter_isolation
          labs.test_a264_ruleset_blueprint_review
          labs.test_a263_main_policy_readonly
          labs.test_a260_offline_runtime_bundle
          labs.test_a259_synthetic_callback_isolation
          labs.test_a258_external_proof_admission
          labs.test_a257_monotonic_origin_gate
          labs.test_a256_one_time_challenge_lab
          labs.test_a255_two_party_reservation_binding
          labs.test_a254_synthetic_origin_event_identity
          labs.test_a243_signed_first_attempt
          labs.test_a202_outbox_dispatch_atomic_cas
          labs.test_a203_outbox_stale_revocation_cas
          labs.test_a204_outbox_stale_absence_confirmed
          labs.test_a205_unverified_adapter_absence_no_resend
          labs.test_a206_late_send_outcome_cas
          labs.test_a213_outbox_untrusted_positive_hard_nogo
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign
