name: A190 G52 default local reconcile snapshot CAS LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g52_reconcile_default_cas_lab.py'
      - 'labs/a190/test_g42_reconcile_snapshot_cas_lab.py'
      - '.github/workflows/aion-a190-g52-default-reconcile-cas-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g52-local-consistency:
    name: G52 default reconcile CAS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install minimal isolated LAB dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G52 strict-disabled & default reconciliation cases
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g52_*.py' -v 2>&1 | tee g52.log
          grep -F 'Ran 10 tests' g52.log
          grep -F 'G52_NEGATIVE_STALE_GREEN=CONFIRMED_PRESERVED' g52.log
          grep -F 'G52_REVOKED_GREEN=NO_FAKE_CONFIRM' g52.log
          grep -F 'G52_RECEIPT_GREEN=ORIGINAL_TIMESTAMP' g52.log
          grep -F 'G52_AUTH_REENTRY_GREEN=NO_STALE_VIEW' g52.log
          grep -F 'G52_EPOCH_GREEN=NO_UNAUTHORIZED_LEDGER' g52.log
      - name: Inherited G50-G30 synthetic regression
        shell: bash
        run: |
          set -o pipefail
          for entry in 'g50 11' 'g49 7' 'g48 11' 'g47 18' 'g46 10' 'g45 7' 'g44 39' 'g43 32' 'g42 28' 'g41 18' 'g40 36' 'g39 28' 'g38 24' 'g37 34' 'g36 20' 'g35 18' 'g34 16' 'g33 24' 'g32 20' 'g31 18' 'g30 23'; do
            set -- $entry
            python -B -m unittest discover -s labs/a190 -p "test_$1_*.py" -v 2>&1 | tee "$1.log"
            grep -F "Ran $2 tests" "$1.log"
          done
          grep -F 'G52_G42_LEGACY_STALE_GREEN=NO_OLD_SNAPSHOT' g42.log
      - name: No operational authority — hard gate
        shell: bash
        run: |
          echo 'G52 is only local synthetic SQLite snapshot & state validation.'
          echo 'No real provider SEND, trusted receipt, external witness, keys, customer, Worker, main, merge or deploy.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
