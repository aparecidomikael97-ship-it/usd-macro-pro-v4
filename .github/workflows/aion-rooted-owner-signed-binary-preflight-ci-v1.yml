name: AION Rooted Owner Signed Binary Preflight CI V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py"
      - "tests/test_atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py"
      - "docs/aion/AION_ROOTED_OWNER_SIGNED_BINARY_PREFLIGHT_CI_V1.md"
      - ".github/workflows/aion-rooted-owner-signed-binary-preflight-ci-v1.yml"
      - "atlasquant_aion_windows_signed_binary_ci_negative_intent_v1.py"

permissions:
  contents: read

jobs:
  rooted-owner-binary-preflight:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Enforce pull-request CI scope
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          assert os.environ.get("RUNNER_OS") in ("Windows", "Linux")
          assert os.environ.get("GITHUB_RUN_ID")
          PY
      - name: Install pinned Ed25519 verification dependency in runner only
        run: |
          python -m pip install --disable-pip-version-check "cryptography==50.0.2"
          python - <<'PY'
          import cryptography
          assert cryptography.__version__ == "50.0.2"
          PY
      - name: Compile rooted owner binary preflight
        run: |
          python -m py_compile             atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py             tests/test_atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py
      - name: Run rooted trust and anti-replay adversarial tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests             -p 'test_atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py'
      - name: Assert preflight module has no execution/network mutation surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path("atlasquant_aion_rooted_owner_signed_binary_preflight_ci_v1.py")
          tree = ast.parse(path.read_text("utf-8"))
          forbidden_imports = {"subprocess", "socket", "ctypes", "requests", "urllib", "httpx"}
          forbidden_calls = {
              "ResumeThread", "NtResumeProcess", "CreateProcessW",
              "CreateAppContainerProfile", "DeleteAppContainerProfile",
              "FwpmFilterAdd0", "FwpmFilterDeleteById0",
          }
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  for alias in node.names:
                      assert alias.name.split(".")[0] not in forbidden_imports, alias.name
              if isinstance(node, ast.ImportFrom):
                  assert (node.module or "").split(".")[0] not in forbidden_imports, node.module
              if isinstance(node, ast.Attribute):
                  assert node.attr not in forbidden_calls, node.attr
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name):
                  assert node.func.id not in forbidden_calls, node.func.id
          source = path.read_text("utf-8")
          for literal in (
              '"safe_to_resume": False',
              '"installer_authorized": False',
              '"build_authorized": False',
              '"deploy_authorized": False',
          ):
              assert literal in source, literal
          PY
