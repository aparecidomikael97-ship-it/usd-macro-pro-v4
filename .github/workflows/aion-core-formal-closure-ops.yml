name: AION Core Formal Closure OPS

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/aion-core-v1-technical-closure-candidate-20261006
    paths:
      - "ops/aion-core-v1-formal-closure/**"
      - "ops/aion_core_v1_formal_closure/**"
      - ".github/workflows/aion-core-formal-closure-ops.yml"

permissions:
  contents: read

concurrency:
  group: aion-core-formal-closure-ops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ops-packet:
    name: Validate formal closure and no-authority boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install cryptographic verification dependency only
        run: |
          python -m pip install pip==26.2.1
          python -m pip install cryptography==50.0.2

      - name: Compile OPS ceremony tooling
        run: |
          python -m py_compile \
            ops/aion_core_v1_formal_closure/validate_unsigned_v220_packet.py \
            ops/aion_core_v1_formal_closure/export_v220_signing_bundle.py \
            ops/aion_core_v1_formal_closure/apply_v220_signatures.py \
            ops/aion_core_v1_formal_closure/prepare_v220_v222.py \
            ops/aion_core_v1_formal_closure/perform_v223_runtime_write.py \
            ops/aion_core_v1_formal_closure/prepare_v224_owner_signature.py \
            ops/aion_core_v1_formal_closure/verify_v224_prepare_v225.py \
            ops/aion_core_v1_formal_closure/perform_v225_v226.py \
            ops/aion_core_v1_formal_closure/core_freeze_ceremony.py \
            ops/aion_core_v1_formal_closure/prepare_core_freeze.py \
            ops/aion_core_v1_formal_closure/perform_core_freeze.py \
            ops/aion_core_v1_formal_closure/validate_post_freeze_boundary.py \
            ops/aion_core_v1_formal_closure/windows_readiness_preflight.py \
            ops/aion_core_v1_formal_closure/smoke_check.py

      - name: Validate packet and authority boundaries
        run: |
          python ops/aion_core_v1_formal_closure/smoke_check.py

      - name: Validate read-only Windows readiness preflight contract
        run: |
          python -m ops.aion_core_v1_formal_closure.windows_readiness_preflight \
            --repo-root "${{ github.workspace }}" \
            --work-dir /tmp/aion-core-formal-closure-work \
            --nonce-registry /tmp/aion-core-formal-closure-nonce.sqlite3 \
            --allow-non-windows-ci

      - name: Red-team readiness gate rejects repository-local durable state
        shell: bash
        run: |
          set +e
          output="$(python -m ops.aion_core_v1_formal_closure.windows_readiness_preflight \
            --repo-root "${{ github.workspace }}" \
            --work-dir "${{ github.workspace }}/.closure-work" \
            --nonce-registry "${{ github.workspace }}/nonce-registry.sqlite3" \
            --allow-non-windows-ci)"
          rc=$?
          set -e
          test "$rc" -eq 2
          OUTPUT="$output" python - <<'PY'
          import json, os
          row = json.loads(os.environ["OUTPUT"])
          assert row["state"] == "BLOCKED"
          assert "WORK_DIR_MUST_BE_OUTSIDE_REPOSITORY" in row["blockers"]
          assert "NONCE_REGISTRY_MUST_BE_OUTSIDE_REPOSITORY" in row["blockers"]
          assert row["nonce_consumed"] is False
          assert row["runtime_write_performed"] is False
          assert row["executes_action"] is False
          print("FAIL-CLOSED PASS: repository-local durable state rejected")
          PY

      - name: Red-team readiness gate rejects tampered V2.20 packet
        shell: bash
        run: |
          cp ops/aion-core-v1-formal-closure/unsigned_v220_evidence_packet.json /tmp/tampered-v220.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/tampered-v220.json")
          row = json.loads(p.read_text(encoding="utf-8"))
          row["contract_test_count_sum"] = int(row["contract_test_count_sum"]) + 1
          p.write_text(json.dumps(row, ensure_ascii=False, sort_keys=True), encoding="utf-8")
          PY
          set +e
          output="$(python -m ops.aion_core_v1_formal_closure.windows_readiness_preflight \
            --repo-root "${{ github.workspace }}" \
            --packet /tmp/tampered-v220.json \
            --work-dir /tmp/aion-core-formal-closure-work \
            --nonce-registry /tmp/aion-core-formal-closure-nonce.sqlite3 \
            --allow-non-windows-ci)"
          rc=$?
          set -e
          test "$rc" -eq 2
          OUTPUT="$output" python - <<'PY'
          import json, os
          row = json.loads(os.environ["OUTPUT"])
          assert row["state"] == "BLOCKED"
          assert "UNSIGNED_V220_PACKET_NOT_CANONICAL" in row["blockers"]
          assert row["signature_performed"] is False
          assert row["runtime_write_performed"] is False
          assert row["executes_action"] is False
          print("FAIL-CLOSED PASS: tampered V2.20 packet rejected")
          PY

      - name: Red-team readiness gate rejects private key material in trust-root file
        shell: bash
        run: |
          cat > /tmp/unsafe-trust-root.json <<'JSON'
          {"private_key_b64":"MUST_NEVER_BE_ACCEPTED"}
          JSON
          set +e
          output="$(python -m ops.aion_core_v1_formal_closure.windows_readiness_preflight \
            --repo-root "${{ github.workspace }}" \
            --work-dir /tmp/aion-core-formal-closure-work \
            --nonce-registry /tmp/aion-core-formal-closure-nonce.sqlite3 \
            --certification-trust-root /tmp/unsafe-trust-root.json \
            --allow-non-windows-ci)"
          rc=$?
          set -e
          test "$rc" -eq 2
          OUTPUT="$output" python - <<'PY'
          import json, os
          row = json.loads(os.environ["OUTPUT"])
          assert row["state"] == "BLOCKED"
          assert "CERTIFICATION_TRUST_ROOT_CONTAINS_PRIVATE_FIELD" in row["blockers"]
          assert row["private_key_loaded"] is False
          assert row["signature_performed"] is False
          assert row["runtime_write_performed"] is False
          print("FAIL-CLOSED PASS: private-key material rejected from trust-root input")
          PY

      - name: Export canonical external-signing bundle without a private key
        run: |
          python -m ops.aion_core_v1_formal_closure.export_v220_signing_bundle \
            --packet ops/aion-core-v1-formal-closure/unsigned_v220_evidence_packet.json \
            --key-id ci-public-placeholder \
            --key-version 1 \
            --issued-at 2026-10-06T00:00:00Z \
            --expires-at 2026-10-07T00:00:00Z \
            --output /tmp/v220_signing_bundle.json

      - name: Assert OPS boundary remains action-free
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bundle = json.loads(Path("/tmp/v220_signing_bundle.json").read_text(encoding="utf-8"))
          assert bundle["state"] == "READY_FOR_EXTERNAL_SIGNATURE"
          assert len(bundle["entries"]) == 17
          assert bundle["private_key_loaded"] is False
          assert bundle["signature_performed"] is False
          assert bundle["network_called"] is False
          assert bundle["executes_action"] is False
          assert all(not entry["row_to_sign"]["signature_b64"] for entry in bundle["entries"])
          print("OPS boundary PASS: V2.20->V2.26+Freeze prepared, zero private-key/sign/write action")
          PY
