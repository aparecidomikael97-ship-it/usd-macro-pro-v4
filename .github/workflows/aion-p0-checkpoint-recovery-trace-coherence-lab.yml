name: AION P0 LAB Checkpoint Recovery Trace Shape Coherence

on:
  push:
    branches: [lab/aion-p0-checkpoint-recovery-trace-shape-coherence-20261021]

permissions:
  contents: read

jobs:
  recovery:
    name: Local recovery trace shape and projections - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install exact project dependencies
        run: python -m pip install -r requirements.txt
      - name: 26 new RED-first checkpoint trace projection and type checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_checkpoint_recovery_trace_shape_coherence_lab.py -v
      - name: Existing original recovery traceability contract
        run: python -B -m unittest -v test_atlasquant_aion_recovery_traceability_gate
      - name: Existing actual recovery review bridge
        run: python -B -m unittest -v test_atlasquant_aion_recovery_review
      - name: Existing local traceability map
        run: python -B -m unittest -v test_atlasquant_aion_local_traceability
      - name: H0 causal no-effect denial regression
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
