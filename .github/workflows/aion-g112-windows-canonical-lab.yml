name: AION G112 Windows final canonical LAB
on:
  pull_request:
    paths:
      - '.github/workflows/aion-g112-windows-canonical-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: G112 Windows canonical Quality
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install G90 pinned application and canonical tools
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0'
          python -m pip check
      - name: Original unchanged canonical 6449 Quality
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py quality
  security:
    name: G112 Windows canonical Security
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install G90 pinned application and canonical tools
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0'
          python -m pip check
      - name: Original unchanged canonical 368 Security unittest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-unittest
      - name: Original unchanged canonical Security pytest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-pytest
