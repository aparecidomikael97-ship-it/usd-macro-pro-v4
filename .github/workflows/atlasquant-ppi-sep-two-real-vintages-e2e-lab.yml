name: AtlasQuant Real PPI September Revision Vintage E2E LAB

on:
  pull_request:
    paths:
      - ".github/workflows/atlasquant-ppi-sep-two-real-vintages-e2e-lab.yml"
      - "atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab.py"
      - "test_atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab.py"
      - "atlasquant_trader_fx28_32_factor_source_admission_lab.py"
      - "test_atlasquant_trader_fx28_ppi_revision_source_admission_lab.py"
      - "atlasquant_trader_fx28_single_readiness_panel_lab.py"
      - "test_atlasquant_trader_fx28_panel_ppi_two_vintages_readout_lab.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-sep-ppi-first-print-and-revision-from-real-bodies:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout research branch (no persisted credentials)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Offline syntax + 18 adversarial synthetic guards
        shell: bash
        run: |
          python -m py_compile atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab.py test_atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab.py
          python -m unittest -v test_atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab
      - name: Reuse EXACT existing historic BLS Action ZIPs (no new BLS requests)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 0 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -o "${RUNNER_TEMP}/bls_sep.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14192770992/zip"
          curl --fail --silent --show-error --location --retry 0 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -o "${RUNNER_TEMP}/bls_oct_ppi.zip" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14120274042/zip"
      - name: Verify official HTML original SHAs and two real September PPI vintages
        shell: bash
        env:
          BLS_REAL_TMP: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from datetime import timedelta
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile
          import os
          from atlasquant_trader_bls_four_real_originals_pit_replay_lab import ARCHIVES, PINS
          from atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab import (
              SEP_CAPTURE, OCT_CAPTURE, inspect_real_ppi_sep2026_release_vintages_lab,
          )
          from atlasquant_trader_fx28_32_factor_source_admission_lab import (
              inspect_fx28_32_factor_source_admission_lab,
          )
          from atlasquant_trader_fx28_single_readiness_panel_lab import (
              inspect_fx28_single_readiness_panel_lab,
          )
          from test_atlasquant_trader_fx28_single_readiness_panel_lab import mock_policy
          from unittest.mock import patch
          root = Path(os.environ["BLS_REAL_TMP"])
          sources = {}
          for name, archive_id in [("sep", "sep"), ("oct", "oct_ppi")]:
              path = root / ("bls_" + name + ("" if name == "sep" else "_ppi") + ".zip")
              data = path.read_bytes()
              archive_name, expected_sha = ARCHIVES[archive_id]
              assert sha256(data).hexdigest() == expected_sha, ("ZIP_SHA_MISMATCH", name)
              with ZipFile(path) as z:
                  assert z.testzip() is None, ("ZIP_CRC_BROKEN", name)
                  pin = PINS["US_PPI_SEP2026" if name == "sep" else "US_PPI_OCT2026"]
                  body = z.read(pin[1])
                  receipt = z.read(pin[2])
                  assert sha256(body).hexdigest() == pin[3], ("HTML_SHA_MISMATCH", name)
                  assert sha256(receipt).hexdigest() == pin[4], ("RECEIPT_SHA_MISMATCH", name)
                  sources[name] = body
          cases = [
              (OCT_CAPTURE - timedelta(microseconds=1), 0, False),
              (OCT_CAPTURE, 1, False),
              (SEP_CAPTURE - timedelta(microseconds=1), 1, False),
              (SEP_CAPTURE, 2, True),
          ]
          for when, expected_count, complete in cases:
              out = inspect_real_ppi_sep2026_release_vintages_lab(
                  sep_original_html=sources["sep"],
                  oct_original_html=sources["oct"],
                  research_cutoff_utc=when,
              )
              assert out["originals_visible_at_local_cutoff"] == expected_count, (when, out)
              assert out["trade_authorized"] is False
              assert out["publishable"] is False
              assert out["accuracy"] is None
              assert out["bias_usd"] is None
              assert out["independent_directional_fx_predictions"] == 0
              assert out["fx28_672_slots_changed"] is False
              # ACTUAL Motor A source-admission pipeline, not another
              # synthetic positive fixture: raw BLS original bytes enter
              # the existing FX28 32-factor module at the SAME PIT cutoff.
              motor = inspect_fx28_32_factor_source_admission_lab(
                  local_appdata=str(root),
                  decision_at_utc=when.replace(microsecond=0),
                  ppi_sep2026_two_vintage_originals=(
                      sources["sep"], sources["oct"]),
              )
              assert motor["state"] == "LAB_FX28_32_FACTOR_DOCUMENTARY_GAP_RECONCILED_NO_GO", (when,motor)
              assert motor["ppi_sep2026_vintage_context_requested"] is True
              assert motor["ppi_sep2026_verified_original_count_at_local_cutoff"] == expected_count, (when,motor)
              assert motor["ppi_sep2026_first_release_and_revision_reconciled_local_only"] is complete
              assert motor["factor_slots_inspected"] == 32
              assert len(motor["pairs"]) == 28
              assert motor["factor_slots_with_signed_impact_independently_admissible"] == 0
              assert motor["factor_slots_with_pre_event_consensus_verified"] == 0
              assert motor["validated_direction_accuracy"] is None
              assert motor["calibrated_probability"] is None
              assert motor["trade_authorized"] is False and motor["publishable"] is False
              assert all(p["forecast_direction"] is None
                         and p["trade_authorized"] is False for p in motor["pairs"])
              attached = [slot for slot in motor["factor_slots"]
                          if slot["ppi_sep2026_historical_two_release_revision_context"] is not None]
              assert len(attached) == int(complete)
              # All public BLS bytes now flow to the ACTUAL 32-factor
              # admission AND the ACTUAL 672-slot readiness presenter.
              # The bank archive is absent in this isolated runner, so
              # explicitly use an EMPTY policy-stub, never a fake current
              # 8-bank source or a claimed real macro forecast.
              with patch(
                  "atlasquant_trader_fx28_single_readiness_panel_lab."
                  "inspect_fx28_official_policy_archive_replay_lab",
                  return_value=mock_policy(()),
              ):
                  display = inspect_fx28_single_readiness_panel_lab(
                      local_appdata=str(root),
                      inspected_at_utc=when.replace(microsecond=0),
                      ppi_sep2026_two_vintage_originals=(
                          sources["sep"], sources["oct"]),
                  )
              assert display["state"] == "LAB_FX28_SINGLE_READINESS_PANEL_RECONCILED_NO_GO", (when,display)
              assert display["ppi_sep2026_locally_verified_original_count"] == expected_count
              assert (display["ppi_sep2026_revision_documentary_summary"] is not None) is complete
              assert display["slots_accounted"] == 672
              assert display["factors_expected"] == 32
              assert display["factors_with_independently_accepted_signed_effect"] == 0
              assert display["calibrated_probability"] is None
              assert display["validated_fx28_accuracy"] is None
              assert display["directional_bias"] is None
              assert display["trade_authorized"] is False
              assert display["publishable"] is False
              if complete:
                  documentary = display["ppi_sep2026_revision_documentary_summary"]
                  assert documentary["initial_headline_pct"] == "1.3"
                  assert documentary["revised_headline_pct"] == "1.4"
                  assert documentary["initial_core_ex_food_energy_pct"] == "0.7"
                  assert documentary["revised_core_ex_food_energy_pct"] == "0.8"
                  assert documentary["headline_revision_percentage_points"] == "0.1"
                  assert documentary["first_seen_by_model_on_original_release_date_authenticated"] is False
              print("FX28_PANEL_REAL_BLS_VINTAGE:",when.isoformat(),
                    "visible=",expected_count,"revised_display=",complete,"NO_GO")
              if complete:
                  assert (attached[0]["currency"],attached[0]["category"]) == ("USD","inflation_impact")
                  ctx=attached[0]["ppi_sep2026_historical_two_release_revision_context"]
                  assert ctx["initial_release"]["headline_pct"] == "1.3"
                  assert ctx["later_release_revision"]["headline_pct"] == "1.4"
                  assert ctx["core_revision_percentage_points"] == "0.1"
                  assert ctx["backtest_as_if_2026_10_15_known"] is False
                  assert ctx["can_derive_signed_inflation_impact"] is False
              if not complete:
                  assert out["later_revision_minus_first_release_headline_pp"] is None
              else:
                  if out["state"] != "LAB_PPI_SEP2026_TWO_REAL_VINTAGES_RECONCILED_NO_GO":
                      from atlasquant_trader_us_ppi_sep2026_two_real_vintages_lab import _ppi_table1_sep_2026_values
                      from atlasquant_trader_us_ppi_oct2026_actual_table_guard_lab import _BlsTables
                      for key, edition in [("sep", "sep"), ("oct", "oct")]:
                          data = sources[key]
                          parsed = _ppi_table1_sep_2026_values(data, edition=edition)
                          table = _BlsTables()
                          table.feed(data.decode("utf-8", "surrogateescape"))
                          table.close()
                          selection = [(context[-180:],len(rows),len(table.table_layouts[index]))
                                       for index,(context,rows) in enumerate(table.tables)
                                       if "Table 1." in context]
                          print("DIAG_REAL_BLS_TABLE1",edition,"parsed",parsed,"selection",selection[:6])
                          matching = [(i, context[-120:],rows,table.table_layouts[i])
                                      for i,(context,rows) in enumerate(table.tables)
                                      if "Table 1." in context and
                                         ("September 2026" if edition=="sep" else "October 2026") in context
                                         and "seasonally adjusted" in context.lower()]
                          if len(matching)==1:
                              index, context, rows, layouts = matching[0]
                              print("DIAG_TABLE_HEADERS",edition, layouts[:2])
                              print("DIAG_TABLE_TARGET",edition,[r[:4]+r[-2:] for r in rows
                                  if len(r)>2 and r[1:3] in [("FD","4"),("FD","49104")]][:4])
                  assert out["state"] == "LAB_PPI_SEP2026_TWO_REAL_VINTAGES_RECONCILED_NO_GO", out
                  assert (
                      out["sep_reported_sep2026_sa_mom_headline_pct"],
                      out["oct_reported_revised_sep2026_sa_mom_headline_pct"],
                      out["sep_reported_sep2026_sa_mom_core_ex_food_energy_pct"],
                      out["oct_reported_revised_sep2026_sa_mom_core_ex_food_energy_pct"],
                  ) == ("1.3", "1.4", "0.7", "0.8")
                  assert out["later_revision_minus_first_release_headline_pp"] == "0.1"
                  assert out["later_revision_minus_first_release_core_pp"] == "0.1"
                  assert out["oct2026_actual_headline_sa_mom_pct"] == "0.3"
                  assert out["oct2026_actual_core_ex_food_energy_sa_mom_pct"] == "0.3"
                  assert out["original_first_print_time_independently_authenticated"] is False
                  assert out["economic_consensus_pre_event_authenticated"] is False
              print("REAL_PPI_SEP_VINTAGE_PIT:", when.isoformat(), "visible", expected_count,
                    "complete", complete, "NO_GO")
          changed = bytearray(sources["oct"])
          changed[-1] ^= 1
          rejected = inspect_real_ppi_sep2026_release_vintages_lab(
              sep_original_html=sources["sep"],
              oct_original_html=bytes(changed),
              research_cutoff_utc=SEP_CAPTURE,
          )
          assert rejected["state"].endswith("_HARD_NO_GO")
          assert rejected["later_revision_minus_first_release_headline_pp"] is None
          print("SUCCESS: two SHA256-pinned real BLS originals, receipt pins, "
                "four local PIT cutoffs and a corruption rejection; no forecast or trade")
          PY

# These are official PUBLIC POST-RELEASE HTML originals captured 14-16 Nov.
# No pre-event provider consensus, no witness of first publication, no price,
# no broker connection, no job artifact upload, no cron, no trade.
