name: AION G110 Windows canonical LAB
on:
  pull_request:
    paths:
      - '.github/workflows/aion-g110-windows-canonical-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical:
    name: G110 Windows Quality and Security
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install canonical dependency pins
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0'
          python -m pip check
      - name: Run full original Quality suite
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py quality
      - name: Run original Security unittest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-unittest
      - name: Run original Security pytest
        shell: bash
        run: python -B scripts/run_a183_canonical_lab.py security-pytest
