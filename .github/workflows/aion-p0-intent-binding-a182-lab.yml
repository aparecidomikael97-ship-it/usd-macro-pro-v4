name: A182 LAB binding and explicit unmet external requirements

on:
  pull_request:
    paths:
      - 'aion_chat/intent_binding_a182_lab.py'
      - 'test_atlasquant_aion_intent_binding_a182_lab.py'
      - 'lab_a182_external_requirements_red.py'
      - 'scripts/run_a182_lab.py'
      - '.github/workflows/aion-p0-intent-binding-a182-lab.yml'

permissions:
  contents: read

jobs:
  lab:
    name: A182 ${{ matrix.suite }} (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [regression, sqlite, external-red]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Pinned existing LAB dependencies
        run: python -m pip install cryptography==50.0.2 requests==2.34.2
      - name: Run explicit suite (external-red MUST fail while requirements unmet)
        run: python -B scripts/run_a182_lab.py ${{ matrix.suite }}

