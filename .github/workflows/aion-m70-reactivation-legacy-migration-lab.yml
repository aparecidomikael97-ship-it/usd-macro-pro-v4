name: AION M70 Legacy Reactivation Migration LAB (READ ONLY)

on:
  push:
    branches: [lab/aion-m70-reactivation-legacy-migration-20261019]
    paths:
      - "test_aion_m70_reactivation_gate_migration_candidate.py"
      - "test_aion_m68_original_a118_negative.py"
      - ".github/workflows/aion-m70-reactivation-legacy-migration-lab.yml"

permissions:
  contents: read

jobs:
  candidate_reactivation_migration:
    name: M70 historical 15 candidate + M68 2 negatives (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Verify original A118 test and guard file blobs (no product changes)
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            actual="$(git hash-object "$1")"
            if [ "$actual" != "$2" ]; then
              echo "A118_SOURCE_DRIFT: $1 expected $2 got $actual"
              exit 1
            fi
          }
          check_blob test_atlasquant_aion_global_worker_reactivation_gate.py 6c66e11b4c29b2bef1ff277a0c47740cdb0bf220
          check_blob atlasquant_aion_global_worker_activation.py df43bb4371c784396069f4ede51205b0aa19cc0a
          check_blob atlasquant_aion_global_worker_reactivation_gate.py 8412ada82761de37a72a8f29af7f8672cfb5b082
          check_blob atlasquant_aion_global_worker_incident_reconciliation.py 85541bb2d10f0b97b096df10b5184851160cfec9
          echo "A118_ORIGINAL_4_BLOBS_MATCH"
      - name: Install tracked dependency versions for original A118 imports
        run: python -m pip install -r requirements.txt
      - name: Assert original candidate count is exactly 15 and M68 contains exactly 2
        run: |
          python -B -c "import unittest; l=unittest.defaultTestLoader; a=l.loadTestsFromName('test_aion_m70_reactivation_gate_migration_candidate'); b=l.loadTestsFromName('test_aion_m68_original_a118_negative'); assert a.countTestCases()==15,(a.countTestCases()); assert b.countTestCases()==2,(b.countTestCases()); print('M70_15_PLUS_M68_2_CASES')"
      - name: Execute 17 safety checks on original A118 modules
        run: |
          python -B -m unittest -v test_aion_m70_reactivation_gate_migration_candidate test_aion_m68_original_a118_negative
