name: AION P0 LAB Saga Cross-Scope Internal Helpers (NO-GO)

on:
  push:
    branches: [lab/aion-p0-saga-scope-checked-event-step-helpers-20261021]

permissions:
  contents: read

jobs:
  scoped_saga:
    name: Saga internal helper scope checks - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Twelve private Saga helper scope tests with actual SQLite
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: Sixteen previously validated Saga-Outbox internal state tests
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: Eleven original SQL cross-scope Outbox regression tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: Forty-four read-only SQLite recovery tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: Sixty-four independent H0 A79 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
