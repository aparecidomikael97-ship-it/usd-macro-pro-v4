name: AION A269 Trader Per-Timeframe Closed Candle Evidence LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_trader_timeframes.py
      - atlasquant_aion_trader_observation.py
      - atlasquant_trader_resident.py
      - labs/test_a269_trader_closed_mtf_evidence.py
      - docs/lab/aion_a269_trader_closed_mtf_evidence.md
      - .github/workflows/aion-a269-trader-closed-mtf-evidence.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-mtf:
    name: A269 closed MTF evidence without orders (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout immutable PR source, never deploy or query market
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing app deps and test runner only
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Six distinct TF offline validation and existing Trader risk contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a269_trader_closed_mtf_evidence
          labs.test_a268_trader_readonly_observation
          test_atlasquant_risk_guardian
          test_atlasquant_aion_capabilities
      - name: Legacy Trader resident and FX28 scanner regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
