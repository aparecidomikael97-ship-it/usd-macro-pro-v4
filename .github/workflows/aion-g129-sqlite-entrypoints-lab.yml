# G129 is a static regression inventory, never a native SQLite security proof.
# Real A183 external/native 5xRED remains the only acceptance authority here.
name: AION G129 tracked SQLite entrypoints static inventory NOT P0
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    name: G129 SQLite source inventory / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Check AST classifier and real tracked repository without hiding legacy debt
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g129_sqlite_entrypoints_lab 2>&1 | tee g129-tests.log
          grep -F 'Ran 9 tests' g129-tests.log
          grep -Fx 'OK' g129-tests.log
          grep -F 'G129_EXISTING_NATIVE_SQLITE_DEBT=TRACKED_NOT_P0' g129-tests.log
          python -B scripts/aion_sqlite_entrypoints_inventory_lab.py --check-known 2>&1 | tee g129-inventory.log
          grep -F 'G129_INVENTORY_CHECK=PASS_NOT_P0' g129-inventory.log
