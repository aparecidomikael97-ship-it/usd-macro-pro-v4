name: AION A76 LAB independent negative activation coverage

on:
  pull_request:
    branches: [lab/aion-v16-a75-f1-t1-untrusted-witness-intake-20261014]
    paths:
      - test_atlasquant_aion_activation_denial_coverage_a76.py
      - .github/workflows/aion-a76-activation-negative-matrix-lab.yml

permissions:
  contents: read

jobs:
  contracts:
    name: A76 negative contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing pinned dependencies only
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A76 plus intact A75 A74 A73 A72 A71 A58
        env:
          A76_REPORT: a76-targeted.json
          A76_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -B test_atlasquant_aion_activation_denial_coverage_a76.py
      - name: Publish complete test observations
        if: always()
        run: python -c "from pathlib import Path; p=Path('a76-targeted.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'REPORT_NOT_CREATED; inspect traceback above')"
  historical:
    name: A76 historical ${{ matrix.selection }} retained RED
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        selection: [legacy, quality, security]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing canonical dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Historical selection with no waivers and no live sockets
        env:
          A76_REPORT: a76-historical.json
          A76_HEAD: ${{ github.event.pull_request.head.sha }}
          A76_SELECTION: ${{ matrix.selection }}
        run: |
          python -c "import os, subprocess, sys; mode=os.environ['A76_SELECTION']; args=['--legacy'] if mode=='legacy' else ['--canonical']+(['--security'] if mode=='security' else []); sys.exit(subprocess.call([sys.executable,'-B','test_atlasquant_aion_activation_denial_coverage_a76.py',*args]))"
      - name: Publish counts and complete errors
        if: always()
        run: python -c "from pathlib import Path; p=Path('a76-historical.json'); print(p.read_text(encoding='utf-8') if p.exists() else 'REPORT_NOT_CREATED; inspect traceback above')"
