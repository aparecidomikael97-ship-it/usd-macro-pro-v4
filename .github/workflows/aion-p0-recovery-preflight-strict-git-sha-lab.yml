name: AION P0 LAB Recovery Preflight Strict Git CAS SHA

on:
  push:
    branches: [lab/aion-p0-recovery-preflight-sha-validation-20261021]

permissions:
  contents: read

jobs:
  preflight:
    name: Strict recovery CAS preflight and denial - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: 17 RED-first invalid Git SHA preflight/no network denial cases
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_preflight_strict_git_sha_lab.py -v
      - name: Original 24 recovery tests
        run: python -B -m unittest -v test_atlasquant_aion_recovery
      - name: 26 prior checkpoint trace projection guards
        run: python -B -m unittest discover -s tests -p test_aion_p0_checkpoint_recovery_trace_shape_coherence_lab.py -v
      - name: Original recovery traceability tests
        run: python -B -m unittest -v test_atlasquant_aion_recovery_traceability_gate
      - name: 64 H0 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
