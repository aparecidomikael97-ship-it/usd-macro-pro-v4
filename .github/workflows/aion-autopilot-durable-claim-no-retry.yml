name: AION Autopilot Durable Claim and No Retry

on:
  pull_request:
    branches:
      - audit/aion-composite-shadow-hard-deny-contract-20261011
    paths:
      - "test_autopilot_v107.py"
      - ".github/workflows/aion-autopilot-durable-claim-no-retry.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autopilot-failclosed:
    name: Autopilot 31-test suite + durable claim regression / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install current requirements
        run: python -m pip install -r requirements.txt
      - name: Run whole Autopilot existing suite
        run: python -B -m unittest -v test_autopilot_v107
      - name: Verify independent negative sink fences
        run: python -B -m unittest -v test_atlasquant_legacy_remote_tenant_quarantine_v1 test_atlasquant_private_read_gate_v1
