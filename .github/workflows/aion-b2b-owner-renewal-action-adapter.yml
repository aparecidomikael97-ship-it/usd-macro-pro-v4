name: AION B2B Controlled Action Adapter Offline

on:
  workflow_dispatch:
  pull_request:
    branches: [main, business/aion-b2b-owner-renewal-action-command-plan-20261005]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_action_*.py"
      - "test_atlasquant_aion_b2b_owner_renewal_action_*.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_ACTION_ADAPTER_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-action-adapter.yml"

permissions:
  contents: read

jobs:
  controlled-adapter-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install existing pinned regression dependencies
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2 pandas==3.0.6 numpy==2.5.3
      - name: Compile offline adapter contracts
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_action_adapter_plan.py \
            atlasquant_aion_b2b_owner_renewal_action_adapter_dry_run.py \
            atlasquant_aion_b2b_owner_renewal_action_adapter_receipt.py \
            test_atlasquant_aion_b2b_owner_renewal_action_adapter.py
      - name: Run new safety matrix and upstream regression
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_action_adapter.py \
            test_atlasquant_aion_core_independence.py \
            test_atlasquant_aion_b2b_owner_renewal_action_command_plan.py \
            test_atlasquant_aion_b2b_owner_renewal_action_execution_preflight.py \
            test_atlasquant_aion_b2b_owner_renewal_action_execution_persistence_attestation.py \
            test_atlasquant_aion_b2b_owner_renewal_action_execution_writer_attestation.py
