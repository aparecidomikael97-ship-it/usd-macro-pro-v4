name: AION Native CNG Silent Signature Algorithm Enumeration V1 CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py"
      - "tests/test_atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py"
      - "docs/aion/AION_NATIVE_CNG_SILENT_SIGNATURE_ALGORITHM_ENUM_V1.md"
      - ".github/workflows/aion-native-cng-silent-signature-algorithm-enum-v1.yml"

permissions:
  contents: read

jobs:
  silent-signature-algorithms:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require disposable GitHub pull request job
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          assert os.environ.get("GITHUB_REPOSITORY") == "aparecidomikael97-ship-it/usd-macro-pro-v4"
          assert os.environ.get("RUNNER_OS") in ("Windows","Linux")
          PY
      - name: Compile native code and tests
        run: |
          python -m py_compile \
            atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py \
            tests/test_atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py
      - name: Execute adversarial and Windows-native read-only tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py'
      - name: Sanitized provider algorithm enumeration in GitHub runner only
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import json,secrets
          from atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1 import (
              observe_silent_signature_algorithms_ci_only,
          )
          out=observe_silent_signature_algorithms_ci_only(secrets.token_hex(32))
          print(json.dumps({
              "state":out["state"],"reason":out["reason"],
              "open_status":out["provider_open_status"],
              "enum_status":out["enumeration_status"],
              "signature_algorithms":out["target_algorithm_names"],
              "result_buffer_released":out["result_buffer_released"],
              "provider_handle_released":out["provider_handle_released"],
              "ui_suppression_physically_verified":out["actual_no_ui_physically_verified"],
              "private_keys_enumerated":out["private_key_enumerated"],
              "installer_authorized":out["installer_authorized"],
          },sort_keys=True))
          assert out["actual_no_ui_physically_verified"] is False
          assert out["private_key_enumerated"] is False
          assert out["installer_authorized"] is False
          PY
      - name: Static no-key/no-OS-mutation and fail-closed guard
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("atlasquant_aion_native_cng_silent_signature_algorithm_enum_v1.py").read_text("utf-8")
          tree=ast.parse(s)
          forbidden={"subprocess","socket","winreg","requests","urllib",
                     "httpx","shutil","tempfile"}
          allowed={"NCryptEnumAlgorithms","NCryptOpenStorageProvider",
                   "NCryptFreeBuffer","NCryptFreeObject"}
          for n in ast.walk(tree):
              if isinstance(n,ast.Import):
                  assert all(x.name.split(".")[0] not in forbidden for x in n.names)
              if isinstance(n,ast.ImportFrom):
                  assert (n.module or "").split(".")[0] not in forbidden
              if isinstance(n,ast.Attribute) and n.attr.startswith("NCrypt"):
                  assert n.attr in allowed
          assert 'SIGNATURE_OPERATION = 0x00000010' in s
          assert 'NCRYPT_SILENT_FLAG' in s
          for f in (
              '"actual_no_ui_physically_verified": False',
              '"owner_pc_execution_authorized_by_code": False',
              '"private_key_enumerated": False',
              '"private_key_created": False',
              '"private_key_opened": False',
              '"private_key_enrolled": False',
              '"installer_authorized": False',
              '"safe_to_resume": False',
              '"host_security_state_modified": False',
          ):
              assert f in s,f
          PY
