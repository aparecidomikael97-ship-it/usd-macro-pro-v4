name: AION Native CNG Zero Flags CI Feasibility Only V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py"
      - "tests/test_atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py"
      - "docs/aion/AION_NATIVE_CNG_ZERO_FLAGS_CI_FEASIBILITY_V1.md"
      - ".github/workflows/aion-native-cng-zero-flags-ci-feasibility-v1.yml"

permissions:
  contents: read

jobs:
  zero-flags-ci-only:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Ensure disposable GitHub PR CI
        run: |
          python - <<'PY'
          import os
          assert os.environ.get("GITHUB_ACTIONS") == "true"
          assert os.environ.get("GITHUB_EVENT_NAME") == "pull_request"
          assert os.environ.get("GITHUB_REPOSITORY") == "aparecidomikael97-ship-it/usd-macro-pro-v4"
          assert os.environ.get("RUNNER_OS") in ("Windows","Linux")
          PY
      - name: Compile source and tests
        run: |
          python -m py_compile \
            atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py \
            tests/test_atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py
      - name: Run negative and native disposable Windows CI tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py'
      - name: Report sanitized ephemeral Windows CNG status
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import json,secrets
          from atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1 import (
              probe_zero_flags_ci_feasibility_only,
          )
          r=probe_zero_flags_ci_feasibility_only(secrets.token_hex(32))
          print(json.dumps({
              "state":r["state"],"reason":r["reason"],
              "provider_opened":r["provider_opened"],
              "open_status":r["open_status"],
              "algorithm_statuses":r["algorithm_statuses"],
              "free_confirmed":r["provider_handle_released"],
              "ui_suppression_verified":r["ui_suppression_verified"],
              "zero_flags_may_allow_provider_ui":r["zero_flags_may_allow_provider_ui"],
              "owner_pc_execution_authorized":r["owner_pc_execution_authorized_by_code"],
              "private_key_created":r["private_key_created"],
              "installer_authorized":r["installer_authorized"],
              "host_security_state_modified":r["host_security_state_modified"],
          },sort_keys=True))
          assert r["ui_suppression_verified"] is False
          assert r["owner_pc_execution_authorized_by_code"] is False
          assert r["private_key_created"] is False
          assert r["installer_authorized"] is False
          assert r["host_security_state_modified"] is False
          PY
      - name: No key/Windows/security/network writes or physical authorization
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("atlasquant_aion_native_cng_zero_flags_ci_feasibility_v1.py").read_text("utf-8")
          t=ast.parse(s)
          banned_imports={"subprocess","socket","winreg","requests","urllib",
                          "httpx","shutil","tempfile"}
          for node in ast.walk(t):
              if isinstance(node,ast.Import):
                  assert all(x.name.split(".")[0] not in banned_imports for x in node.names)
              if isinstance(node,ast.ImportFrom):
                  assert (node.module or "").split(".")[0] not in banned_imports
              if isinstance(node,ast.Attribute) and node.attr.startswith("NCrypt"):
                  assert node.attr in {
                      "NCryptOpenStorageProvider",
                      "NCryptIsAlgSupported",
                      "NCryptFreeObject",
                  }
          assert 'ZERO_FLAGS = 0' in s
          for guard in (
              '"zero_flags_may_allow_provider_ui": True',
              '"ui_suppression_verified": False',
              '"owner_pc_execution_authorized_by_code": False',
              '"physical_host_safety_verified": False',
              '"private_key_created": False',
              '"private_key_opened": False',
              '"private_key_enrolled": False',
              '"host_security_state_modified": False',
              '"installer_authorized": False',
              '"build_authorized": False',
              '"deploy_authorized": False',
              '"safe_to_resume": False',
          ):
              assert guard in s, guard
          PY
