name: AION A202 SQLite Dispatch CAS LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_execution_outbox.py"
      - "labs/test_a202_outbox_dispatch_atomic_cas.py"
      - "docs/lab/aion_a202_sqlite_dispatch_atomic_cas.md"
      - ".github/workflows/aion-a202-dispatch-cas-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch-cas:
    name: A202 same-lease reentry / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install only requirements of real SQLite and privacy module
        run: python -m pip install requests==2.34.2
      - name: Race the same claimed semantic intent through two actual SQLite connections
        run: python -B -m unittest -v labs.test_a202_outbox_dispatch_atomic_cas
