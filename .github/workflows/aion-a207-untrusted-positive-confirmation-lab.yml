name: AION A207 Untrusted Positive Confirmation RED LAB

on:
  pull_request:
    paths:
      - "labs/test_a207_untrusted_confirmation_requires_receipt.py"
      - "docs/lab/aion_a207_untrusted_positive_confirmation_red.md"
      - ".github/workflows/aion-a207-untrusted-positive-confirmation-lab.yml"
      - "atlasquant_aion_execution_outbox.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  untrusted-positive:
    name: A207 untrusted positive cannot fabricate effect / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install minimal import dependency
        run: python -m pip install requests==2.34.2
      - name: Run deliberate RED-first fake confirmation tests
        run: python -B -m unittest -v labs.test_a207_untrusted_confirmation_requires_receipt
