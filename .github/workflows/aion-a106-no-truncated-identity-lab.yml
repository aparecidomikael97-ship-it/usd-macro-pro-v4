name: AION A106 LAB action identity no truncation

on:
  pull_request:
    branches: [lab/aion-v16-a104-a103-historical-rebaseline-20261015]
    paths:
      - "atlasquant_aion_execution_outbox.py"
      - "atlasquant_aion_execution_saga.py"
      - "test_atlasquant_aion_a106_no_truncated_identity.py"
      - ".github/workflows/aion-a106-no-truncated-identity-lab.yml"

permissions:
  contents: read

jobs:
  a106_lab:
    name: A106 identity boundary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned runtime dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A106 boundary and A103/A89 regressions
        run: >-
          python -m unittest -q
          test_atlasquant_aion_a106_no_truncated_identity
          test_atlasquant_aion_a103_bounded_action_payload
          test_atlasquant_aion_a89_canonical_action_payload
          test_atlasquant_aion_a88_redacted_payload_identity
          test_atlasquant_aion_saga_plan_integrity_a50
          test_atlasquant_aion_outbox_fifo_local_terminal_denial
          test_atlasquant_aion_outbox_missing_predecessor_denial
          test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_enqueue_is_transactional_idempotent_and_collision_safe
