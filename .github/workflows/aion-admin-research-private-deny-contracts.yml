name: AION Admin Research Private Deny Contracts

on:
  pull_request:
    branches:
      - audit/aion-access-gate-runtime-denial-regression-20261011
    paths:
      - "test_atlasquant_admin_event_foundation.py"
      - "test_atlasquant_research_intelligence_foundation.py"
      - ".github/workflows/aion-admin-research-private-deny-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  private-denial:
    name: Admin private-read and Research hard-deny / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Admin, Research, Worker, and read gates
        run: python -B -m unittest -v test_atlasquant_admin_event_foundation test_atlasquant_research_intelligence_foundation test_atlasquant_access_panel test_atlasquant_aion_global_worker_activation test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1
