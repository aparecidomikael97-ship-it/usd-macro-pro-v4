name: AION P0 A153 IAM Policy Document Boundary LAB (NO-GO)
on:
  pull_request:
    paths:
      - 'tools/aion_p0_a153_iam_document_boundary_lab.py'
      - 'tests/test_aion_p0_a153_iam_document_boundary_lab.py'
      - 'tests/run_aion_a153_counted_lab.py'
      - 'docs/aion/evidence/aion_p0_a153_synthetic_iam_scope_candidate_no_go.json'
      - 'docs/aion/A153_H0_E1_IAM_POLICY_DOCUMENT_BOUNDARY_NO_GO_20261022.md'
      - '.github/workflows/aion-p0-a153-iam-proposal-boundary-lab.yml'
  push:
    branches:
      - lab/aion-p0-a153-iam-policy-adversarial-fence-20261022
permissions:
  contents: read
jobs:
  count-and-deny-local-policy-document:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_LAB_MODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned offline LAB crypto dependency
        run: python -m pip install "cryptography==44.0.3"
      - name: A145-A150 259 counted synthetic regression tests
        run: python -B tests/run_aion_a150_counted_lab.py
      - name: A151 16 import-fence tests plus checkout scan
        run: python -B tests/run_aion_a151_no_go_gate.py
      - name: A152 55 decision and existing FinOps tests
        run: python -B tests/run_aion_a152_decision_counted_lab.py
      - name: A152 documentary source-only decision remains HARD NO-GO
        run: python -B tools/aion_p0_a152_external_evidence_decision_gate.py
      - name: A153 48 adversarial static IAM policy tests
        run: python -B tests/run_aion_a153_counted_lab.py
      - name: A153 static synthetic IAM proposal does NOT authorize live IAM
        run: python -B tools/aion_p0_a153_iam_document_boundary_lab.py docs/aion/evidence/aion_p0_a153_synthetic_iam_scope_candidate_no_go.json
      - name: Exact historical crosswalk of 32 producer blockers
        run: python -B tools/aion_p0_h0_provider_32_crosswalk_audit.py --check-crosswalk
