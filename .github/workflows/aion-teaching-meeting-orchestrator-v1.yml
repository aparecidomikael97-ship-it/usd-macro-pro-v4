name: AION Teaching Meeting Orchestrator V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_teaching_meeting_orchestrator_v1.py"
      - "tests/test_atlasquant_aion_teaching_meeting_orchestrator_v1.py"
      - "docs/aion/AION_TEACHING_MEETING_ORCHESTRATOR_V1.md"
      - ".github/workflows/aion-teaching-meeting-orchestrator-v1.yml"

permissions:
  contents: read

jobs:
  teaching-meeting-orchestrator-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile orchestrator
        run: |
          python -m py_compile \
            atlasquant_aion_teaching_meeting_orchestrator_v1.py \
            tests/test_atlasquant_aion_teaching_meeting_orchestrator_v1.py

      - name: Run orchestrator tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_teaching_meeting_orchestrator_v1.py'

      - name: Assert orchestration-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_teaching_meeting_orchestrator_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import socket",
              "import requests",
              "urllib.request",
              "from pptx",
              "import pptx",
              "import matplotlib",
              "import streamlit",
              "import cv2",
              "import pyaudio",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"powerpoint_created": False',
              '"presentation_started": False',
              '"charts_rendered": False',
              '"physical_demo_started": False',
              '"raw_question_persisted": False',
              '"raw_answer_persisted": False',
              '"authentication_transferred": False',
              '"owner_authority_transferred": False',
              '"production_demo_authority": False',
              '"real_customer_data_in_demo": False',
              '"payments_in_demo": False',
              '"trading_in_demo": False',
              '"publication_in_demo": False',
              '"message_send_in_demo": False',
              '"provider_called": False',
              '"network_called": False',
              '"camera_started": False',
              '"microphone_started": False',
              '"worker_armed": False',
              '"deploy_executed": False',
              '"core_checkpoint_write": False',
              '"external_action_executed": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
