name: AION A194 Real Login Gate Failclosed LAB

on:
  pull_request:
    paths:
      - "atlasquant_access_panel.py"
      - "usd_macro_pro_v4_cloud.py"
      - "test_atlasquant_access_panel.py"
      - "labs/test_a194_real_login_gate_failclosed_lab.py"
      - "docs/lab/aion_a194_real_login_gate_failclosed.md"
      - ".github/workflows/aion-a194-real-login-gate-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-gate-lab:
    name: A194 actual login/fallback AST / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: A194 real source AST stdlib-only synthetic tests
        run: python -B -m unittest -v labs.test_a194_real_login_gate_failclosed_lab
