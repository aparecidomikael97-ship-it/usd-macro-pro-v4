name: AION P0 LAB Trust Root Strict Public-Key File Intake (NO-GO)

on:
  push:
    branches: [lab/aion-p0-trust-root-strict-file-admission-20261020]

permissions:
  contents: read

jobs:
  strict_local_root_intake:
    name: Bounded trust root file and strict key syntax - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing pinned packages
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Fourteen trust root admission adversarial tests (RED before patch)
        run: python -B -m unittest discover -s tests -p test_aion_p0_trust_root_strict_file_admission_lab.py -v
      - name: Owner signed ceremony historical pytest regressions
        run: python -m pytest -q test_atlasquant_aion_v224_owner_signature_ceremony.py
      - name: Owner decision record and persistence pytest regressions
        run: python -m pytest -q test_atlasquant_aion_v225_explicit_owner_decision_record.py test_atlasquant_aion_v226_owner_decision_persistence_attestation.py
      - name: Signed incident envelope cryptographic negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_signed_incident_envelope_cryptographic_lab.py -v
      - name: KMS interop proposal always NO-GO negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_kms_ed25519_raw_interop_lab.py -v
