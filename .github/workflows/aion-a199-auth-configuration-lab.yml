name: AION A199 Cross-Source Auth Failclosed LAB

on:
  pull_request:
    paths:
      - "atlasquant_access_panel.py"
      - "usd_macro_pro_v4_cloud.py"
      - "labs/test_a199_auth_configuration_monotonic_lab.py"
      - "docs/lab/aion_a199_auth_configuration_monotonic.md"
      - ".github/workflows/aion-a199-auth-configuration-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-configuration:
    name: A199 monotonic login requirement / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Real access_required and cloud import fallback AST, stdlib only
        run: python -B -m unittest -v labs.test_a199_auth_configuration_monotonic_lab
