name: AION Chat Pending Model Turn Durable Staging CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_chat_pending_model_turn_v1.py"
      - "tests/test_atlasquant_aion_chat_pending_model_turn_v1.py"
      - "docs/aion/AION_CHAT_PENDING_MODEL_TURN_V1.md"
      - ".github/workflows/aion-chat-pending-model-turn-v1.yml"

permissions:
  contents: read

jobs:
  pending-model-turn:
    name: Scoped pending turn / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned repo and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile new store boundary
        run: python -m py_compile atlasquant_aion_chat_pending_model_turn_v1.py tests/test_atlasquant_aion_chat_pending_model_turn_v1.py
      - name: Run focused pending-turn/identity/provider regression suites
        run: |
          python -m pytest -q tests/test_atlasquant_aion_chat_pending_model_turn_v1.py test_atlasquant_aion_chat_product_bridge.py test_atlasquant_aion_provider.py test_atlasquant_aion_model_router.py
