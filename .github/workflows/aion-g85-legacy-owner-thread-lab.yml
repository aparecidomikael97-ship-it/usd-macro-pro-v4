name: AION G85 legacy SQLite owner-thread custody LAB
on:
  pull_request:
    paths:
      - 'aion_chat/store.py'
      - 'atlasquant_aion_chat_host_staging.py'
      - 'labs/a190/test_g85_legacy_owner_thread_preservation_lab.py'
      - '.github/workflows/aion-g85-legacy-owner-thread-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g85-owner:
    name: G85 legacy owner / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install existing synthetic test dependencies
        shell: bash
        run: python -m pip install 'cryptography==50.0.2' 'requests==2.34.2'
      - name: G85 owner-thread, canonical legacy lifecycle, and G83/G84
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v \
            labs.a190.test_g85_legacy_owner_thread_preservation_lab \
            test_atlasquant_aion_chat_sqlite_lifecycle.SQLiteLifecycleTests.test_foreign_legacy_connection_is_retained_until_owner_can_close_it \
            labs.a190.test_g84_direct_constructor_interrupt_lab \
            labs.a190.test_g83_constructor_cleanup_interruption_lab 2>&1 | tee g85.log
          grep -F 'Ran 18 tests' g85.log
          grep -Fx 'OK' g85.log
          grep -F 'G85_FOREIGN_REPLACE_GREEN=OWNER_CAN_RELEASE_NATIVE_HANDLE' g85.log
          grep -F 'G85_FOREIGN_CLOSE_ALL_GREEN=OWNER_RETAINED' g85.log
          grep -F 'G85_FOREIGN_CLOSE_ONE_GREEN=OWNER_RETAINED' g85.log
          grep -F 'G85_OWNER_REPLACE_GREEN=SCOPED_HANDLE' g85.log
          grep -F 'G85_SCOPED_CROSS_THREAD_GREEN=STILL_REVOKABLE' g85.log
