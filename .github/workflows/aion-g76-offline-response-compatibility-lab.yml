name: AION G76 offline response compatibility LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_provider.py'
      - 'atlasquant_neural_tts.py'
      - 'atlasquant_external_first_send_gate.py'
      - 'test_atlasquant_aion_provider.py'
      - 'test_atlasquant_voice_profile.py'
      - 'labs/a190/test_g74_operational_first_send_red_lab.py'
      - 'labs/a190/test_g75_external_first_send_lab.py'
      - 'labs/a190/test_g76_offline_response_compatibility_lab.py'
      - '.github/workflows/aion-g76-offline-response-compatibility-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-compatibility:
    name: G76 no external send / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned test dependency
        shell: bash
        run: python -m pip install 'requests==2.34.2'
      - name: Synthetic G74-G76 and historical provider/voice tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v             labs.a190.test_g74_operational_first_send_red_lab             labs.a190.test_g75_external_first_send_lab             labs.a190.test_g76_offline_response_compatibility_lab             test_atlasquant_aion_provider             test_atlasquant_voice_profile 2>&1 | tee g76.log
          grep -F 'Ran 50 tests' g76.log
          grep -Fx 'OK' g76.log
