name: AION A195 Streamlit Chat Session Recheck LAB

on:
  pull_request:
    paths:
      - "atlasquant_aion_chat_entrypoint_guard.py"
      - "atlasquant_aion_chat_host_staging.py"
      - "atlasquant_aion_chat_render_production_host_v1.py"
      - "labs/test_a195_chat_entrypoint_guard.py"
      - "docs/lab/aion_a195_chat_entrypoint_guard.md"
      - ".github/workflows/aion-a195-chat-entrypoint-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session-boundary:
    name: A195 revalidate host session / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synthetic session, actual guard and host wrapper AST
        run: python -B -m unittest -v labs.test_a195_chat_entrypoint_guard
