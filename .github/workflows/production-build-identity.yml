name: AtlasQuant - Production Build Identity

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: atlasquant-production-build-identity
  cancel-in-progress: true

jobs:
  build-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      APP_URL: "https://atlasquant-private.onrender.com"
    steps:
      - name: Checkout expected source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install browser probe
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Wait for exact production source build
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path

          from playwright.sync_api import sync_playwright
          from atlasquant_build_identity import short_source_fingerprint

          url=os.environ["APP_URL"]
          expected=short_source_fingerprint(Path.cwd(),16)
          out=Path("production-build-identity")
          out.mkdir(exist_ok=True)
          report={
              "url":url,
              "expected_source_build":expected,
              "github_sha":os.environ.get("GITHUB_SHA",""),
              "attempts":0,
              "seen_builds":[],
              "matched":False,
              "http_statuses":[],
          }

          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={"width":1280,"height":800})
              for attempt in range(1,37):
                  report["attempts"]=attempt
                  status=None
                  try:
                      response=page.goto(url,wait_until="domcontentloaded",timeout=180_000)
                      status=response.status if response else None
                  except Exception:
                      status=None
                  report["http_statuses"].append(status)

                  source_build=""
                  try:
                      marker=page.locator("#atlasquant-source-build-marker")
                      if marker.count():
                          source_build=str(
                              marker.first.get_attribute("data-build") or ""
                          ).strip().lower()
                      if not source_build:
                          html=page.content()
                          match=re.search(r"AQBUILD:([0-9a-f]{16})",html,re.I)
                          if match:
                              source_build=match.group(1).lower()
                  except Exception:
                      source_build=""

                  if source_build and source_build not in report["seen_builds"]:
                      report["seen_builds"].append(source_build)
                  if source_build==expected:
                      report["matched"]=True
                      break
                  if attempt<36:
                      time.sleep(10)
              page.screenshot(path=str(out/"production.png"),full_page=False)
              browser.close()

          (out/"report.json").write_text(
              json.dumps(report,ensure_ascii=False,indent=2),
              encoding="utf-8",
          )
          print(json.dumps(report,ensure_ascii=False))
          if not report["matched"]:
              raise SystemExit(
                  "Production source build did not match expected build "
                  f"{expected}; seen={report['seen_builds']}"
              )
          PY

      - name: Build identity summary
        if: always()
        shell: bash
        run: |
          if [ -f production-build-identity/report.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("production-build-identity/report.json").read_text())
          print("## AtlasQuant production build identity")
          print("")
          print(f"- Expected source build: `{r['expected_source_build']}`")
          print(f"- GitHub SHA: `{r['github_sha']}`")
          print(f"- Match: **{r['matched']}**")
          print(f"- Attempts: {r['attempts']}")
          print(f"- Seen builds: {', '.join(r['seen_builds']) or 'none'}")
          PY
          fi

      - name: Upload build identity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlasquant-production-build-identity
          path: production-build-identity/
          if-no-files-found: warn
          retention-days: 14
