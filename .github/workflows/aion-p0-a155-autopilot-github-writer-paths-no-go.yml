name: AION P0 A155 Autopilot GitHub Writer Path Containment (LAB NO-GO)
on:
  pull_request:
    paths:
      - 'autopilot_v107.py'
      - 'tests/test_aion_p0_a155_autopilot_writer_allowlist_lab.py'
      - 'tests/run_aion_a155_autopilot_destinations_counted_lab.py'
      - 'tests/test_aion_p0_generic_github_writer_paths_lab.py'
      - 'tests/test_aion_p0_other_generic_writers_path_lab.py'
      - 'docs/aion/A155_AUTOPILOT_GITHUB_DESTINATION_ALLOWLIST_NO_GO_20261022.md'
      - '.github/workflows/aion-p0-a155-autopilot-github-writer-paths-no-go.yml'
  push:
    branches:
      - lab/aion-p0-a155-autopilot-writer-allowlist-20261022
permissions:
  contents: read
jobs:
  enforce-allowed-autopilot-destinations:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_LAB_MODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned LAB regression test dependencies only
        run: python -m pip install "cryptography==44.0.3" "requests==2.32.3"
      - name: A155 78 counted real generic-writer mocked destination tests
        run: python -B tests/run_aion_a155_autopilot_destinations_counted_lab.py
      - name: A145-A150 259 synthetic baseline regressions
        run: python -B tests/run_aion_a150_counted_lab.py
      - name: A151 16 lab-to-runtime import fence and repository scan
        run: python -B tests/run_aion_a151_no_go_gate.py
      - name: A152 55 documentary and FinOps tests
        run: python -B tests/run_aion_a152_decision_counted_lab.py
      - name: A153 48 IAM document attack tests
        run: python -B tests/run_aion_a153_counted_lab.py
      - name: A154 73 checkpoint real-writer deny and AST mutation tests
        run: python -B tests/run_aion_a154_checkpoint_deny_counted_lab.py
      - name: A154 direct checkpoint witness guard static verdict HARD NO-GO
        run: python -B tools/aion_p0_a154_runtime_writer_deny_ast_lab.py
      - name: A136 broad static checkpoint write surface audit still enforced
        run: python -B tools/aion_p0_checkpoint_write_surface_audit.py --enforce
      - name: A152 E0-E5 decision remains HARD NO-GO
        run: python -B tools/aion_p0_a152_external_evidence_decision_gate.py
      - name: Exact 32 unresolved historical producer errors preserved
        run: python -B tools/aion_p0_h0_provider_32_crosswalk_audit.py --check-crosswalk
