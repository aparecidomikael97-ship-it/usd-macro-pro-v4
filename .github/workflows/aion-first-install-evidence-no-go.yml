name: AION First Install Evidence NO-GO Regression

on:
  pull_request:
    branches:
      - audit/aion-convergence-true-main-protection-20261011
    paths:
      - "tests/test_aion_first_install_evidence_no_go_1215.py"
      - "docs/aion/AION_FIRST_INSTALL_EVIDENCE_NO_GO_20261011.md"
      - ".github/workflows/aion-first-install-evidence-no-go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-go-evidence:
    name: Offline first-install evidence / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify evidence manifest and early deny (offline)
        run: python -B -m unittest discover -s tests -p "test_aion_first_install_evidence_no_go_1215.py" -v
      - name: Verify existing worker and readiness source fences
        run: python -B -m unittest -v test_atlasquant_aion_global_worker_source_gate_v1 test_atlasquant_aion_global_worker_readiness_source_gate_v1 test_atlasquant_aion_readiness_credential_fence_1190
