name: AION A289 SQLite Authorizer Cached Statement LAB

on:
  pull_request:
    paths:
      - labs/a289_sqlite_authorizer_cache_lab.py
      - labs/test_a289_sqlite_authorizer_cache_lab.py
      - docs/lab/aion_a289_sqlite_authorizer_cache_lab.md
      - .github/workflows/aion-a289-sqlite-authorizer-cache-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorizer-cache:
    name: A289 native SQLite authorizer cache limitations (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Native Python SQLite authorizer and prior read guard regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a289_sqlite_authorizer_cache_lab
          labs.test_a288_sqlite_postread_guard
          labs.test_a287_sqlite_read_race_probe
          labs.test_a286_sqlite_store_data_version_guard
          labs.test_a285_sqlite_live_data_version_lab
