name: AION Core isolated tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'aion_core/**'
      - 'test_aion_core_*.py'
      - '.github/workflows/aion-core-nightshift.yml'
jobs:
  isolated-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Compile isolated AION Core
        run: python -m compileall -q aion_core test_aion_core_*.py
      - name: Run 92 isolated core tests
        run: python -m unittest discover -s . -p 'test_aion_core_*.py' -q
