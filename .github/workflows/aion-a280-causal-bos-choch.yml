name: AION A280 Causal BOS CHOCH LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_causal_structure_lab.py
      - atlasquant_aion_causal_fvg_lab.py
      - atlasquant_aion_csv_backtest_lab.py
      - atlasquant_aion_historical_csv.py
      - labs/test_a280_causal_structure_lab.py
      - docs/lab/aion_a280_causal_bos_choch.md
      - .github/workflows/aion-a280-causal-bos-choch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-structure:
    name: A280 delayed pivots/no-order (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Existing dependencies and test runner
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: Delayed swing confirmation, no-lookahead and historical invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a280_causal_structure_lab
          labs.test_a279_causal_fvg_research
          labs.test_a278_plan_journal_local_hash
          labs.test_a277_csv_backtest_holdout
          labs.test_a276_historical_csv
          labs.test_a275_nonfx_readonly_overlay
          labs.test_a269_trader_closed_mtf_evidence
          labs.test_a268_trader_readonly_observation
          test_atlasquant_risk_guardian
      - name: Existing backtest and scanner regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_operational_backtest.py
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
