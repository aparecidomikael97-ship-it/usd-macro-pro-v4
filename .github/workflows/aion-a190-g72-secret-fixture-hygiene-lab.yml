name: A190 G72 synthetic credential fixtures hygiene LAB
on:
  pull_request:
    paths:
      - 'labs/a190/test_g62_tuple_privacy_cycles_transaction_lab.py'
      - 'labs/a190/test_g63_confirm_cycle_volatile_payload_lab.py'
      - 'labs/a190/test_g64_confirm_opaque_privacy_depth_lab.py'
      - 'labs/a190/test_g65_key_width_bytes_budget_lab.py'
      - '.github/workflows/aion-a190-g72-secret-fixture-hygiene-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-hygiene:
    name: G72 fake-token checks / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install synthetic LAB dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Check full repository credential literal hygiene
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v test_atlasquant_repository_secret_hygiene 2>&1 | tee g72-hygiene.log
          grep -F 'Ran 2 tests' g72-hygiene.log
      - name: Verify G60-G69 privacy and transaction regressions
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g6*.py' -v 2>&1 | tee g72-g6x.log
          grep -F 'Ran 147 tests' g72-g6x.log
          grep -F 'G62_DEEP_TUPLE_GREEN=PATTERNS_REDACTED' g72-g6x.log
          grep -F 'G63_STABLE_SECRET_GREEN=REDACTION_AFTER_ENCODING' g72-g6x.log
          grep -F 'G64_OPAQUE_TOKEN_GREEN=NO_LEDGER_OR_BEGIN' g72-g6x.log
          grep -F 'G65_STAGING_KEY_GREEN=NO_RESERVATION' g72-g6x.log
          grep -F 'G65_ONE_STR_GREEN=NO_SECOND_OPAQUE_CONVERSION' g72-g6x.log
