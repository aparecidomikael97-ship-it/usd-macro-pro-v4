name: AION Owner + Worker Source Composite Negative Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_owner_experience_v1.py"
      - "atlasquant_aion_global_worker_source_gate_v1.py"
      - "atlasquant_aion_v2_four_role_key_enrollment_reference.py"
      - "tests/test_aion_owner_worker_source_negative_composition.py"
      - ".github/workflows/aion-owner-worker-source-composite-negative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny-untrusted-sources:
    name: Composite Owner/Chat/Worker deny / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact unmerged composite HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install repo-pinned test dependencies only
        run: python -m pip install -r requirements.txt
      - name: Compile three real source contracts plus tests
        run: python -m py_compile atlasquant_aion_owner_experience_v1.py atlasquant_aion_global_worker_source_gate_v1.py atlasquant_aion_chat_product_bridge.py tests/test_aion_owner_worker_source_negative_composition.py
      - name: Verify cross-stack source gate is fail-closed despite synthetic owner
        shell: bash
        run: |
          python -B -m unittest discover -v -s tests -p 'test_aion_owner_worker_source_negative_composition.py'
      - name: Verify source guard always denies before GET, CAS and execution
        shell: bash
        run: |
          python -B -m unittest test_atlasquant_aion_global_worker_source_gate_v1.py -v
      - name: Guard against invented trust acceptance state
        shell: bash
        run: |
          python - <<'PY'
          from atlasquant_aion_global_worker_source_gate_v1 import independent_worker_source_preflight
          from atlasquant_aion_v2_four_role_key_enrollment_reference import FALSE_GATES
          r = independent_worker_source_preflight({'trusted_owner': True, 'worker_authorized': True})
          assert r['status'] == 'BLOCKED'
          assert r['source_verified'] is False
          assert r['worker_authorized'] is False
          assert r['network_called'] is False
          assert r['safe_to_retry'] is False
          assert FALSE_GATES['installer_authorized'] is False
          print('COMPOSITE_REAL_SOURCE_ENROLLMENT_NOT_PROVED_HARD_NO_GO')
          PY
