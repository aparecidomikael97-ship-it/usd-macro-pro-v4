name: AION CI Publisher Registry and Separate Build Witness V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_ci_publisher_registry_build_witness_v1.py"
      - "tests/test_atlasquant_aion_ci_publisher_registry_build_witness_v1.py"
      - "docs/aion/AION_CI_PUBLISHER_REGISTRY_BUILD_WITNESS_V1.md"
      - ".github/workflows/aion-ci-publisher-registry-build-witness-v1.yml"

permissions:
  contents: read

jobs:
  isolated-key-governance-and-witness-v1:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify controlled test-only dependency set
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import os
          import sys
          import cryptography
          assert sys.version_info[:2] == (3, 12), sys.version
          assert cryptography.__version__ == "50.0.2"
          assert os.environ["GITHUB_ACTIONS"] == "true"
          assert os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          assert os.environ["RUNNER_OS"] in ("Linux", "Windows")
          PY

      - name: Compile publisher registry and independent witness contracts
        run: |
          python -m py_compile \
            atlasquant_aion_ci_publisher_registry_build_witness_v1.py \
            tests/test_atlasquant_aion_ci_publisher_registry_build_witness_v1.py

      - name: Adversarial publisher rotation revocation and witness verification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_ci_publisher_registry_build_witness_v1.py'

      - name: Enforce no production key, installer, device or Worker side effects
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_ci_publisher_registry_build_witness_v1.py").read_text("utf-8")
          forbidden = (
              "Ed25519PrivateKey", "generate_private_key", "import subprocess",
              "from subprocess", "import socket", "from socket",
              "import requests", "from requests", "urllib.request",
              "import httpx", "import winreg", "from winreg",
              "import ctypes", "from ctypes", "import sqlite3",
              "os.system(", "os.exec", "Path.write_bytes(", "Path.write_text(",
              "open(", "os.startfile(", "Start-Process ",
          )
          for marker in forbidden:
              assert marker not in source, marker
          from atlasquant_aion_ci_publisher_registry_build_witness_v1 import publisher_build_policy
          p = publisher_build_policy()
          assert p["ci_only"] is True
          for name in (
              "governance_source_trusted", "ci_self_signed_registry_grants_real_trust",
              "self_supplied_build_witness_is_independent_provenance",
              "external_policy_digest_means_policy_approved",
              "registry_sequence_is_durably_anchored",
              "ci_pubkey_promoted_to_production", "release_ready_for_install",
              "owner_authorization_consumed", "owner_device_accessed",
              "production_signed_release_created", "aion_installed",
              "deploy_executed", "worker_activated",
          ):
              assert p[name] is False, name
          PY
