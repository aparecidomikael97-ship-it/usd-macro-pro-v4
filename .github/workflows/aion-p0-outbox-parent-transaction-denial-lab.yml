name: AION P0 LAB Outbox Deny Nested SQLite Parent Transaction

on:
  push:
    branches: [lab/aion-p0-outbox-block-deny-parent-transaction-20261021]

permissions:
  contents: read

jobs:
  outbox_parent:
    name: No commit-through of caller owned SQLite state - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install project tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: Nine adversarial real SQLite borrowed parent transaction tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_parent_transaction_denial_lab.py -v
      - name: Nine Saga transactional CAS regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_atomic_scoped_stage_cas_lab.py -v
      - name: Twelve Saga scoped event helpers
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: Sixteen Saga Outbox local fail closed tests
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: Eleven scoped Outbox SQL join regression tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: Forty-four read-only Outbox recovery checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: Sixty-four H0 A79 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
