name: AION CI Governance Root and Builder Identity Preflight V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_ci_governance_anchor_builder_identity_v1.py"
      - "tests/test_atlasquant_aion_ci_governance_anchor_builder_identity_v1.py"
      - "docs/aion/AION_CI_GOVERNANCE_ANCHOR_BUILDER_IDENTITY_V1.md"
      - ".github/workflows/aion-ci-governance-anchor-builder-identity-v1.yml"

permissions:
  contents: read

jobs:
  ephemeral-root-and-builder-identity-shapes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Verify ephemeral CI-only dependency set
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import os, sys, cryptography
          assert sys.version_info[:2] == (3, 12), sys.version
          assert cryptography.__version__ == "50.0.2"
          assert os.environ["GITHUB_ACTIONS"] == "true"
          assert os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          assert os.environ["RUNNER_OS"] in ("Windows", "Linux")
          PY

      - name: Compile governance anchor and builder identity review
        run: |
          python -m py_compile \
            atlasquant_aion_ci_governance_anchor_builder_identity_v1.py \
            tests/test_atlasquant_aion_ci_governance_anchor_builder_identity_v1.py

      - name: Run adversarial governance-root and builder identity preflight
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_ci_governance_anchor_builder_identity_v1.py'

      - name: Assert no real signer, installation, privileged OS or Worker action
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_ci_governance_anchor_builder_identity_v1.py").read_text("utf-8")
          forbidden = (
              "Ed25519PrivateKey", "generate_private_key",
              "import subprocess", "from subprocess", "import socket",
              "from socket", "import requests", "from requests",
              "urllib.request", "import httpx", "import winreg",
              "from winreg", "import ctypes", "from ctypes",
              "import sqlite3", "os.system(", "os.exec",
              "Path.write_bytes(", "Path.write_text(",
              "open(", "os.startfile(", "Start-Process ",
          )
          for term in forbidden:
              assert term not in source, term
          from atlasquant_aion_ci_governance_anchor_builder_identity_v1 import governance_builder_policy
          p = governance_builder_policy()
          assert p["test_only"] is True
          assert p["ephemeral_ci_keys_only"] is True
          for k, v in p.items():
              if k not in ("schema", "test_only", "ephemeral_ci_keys_only"):
                  assert v is False, k
          PY
