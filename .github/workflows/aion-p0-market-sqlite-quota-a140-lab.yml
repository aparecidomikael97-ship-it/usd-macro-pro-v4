name: AION P0 A140 LAB Durable SQLite Quota Journal (NO-GO)
on:
  push:
    branches:
      - lab/aion-p0-market-sqlite-quota-journal-a140-20261021
permissions:
  contents: read
jobs:
  quota-journal-lab:
    name: A140 SQLite offline quota - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AION_LAB_MODE: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: A140 SQLite RED-first adversarial scenarios
        run: python -B -m unittest discover -s tests -p test_aion_p0_sqlite_durable_market_quota_a140_lab.py -v
      - name: Previous A139 synthetic acquisition regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_market_acquisition_isolation_a139_lab.py -v
      - name: A138 artifact and workflow contracts
        shell: bash
        run: |
          python -B -m unittest discover -s tests -p test_aion_p0_market_artifact_only_a138_lab.py -v
          python -B -m unittest discover -s tests -p test_aion_p0_market_artifact_workflow_contract_a138_lab.py -v
      - name: No real provider or GitHub write code in A140
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path("atlasquant_market_sqlite_quota_a140.py").read_text(encoding="utf-8")
          banned=["requests.", "httpx.", "urllib.request", "subprocess.", "github.token", "GITHUB_TOKEN_HISTORICO", "save_runtime_checkpoint", "AppTest", "CHAVE_TWELVE_DATA"]
          for forbidden in banned:
              assert forbidden not in text, forbidden
          print("A140 sqlite LAB gate: no direct network, provider or runtime writer")
          PY
