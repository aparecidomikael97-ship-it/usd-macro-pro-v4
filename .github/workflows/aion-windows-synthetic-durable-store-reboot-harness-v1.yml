name: AION Windows Synthetic CAS Store Reboot Harness V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py"
      - "tests/test_atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py"
      - "docs/aion/AION_WINDOWS_SYNTHETIC_DURABLE_STORE_REBOOT_HARNESS_V1.md"
      - ".github/workflows/aion-windows-synthetic-durable-store-reboot-harness-v1.yml"

permissions:
  contents: read

jobs:
  synthetic-cas-and-reboot-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.12"

      - name: Exact dependency environment
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import sys
          import cryptography
          assert sys.version_info[:3] == (3, 12, 12), sys.version
          assert cryptography.__version__ == "50.0.2", cryptography.__version__
          PY

      - name: Compile synthetic harness
        run: |
          python -m py_compile \
            atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py \
            tests/test_atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py

      - name: Run synthetic CAS and reboot adversarial tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py'

      - name: Assert no real Windows or persistence side effect
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1.py").read_text(encoding="utf-8")
          forbidden = (
              "import sqlite3", "from sqlite3", "import subprocess",
              "from subprocess", "import shutil", "from shutil",
              "import socket", "from socket", "import requests",
              "urllib.request", "import httpx", "import winreg",
              "win32file", "win32security", "win32process",
              "os.system", "os.exec", "Path.write_text(", "Path.write_bytes(",
              "import ctypes", "from ctypes",
          )
          for marker in forbidden:
              assert marker not in source, marker
          from atlasquant_aion_windows_synthetic_durable_store_reboot_harness_v1 import SIMULATOR_POLICY
          p = SIMULATOR_POLICY
          assert p["test_only"] is True
          for key in (
              "physical_durable_store_used", "physical_windows_reads_used",
              "real_windows_reboot_performed", "trusted_witness_generated",
              "write_ahead_install_commitment_executed",
              "owner_authorization_consumed", "install_token_consumed",
              "journal_persisted", "terminal_receipt_persisted",
              "files_copied", "acl_changed", "startup_changed",
              "aion_started", "package_installed", "rollback_executed",
              "network_called", "github_api_called", "deploy_executed",
              "worker_activated", "automatic_retry_on_unknown",
              "automatic_reinstall_on_unhealthy",
          ):
              assert p[key] is False, (key, p[key])
          PY
