name: AION External Witness Cost Capacity Reference V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_external_witness_cost_capacity_reference_v1.py"
      - "test_atlasquant_aion_external_witness_cost_capacity_reference_v1.py"
      - "test_atlasquant_aion_external_witness_workers_peak_v1.py"
      - "docs/aion/AION_EXTERNAL_WITNESS_COST_CAPACITY_20261010.md"
      - ".github/workflows/aion-external-witness-cost-capacity-ref-v1.yml"

permissions:
  contents: read

jobs:
  budget-research:
    name: External witness no-purchase model / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile budget model and no-go tests
        run: python -B -m py_compile atlasquant_aion_external_witness_cost_capacity_reference_v1.py test_atlasquant_aion_external_witness_cost_capacity_reference_v1.py test_atlasquant_aion_external_witness_workers_peak_v1.py
      - name: Verify hypothetical cost arithmetic and authorization separation
        run: python -B -m unittest test_atlasquant_aion_external_witness_cost_capacity_reference_v1.py test_atlasquant_aion_external_witness_workers_peak_v1.py -v
