name: AION P0 Outbox Legacy No-Producer Hardstop (NO-GO)

on:
  push:
    branches: [lab/aion-p0-outbox-legacy-no-provider-fence-20261021]

permissions:
  contents: read

jobs:
  outbox_boundary_denial:
    name: Five legacy cases and no-issuer negative controls - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Five ORIGINAL Outbox test identifiers, now requiring pre-provider denial
        shell: bash
        run: |
          python -B -m unittest -v \
            test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_lost_response_after_effect_requires_reconcile_and_never_blind_resends \
            test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_unverified_absence_never_allows_retry_even_if_fixture_knows_no_effect \
            test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_same_aggregate_is_ordered_until_previous_intent_is_terminal \
            test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_sent_without_confirmation_is_reconciled_not_redispatched \
            test_atlasquant_aion_execution_outbox.OutboxTimeOfUseFenceP0Tests.test_unexpired_claim_still_dispatches_once
      - name: Existing independent sender-denial and FIFO controls
        shell: bash
        run: |
          python -B -m unittest -v \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_no_enrolled_producer_must_block_before_adapter_send \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_self_attested_adapter_enrollment_cannot_enable_send \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_pre_send_gate_rejects_before_accessing_adapter_descriptor \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_block_keeps_same_aggregate_fifo_but_not_unrelated_work \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_unenrolled_reconcile_must_not_invoke_side_effecting_callback \
            test_atlasquant_aion_execution_outbox.OutboxStaleStateBlockCASP0Tests.test_confirm_rejects_claimed_without_send
      - name: Historical 85-case audit names retained exactly
        run: python -B -m unittest -q test_aion_p0_quality_85_causal_inventory_lab.py
      - name: 64 cross-process H0 causality denial tests
        run: python -B -m unittest -q test_atlasquant_aion_h0_causal_denial_a79.py
