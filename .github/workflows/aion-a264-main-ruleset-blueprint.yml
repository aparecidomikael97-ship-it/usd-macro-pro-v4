name: AION A264 Proposed Main Ruleset - Offline Contract

on:
  pull_request:
    paths:
      - docs/lab/a264_main_ruleset_admin_proposal.json
      - docs/lab/a264_main_ruleset_admin_playbook.md
      - labs/a264_ruleset_blueprint_review.py
      - labs/test_a264_ruleset_blueprint_review.py
      - .github/workflows/aion-a264-main-ruleset-blueprint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proposed-ruleset-offline:
    name: A264 candidate main freeze (NO administrator change, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout only, NO ruleset edit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test parser only
        run: python -m pip install PyYAML==6.0.2
      - name: A264 policy downgrade and A263 main-protection negative tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a264_ruleset_blueprint_review
          labs.test_a263_main_policy_readonly
