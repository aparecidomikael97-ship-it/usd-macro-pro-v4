name: A190 G25 monotonic custody witness LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g25_monotonic_custody_contract_lab.py'
      - 'labs/a190/test_g25_monotonic_custody_contract_lab.py'
      - '.github/workflows/aion-a190-g25-monotonic-custody-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g25-monotonic-custody:
    name: G25 monotonic witness custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only cryptography
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Monotonic floor contract and host-floor RED, no provider
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g25_monotonic_custody_contract_lab.py' -v 2>&1 | tee g25.log
          grep -F 'Ran 18 tests' g25.log
          grep -F 'G25_HOST_CONTROLLED_FLOOR_RED=OLD_JOURNAL_OLD_FLOOR_MATCH' g25.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'External high-water mark is synthetic and host-provided in LAB.'
          echo 'Passing RED proves false confidence from same-host custody.'
          echo 'No real independent monotonic store, provider dispatch or P0 closure.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
