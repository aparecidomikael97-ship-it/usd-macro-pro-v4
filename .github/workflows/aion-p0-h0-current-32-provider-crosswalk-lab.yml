name: AION P0 H0 LAB Current 32 Provider Error Crosswalk (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-provider-32-current-evidence-crosswalk-20261021]

permissions:
  contents: read

jobs:
  crosswalk:
    name: Exact current external producer blockers - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked requirements for unchanged A79 suite
        run: python -m pip install -r requirements.txt
      - name: Verify 32 historical/current one-to-one matches and prevent vendor self approval
        run: python -B tools/aion_p0_h0_provider_32_crosswalk_audit.py --check-crosswalk
      - name: 17 adversarial cross-platform provider proof crosswalk tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_provider_32_current_crosswalk_lab.py -v
      - name: 14 canonical Quality ledger integrity tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_quality_red_ledger_audit_lab.py -v
      - name: 64 existing H0 A79 causal denials
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
