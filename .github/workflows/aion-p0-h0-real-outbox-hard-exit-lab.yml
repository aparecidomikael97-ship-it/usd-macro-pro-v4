name: AION P0 H0 Real Outbox Hard Process Exit LAB (NO-GO)

on:
  push:
    branches: [lab/aion-p0-outbox-hard-exit-claim-recovery-20261020]

permissions:
  contents: read

jobs:
  verify_actual_outbox_hard_exit:
    name: Actual Outbox os._exit and H0 rollback - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 32
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing tracked requirements
        run: python -m pip install -r requirements.txt
      - name: Five actual Outbox hard child process exits (OPEN H0)
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_real_outbox_hard_process_exit_lab.py -v
      - name: Existing eight restored SQLite Outbox OPEN-gap tests unchanged
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
      - name: Existing A113 pre-dispatch claim lease quarantine unchanged
        run: python -B -m unittest -v test_atlasquant_aion_a113_expired_claim_quarantine
      - name: Existing Outbox Saga CAS recovery unchanged
        run: python -B -m unittest -v test_aion_p0_outbox_saga_cas_retry_recovery_lab
      - name: Existing scope and decision mismatch denial unchanged
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_decision_metadata_coherence_lab.py -v
      - name: H0 A79 causal denial canonical unchanged
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
