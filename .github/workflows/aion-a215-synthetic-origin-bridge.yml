name: AION A215 Synthetic Origin Bridge HARD NO-GO Lab

on:
  pull_request:
    paths:
      - labs/a215_synthetic_origin_bridge.py
      - labs/test_a215_synthetic_origin_bridge.py
      - atlasquant_aion_external_evidence_intake.py
      - labs/a212_synthetic_signed_effect_preflight.py
      - .github/workflows/aion-a215-synthetic-origin-bridge.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-origin-no-authority:
    name: Synthetic origin never authority (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only crypto dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.32.3
      - name: A215 origin chain and full Outbox negative authority regression
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a215_synthetic_origin_bridge
          labs.test_a214_external_evidence_intake
          labs.test_a213_outbox_untrusted_positive_hard_nogo
          labs.test_a207_untrusted_confirmation_requires_receipt
          labs.test_a206_late_send_outcome_cas
          labs.test_a205_unverified_adapter_absence_no_resend
          labs.test_a204_outbox_stale_absence_confirmed
          labs.test_a203_outbox_stale_revocation_cas
          labs.test_a202_outbox_dispatch_atomic_cas
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign
          labs.test_a212_synthetic_signed_effect_preflight
          labs.test_a211_claimed_witness_coherence
          labs.test_a210_offline_root_rotation_proposal
          labs.test_a209_root_provenance_failclosed
          labs.test_a208_independent_receipt_preflight
