name: AtlasQuant - Source Backup ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ATLASQUANT_REAL_EXECUTION: "0"
    steps:
      - name: Checkout stable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build source ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          name="AtlasQuant_SOURCE_${short_sha}"
          mkdir -p backup-out
          {
            echo "AtlasQuant source backup"
            echo "commit=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "real_execution=0"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > backup-out/BACKUP_MANIFEST.txt
          zip -qr "backup-out/${name}.zip" .             -x ".git/*"                "backup-out/*"                "__pycache__/*"                "*.pyc"
          sha256sum "backup-out/${name}.zip" > "backup-out/${name}.sha256"

          echo "Verifying source backup integrity..."
          sha256sum -c "backup-out/${name}.sha256"
          unzip -t "backup-out/${name}.zip" >/dev/null

          for critical in \
            "CONTEXTO_DO_PROJETO.md" \
            "docs/continuidade/checkpoint_mestre_latest.json" \
            "docs/continuidade/CHECKPOINT_MESTRE_RECONCILIACAO_2026-09-30.md" \
            "docs/continuidade/checkpoint_mestre_reconciliation_2026-09-30.json" \
            "atlasquant_aion_recovery.py" \
            "atlasquant_aion_memory.py"
          do
            unzip -Z1 "backup-out/${name}.zip" | grep -Fx -- "$critical" >/dev/null
          done

          echo "verified=true" >> backup-out/BACKUP_MANIFEST.txt
          ls -lh backup-out/

      - name: Upload source backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: atlasquant-source-backup-${{ github.sha }}
          path: backup-out/
          if-no-files-found: error
          retention-days: 30
