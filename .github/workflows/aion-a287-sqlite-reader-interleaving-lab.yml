name: AION A287 SQLite Reader Interleaving LAB

on:
  pull_request:
    paths:
      - labs/a287_sqlite_read_race_probe.py
      - labs/test_a287_sqlite_read_race_probe.py
      - docs/lab/aion_a287_sqlite_read_race_lab.md
      - .github/workflows/aion-a287-sqlite-reader-interleaving-lab.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sqlite-interleaving:
    name: A287 deterministic native SQLite read race (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    steps:
      - name: Checkout isolated LAB source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: SQLite native read race, store mode and counter regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a287_sqlite_read_race_probe
          labs.test_a286_sqlite_store_data_version_guard
          labs.test_a285_sqlite_live_data_version_lab
