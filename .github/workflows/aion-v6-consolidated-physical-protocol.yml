name: AION V6 Consolidation and Physical Scope NO-GO

on:
  pull_request:
    branches:
      - audit/aion-v5-durable-receipt-boundary-20261011
    paths:
      - "atlasquant_aion_first_install_preparation_v6/**"
      - "tests/test_aion_v6_consolidation_protocol.py"
      - "docs/aion/AION_V1_V5_CONSOLIDATION_AND_PHYSICAL_MINIMUM_V6_20261011.md"
      - ".github/workflows/aion-v6-consolidated-physical-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v6-offline:
    name: V1-V5 consolidation and physical NO-GO / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Existing pinned offline CI dependencies only
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --require-hashes -r requirements-aion-webauthn-reference.txt
      - name: V6 negative protocol and consolidation tests
        run: python -B -m unittest -v tests.test_aion_v6_consolidation_protocol
      - name: Rerun actual V5 receipt and root mathematical safety
        run: python -B -m unittest -v tests.test_aion_v5_receipt_admission tests.test_aion_v5_epoch_root_reference
      - name: Rerun original twenty blocked evidence proofs
        run: python -B -m unittest discover -s tests -p "test_aion_first_install_evidence_no_go_1215.py" -v
      - name: Render publicly safe consolidation report
        run: python -B -m atlasquant_aion_first_install_preparation_v6.consolidation
      - name: Compile tracked project Python sources
        run: python -m compileall -q -x '(^|[\\/])\.git([\\/]|$)' .
      - name: Verify whitespace and boundaries against V5
        run: git diff --check 2acae11ae76e300fae879bb1fd442409eb1e63c6 HEAD

  exact-root-quality:
    name: Original global root Quality / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install original Quality dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Run exact original root Quality block, no exclusions
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
