name: AION P0 H0 LAB Authority Graph Shared Control (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-authority-graph-offline-20261020]

permissions:
  contents: read

jobs:
  denied_authority_graph:
    name: H0 claimed independence remains NO-GO - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependency pins and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: 38 offline H0 independence graph adversarial cases
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_authority_graph_lab.py -v
      - name: 34 dual-signature H0 witness checks from parent PR
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_dual_signed_witness_transcript_lab.py -v
      - name: Original third anchor negative static design checks
        run: python -B -m unittest -v test_aion_p0_h0_third_anchor_design_review_lab
      - name: Original two-domain custody antirollback model
        run: python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: Original 64 H0 A79 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
