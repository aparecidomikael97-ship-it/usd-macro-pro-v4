name: AION Owner Experience V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "atlasquant_aion_owner_experience_v1.py"
      - "tests/test_atlasquant_aion_owner_experience_v1.py"
      - "docs/aion/AION_OWNER_EXPERIENCE_V1.md"
      - ".github/workflows/aion-owner-experience-v1.yml"

permissions:
  contents: read

jobs:
  owner-experience-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile owner experience contract
        run: |
          python -m py_compile             atlasquant_aion_owner_experience_v1.py             tests/test_atlasquant_aion_owner_experience_v1.py

      - name: Run owner experience tests
        run: |
          python -m unittest discover -v -s tests             -p 'test_atlasquant_aion_owner_experience_v1.py'

      - name: Assert side-effect boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("atlasquant_aion_owner_experience_v1.py").read_text(
              encoding="utf-8"
          )

          banned = (
              "subprocess.",
              "socket.",
              "requests.",
              "os.getenv(",
              "os.environ",
              "streamlit.secrets",
          )
          for marker in banned:
              assert marker not in source, marker

          required = (
              '"automatic_app_launch": False',
              '"automatic_navigation": False',
              '"microphone_started": False',
              '"continuous_listener_started": False',
              '"worker_armed": False',
              '"deploy_executed": False',
              '"core_checkpoint_write": False',
              '"external_action_executed": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
