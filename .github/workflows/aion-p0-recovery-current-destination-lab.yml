name: AION P0 LAB Recovery Current and Destination Gate (NO-GO)

on:
  push:
    branches:
      - lab/aion-p0-recovery-live-destination-binding-20261021

permissions:
  contents: read

jobs:
  recovery-lab:
    name: Read-only recovery regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
      AION_LAB_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: A128 current checkpoint completeness
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_current_envelope_completeness_lab.py -v
      - name: A129 live destination readback binding
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_live_destination_binding_lab.py -v
      - name: A127 strict Git SHA preflight
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_preflight_strict_git_sha_lab.py -v
      - name: Original recovery
        run: python -B -m unittest -v test_atlasquant_aion_recovery
      - name: Original recovery traceability
        run: python -B -m unittest -v test_atlasquant_aion_recovery_traceability_gate
      - name: A126 checkpoint trace guards
        run: python -B -m unittest discover -s tests -p test_aion_p0_checkpoint_recovery_trace_shape_coherence_lab.py -v
      - name: A79 H0 causal denial
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
  recovery-lab-windows:
    name: Read-only recovery regression tests Windows
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
      AION_LAB_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: A128 current checkpoint completeness
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_current_envelope_completeness_lab.py -v
      - name: A129 live destination readback binding
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_live_destination_binding_lab.py -v
      - name: A127 strict Git SHA preflight
        run: python -B -m unittest discover -s tests -p test_aion_p0_recovery_preflight_strict_git_sha_lab.py -v
      - name: Original recovery
        run: python -B -m unittest -v test_atlasquant_aion_recovery
      - name: Original recovery traceability
        run: python -B -m unittest -v test_atlasquant_aion_recovery_traceability_gate
      - name: A126 checkpoint trace guards
        run: python -B -m unittest discover -s tests -p test_aion_p0_checkpoint_recovery_trace_shape_coherence_lab.py -v
      - name: A79 H0 causal denial
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
