name: AtlasQuant - Production Browser Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, atlasquant-integration]
  schedule:
    - cron: "41 12 * * *"

permissions:
  contents: read

concurrency:
  group: atlasquant-production-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: "https://atlasquant-private.onrender.com"
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Warm production service
        shell: bash
        run: |
          set -euo pipefail
          code="000"
          for attempt in 1 2 3 4 5; do
            code=$(curl -L -sS --connect-timeout 20 --max-time 180 -o /tmp/atlasquant-health.txt -w "%{http_code}" "$APP_URL/_stcore/health" || true)
            echo "warm attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 15
          done
          test "$code" = "200"

      - name: Wait for fresh Fast Home snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/dados/atlasquant_home_snapshot_v1.json?ref=atlasquant-runtime"
          fresh="0"
          for attempt in $(seq 1 24); do
            code=$(curl -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -o /tmp/atlasquant-home-api.json \
              -w "%{http_code}" \
              "$api" || true)
            echo "home snapshot attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              fresh=$(python - <<'PY'
          import base64, json
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              payload=json.loads(Path("/tmp/atlasquant-home-api.json").read_text(encoding="utf-8"))
              obj=json.loads(base64.b64decode(payload.get("content","")).decode("utf-8"))
              generated=str(obj.get("runtime_generated_at") or obj.get("generated_at") or "")
              ts=datetime.fromisoformat(generated.replace("Z","+00:00")).astimezone(timezone.utc)
              age=(datetime.now(timezone.utc)-ts).total_seconds()/60.0
              ok=(
                  obj.get("schema")=="ATLASQUANT_HOME_SNAPSHOT_V1"
                  and bool(obj.get("packs"))
                  and age >= 0
                  and age <= 120
                  and (obj.get("safety") or {}).get("real_orders") is False
                  and (obj.get("safety") or {}).get("automatic_execution") is False
              )
              print("1" if ok else "0")
          except Exception:
              print("0")
          PY
              )
              if [ "$fresh" = "1" ]; then
                echo "Fast Home snapshot: fresh and safe"
                break
              fi
            fi
            sleep 10
          done
          test "$fresh" = "1"

      - name: Open production in desktop and mobile Chromium
        shell: bash
        run: |
          cat > /tmp/atlasquant_browser_smoke.py <<'PY'
          import json
          import os
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          out = Path("browser-smoke")
          out.mkdir(exist_ok=True)

          profiles = {
              "desktop": {"viewport": {"width": 1440, "height": 1000}, "is_mobile": False},
              "mobile": {"viewport": {"width": 390, "height": 844}, "is_mobile": True},
          }
          report = {"url": url, "profiles": {}}
          failures = []

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for name, cfg in profiles.items():
                  if name == "mobile":
                      device = dict(p.devices["Pixel 7"])
                      device["locale"] = "pt-BR"
                      context = browser.new_context(**device)
                  else:
                      context = browser.new_context(
                          viewport=cfg["viewport"],
                          is_mobile=cfg["is_mobile"],
                          device_scale_factor=1,
                      )
                  page = context.new_page()
                  console_errors = []
                  page_errors = []
                  page.on("console", lambda msg: console_errors.append(msg.text) if msg.type == "error" else None)
                  page.on("pageerror", lambda exc: page_errors.append(str(exc)))
                  started = time.perf_counter()
                  status = None
                  status_history = []
                  http_attempts = 0
                  dom_loaded_ms = None
                  app_container_ms = None
                  meaningful_ms = None
                  for attempt in range(1, 6):
                      http_attempts = attempt
                      try:
                          response = page.goto(url, wait_until="domcontentloaded", timeout=180_000)
                          status = response.status if response else None
                          if dom_loaded_ms is None:
                              dom_loaded_ms = round((time.perf_counter()-started)*1000)
                      except Exception:
                          status = None
                      status_history.append(status)
                      if status is not None and status < 500:
                          break
                      page.wait_for_timeout(5_000)

                  try:
                      page.locator('[data-testid="stAppViewContainer"]').wait_for(timeout=90_000)
                      app_container_ms = round((time.perf_counter()-started)*1000)
                  except Exception:
                      pass
                  page.wait_for_timeout(2_000)

                  body_text = ""
                  page_title = ""
                  streamlit_container = 0
                  main_container = 0
                  auth_inputs = 0
                  rendered = False
                  render_attempts = 0
                  for render_attempt in range(1, 7):
                      render_attempts = render_attempt
                      streamlit_container = page.locator('[data-testid="stAppViewContainer"]').count()
                      main_container = page.locator('[data-testid="stMainBlockContainer"]').count()
                      auth_inputs = page.locator('[data-testid="stTextInput"]').count()
                      page_title = page.title()
                      body_text = page.locator("body").inner_text(timeout=30_000)
                      rendered = (
                          "AtlasQuant" in page_title
                          or "AtlasQuant" in body_text
                          or auth_inputs >= 1
                      ) and streamlit_container >= 1 and main_container >= 1
                      meaningful = (
                          "Radar de Oportunidades" in body_text
                          or "carregamento rápido por snapshot validado" in body_text
                          or auth_inputs >= 1
                      )
                      if meaningful and meaningful_ms is None:
                          meaningful_ms = round((time.perf_counter()-started)*1000)
                      if rendered and meaningful:
                          break
                      if render_attempt in (2, 4):
                          try:
                              reload_response = page.reload(wait_until="domcontentloaded", timeout=180_000)
                              if reload_response is not None:
                                  status = reload_response.status
                                  status_history.append(status)
                          except Exception:
                              status_history.append(None)
                      page.wait_for_timeout(5_000)

                  mobile_transition = {"attempted": False, "advanced": False, "decision": False, "radar_back": False}
                  if name == "mobile" and auth_inputs < 1 and "Radar de Oportunidades" in body_text:
                      mobile_transition["attempted"] = True
                      try:
                          advanced = page.get_by_text("Avançado", exact=True)
                          if advanced.count():
                              advanced.first.click()
                              page.get_by_text("Área avançada", exact=True).wait_for(timeout=120_000)
                              mobile_transition["advanced"] = True
                              nav = page.locator('[data-testid="stSelectbox"]').filter(has_text="Área avançada").first
                              combo = nav.get_by_role("combobox")
                              combo.click()
                              page.get_by_role("option", name="⚡ Decisão", exact=True).click()
                              page.wait_for_timeout(1_500)
                              mobile_transition["decision"] = True
                              nav = page.locator('[data-testid="stSelectbox"]').filter(has_text="Área avançada").first
                              combo = nav.get_by_role("combobox")
                              combo.click()
                              page.get_by_role("option", name="🎯 Radar", exact=True).click()
                              page.wait_for_timeout(1_500)
                              mobile_transition["radar_back"] = "Radar de Oportunidades" in page.locator("body").inner_text(timeout=30_000)
                          body_text = page.locator("body").inner_text(timeout=30_000)
                      except Exception as exc:
                          page_errors.append(f"mobile-transition: {type(exc).__name__}: {exc}")

                  exception_count = page.locator('[data-testid="stException"]').count()
                  viewport_width = page.evaluate("window.innerWidth")
                  document_width = page.evaluate("document.documentElement.scrollWidth")
                  horizontal_overflow = max(0, int(document_width) - int(viewport_width))
                  screenshot = out / f"{name}.png"
                  page.screenshot(path=str(screenshot), full_page=False)

                  fast_snapshot_shell = "carregamento rápido por snapshot validado" in body_text
                  radar_visible = "Radar de Oportunidades" in body_text
                  meaningful = bool(radar_visible or fast_snapshot_shell or auth_inputs >= 1)

                  info = {
                      "http_status": status,
                      "http_attempts": http_attempts,
                      "http_status_history": status_history,
                      "render_attempts": render_attempts,
                      "dom_loaded_ms": dom_loaded_ms,
                      "app_container_ms": app_container_ms,
                      "meaningful_content_ms": meaningful_ms,
                      "fast_snapshot_shell": fast_snapshot_shell,
                      "radar_visible": radar_visible,
                      "meaningful": meaningful,
                      "title": page_title,
                      "body_chars": len(body_text),
                      "streamlit_container": streamlit_container,
                      "main_container": main_container,
                      "auth_inputs": auth_inputs,
                      "streamlit_exceptions": exception_count,
                      "viewport_width": viewport_width,
                      "document_width": document_width,
                      "horizontal_overflow_px": horizontal_overflow,
                      "console_errors": console_errors[-10:],
                      "page_errors": page_errors[-10:],
                      "mobile_transition": mobile_transition,
                      "screenshot": str(screenshot),
                  }
                  report["profiles"][name] = info

                  if status is None or status >= 400:
                      failures.append(f"{name}: HTTP {status}")
                  if streamlit_container < 1:
                      failures.append(f"{name}: Streamlit container ausente")
                  if not rendered:
                      failures.append(f"{name}: AtlasQuant/login não terminou de renderizar")
                  if not meaningful:
                      failures.append(f"{name}: conteúdo útil não apareceu (Radar/Fast Home/login ausentes)")
                  if auth_inputs < 1 and not (radar_visible or fast_snapshot_shell):
                      failures.append(f"{name}: produção carregou Streamlit, mas não abriu a Home/Radar atual")
                  if meaningful_ms is None:
                      failures.append(f"{name}: tempo até conteúdo útil não foi medido")
                  elif auth_inputs < 1 and meaningful_ms > 30000:
                      failures.append(f"{name}: Home/Radar demorou {meaningful_ms}ms (>30000ms) após warm-up")
                  if exception_count:
                      failures.append(f"{name}: {exception_count} stException")
                  if page_errors:
                      failures.append(f"{name}: {len(page_errors)} pageerror")
                  if name == "mobile" and mobile_transition["attempted"] and not all(
                      mobile_transition.get(key, False) for key in ("advanced", "decision", "radar_back")
                  ):
                      failures.append(f"{name}: transição móvel Iniciante→Avançado→Decisão→Radar incompleta")
                  if "NotFoundError" in body_text or "removeChild" in body_text:
                      failures.append(f"{name}: erro DOM NotFoundError/removeChild visível")
                  if horizontal_overflow > 8:
                      failures.append(f"{name}: overflow horizontal {horizontal_overflow}px")

                  context.close()
              browser.close()

          (out / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if failures:
              raise SystemExit(" | ".join(failures))
          PY
          python /tmp/atlasquant_browser_smoke.py

      - name: Browser smoke summary
        if: always()
        shell: bash
        run: |
          echo "## AtlasQuant browser smoke" >> "$GITHUB_STEP_SUMMARY"
          if [ -f browser-smoke/report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat browser-smoke/report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatorio nao foi gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atlasquant-production-browser-smoke
          path: browser-smoke/
          if-no-files-found: warn
          retention-days: 14