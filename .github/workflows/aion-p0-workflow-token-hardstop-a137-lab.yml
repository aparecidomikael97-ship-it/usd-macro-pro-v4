name: AION P0 A137 LAB Workflow Credential Surface (NO-GO)
on:
  push:
    branches:
      - lab/aion-p0-workflow-credential-schedule-hardstop-20261021
permissions:
  contents: read
jobs:
  readonly-lab:
    name: A137 offline workflow guards - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AION_LAB_MODE: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: A137 synthetic and repository static tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_workflow_token_hardstop_a137_lab.py -v
      - name: Enforce hardstop of four write-capable jobs
        run: python -B tools/aion_p0_workflow_credential_surface_a137.py --enforce
