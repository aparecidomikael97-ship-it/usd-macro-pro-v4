name: AION Composite Shadow Remote Fail-Closed Reconciliation

on:
  pull_request:
    branches:
      - audit/aion-composite-calendar-voice-failclosed-reconciliation-20261011
    paths:
      - "test_atlasquant_shadow_store.py"
      - "test_atlasquant_shadow_persistence.py"
      - ".github/workflows/aion-composite-shadow-failclosed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow-no-egress:
    name: Shadow local pure functions + remote writer hard deny / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete Shadow store and persistence regression modules
        run: python -B -m unittest -v test_atlasquant_shadow_store test_atlasquant_shadow_persistence
      - name: Reassert private-read gate and tenant quarantine
        run: python -B -m unittest -v test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1
