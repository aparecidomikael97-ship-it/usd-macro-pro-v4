name: AION Windows Immutable Evidence Receipt Persistence V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py"
      - "tests/test_atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py"
      - "docs/aion/AION_WINDOWS_IMMUTABLE_EVIDENCE_RECEIPT_PERSISTENCE_V1.md"
      - ".github/workflows/aion-windows-immutable-evidence-receipt-persistence-v1.yml"

permissions:
  contents: read

jobs:
  windows-immutable-evidence-receipt-persistence-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.12"

      - name: Prepare exact crypto dependency
        run: |
          python -m pip install --disable-pip-version-check "pip==26.2.1" "cryptography==50.0.2"
          python - <<'PY'
          import sys
          import cryptography
          assert sys.version_info[:3] == (3, 12, 12), sys.version
          assert cryptography.__version__ == "50.0.2", cryptography.__version__
          PY

      - name: Compile evidence persistence contract
        run: |
          python -m py_compile \
            atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py \
            tests/test_atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py

      - name: Run evidence persistence contract tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py'

      - name: Assert persistence layer remains design-only and non-writing
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_windows_immutable_evidence_receipt_persistence_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import sqlite3",
              "from sqlite3",
              "import subprocess",
              "from subprocess",
              "import socket",
              "import requests",
              "from requests",
              "urllib.request",
              "import httpx",
              "win32file",
              "win32api",
              "winreg",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          forbidden_live_material = (
              "api.github.com",
              "GITHUB_TOKEN",
              "GH_TOKEN",
          )
          for marker in forbidden_live_material:
              assert marker not in source, marker

          required = (
              '"append_only_required": True',
              '"compare_and_set_required": True',
              '"exactly_once_required": True',
              '"single_writer_commit_required": True',
              '"read_after_write_required": True',
              '"reopen_consistency_required": True',
              '"same_identity_same_digest_is_idempotent": True',
              '"same_identity_different_digest_is_conflict": True',
              '"evidence_delete_allowed": False',
              '"evidence_replace_allowed": False',
              '"evidence_reorder_allowed": False',
              '"chain_truncate_allowed": False',
              '"receipt_delete_allowed": False',
              '"receipt_replace_allowed": False',
              '"receipt_rewrite_allowed": False',
              '"receipt_revision_increment_allowed": False',
              '"evidence_chain_mutation_after_receipt_allowed": False',
              '"caller_persistence_verification_is_authority": False',
              '"document_digest_is_persistence_proof": False',
              '"store_opened": False',
              '"database_opened": False',
              '"transaction_started": False',
              '"cas_attempted": False',
              '"cas_succeeded": False',
              '"writer_implemented": False',
              '"writer_executed": False',
              '"record_written": False',
              '"evidence_persisted": False',
              '"verification_receipt_issued": False',
              '"verification_receipt_signed": False',
              '"verification_receipt_persisted": False',
              '"read_after_write_verified": False',
              '"reopen_verified": False',
              '"crash_recovery_verified": False',
              '"physical_persistence_verified": False',
              '"physical_proof_verified": False',
              '"windows_sandbox_verified": False',
              '"build_authorized": False',
              '"build_started": False',
              '"package_built": False',
              '"package_installed": False',
              '"process_spawned": False',
              '"filesystem_modified": False',
              '"network_called": False',
              '"github_api_called": False',
              '"live_repository_mutation_authorized": False',
              '"live_repository_mutation_performed": False',
              '"production_repository_mutation_performed": False',
              '"deploy_executed": False',
              '"worker_activated": False',
              '"provider_activated": False',
              '"production_persistence_activated": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
