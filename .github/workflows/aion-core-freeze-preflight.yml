name: AION Core Freeze Preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_core_certification.py"
      - "atlasquant_aion_core_completion_review.py"
      - "atlasquant_aion_core_freeze_preflight.py"
      - "atlasquant_aion_checkpoint_master.py"
      - "atlasquant_aion_trust_root.py"
      - "test_atlasquant_aion_v220_core_certification.py"
      - "test_atlasquant_aion_v221_core_completion_review.py"
      - "test_atlasquant_aion_v222_core_freeze_preflight.py"
      - "docs/aion/AION_V222_CORE_FREEZE_PREFLIGHT.md"
      - "docs/adr/ADR-0021-core-freeze-preflight-binds-checkpoint.md"
      - ".github/workflows/aion-core-freeze-preflight.yml"

permissions:
  contents: read

concurrency:
  group: aion-core-freeze-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze-preflight:
    name: V2.22 Core Freeze ceremony preflight and TOCTOU guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install deterministic preflight dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Compile V2.20-V2.22 decision chain
        run: |
          python -m py_compile \
            atlasquant_aion_trust_root.py \
            atlasquant_aion_checkpoint_master.py \
            atlasquant_aion_core_certification.py \
            atlasquant_aion_core_completion_review.py \
            atlasquant_aion_core_freeze_preflight.py \
            test_atlasquant_aion_v220_core_certification.py \
            test_atlasquant_aion_v221_core_completion_review.py \
            test_atlasquant_aion_v222_core_freeze_preflight.py

      - name: Run V2.22 Core Freeze preflight red-team
        run: |
          python -m pytest -q -s test_atlasquant_aion_v222_core_freeze_preflight.py

      - name: Re-run V2.21 Core Completion Review
        run: |
          python -m pytest -q -s test_atlasquant_aion_v221_core_completion_review.py

      - name: Re-run V2.20 Core Certification
        run: |
          python -m pytest -q -s test_atlasquant_aion_v220_core_certification.py

      - name: Re-run Checkpoint Mestre safety contracts
        run: |
          python -m pytest -q -s \
            test_atlasquant_aion_core_v23_memory_checkpoint.py \
            test_atlasquant_aion_core_checkpoint_bridge.py
