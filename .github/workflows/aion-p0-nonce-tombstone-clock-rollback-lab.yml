name: AION P0 LAB Nonce Tombstone Time Rollback and Owner Replay (NO-GO)

on:
  push:
    branches: [lab/aion-p0-nonce-retention-clock-rollback-20261020]

permissions:
  contents: read

jobs:
  nonce_retention:
    name: Historical nonce retention and clock rollback - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 36
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install fixed dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Fourteen signed owner nonce tombstone and clock rollback tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_nonce_tombstone_clock_rollback_lab.py -v
      - name: Sixteen schema and concurrent startup safety tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_nonce_schema_startup_downgrade_lab.py -v
      - name: Fourteen signature canonicality and SQLite restore negative tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_owner_signature_canonical_nonce_restore_lab.py -v
      - name: Thirty original owner ceremony V224 regression tests
        run: python -m pytest -q test_atlasquant_aion_v224_owner_signature_ceremony.py
      - name: Fifty five owner V225 V226 persistence regression tests
        run: python -m pytest -q test_atlasquant_aion_v225_explicit_owner_decision_record.py test_atlasquant_aion_v226_owner_decision_persistence_attestation.py
      - name: Sixty four H0 A79 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
