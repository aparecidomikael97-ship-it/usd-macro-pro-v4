name: AION P0 LAB Dual PR Cross Review 1331 1333 (NO-GO offline)

on:
  push:
    branches: [lab/aion-p0-budget-dual-pr-cross-review-20261020]

permissions:
  contents: read

jobs:
  candidate_contract_checks:
    name: Budget input denial candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: Canonical budget-only tests (not complete Quality)
        run: python -B -m unittest -v test_atlasquant_aion_cumulative_authority_budget
      - name: Existing LAB budget and Saga trust regression
        run: python -B -m unittest -v test_aion_p0_budget_saga_trust_boundary_lab
      - name: PR 1331 budget schema parity regression
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_guard_schema_parity_lab.py -v
      - name: Previous adversarial budget consumer regression
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_guard_independent_review_lab.py -v
      - name: Normative non-Mapping input denial and hostile Mapping test
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_input_contract_observation_lab.py -v
      - name: Independent combined-PR budget contract and consumer cases (14)
        run: python -B -m unittest discover -s tests -p test_aion_p0_dual_pr_cross_review_lab.py -v
      - name: Original canonical Outbox negative producer / CAS selections (5)
        run: |
          python -B -m unittest -v \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_no_enrolled_producer_must_block_before_adapter_send \
            test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests.test_self_attested_adapter_enrollment_cannot_enable_send \
            test_atlasquant_aion_execution_outbox.ExecutionOutboxTests.test_cross_scope_cannot_read_or_claim_foreign_intent \
            test_atlasquant_aion_execution_outbox.OutboxPostSendStateCASP0Tests.test_confirm_rejects_claimed_without_send \
            test_atlasquant_aion_execution_outbox.OutboxStaleStateBlockCASP0Tests.test_late_revocation_cannot_revoke_reclaimed_claim
      - name: Original canonical Saga independent effect boundary selections (3)
        run: |
          python -B -m unittest -v \
            test_atlasquant_aion_execution_saga.ExecutionSagaTests.test_a38_local_sql_confirmed_cannot_supply_external_producer_receipt \
            test_atlasquant_aion_execution_saga.ExecutionSagaTests.test_a43_valid_local_chain_never_claims_external_authority \
            test_atlasquant_aion_execution_saga.ExecutionSagaTests.test_saga_plan_rejects_critical_capability_and_over_budget_shape
      - name: Owner-thread original LAB budget contracts
        run: python -B -m unittest -v test_aion_p0_sqlite_authority_budget_owner_thread_lab
