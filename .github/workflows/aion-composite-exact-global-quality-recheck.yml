name: AION Composite Exact Global Quality Recheck

on:
  pull_request:
    branches:
      - audit/aion-admin-research-private-denial-regression-20261011
    paths:
      - ".github/workflows/aion-composite-exact-global-quality-recheck.yml"
      - ".github/scripts/aion_run_exact_quality_step.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complete-quality:
    name: Exact official Quality scripts / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install official Quality dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Compile all Python sources
        run: python -m compileall -q .
      - name: Run official root unittest Quality block verbatim
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
      - name: Run official reference UI and real-browser Quality block
        if: always()
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run reference interface contracts and actual browser checks"
      - name: Run official AION chat and unified runtime Quality block
        if: always()
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run AION chat and unified runtime contracts in isolated process"
