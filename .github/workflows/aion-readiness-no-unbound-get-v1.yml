name: AION Readiness No Unbound GitHub GET V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_global_worker_readiness.py"
      - "test_atlasquant_aion_global_worker_readiness_no_get_v1.py"
      - "test_atlasquant_aion_global_worker_readiness_source_gate_v1.py"
      - "docs/aion/AION_SOURCE_TRUST_PROVIDER_SELECTION_20261010.md"
      - ".github/workflows/aion-readiness-no-unbound-get-v1.yml"

permissions:
  contents: read

jobs:
  no-untrusted-checkpoint-get:
    name: No untrusted checkpoint read / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile readiness and independent-source tests
        run: python -B -m py_compile atlasquant_aion_global_worker_readiness.py atlasquant_aion_global_worker_source_gate_v1.py test_atlasquant_aion_global_worker_readiness_no_get_v1.py
      - name: Verify real CLI no GET/token, NO-GO and runtime source posture
        run: python -B -m unittest test_atlasquant_aion_global_worker_readiness_no_get_v1.py test_atlasquant_aion_global_worker_readiness_source_gate_v1.py -v
