name: AION Local Action Audit Receipt V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_local_action_audit_receipt_v1.py"
      - "tests/test_atlasquant_aion_local_action_audit_receipt_v1.py"
      - "docs/aion/AION_LOCAL_ACTION_AUDIT_RECEIPT_V1.md"
      - ".github/workflows/aion-local-action-audit-receipt-v1.yml"

permissions:
  contents: read

jobs:
  local-action-audit-receipt-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile audit receipt contract
        run: |
          python -m py_compile \
            atlasquant_aion_local_action_audit_receipt_v1.py \
            tests/test_atlasquant_aion_local_action_audit_receipt_v1.py

      - name: Run audit receipt tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_local_action_audit_receipt_v1.py'

      - name: Assert evidence-only boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_local_action_audit_receipt_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import os",
              "from os ",
              "import socket",
              "import requests",
              "urllib.request",
              "psutil",
              "win32api",
              "win32com",
              "ctypes",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"CONFIRMED_SUCCESS"',
              '"CONFIRMED_PARTIAL"',
              '"CONFIRMED_TERMINAL_FAILURE"',
              '"OUTCOME_UNKNOWN"',
              '"automatic_retry_allowed": False',
              '"automatic_reconciliation_allowed": False',
              '"new_attempt_requires_fresh_owner_command": True',
              '"new_attempt_requires_new_nonce": True',
              '"receipt_persisted": False',
              '"receipt_signed_by_this_module": False',
              '"raw_process_output_included": False',
              '"executable_material_included": False',
              '"credential_material_included": False',
              '"receipt_builder_executed_action": False',
              '"external_action_executed_by_this_module": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
