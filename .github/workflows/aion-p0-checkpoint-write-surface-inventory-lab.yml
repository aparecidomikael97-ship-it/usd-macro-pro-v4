name: AION P0 LAB Checkpoint Write Surface Inventory (NO-GO)

on:
  push:
    branches:
      - lab/aion-p0-checkpoint-write-surface-inventory-20261021

permissions:
  contents: read

jobs:
  static-audit:
    name: Read-only source AST audit - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
      AION_LAB_MODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Synthetic AST detector regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_checkpoint_write_surface_ast_lab.py -v
      - name: Scan repository production Python and ENFORCE A135 writer fence
        run: python -B tools/aion_p0_checkpoint_write_surface_audit.py --enforce
