name: AION A259 Synthetic Callback Isolation HARD NO-GO Lab

on:
  pull_request:
    paths:
      - atlasquant_aion_execution_outbox.py
      - labs/a259_synthetic_outbox_fixture.py
      - test_atlasquant_aion_execution_outbox.py
      - labs/test_a202_outbox_dispatch_atomic_cas.py
      - labs/test_a203_outbox_stale_revocation_cas.py
      - labs/test_a206_late_send_outcome_cas.py
      - labs/test_a241_outbox_store_binding.py
      - labs/test_a242_first_attempt_guard.py
      - labs/test_a243_signed_first_attempt.py
      - labs/test_a258_external_proof_admission.py
      - labs/test_a259_synthetic_callback_isolation.py
      - docs/lab/aion_a259_synthetic_callback_isolation.md
      - .github/workflows/aion-a259-synthetic-callback-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-isolation:
    name: A259 normal Outbox NO-SEND and synthetic LAB (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.32.3
      - name: A259 production constructor refusal and prior LAB regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          test_atlasquant_aion_execution_outbox
          labs.test_a259_synthetic_callback_isolation
          labs.test_a258_external_proof_admission
          labs.test_a257_monotonic_origin_gate
          labs.test_a256_one_time_challenge_lab
          labs.test_a255_two_party_reservation_binding
          labs.test_a254_synthetic_origin_event_identity
          labs.test_a243_signed_first_attempt
          labs.test_a253_wal_checkpoint_coordination
          labs.test_a252_coordinated_backup
          labs.test_a251_all_staged_chat_writers_fenced
          labs.test_a250_conversation_commit_fence
          labs.test_a249_lock_path_identity
          labs.test_a248_cross_process_message_lock
          labs.test_a247_commit_pending_restart_veto
          labs.test_a246_chat_commit_uncertainty
          labs.test_a245_sqlite_connect_path_fence
          labs.test_a240_sqlite_pathname_fence
          labs.test_a241_outbox_store_binding
          labs.test_a242_first_attempt_guard
          labs.test_a233_native_sqlite_p0_repro
          test_atlasquant_aion_chat_staged_runtime_resilience
