name: A301 evidence-bound SQLite recovery contract LAB

on:
  pull_request:
    paths:
      - 'labs/a301_recovery_evidence_contract_lab.py'
      - 'labs/test_a301_recovery_evidence_contract_lab.py'
      - 'docs/lab/aion_a301_recovery_evidence_contract_lab.md'
      - '.github/workflows/aion-a301-recovery-evidence-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-contract:
    name: A301 recovery evidence — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A301 strict contract and A300 A299 A293 A292 regressions
        run: |
          python -m unittest -v labs.test_a301_recovery_evidence_contract_lab labs.test_a300_cold_restart_sqlite_recovery_lab labs.test_a299_sqlite_native_p0_5_6_gap_lab labs.test_a293_host_sqlite_boundary_lab labs.test_a292_staged_chat_write_inventory_lab
