name: AION B2B Pilot Checkpoint Writer Attestation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py"
      - "test_atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py"
      - "atlasquant_aion_b2b_pilot_owner_decision_persistence_attestation.py"
      - "docs/aion/AION_B2B_PILOT_CHECKPOINT_WRITER_ATTESTATION_V1.md"
      - ".github/workflows/aion-b2b-pilot-checkpoint-writer-attestation.yml"

permissions:
  contents: read

jobs:
  writer-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile writer attestation chain
        run: |
          python -m py_compile \
            atlasquant_aion_trust_root.py \
            atlasquant_aion_nonce_registry.py \
            atlasquant_aion_b2b_pilot_owner_decision_persistence_attestation.py \
            atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py \
            test_atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py
      - name: Run writer and persistence attestation tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py \
            test_atlasquant_aion_b2b_pilot_owner_decision_persistence_attestation.py
      - name: Assert no write or activation authority
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_b2b_pilot_checkpoint_writer_attestation.py").read_text(encoding="utf-8")
          for marker in (
              '"writer_identity_verified": True',
              '"writer_authority_verified": True',
              '"receipt_binding_verified": True',
              '"pilot_activation_authorized": False',
              '"pilot_activated": False',
              '"checkpoint_write_performed": False',
              '"customer_contact_authorized": False',
              '"billing_authorized": False',
              '"deploy_authorized": False',
              '"production_mutation_authorized": False',
              '"executes_action": False',
          ):
              assert marker in source, marker
          for banned in (
              "append_checkpoint_patch(",
              "save_runtime_checkpoint(",
              "requests.post(",
              "requests.put(",
              "subprocess.",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
