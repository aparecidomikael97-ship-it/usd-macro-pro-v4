name: AION Owner Stack Merge Ceremony Dry Run V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py"
      - "tests/test_atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py"
      - "docs/aion/AION_OWNER_STACK_MERGE_CEREMONY_DRY_RUN_V1.md"
      - ".github/workflows/aion-owner-stack-merge-ceremony-dry-run-v1.yml"

permissions:
  contents: read

jobs:
  owner-stack-merge-ceremony-dry-run-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile dry-run ceremony contract
        run: |
          python -m py_compile \
            atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py \
            tests/test_atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py

      - name: Run dry-run ceremony tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py'

      - name: Assert zero repository mutation authority
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_owner_stack_merge_ceremony_dry_run_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import git",
              "from git",
              "import requests",
              "urllib.request",
              "import socket",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"synthetic_only": True',
              '"virtual_shas_are_not_git_objects": True',
              '"real_owner_authorization_used": False',
              '"repository_mutation_performed": False',
              '"actual_merge_executed": False',
              '"actual_retarget_executed": False',
              '"actual_rebase_executed": False',
              '"actual_revert_executed": False',
              '"merge_authorized": False',
              '"retarget_authorized": False',
              '"rebase_authorized": False',
              '"revert_authorized": False',
              '"deploy_authorized": False',
              '"worker_activation_authorized": False',
              '"provider_activation_authorized": False',
              '"external_action_executed": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
