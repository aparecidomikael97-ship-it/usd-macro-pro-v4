name: AION P0 Owner Signed Enrollment Proof LAB (READ ONLY)

on:
  push:
    branches: [lab/aion-p0-owner-attested-bootstrap-20261019]
    paths:
      - "atlasquant_aion_p0_signed_enrollment_proof_lab.py"
      - "test_atlasquant_aion_p0_signed_enrollment_proof_lab.py"
      - ".github/workflows/aion-p0-owner-signed-enrollment-lab.yml"

permissions:
  contents: read

jobs:
  cryptographic_owner_enrollment_lab:
    name: P0 signed enrollment 39 + 102 controls (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Assert untouched A118 cryptographic and activation guard blobs
        shell: bash
        run: |
          set -euo pipefail
          check_blob() {
            actual="$(git hash-object "$1")"
            test "$actual" = "$2" || { echo "A118_DRIFT $1"; exit 1; }
          }
          check_blob atlasquant_aion_owner_signature_ceremony.py eac8091ed9c80d838e069b16130c65530bde6652
          check_blob atlasquant_aion_owner_decision_record.py 2d0ae10f33dc4a4cafdc0241074829a7a4d97b57
          check_blob atlasquant_aion_trust_root.py 2d3b102893303751b2faf9a34b069ffb387ebce0
          check_blob atlasquant_aion_global_worker_activation.py df43bb4371c784396069f4ede51205b0aa19cc0a
          echo "P0_SIGNED_ENROLLMENT_A118_ORIGINAL_BLOBS_MATCH"
      - name: Install tracked Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Run 39 new signed-enrollment adversarial LAB cases
        run: |
          python -B -m pytest -q test_atlasquant_aion_p0_signed_enrollment_proof_lab.py
      - name: Run 27 prior deny-only enrollment contract cases
        run: |
          python -B -m pytest -q test_atlasquant_aion_p0_owner_enrollment_intake_lab.py
      - name: Run 69 original owner and negative regression cases
        run: |
          python -B -m pytest -q test_atlasquant_aion_v224_owner_signature_ceremony.py test_atlasquant_aion_v225_explicit_owner_decision_record.py test_aion_p0_owner_root_custody_lab.py
      - name: Run six unchanged A74 activation authority hard stops
        run: |
          python -B -m unittest -v test_atlasquant_aion_activation_authority_a74
