name: AION Repository Mutation Terminal Audit Certificate V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py"
      - "tests/test_atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py"
      - "docs/aion/AION_REPOSITORY_MUTATION_TERMINAL_AUDIT_CERTIFICATE_V1.md"
      - ".github/workflows/aion-repository-mutation-terminal-audit-certificate-v1.yml"

permissions:
  contents: read

jobs:
  repository-mutation-terminal-audit-certificate-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile repository mutation terminal audit certificate
        run: |
          python -m py_compile \
            atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py \
            tests/test_atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py

      - name: Run repository mutation terminal audit certificate tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py'

      - name: Assert certificate is read-only evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_repository_mutation_terminal_audit_certificate_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import git",
              "from git",
              "import requests",
              "urllib.request",
              "import socket",
              "import httpx",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"certificate_is_execution_authorization": False',
              '"certificate_authorizes_retry": False',
              '"certificate_authorizes_reopen": False',
              '"certificate_authorizes_new_attempt": False',
              '"certificate_authorizes_repository_mutation": False',
              '"certificate_persisted_by_this_module": False',
              '"github_queried_by_this_module": False',
              '"github_api_called_by_this_module": False',
              '"network_called_by_this_module": False',
              '"repository_mutation_performed": False',
              '"merge_executed": False',
              '"retarget_executed": False',
              '"draft_transition_executed": False',
              '"branch_deleted": False',
              '"deploy_executed": False',
              '"worker_activated": False',
              '"provider_activated": False',
              '"production_persistence_activated": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
