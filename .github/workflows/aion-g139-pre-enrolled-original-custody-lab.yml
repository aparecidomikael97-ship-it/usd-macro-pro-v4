# G139 is synthetic pre-enrollment + fake custody, NOT independent identity.
name: AION G139 pre-enrolled original dual-root custody contract NOT P0
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g139-two-role-root-lab:
    name: G139 preenrollment plus custody original chain / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install unchanged project requirements
        shell: bash
        run: |
          set -o pipefail
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run 18 adversarial pre-enrollment, custody and bypass cases
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g139_pre_enrolled_original_lab 2>&1 | tee g139.log
          grep -F 'Ran 18 tests' g139.log
          grep -Fx 'OK' g139.log
          grep -F 'G139_PRIOR_ENROLLMENT_AND_DISTINCT_CUSTODY_SIGNATURES=LAB_ONLY_NO_SEND' g139.log
          grep -F 'G139_MISSING_PRE_ENROLLMENT=DENY_NO_TRUST_ON_FIRST_USE' g139.log
          grep -F 'G139_STALE_PRE_ENROLLMENT_SEQUENCE=DENIED_LOCAL_FLOOR_ONLY' g139.log
          grep -F 'G139_CUSTODY_ACK_LOSS=UNCERTAIN_ZERO_AUTO_RESEND_LAB' g139.log
          grep -F 'G139_JOINT_SELF_REPIN_ENROLLMENT_AND_CUSTODY=FAKE_FIRST_ADMITTED_RED_NOT_P0' g139.log
          grep -F 'G139_DIRECT_LOCAL_G137_TICKET_WITHOUT_ENROLLMENT=STAGE_BYPASS_RED_NO_SEND' g139.log
