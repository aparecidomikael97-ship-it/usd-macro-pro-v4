name: AION A262 Publication Route HARD NO-GO LAB

on:
  pull_request:
    paths:
      - .github/workflows/render-deploy-control.yml
      - labs/a262_publication_surface_hard_stop.py
      - labs/test_a262_publication_surface_hard_stop.py
      - docs/lab/aion_a262_render_deploy_paths_hard_stop.md
      - .github/workflows/aion-a262-publication-route-hard-stop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-release:
    name: A262 audit only, NEVER deploy (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout pinned code (never Render)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install offline test-only dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.32.3 PyYAML==6.0.2
      - name: Inspect deploy hook hard-stop and prior no-send regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a262_publication_surface_hard_stop
          labs.test_a261_offline_release_preflight
          labs.test_a260_offline_runtime_bundle
          labs.test_a259_synthetic_callback_isolation
          labs.test_a258_external_proof_admission
          labs.test_a257_monotonic_origin_gate
          labs.test_a256_one_time_challenge_lab
          labs.test_a255_two_party_reservation_binding
          labs.test_a254_synthetic_origin_event_identity
          labs.test_a243_signed_first_attempt
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign
