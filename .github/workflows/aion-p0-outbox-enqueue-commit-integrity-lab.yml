name: AION P0 LAB Outbox Enqueue Atomic Integrity (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-enqueue-commit-integrity-atomic-20261021]

permissions:
  contents: read

jobs:
  atomic_integrity:
    name: Real SQLite Outbox/Saga post-insert integrity - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: 15 post-insert atomicity tests Outbox and Saga
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_enqueue_commit_integrity_lab.py -v
      - name: 16 expired-lease integrity fence
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_expired_lease_integrity_fence_lab.py -v
      - name: 26 Outbox decision quarantine and callback denial
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_read_integrity_hardstop_lab.py -v
      - name: 9 parent-transaction hardstops
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_parent_transaction_denial_lab.py -v
      - name: 9 Saga atomic staging CAS
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_atomic_scoped_stage_cas_lab.py -v
      - name: 12 Saga scoped helpers
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: 16 Saga Outbox internal state
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: 11 Outbox cross scope SQL
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: 44 real SQLite Outbox rollback triage
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 64 H0 A79 fail-closed causal denials
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
