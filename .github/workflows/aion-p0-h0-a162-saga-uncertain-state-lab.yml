name: AION P0 H0 A162 Saga Uncertain No Downgrade LAB (NO-GO)

on:
  push:
    branches: [lab/aion-p0-a162-saga-uncertain-state-no-downgrade-20261022]

permissions:
  contents: read

jobs:
  saga_unknown_downgrade_lab:
    name: A162 unknown first effect remains blocked - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependency pins
        run: python -m pip install -r requirements.txt
      - name: Assert resolved dependencies
        run: python -m pip check
      - name: A162 eight SQLite Saga uncertainty downgrade negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_a162_saga_uncertain_downgrade_lab.py -v
      - name: Parent fourteen first-intent reentry controls
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_saga_existing_first_intent_reentry_lab.py -v
      - name: Original H0 A79 fail-closed controls
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
