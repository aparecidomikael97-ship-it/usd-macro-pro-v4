name: AION B2B Durable Dispatch Record Contract V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - design/aion-b2b-pre-dispatch-attestation-contract-v1-20261006
    paths:
      - "atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py"
      - "test_atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py"
      - "docs/aion/AION_B2B_DURABLE_DISPATCH_RECORD_CONTRACT_V1.md"
      - ".github/workflows/aion-b2b-durable-dispatch-record-contract-v1.yml"

permissions:
  contents: read

jobs:
  durable-dispatch-record-contract-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile design contract
        run: |
          python -m py_compile             atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py             test_atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py
      - name: Run durable-dispatch design tests
        run: |
          python -m unittest -q             test_atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py
      - name: Assert no dispatch persistence or external effect
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_b2b_durable_dispatch_record_contract_v1.py").read_text(encoding="utf-8")
          for banned in (
              "DurableExecutionStore(",
              ".prepare(",
              ".acquire_lease(",
              ".record_dispatch_started(",
              ".mark_outcome_unknown(",
              "requests.post(",
              "requests.put(",
              "httpx.post(",
              "socket.socket(",
              "subprocess.Popen(",
              "subprocess.run(",
              "call_provider(",
              "send_whatsapp(",
              "send_email(",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          for marker in (
              '"READY_FOR_DURABLE_DISPATCH_RECORD_DESIGN_REVIEW"',
              '"DESIGN_EXTERNAL_EFFECT_CALL_BOUNDARY_CONTRACT_ONLY"',
              'CORE_DISPATCH_STATE = "DISPATCH_RECORDED"',
              'CORE_UNKNOWN_STATE = "OUTCOME_UNKNOWN"',
              '"dispatch_recorded"',
          ):
              assert marker in source, marker
          PY
