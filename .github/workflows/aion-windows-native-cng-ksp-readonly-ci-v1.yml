name: AION Windows Native CNG Platform KSP Read-Only CI V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py"
      - "tests/test_atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py"
      - "docs/aion/AION_WINDOWS_NATIVE_CNG_KSP_READONLY_CAPABILITY_V1.md"
      - ".github/workflows/aion-windows-native-cng-ksp-readonly-ci-v1.yml"

permissions:
  contents: read

jobs:
  native-platform-provider-readonly:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Disposable PR-only context
        run: |
          python - <<'PY'
          import os
          assert os.getenv("GITHUB_EVENT_NAME") == "pull_request"
          assert os.getenv("GITHUB_ACTIONS") == "true"
          assert os.getenv("RUNNER_OS") in ("Windows", "Linux")
          PY
      - name: Compile read-only module and test
        run: |
          python -m py_compile \
            atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py \
            tests/test_atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py
      - name: Run adversarial mock and native Windows-only tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py'
      - name: Sanitized Windows-hosted ephemeral runner status
        if: runner.os == 'Windows'
        run: |
          python - <<'PY'
          import json
          import secrets
          from atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1 import (
              probe_platform_ksp_algorithm_support_readonly
          )
          out=probe_platform_ksp_algorithm_support_readonly(secrets.token_hex(32))
          print(json.dumps({
              "state":out["state"], "reason":out["reason"],
              "provider_opened":out["provider_opened"],
              "handle_released":out["provider_handle_released"],
              "algorithm_advertisements":out["algorithm_advertisements"],
              "private_key_created":out["private_key_created"],
              "installer_authorized":out["installer_authorized"],
              "host_security_state_modified":out["host_security_state_modified"],
          },sort_keys=True))
          assert out["private_key_created"] is False
          assert out["installer_authorized"] is False
          assert out["host_security_state_modified"] is False
          PY
      - name: Block unexpected key/registry/network API invocation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path("atlasquant_aion_windows_native_cng_ksp_readonly_capability_v1.py").read_text("utf-8")
          tree=ast.parse(s)
          allowed={"NCryptOpenStorageProvider","NCryptIsAlgSupported","NCryptFreeObject"}
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  assert all(x.name.split(".")[0] not in {"subprocess","socket","winreg",
                      "requests","urllib","httpx","os","pathlib"} for x in node.names)
              if isinstance(node, ast.ImportFrom):
                  assert (node.module or "").split(".")[0] not in {"subprocess","socket",
                      "winreg","requests","urllib","httpx","os","pathlib"}
              if isinstance(node, ast.Attribute) and node.attr.startswith("NCrypt"):
                  assert node.attr in allowed
          assert 'winmode=0x00000800' in s
          for literal in (
              '"private_key_created": False',
              '"private_key_opened": False',
              '"private_key_enrolled": False',
              '"tpm_ed25519_key_custody_verified": False',
              '"p256_tpm_key_custody_verified": False',
              '"installer_authorized": False',
              '"build_authorized": False',
              '"deploy_authorized": False',
              '"safe_to_resume": False',
              '"host_security_state_modified": False',
          ):
              assert literal in s,literal
          PY
