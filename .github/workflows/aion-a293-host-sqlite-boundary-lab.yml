name: A293 host-controlled SQLite boundary LAB

on:
  pull_request:
    paths:
      - 'labs/a293_host_sqlite_boundary_lab.py'
      - 'labs/test_a293_host_sqlite_boundary_lab.py'
      - 'docs/lab/aion_a293_host_sqlite_boundary_lab.md'
      - '.github/workflows/aion-a293-host-sqlite-boundary-lab.yml'
      - 'aion_chat/store.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-lab:
    name: A293 synthetic host-boundary — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A293 host boundary and A292-A290 regression
        run: |
          python -m unittest -v labs.test_a293_host_sqlite_boundary_lab labs.test_a292_staged_chat_write_inventory_lab labs.test_a291_chat_write_gate_commit_fence_lab labs.test_a290_sqlite_local_write_gate_lab
