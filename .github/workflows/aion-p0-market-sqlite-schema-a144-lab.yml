name: AION P0 A144 SQLite Schema RED LAB (NO-GO)
on:
  push:
    branches:
      - lab/aion-p0-market-sqlite-schema-attestation-a144-20261022
permissions:
  contents: read
jobs:
  adversarial-schema:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_LAB_MODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: A144 RED-first schema tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_market_sqlite_schema_attestation_a144_lab.py -v
