name: AION B2B Pilot Activation Execution Preflight

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_pilot_activation_persistence_attestation.py"
      - "atlasquant_aion_b2b_pilot_activation_writer_attestation.py"
      - "atlasquant_aion_b2b_pilot_activation_execution_preflight.py"
      - "test_atlasquant_aion_b2b_pilot_activation_execution_preflight.py"
      - "docs/aion/AION_B2B_PILOT_ACTIVATION_EXECUTION_PREFLIGHT_V1.md"
      - ".github/workflows/aion-b2b-pilot-activation-execution-preflight.yml"

permissions:
  contents: read

jobs:
  activation-execution-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile activation execution preflight chain
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_pilot_activation_persistence_attestation.py \
            atlasquant_aion_b2b_pilot_activation_writer_attestation.py \
            atlasquant_aion_b2b_pilot_activation_execution_preflight.py \
            test_atlasquant_aion_b2b_pilot_activation_execution_preflight.py
      - name: Run execution preflight tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_pilot_activation_execution_preflight.py \
            test_atlasquant_aion_b2b_pilot_activation_writer_attestation.py \
            test_atlasquant_aion_b2b_pilot_activation_persistence_attestation.py
      - name: Assert execution eligibility is not execution
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_b2b_pilot_activation_execution_preflight.py").read_text(encoding="utf-8")
          for marker in (
              '"READY_FOR_ACTIVATION_EXECUTION_CEREMONY"',
              '"human_execution_confirmation_required": True',
              '"execution_request_issued": False',
              '"owner_execution_signature_verified": False',
              '"activation_command_generated": False',
              '"activation_command_executed": False',
              '"pilot_activation_authorized": False',
              '"pilot_activated": False',
              '"provisioning_authorized": False',
              '"deploy_authorized": False',
              '"executes_action": False',
          ):
              assert marker in source, marker
          for banned in (
              "append_checkpoint_patch(",
              "save_runtime_checkpoint(",
              "requests.post(",
              "requests.put(",
              "subprocess.",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
