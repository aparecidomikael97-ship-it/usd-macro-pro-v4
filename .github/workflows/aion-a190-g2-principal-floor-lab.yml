name: A190 G2 Separate OS Principal Floor LAB (Ubuntu Only)
on:
  pull_request:
    paths:
      - 'labs/a190/principal_floor_g2_lab.py'
      - '.github/workflows/aion-a190-g2-principal-floor-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g2-unprivileged-app-vs-custodian-then-root-counterexample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Real UIDs and two local files under different owners
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin a190g2custodian
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin a190g2app
            echo "A190_G2_CUSTODIAN_UID=$(id -u a190g2custodian)"
            echo "A190_G2_APP_UID=$(id -u a190g2app)"
            test "$(id -u a190g2custodian)" != "$(id -u a190g2app)"
            probe_file="$(mktemp -p /tmp a190g2_probe_XXXXXX.py)"
            cp labs/a190/principal_floor_g2_lab.py "$probe_file"
            chmod 644 "$probe_file"
            app_dir="$(mktemp -d -p /tmp a190g2_app_XXXXXX)"
            floor_dir="$(mktemp -d -p /tmp a190g2_floor_XXXXXX)"
            sudo chown a190g2app:a190g2app "$app_dir"
            sudo chmod 700 "$app_dir"
            sudo chown a190g2custodian:a190g2custodian "$floor_dir"
            sudo chmod 755 "$floor_dir"
            database="$app_dir/state.sqlite"
            snapshot_db="$app_dir/old.sqlite"
            floor="$floor_dir/floor.json"
            snapshot_floor="$(mktemp -p /tmp a190g2_floor_backup_XXXXXX)"
            sudo -u a190g2app python -B "$probe_file" app-init "$database"
            first="$(sudo -u a190g2app python -B "$probe_file" state "$database")"
            read -r first_seq first_digest <<< "$first"
            test "$first_seq" = "1"
            sudo -u a190g2custodian python -B "$probe_file" publish "$floor" "$first_seq" "$first_digest"
            sudo -u a190g2app python -B "$probe_file" expect-current "$database" "$floor" 1
            sudo -u a190g2app cp "$database" "$snapshot_db"
            cp "$floor" "$snapshot_floor"
            sudo -u a190g2app python -B "$probe_file" app-advance "$database"
            second="$(sudo -u a190g2app python -B "$probe_file" state "$database")"
            read -r second_seq second_digest <<< "$second"
            test "$second_seq" = "2"
            sudo -u a190g2custodian python -B "$probe_file" publish "$floor" "$second_seq" "$second_digest"
            sudo -u a190g2app python -B "$probe_file" expect-current "$database" "$floor" 2
            sudo -u a190g2app cp "$snapshot_db" "$database"
            sudo -u a190g2app python -B "$probe_file" forge "$floor"
            sudo -u a190g2app python -B "$probe_file" expect-stale "$database" "$floor"
            echo 'A190_G2_DIFFERENT_UNPRIVILEGED_UID_CANNOT_ROLLBACK_PROTECTED_FLOOR=OBSERVED'
            # Privileged host attacker can rewrite BOTH files. Deliberate RED.
            sudo cp "$snapshot_floor" "$floor"
            sudo -u a190g2app python -B "$probe_file" expect-current "$database" "$floor" 1
            echo 'A190_G2_HOST_ROOT_JOINT_LOCAL_RESTORE=UNSAFE_READMISSION_REPRODUCED'
            echo 'A190_G2_ORIGINAL_EVENT_AND_REMOTE_MONOTONIC_CUSTODY=NOT_ATTESTED'
          } 2>&1 | tee a190g2_lab.log
          grep -q 'A190_G2_ATTACKER_INPLACE_WRITE=OS_DENIED' a190g2_lab.log
          grep -q 'A190_G2_ATTACKER_SIBLING_REPLACEMENT=OS_DENIED' a190g2_lab.log
          grep -q 'A190_G2_APP_DB_ROLLBACK_VS_SEPARATE_UID_FLOOR=DENIED' a190g2_lab.log
          grep -q 'A190_G2_HOST_ROOT_JOINT_LOCAL_RESTORE=UNSAFE_READMISSION_REPRODUCED' a190g2_lab.log
      - name: State honest G2 boundary
        run: |
          echo 'GREEN = real UID separation plus root bypass reproduced. NOT external custody.'
          echo 'Ubuntu only. Windows G2, WAL/SHM, H0, remote monotonic floor, effects/receipts not tested.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
