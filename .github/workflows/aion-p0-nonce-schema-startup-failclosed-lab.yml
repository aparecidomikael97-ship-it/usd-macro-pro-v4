name: AION P0 LAB Nonce Registry Schema Fail-Closed Startup (NO-GO)

on:
  push:
    branches: [lab/aion-p0-nonce-schema-startup-fail-closed-20261020]

permissions:
  contents: read

jobs:
  nonce_registry_compatibility:
    name: Nonce SQLite downgrade and restart gate - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Fourteen real SQLite nonce registry startup/migration tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_nonce_schema_startup_downgrade_lab.py -v
      - name: Fourteen Owner V224 signature and restored nonce tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_owner_signature_canonical_nonce_restore_lab.py -v
      - name: Historical owner V224 signature pytest tests
        run: python -m pytest -q test_atlasquant_aion_v224_owner_signature_ceremony.py
      - name: Historical V225 V226 persistent owner decision tests
        run: python -m pytest -q test_atlasquant_aion_v225_explicit_owner_decision_record.py test_atlasquant_aion_v226_owner_decision_persistence_attestation.py
      - name: H0 A79 causal denial
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
