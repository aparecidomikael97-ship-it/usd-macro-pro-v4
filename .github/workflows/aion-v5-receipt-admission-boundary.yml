name: AION V5 Durable Witness Receipt Boundary
on:
  pull_request:
    branches:
      - codex/aion-signed-webauthn-anchors-v4-offline-20261011
    paths:
      - "atlasquant_aion_first_install_preparation_v5/**"
      - "tests/test_aion_v5_*.py"
      - "docs/aion/AION_V5_DURABLE_RECEIPT_BOUNDARY_20261011.md"
      - ".github/workflows/aion-v5-receipt-admission-boundary.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v5-offline:
    name: V5 receipt replay and epoch candidate / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install pinned offline fixture dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --no-deps --require-hashes -r requirements-aion-webauthn-reference.txt
      - name: V5 offline adversarial regression
        run: python -B -m unittest -v tests.test_aion_v5_receipt_admission tests.test_aion_v5_epoch_root_reference
      - name: V4 signed anchors and V3 durable ledger regression
        run: python -B -m unittest -v tests.test_aion_signed_commitments_v4 tests.test_aion_anchor_freshness_v4 tests.test_aion_anchor_rollback_recovery_v4 tests.test_aion_webauthn_ledger_v3 tests.test_aion_webauthn_registry_v3 tests.test_aion_webauthn_recovery_v3
      - name: Original first-install NO-GO
        run: python -B -m unittest discover -s tests -p "test_aion_first_install_evidence_no_go_1215.py" -v
      - name: Compile all source
        run: python -m compileall -q -x '(^|[\\/])\.git([\\/]|$)' .
      - name: Whitespace diff
        run: git diff --check 8a143ee40b9f6893845817d61b564ccc47611502 HEAD
  quality-global:
    name: Exact root Quality / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Full original global quality without omission
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
