name: AION P0 LAB Budget Input Contract Diagnostic (NO-GO offline)

on:
  push:
    branches: [lab/aion-p0-budget-input-contract-20261019]

permissions:
  contents: read

jobs:
  budget_input_type_observation:
    name: Independent budget input contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: Canonical budget-only regression (not full Quality)
        run: python -B -m unittest -v test_atlasquant_aion_cumulative_authority_budget
      - name: PR 1331 schema parity regression
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_guard_schema_parity_lab.py -v
      - name: Previous independent budget consumer review
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_guard_independent_review_lab.py -v
      - name: New open input contract observations (green != approved)
        run: python -B -m unittest discover -s tests -p test_aion_p0_budget_input_contract_observation_lab.py -v
