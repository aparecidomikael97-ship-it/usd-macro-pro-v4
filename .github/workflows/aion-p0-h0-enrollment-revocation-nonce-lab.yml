name: AION P0 H0 LAB Signed Enrollment Revocation Nonce (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-enrollment-revocation-nonce-policy-20261021]

permissions:
  contents: read

jobs:
  denied_enrollment_revocation_nonce:
    name: Signed enrollment-revocation-nonce denied - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependency pins and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: 56 adversarial simulated issuer-enrollment-revocation-nonce tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_enrollment_revocation_nonce_lab.py -v
      - name: 38 authority graph shared-control negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_authority_graph_lab.py -v
      - name: 34 Ed25519 dual signed-witness negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_dual_signed_witness_transcript_lab.py -v
      - name: 55 external evidence structural tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_external_evidence_admission_lab.py -v
      - name: 28 third-anchor negative static checks
        run: python -B -m unittest -v test_aion_p0_h0_third_anchor_design_review_lab
      - name: 20 custody two-domain rollback tests
        run: python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: 64 H0 A79 causal denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
      - name: 8 real Outbox rollback claim negatives
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
