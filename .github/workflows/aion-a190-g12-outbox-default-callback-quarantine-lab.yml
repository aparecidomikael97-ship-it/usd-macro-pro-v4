name: A190 G12 Outbox Default Callback Quarantine LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'test_atlasquant_aion_execution_outbox.py'
      - 'test_atlasquant_aion_execution_saga.py'
      - 'test_atlasquant_aion_outbox_uncertain_retry_a176_lab.py'
      - 'test_atlasquant_aion_outbox_receipt_admission_a177_lab.py'
      - 'test_atlasquant_aion_a190_g6_outbox_callback_trust_boundary_lab.py'
      - 'test_atlasquant_aion_a190_g12_default_callback_quarantine_lab.py'
      - '.github/workflows/aion-a190-g12-outbox-default-callback-quarantine-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g12-real-outbox-default-deny-cross-os:
    name: G12 Outbox quarantine + regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install fixed minimal AION LAB dependencies
        run: python -m pip install cryptography==50.0.2 requests==2.34.2
      - name: Run real Outbox and synthetic LAB regression suites
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m unittest -v \
            test_atlasquant_aion_a190_g12_default_callback_quarantine_lab \
            test_atlasquant_aion_execution_outbox \
            test_atlasquant_aion_execution_saga \
            test_atlasquant_aion_outbox_uncertain_retry_a176_lab \
            test_atlasquant_aion_outbox_receipt_admission_a177_lab \
            test_atlasquant_aion_a190_g6_outbox_callback_trust_boundary_lab \
            test_atlasquant_aion_a190_g5_real_process_crash_h0_lab \
            test_atlasquant_aion_a190_g4_sqlite_native_files_lab \
            test_atlasquant_aion_a190_g3_first_intent_contract_lab \
            2>&1 | tee a190_g12.log
          grep -q 'G12_DEFAULT_TRUE_CALLBACKS=NO_SEND_NO_ADAPTER_LOOKUP' a190_g12.log
          grep -q 'G12_DEFAULT_RECONCILE=NO_CONFIRM_NO_ADAPTER_LOOKUP' a190_g12.log
          grep -q 'G12_REOPEN_TRUE_CALLBACK=STILL_UNCERTAIN_ZERO_EFFECT' a190_g12.log
          grep -q 'G12_UNSAFE_LAB_OPT_IN=STRICT_BOOL_ONLY' a190_g12.log
          grep -q 'G12_EXPLICIT_UNSAFE_LAB_ONLY=MEMORY_EFFECT_NOT_AUTHORITY_RED' a190_g12.log
          grep -q 'G12_DEFAULT_UNCERTAIN=ZERO_AUTO_RESEND' a190_g12.log
          grep -q 'A190_G6_CALLER_TRUE_GUARD_AND_RECEIPT=IN_MEMORY_SEND_CONFIRMED_RED' a190_g12.log
          grep -q 'A190_G5_HOST_ROLLBACK_AFTER_REAL_PROCESS_CRASH=UNSAFE_READMISSION_RED' a190_g12.log
          echo 'G12_DEFAULT_OUTBOX_QUARANTINE=TESTED_NO_PROVIDER'
      - name: Explicit authority and deployment NO-GO
        run: |
          echo 'Production default: injectable callbacks do not permit adapter send or receipt confirmation.'
          echo 'unsafe_allow_synthetic_lab_callbacks=True preserves only isolated synthetic tests.'
          echo 'Python in-process hosts can opt in: THIS IS NOT a security/authority trust root.'
          echo 'G6 injection and G5 same-host rollback RED remain reproducible inside opt-in LAB.'
          echo 'No real provider, actual OS-independent durable custodian, identity or verified receipt.'
          echo 'No merge, deploy, Worker, credentials, account creation, spending or external effect.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
