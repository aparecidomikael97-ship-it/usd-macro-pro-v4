name: A190 G18 Windows stdlib SQLite exact native file identity LAB
on:
  pull_request:
    paths:
      - 'labs/a190/aion_g18_win32_native_identity_extension.c'
      - 'labs/a190/test_g18_win32_native_identity_lab.py'
      - 'labs/a190/g17_prepare_official_headers_lab.py'
      - '.github/workflows/aion-a190-g18-win32-stdlib-native-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-g18-windows:
    name: G18 native stdlib sqlite3.Connection Win32 identity synthetic LAB
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify pinned official SQLite SDK headers
        shell: pwsh
        run: |
          python -B labs/a190/g17_prepare_official_headers_lab.py --dest "$env:RUNNER_TEMP\aion_g18_sdk"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compile diagnostic C extension with discovered runner MSVC (synthetic only)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'VSWHERE_NOT_FOUND' }
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC_TOOLCHAIN_NOT_FOUND' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw 'MSVC_VCVARS_NOT_FOUND' }
          $batch = Join-Path $env:RUNNER_TEMP 'build_g18.cmd'
          $lines = @(
            '@echo off',
            ('call "' + $vcvars + '"'),
            'if errorlevel 1 exit /b 1',
            'cl /nologo /LD /O2 /W4 /I "%RUNNER_TEMP%\aion_g18_sdk" /Fe:"%RUNNER_TEMP%\aion_g18_probe.dll" labs\a190\aion_g18_win32_native_identity_extension.c kernel32.lib',
            'if errorlevel 1 exit /b 1'
          )
          Set-Content -Path $batch -Value $lines -Encoding ascii
          & cmd.exe /d /c $batch
          if ($LASTEXITCODE -ne 0) { throw 'G18_MSVC_COMPILE_FAILED' }
      - name: Execute Windows real stdlib SQLite synthetic tests
        shell: pwsh
        env:
          AION_G18_LAB_EXTENSION: ${{ runner.temp }}\aion_g18_probe.dll
        run: |
          git rev-parse HEAD
          python -B -m unittest discover -s labs/a190 -p 'test_g18_win32_native_identity_lab.py' -v 2>&1 | Tee-Object -FilePath g18_win32.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Get-Content g18_win32.log -Raw
          foreach ($marker in @('Ran 9 tests', 'G18_WIN32_EXACT_STDLIB_NATIVE_MATCH=LOCAL_OBSERVATION_ONLY', 'G18_WIN32_SAME_MARKER_CLONE=WRONG_NATIVE_FILE_DENIED_BY_COMPARISON', 'G18_WIN32_PREOPENED_ROGUE_PLUS_DECOY=CONNECTIONS_DISTINGUISHED', 'G18_WIN32_WAL_MAIN_MATCH=NOT_WAL_SHM_OR_ROLLBACK_ATTESTATION')) {
            if (-not $log.Contains($marker)) { throw "Missing evidence marker: $marker" }
          }
      - name: No-go statement
        shell: pwsh
        run: |
          Write-Output 'LAB only: unsigned C extension is not production safe or externally trusted.'
          Write-Output 'Win32 local file identity does not prove owner, provider receipt, WAL/SHM, rollback custody, or durable H0.'
          Write-Output '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
