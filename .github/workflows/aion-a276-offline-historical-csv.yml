name: AION A276 Offline Historical CSV LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_historical_csv.py
      - atlasquant_aion_trader_nonfx.py
      - atlasquant_aion_trader_timeframes.py
      - atlasquant_operational_backtest.py
      - labs/test_a276_historical_csv.py
      - docs/lab/aion_a276_offline_historical_csv.md
      - .github/workflows/aion-a276-offline-historical-csv.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-offline:
    name: A276 historical-only/no-order (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 25
    steps:
      - name: Checkout offline LAB sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install existing dependencies and test runner
        run: python -m pip install -r requirements.txt pytest==9.1.1
      - name: CSV intake and inherited no-order invariants
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a276_historical_csv
          labs.test_a275_nonfx_readonly_overlay
          labs.test_a269_trader_closed_mtf_evidence
          labs.test_a268_trader_readonly_observation
          test_atlasquant_risk_guardian
      - name: Historical backtest and FX scanner compatibility
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q
          test_atlasquant_operational_backtest.py
          test_atlasquant_reference_resident.py
          tests/test_atlasquant_scanner_coverage.py
