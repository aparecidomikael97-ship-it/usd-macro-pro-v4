name: AION Chat Postgres Store Adapter Fake V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "atlasquant_aion_chat_postgres_store_adapter_fake_v1.py"
      - "test_atlasquant_aion_chat_postgres_store_adapter_fake_v1.py"
      - "docs/aion/AION_CHAT_POSTGRES_STORE_ADAPTER_FAKE_V1.md"
      - ".github/workflows/aion-chat-postgres-store-adapter-fake-v1.yml"
      - ".github/workflows/quality-tests.yml"

permissions:
  contents: read

jobs:
  postgres-store-adapter-fake-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile fake adapter
        run: |
          python -m py_compile \
            atlasquant_aion_chat_postgres_store_adapter_fake_v1.py \
            test_atlasquant_aion_chat_postgres_store_adapter_fake_v1.py
      - name: Run fake adapter tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_chat_postgres_store_adapter_fake_v1.py
      - name: Assert no real Postgres/network/provider execution
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_chat_postgres_store_adapter_fake_v1.py").read_text(encoding="utf-8")
          for banned in (
              "import psycopg",
              "import sqlalchemy",
              "import asyncpg",
              "import requests",
              "import socket",
              "os.getenv(",
              "DATABASE_URL",
              ".connect(",
              "CREATE TABLE",
              "INSERT INTO",
              "UPDATE ",
              "DELETE FROM",
              "execute_openai_answer(",
              "subprocess",
          ):
              assert banned not in source, banned
          for marker in (
              "FakePostgresBackend",
              "PostgresChatStoreAdapterSkeleton",
              "CommitOutcomeUnknownError",
              '"fake_backend_only": True',
              '"sql_executed": False',
              '"network_called": False',
              '"provider_called": False',
          ):
              assert marker in source, marker
          PY
