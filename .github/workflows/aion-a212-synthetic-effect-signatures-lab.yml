name: AION A212 Synthetic Signed Effect Binding LAB

on:
  pull_request:
    paths:
      - "labs/a212_synthetic_signed_effect_preflight.py"
      - "labs/test_a212_synthetic_signed_effect_preflight.py"
      - "docs/lab/aion_a212_synthetic_signed_effect_evidence.md"
      - ".github/workflows/aion-a212-synthetic-effect-signatures-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-signature-bindings:
    name: A212 valid crypto != independently proven effect / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test-only Ed25519 and legacy regression dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.34.2
      - name: Check A212 cryptographic math and A211-A206 isolated regressions
        run: python -B -m unittest -v labs.test_a212_synthetic_signed_effect_preflight labs.test_a211_claimed_witness_coherence labs.test_a210_offline_root_rotation_proposal labs.test_a209_root_provenance_failclosed labs.test_a208_independent_receipt_preflight labs.test_a206_late_send_outcome_cas
