name: AION A70 LAB main ruleset policy contract

on:
  pull_request:
    branches: [lab/aion-v16-a69-checkpoint-bootstrap-migration-hard-stop-20261014]
    paths:
      - "docs/aion/main_governance_ruleset_proposal_a70.json"
      - "atlasquant_aion_main_ruleset_guard_a70.py"
      - "test_atlasquant_aion_main_ruleset_guard_a70.py"
      - ".github/workflows/aion-a70-main-ruleset-policy-lab.yml"
      - ".github/workflows/quality-tests.yml"
      - "test_atlasquant_aion_convergence.py"

permissions:
  contents: read

jobs:
  a70-policy-offline:
    name: A70 no-admin policy contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Contract only - zero GitHub calls or credential use
        run: python -m unittest -v test_atlasquant_aion_main_ruleset_guard_a70
