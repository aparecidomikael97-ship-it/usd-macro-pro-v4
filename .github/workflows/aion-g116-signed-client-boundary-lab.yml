name: AION G116 unsigned witness injection RED-to-GREEN LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g115_public_witness_outbox_guard_lab.py'
      - 'labs/a190/test_g115_cross_process_outbox_guard_lab.py'
      - 'labs/a190/test_g116_unsigned_witness_client_injection_lab.py'
      - '.github/workflows/aion-g116-signed-client-boundary-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-boundary:
    name: G116 unsigned client injection / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install canonical application test pins
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Execute unsigned injection and inherited G115 guards
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g116_unsigned_witness_client_injection_lab 2>&1 | tee g116.log
          grep -F 'Ran 13 tests' g116.log
          grep -Fx 'OK' g116.log
          grep -F 'G116_UNSIGNED_CLIENT_CONSTRUCTOR=DENIED' g116.log
          grep -F 'G116_UNSIGNED_BARE_RESPONSES=NO_ADAPTER_SEND' g116.log
          grep -F 'G115_LOST_REMOTE_ACK=NO_PROVIDER_SEND_SPENT' g116.log
          grep -F 'G115_HOST_CONTROLLED_WITNESS_ROLLBACK=STILL_VULNERABLE_NOT_P0' g116.log
      - name: Execute original G114 signed subprocess client regression
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g114_public_only_witness_lab 2>&1 | tee g114.log
          grep -F 'Ran 15 tests' g114.log
          grep -Fx 'OK' g114.log
