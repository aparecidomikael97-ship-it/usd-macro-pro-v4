name: AION FinOps Work Unit Economics

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_finops_metering.py"
      - "atlasquant_aion_finops_work_unit_economics.py"
      - "test_atlasquant_aion_finops_work_unit_economics.py"
      - "docs/aion/AION_FINOPS_WORK_UNIT_ECONOMICS_V1.md"
      - ".github/workflows/aion-finops-work-unit-economics.yml"

permissions:
  contents: read

jobs:
  economics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
      - name: Compile FinOps chain
        run: |
          python -m py_compile \
            atlasquant_aion_finops_metering.py \
            atlasquant_aion_finops_work_unit_economics.py \
            test_atlasquant_aion_finops_work_unit_economics.py
      - name: Run FinOps unit economics tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_finops_metering.py \
            test_atlasquant_aion_finops_work_unit_economics.py
      - name: Assert financial non-action boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_finops_work_unit_economics.py").read_text(encoding="utf-8")
          for marker in (
              '"source_of_truth_for_billing": False',
              '"missing_cost_is_zero": False',
              '"automatic_charge": False',
              '"automatic_pricing_change": False',
              '"automatic_budget_change": False',
              '"automatic_provider_switch": False',
              '"executes_action": False',
          ):
              assert marker in source, marker
          PY
