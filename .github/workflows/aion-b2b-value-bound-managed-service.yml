name: AION B2B Value Bound Managed Service Handoff

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_value_bound_managed_service.py"
      - "test_atlasquant_aion_b2b_value_bound_managed_service.py"
      - "docs/aion/AION_B2B_VALUE_BOUND_MANAGED_SERVICE_HANDOFF_V1.md"
      - ".github/workflows/aion-b2b-value-bound-managed-service.yml"

permissions:
  contents: read

jobs:
  value-bound-managed-service:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile bounded managed-service handoff
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_managed_service_control.py \
            atlasquant_aion_b2b_value_bound_managed_service.py
      - name: Run managed-service handoff tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_managed_service_control.py \
            test_atlasquant_aion_b2b_value_bound_managed_service.py
