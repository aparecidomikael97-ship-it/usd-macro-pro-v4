name: AION P0 H0 LAB Five Signed Evidence Bindings (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-linked-five-envelope-chain-20261021]

permissions:
  contents: read

jobs:
  five_envelopes:
    name: H0 five-envelope cross-binding LAB - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependency pins and pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: 44 adversarial cross-binding cases among five synthetic signed envelopes
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_linked_five_envelopes_lab.py -v
      - name: 56 enrollment revocation signed nonce cases
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_enrollment_revocation_nonce_lab.py -v
      - name: 38 authority graph negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_authority_graph_lab.py -v
      - name: 34 dual-witness Ed25519 signature negatives
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_dual_signed_witness_transcript_lab.py -v
      - name: 55 structural external-evidence checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_external_evidence_admission_lab.py -v
      - name: 28 independent third-anchor design negatives
        run: python -B -m unittest -v test_aion_p0_h0_third_anchor_design_review_lab
      - name: 20 two-domain custody and rollback models
        run: python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: 64 causal H0 A79 negatives
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
      - name: 8 real Outbox restore-claim negatives
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
