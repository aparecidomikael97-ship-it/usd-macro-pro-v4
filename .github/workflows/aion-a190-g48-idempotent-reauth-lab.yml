name: A190 G48 corrupted idempotent reuse gate LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g48_idempotent_reauth_admission_lab.py'
      - '.github/workflows/aion-a190-g48-idempotent-reauth-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g48:
    name: G48 poisoned intent refusal / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install isolated test dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Run G48 adversarial fail-closed cases
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g48_*.py' -v 2>&1 | tee g48.log
          grep -F 'Ran 11 tests' g48.log
          grep -F 'G48_STRICT_REUSE_GREEN=NO_TAMPERED_IDEMPOTENT' g48.log
          grep -F 'G48_DOUBLE_DOWNGRADE_GREEN=NO_TAMPERED_REUSE' g48.log
          grep -F 'G48_GATE_TYPE_GREEN=NO_NONBOOL_BYPASS' g48.log
      - name: Inherited G47 G46 G45 G44 G43 regressions
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g47_*.py' -v 2>&1 | tee g47.log
          grep -F 'Ran 18 tests' g47.log
          python -B -m unittest discover -s labs/a190 -p 'test_g46_*.py' -v 2>&1 | tee g46.log
          grep -F 'Ran 10 tests' g46.log
          python -B -m unittest discover -s labs/a190 -p 'test_g45_*.py' -v 2>&1 | tee g45.log
          grep -F 'Ran 7 tests' g45.log
          python -B -m unittest discover -s labs/a190 -p 'test_g44_*.py' -v 2>&1 | tee g44.log
          grep -F 'Ran 39 tests' g44.log
          python -B -m unittest discover -s labs/a190 -p 'test_g43_*.py' -v 2>&1 | tee g43.log
          grep -F 'Ran 32 tests' g43.log
      - name: Mandatory hard no-go
        shell: bash
        run: |
          echo 'LAB-only structural gate; not independent identity or trusted provider receipt.'
          echo 'No external SEND, Worker, customer data, new secrets, merge, main or deploy.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
