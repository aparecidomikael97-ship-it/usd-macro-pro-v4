name: AION Convergence True-Main Safety & Global Quality

on:
  pull_request:
    branches:
      - audit/aion-composite-full-quality-recheck-20261011
    paths:
      - "test_atlasquant_aion_convergence.py"
      - ".github/workflows/aion-convergence-true-main-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stacked-pr-convergence:
    name: Main surface isolation and Guard Rails / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout exact isolated candidate with main available
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install app dependencies
        run: python -m pip install -r requirements.txt
      - name: Full convergence tests including real git diff with production main
        run: python -B -m unittest -v test_atlasquant_aion_convergence
      - name: Prior P0 negative access and Worker contracts
        run: python -B -m unittest -q test_atlasquant_access_panel test_atlasquant_aion_global_worker_activation test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1

  root-official-quality:
    name: Exact original root Quality on stacked main comparison / ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact isolated candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install original Quality requirements
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 playwright==1.63.0
      - name: Compile all Python
        run: python -m compileall -q -x '(^|/)\.git(/|$)' .
      - name: Run exact official root Quality step, no skips
        run: python -B .github/scripts/aion_run_exact_quality_step.py "Run quality suite"
