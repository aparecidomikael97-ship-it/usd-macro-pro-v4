name: A190 G24 Ed25519 challenge freshness LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g24_challenge_bound_witness_lab.py'
      - 'labs/a190/test_g24_challenge_bound_witness_lab.py'
      - '.github/workflows/aion-a190-g24-challenge-witness-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g24-challenge-witness:
    name: G24 challenge witness / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only cryptography dependency
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Challenge-bound witness adversarial tests, no provider
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g24_challenge_bound_witness_lab.py' -v 2>&1 | tee g24.log
          grep -F 'Ran 18 tests' g24.log
          grep -F 'G24_FRESH_NONCE_OLD_HISTORY_RED=SIGNER_CAN_ATTEST_ROLLBACK' g24.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'Fresh challenge proves response binding, NOT independent log freshness.'
          echo 'Ephemeral test keys only, no real external monotonic witness.'
          echo 'No provider dispatch, no first-attempt reservation, no P0 closure.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
