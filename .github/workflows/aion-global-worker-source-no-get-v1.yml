name: AION Global Worker Source No-GET Gate V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_global_worker.py"
      - "atlasquant_aion_global_worker_source_gate_v1.py"
      - "test_atlasquant_aion_global_worker_source_gate_v1.py"
      - "test_atlasquant_aion_global_worker.py"
      - ".github/workflows/aion-global-worker-source-no-get-v1.yml"

permissions:
  contents: read

jobs:
  verify-no-get:
    name: Worker origin preflight / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile production Worker and offline tests
        run: python -B -m py_compile atlasquant_aion_global_worker.py atlasquant_aion_global_worker_source_gate_v1.py test_atlasquant_aion_global_worker_source_gate_v1.py test_atlasquant_aion_global_worker.py
      - name: Test actual runner source denial without any dependencies or network
        run: python -B -m unittest test_atlasquant_aion_global_worker_source_gate_v1.py -v
      - name: Install pinned project dependencies for offline historic regression
        run: python -m pip install -r requirements.txt
      - name: Test historical worker CAS/fence under synthetic patch (no actual I/O)
        run: python -B -m unittest test_atlasquant_aion_global_worker.py -v
