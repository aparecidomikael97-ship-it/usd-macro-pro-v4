name: AtlasQuant - Automatic Scanner + Autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autopilot-v107.yml"
      - "autopilot_v107.py"
      - "autopilot_paper_v112.py"
      - "autopilot_model_paper_v1.py"
      - "autopilot_news_nowcast_v1.py"
      - "atlasquant_news_nowcast.py"
      - "atlasquant_nowcast_antecedents.py"
      - "atlasquant_live_nowcast.py"
      - "atlasquant_model_paper.py"
      - "atlasquant_setup_candidates.py"
      - "autopilot_setup_audit_v114.py"
      - "autopilot_quota_guard_v111.py"
      - "pair_intelligence_v110.py"
      - "atlasquant_fast_startup.py"
      - "atlasquant_home_radar.py"
      - "paper_trading_v112.py"
      - "paper_friction_v116.py"
      - "decision_integrity_v110.py"
      - "atlasquant_aion_global_worker.py"
      - "atlasquant_aion_background_executor.py"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: usd-macro-autopilot-v107
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      USD_MACRO_AUTOPILOT: "1"
      GITHUB_TOKEN_HISTORICO: ${{ github.token }}
      GITHUB_REPO_HISTORICO: ${{ github.repository }}
      GITHUB_DATA_BRANCH: "atlasquant-runtime"
      GITHUB_BRANCH_HISTORICO: "atlasquant-runtime"
      CHAVE_FRED: ${{ secrets.CHAVE_FRED }}
      CHAVE_TWELVE_DATA: ${{ secrets.CHAVE_TWELVE_DATA }}
      CHAVE_NEWSAPI: ${{ secrets.CHAVE_NEWSAPI }}
      CHAVE_EODHD: ${{ secrets.CHAVE_EODHD }}
    steps:
      - name: Checkout current application code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install pip==26.2.1
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Create Streamlit secrets for headless app
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          keys = [
              "CHAVE_FRED",
              "CHAVE_TWELVE_DATA",
              "CHAVE_NEWSAPI",
              "CHAVE_EODHD",
              "GITHUB_TOKEN_HISTORICO",
              "GITHUB_REPO_HISTORICO",
              "GITHUB_DATA_BRANCH",
              "GITHUB_BRANCH_HISTORICO",
          ]
          with open(".streamlit/secrets.toml", "w", encoding="utf-8") as f:
              for key in keys:
                  value = os.getenv(key, "")
                  f.write(f"{key} = {json.dumps(value)}\n")
          print("secrets.toml criado para AppTest (valores não exibidos).")
          PY

      - name: Run full background autopilot + paper + setup audit
        run: python autopilot_setup_audit_v114.py

      - name: AION Global Worker tick
        if: ${{ vars.ATLASQUANT_AION_GLOBAL_WORKER_ENABLED == '1' }}
        env:
          ATLASQUANT_AION_GLOBAL_WORKER_ENABLED: "1"
          AION_GLOBAL_WORKER_RUNTIME_ID: "gha-${{ github.run_id }}-${{ github.run_attempt }}"
        run: python atlasquant_aion_global_worker.py --tick