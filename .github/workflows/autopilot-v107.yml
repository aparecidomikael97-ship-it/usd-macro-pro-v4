name: AtlasQuant - Automatic Scanner + Autopilot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: usd-macro-autopilot-v107
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      USD_MACRO_AUTOPILOT: "1"
      GITHUB_TOKEN_HISTORICO: ${{ github.token }}
      GITHUB_REPO_HISTORICO: ${{ github.repository }}
      GITHUB_DATA_BRANCH: "atlasquant-runtime"
      GITHUB_BRANCH_HISTORICO: "atlasquant-runtime"
      CHAVE_FRED: ${{ secrets.CHAVE_FRED }}
      CHAVE_TWELVE_DATA: ${{ secrets.CHAVE_TWELVE_DATA }}
      CHAVE_NEWSAPI: ${{ secrets.CHAVE_NEWSAPI }}
      CHAVE_EODHD: ${{ secrets.CHAVE_EODHD }}
    steps:
      - uses: actions/checkout@v4\n        with:\n          ref: atlasquant-runtime

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install streamlit pandas numpy requests pyarrow altair

      - name: Create Streamlit secrets for headless app
        run: |
          mkdir -p .streamlit
          python - <<'PY'
          import json, os
          keys = [
              "CHAVE_FRED",
              "CHAVE_TWELVE_DATA",
              "CHAVE_NEWSAPI",
              "CHAVE_EODHD",
              "GITHUB_TOKEN_HISTORICO",
              "GITHUB_REPO_HISTORICO",
              "GITHUB_DATA_BRANCH",
              "GITHUB_BRANCH_HISTORICO",
          ]
          with open(".streamlit/secrets.toml", "w", encoding="utf-8") as f:
              for key in keys:
                  value = os.getenv(key, "")
                  f.write(f"{key} = {json.dumps(value)}\n")
          print("secrets.toml criado para AppTest (valores não exibidos).")
          PY

      - name: Run full background autopilot
        run: python autopilot_v107.py
