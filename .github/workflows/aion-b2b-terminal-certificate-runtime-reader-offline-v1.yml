name: AION B2B Terminal Certificate Runtime Reader Offline V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - integration/aion-b2b-execution-terminal-certificate-durable-store-extension-offline-v1-20261006
    paths:
      - "atlasquant_aion_b2b_terminal_certificate_read_model_store_projection_offline_v1.py"
      - "atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py"
      - "test_atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py"
      - "atlasquant_aion_durable_execution_kernel.py"
      - "test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_offline_v1.py"
      - "docs/aion/AION_B2B_TERMINAL_CERTIFICATE_RUNTIME_READER_OFFLINE_V1.md"
      - ".github/workflows/aion-b2b-terminal-certificate-runtime-reader-offline-v1.yml"

permissions:
  contents: read

jobs:
  terminal-certificate-runtime-reader-offline-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile offline reader and projection adapter
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_terminal_certificate_read_model_store_projection_offline_v1.py \
            atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py \
            test_atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py
      - name: Run durable-store and reader offline tests
        run: |
          python -m pytest -q \
            test_atlasquant_aion_v214_durable_execution_redteam.py \
            test_atlasquant_aion_b2b_execution_terminal_certificate_durable_store_extension_offline_v1.py \
            test_atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py
      - name: Assert logical read-model boundary and zero external action
        run: |
          python - <<'PY'
          from pathlib import Path

          reader = Path("atlasquant_aion_b2b_terminal_certificate_runtime_reader_offline_v1.py").read_text(encoding="utf-8")
          adapter = Path("atlasquant_aion_b2b_terminal_certificate_read_model_store_projection_offline_v1.py").read_text(encoding="utf-8")
          combined = reader + "\n" + adapter

          for banned in (
              "sqlite3.connect(",
              "requests.get(",
              "requests.post(",
              "httpx.request(",
              "socket.socket(",
              "subprocess.Popen(",
              "subprocess.run(",
              "os.system(",
              "deploy_to_production(",
              "send_whatsapp(",
              "send_email(",
          ):
              assert banned not in combined, banned

          assert "DurableExecutionStore" not in reader
          assert "read_terminal_certificate_snapshot" not in reader
          assert "read_terminal_certificate_projection" in reader
          assert "DurableExecutionStore" in adapter
          assert "read_terminal_certificate_snapshot" in adapter

          for marker in (
              'MODE = "OFFLINE_READ_ONLY_FAIL_CLOSED_TERMINAL_CERTIFICATE_READER"',
              '"VERIFIED"',
              '"MISMATCH"',
              '"UNAVAILABLE"',
              '"STALE"',
              '"executes_action"',
              "def read_terminal_certificate_offline",
          ):
              assert marker in reader, marker
          PY
