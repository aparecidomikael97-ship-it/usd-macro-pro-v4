name: AION Composite Calendar and Voice Fail-Closed Reconciliation

on:
  pull_request:
    branches:
      - audit/aion-composite-quality-coverage-reconciliation-20261011
    paths:
      - "test_calendar.py"
      - "test_atlasquant_voice_profile.py"
      - ".github/workflows/aion-composite-calendar-voice-failclosed.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    name: Calendar local + private-read deny + paid TTS no-egress / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate head without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Exercise complete existing calendar and voice regression modules
        run: python -B -m unittest -v test_calendar test_atlasquant_voice_profile
      - name: Verify unrelated security denies remain unchanged
        run: >-
          python -B -m unittest -v
          test_atlasquant_legacy_remote_tenant_quarantine_v1
          test_atlasquant_private_read_gate_v1
          test_atlasquant_voice_readiness
