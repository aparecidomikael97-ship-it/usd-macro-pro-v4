name: A190 G20 external witness contract synthetic LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g20_independent_witness_recovery_contract_lab.py'
      - 'labs/a190/test_g20_independent_witness_recovery_contract_lab.py'
      - '.github/workflows/aion-a190-g20-witness-contract-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g20-witness-contract:
    name: G20 witness contract / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Synthetic external witness contract, no send
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g20_independent_witness_recovery_contract_lab.py' -v 2>&1 | tee g20.log
          grep -F 'Ran 16 tests' g20.log
          grep -E '^OK$' g20.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'FakeWitness is in-process and has no real cryptographic trust root.'
          echo 'No AION production integration, no external reservation, no provider send.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
