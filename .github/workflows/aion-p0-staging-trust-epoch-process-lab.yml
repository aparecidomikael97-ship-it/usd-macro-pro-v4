name: AION P0 STAGING credential epoch and multiprocess diagnostic (NO-GO)

on:
  push:
    branches: [lab/aion-p0-staging-trust-epoch-process-review-20261020]

permissions:
  contents: read

jobs:
  epoch_multiprocess_review:
    name: STAGING auth and process audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked requirements and pinned canonical pytest
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Seven offline stale credential, multiprocess and runtime flag gap diagnostics
        run: python -B -m unittest discover -s tests -p test_aion_p0_staging_epoch_multiprocess_boundary_diagnostic_lab.py -v
      - name: Existing twelve atomicity and legacy seventeen plus eight lifecycle protections
        run: python -B -m unittest -q test_aion_p0_staged_facade_port_lifecycle_lab test_aion_p0_staged_facade_latest_hardstops_lab
      - name: Original targeted chat and SQLite security suites, unmodified
        run: python -B -m unittest -q test_atlasquant_aion_chat_host_staging test_atlasquant_aion_chat_staged_runtime_resilience test_atlasquant_aion_chat_foundation test_atlasquant_aion_chat_golden_path test_atlasquant_aion_chat_product_bridge test_atlasquant_aion_chat_surface_redteam test_aion_p0_sqlite_chat_store_owner_thread_lab test_aion_p0_sqlite_execution_restore_hardstop_lab
      - name: Normative staging session transitions in inherited #1350
        run: python -B -m unittest discover -s tests -p test_aion_p0_staged_session_atomicity_candidate_lab.py -v
      - name: Canonical security authority and local isolation targeted regression
        run: python -B -m unittest -q test_atlasquant_aion_security_adversarial test_atlasquant_aion_local_security_matrix
