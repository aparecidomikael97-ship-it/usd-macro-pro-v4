name: AION SQLite staged lifecycle

on:
  pull_request:
    paths:
      - 'aion_chat/**'
      - 'atlasquant_aion_chat_host_staging.py'
      - 'atlasquant_aion_chat_storage_resilience.py'
      - 'test_atlasquant_aion_chat_sqlite_lifecycle.py'
      - 'test_atlasquant_aion_chat_sqlite_path_identity.py'
      - 'test_atlasquant_aion_chat_sqlite_inode_anchor.py'
      - 'test_atlasquant_aion_chat_sqlite_live_mutations.py'
      - 'test_atlasquant_aion_chat_host_staging.py'
      - 'test_atlasquant_aion_chat_staged_runtime_resilience.py'
      - '.github/workflows/aion-sqlite-staged-lifecycle.yml'

permissions:
  contents: read

jobs:
  lifecycle:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install CI-only dependency for existing host side-effect guards
        run: python -m pip install requests==2.34.2
      - name: Real SQLite lifecycle, host gates and resilience (network forbidden)
        run: >-
          python -B -c "import socket, unittest; from unittest.mock import Mock;
          socket.socket.connect=Mock(side_effect=AssertionError('network forbidden'));
          socket.socket.connect_ex=Mock(side_effect=AssertionError('network forbidden'));
          socket.create_connection=Mock(side_effect=AssertionError('network forbidden'));
          suite=unittest.defaultTestLoader.loadTestsFromNames(['test_atlasquant_aion_chat_sqlite_lifecycle','test_atlasquant_aion_chat_sqlite_path_identity','test_atlasquant_aion_chat_sqlite_inode_anchor','test_atlasquant_aion_chat_sqlite_live_mutations','test_atlasquant_aion_chat_host_staging','test_atlasquant_aion_chat_staged_runtime_resilience']);
          result=unittest.TextTestRunner(verbosity=2).run(suite);
          raise SystemExit(not result.wasSuccessful())"
