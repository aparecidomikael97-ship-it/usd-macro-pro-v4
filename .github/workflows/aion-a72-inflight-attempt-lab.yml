name: AION A72 LAB malformed local attempt denial

on:
  pull_request:
    branches: [lab/aion-v16-a71-inflight-receipt-missing-unsafe-20261014]
    paths:
      - "atlasquant_aion_global_worker_inflight_reconciliation.py"
      - "test_atlasquant_aion_inflight_attempt_a72.py"
      - ".github/workflows/aion-a72-inflight-attempt-lab.yml"

permissions:
  contents: read

jobs:
  a72-attempt:
    name: A72 malformed attempts block (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A72 malformed attempt and A71/A58 original containment
        run: python -m unittest -v test_atlasquant_aion_inflight_attempt_a72 test_atlasquant_aion_inflight_receipt_safety_a71 test_atlasquant_aion_inflight_untrusted_receipts_a58
