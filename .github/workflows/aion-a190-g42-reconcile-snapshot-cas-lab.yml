name: A190 G42 reconcile snapshot CAS and terminal immutability LAB
on:
  pull_request:
    paths:
      - 'atlasquant_aion_execution_outbox.py'
      - 'labs/a190/test_g42_reconcile_snapshot_cas_lab.py'
      - '.github/workflows/aion-a190-g42-reconcile-snapshot-cas-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g42-snapshot:
    name: G42 reconcile snapshot CAS / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install LAB-only crypto
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G42 strict snapshot fence and terminal state evidence
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g42_*.py' -v 2>&1 | tee g42.log
          grep -F 'Ran 22 tests' g42.log
          grep -F 'G42_MATCHED_SNAPSHOT_GREEN=ONE_ATOMIC_SYNTHETIC_EFFECT' g42.log
          grep -F 'G42_GETTER_REENTRY_GREEN=CONFIRMED_NOT_DOWNGRADED' g42.log
          grep -F 'G42_CALLBACK_REENTRY_GREEN=LOSING_RESULT_NOT_CONFIRMED' g42.log
          grep -F 'G42_VERIFIER_REENTRY_GREEN=EXISTING_LEDGER_PRESERVED' g42.log
          grep -F 'G42_REOPEN_GREEN=PERSISTENT_CONFIRM_AND_EFFECT_LEDGER' g42.log
          grep -F 'G42_LEGACY_STALE_RED=OPT_IN_STRICT_GATE_NOT_GLOBAL' g42.log
          grep -F 'G42_LOCAL_RECEIPT_RED=HOST_CALLBACK_ACCEPTS_FABRICATED_EFFECT' g42.log
          grep -F 'G42_HOST_ROLLBACK_RED=LOCAL_CAS_CANNOT_RECOVER_LOST_CONFIRMATION' g42.log
      - name: G41-G30 inherited RED and GREEN regression checks
        shell: bash
        run: |
          set -o pipefail
          for n in 41 40 39 38 37 36 35 34 33 32 31 30; do
            python -B -m unittest discover -s labs/a190 -p "test_g${n}_*.py" -v 2>&1 | tee "g${n}.log"
          done
          grep -F 'Ran 18 tests' g41.log
          grep -F 'Ran 36 tests' g40.log
          grep -F 'Ran 28 tests' g39.log
          grep -F 'Ran 24 tests' g38.log
          grep -F 'Ran 34 tests' g37.log
          grep -F 'Ran 20 tests' g36.log
          grep -F 'Ran 18 tests' g35.log
          grep -F 'Ran 16 tests' g34.log
          grep -F 'Ran 24 tests' g33.log
          grep -F 'Ran 20 tests' g32.log
          grep -F 'Ran 18 tests' g31.log
          grep -F 'Ran 23 tests' g30.log
      - name: Fail-closed release hold
        shell: bash
        run: |
          echo 'G42 opt-in LAB only. Synthetic local verifier cannot prove provider receipt.'
          echo 'Snapshot CAS does not resist same-host database rollback or hostile binary.'
          echo 'No schema migration, external monotonic trust, real Worker/provider.'
          echo 'No main/merge/deploy, customer data, secrets, purchases, or P0 homologation.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
