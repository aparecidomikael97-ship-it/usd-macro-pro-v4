name: AION Owner Stack Post-Merge Certification Cleanup V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py"
      - "tests/test_atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py"
      - "docs/aion/AION_OWNER_STACK_POST_MERGE_CERTIFICATION_CLEANUP_V1.md"
      - ".github/workflows/aion-owner-stack-post-merge-certification-cleanup-v1.yml"

permissions:
  contents: read

jobs:
  owner-stack-post-merge-certification-cleanup-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Compile post-merge cleanup contract
        run: |
          python -m py_compile \
            atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py \
            tests/test_atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py

      - name: Run post-merge cleanup tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py'

      - name: Assert zero branch deletion authority
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_owner_stack_post_merge_certification_cleanup_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import git",
              "from git",
              "import requests",
              "urllib.request",
              "import socket",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          required = (
              '"branch_deletion_authorized": False',
              '"branch_deleted": False',
              '"repository_mutation_performed": False',
              '"automatic_branch_deletion_allowed": False',
              '"default_branch_deletion_allowed": False',
              '"protected_branch_deletion_allowed": False',
              '"deploy_authorized": False',
              '"worker_activation_authorized": False',
              '"provider_activation_authorized": False',
              '"production_persistence_activation_authorized": False',
              '"external_action_executed": False',
              '"executes_action": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
