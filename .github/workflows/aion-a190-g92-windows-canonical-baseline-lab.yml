name: A190 G92 Windows canonical baseline differential LAB
on:
  pull_request:
    paths:
      - '.github/workflows/aion-a190-g92-windows-canonical-baseline-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-base-windows-quality:
    name: G92 G89 baseline Windows Quality (genuine failures must remain RED)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exactly historical G89 SHA before G90 dependency changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b1808eb5bef98665c53ebf605cf3dcb322acdcb4
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install exact G89 requirements with same canonical test tooling
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
          python -m pip check
          grep -F 'streamlit==1.64.0' requirements.txt
          grep -F 'pypdf==6.19.0' requirements.txt
      - name: Execute unmodified canonical Quality under same A183 socket guard
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/run_a183_canonical_lab.py quality 2>&1 | tee g92-base-quality.log
          grep -F 'Ran 6449 tests' g92-base-quality.log
  candidate-windows-security-unittest:
    name: G92 G90 candidate canonical Security unittest / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install candidate canonical dependencies
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
          python -m pip check
      - name: Exact unmodified canonical Security unittest with socket guard
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/run_a183_canonical_lab.py security-unittest 2>&1 | tee g92-unittest.log
          grep -F 'Ran 368 tests' g92-unittest.log
  candidate-windows-security-pytest:
    name: G92 G90 candidate canonical Security pytest / Windows
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install candidate canonical dependencies
        shell: bash
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
          python -m pip install 'pytest==9.1.1' 'playwright==1.63.0' 'pip-audit==2.10.1' 'bandit==1.9.4'
          python -m pip check
      - name: Exact unmodified canonical Security pytest with socket guard
        shell: bash
        run: |
          set -o pipefail
          python -B scripts/run_a183_canonical_lab.py security-pytest 2>&1 | tee g92-pytest.log
          grep -F '2825 passed' g92-pytest.log
