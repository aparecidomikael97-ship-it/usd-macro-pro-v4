name: AION Independent Witness Architecture Review Reference

on:
  pull_request:
    paths:
      - "atlasquant_aion_witness_architecture_review_reference_v1.py"
      - "test_atlasquant_aion_witness_architecture_review_reference_v1.py"
      - "docs/aion/AION_CHECKPOINT_WITNESS_DUAL_DOMAIN_SHORTLIST_20261010.md"
      - ".github/workflows/aion-witness-architecture-review-reference-v1.yml"

permissions:
  contents: read

jobs:
  witness-design-no-go:
    name: Design blockers and live no-go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile design evaluator and negative tests
        run: python -B -m py_compile atlasquant_aion_witness_architecture_review_reference_v1.py test_atlasquant_aion_witness_architecture_review_reference_v1.py
      - name: Verify no-go under vendor/admin cost and restore adversarial cases
        run: python -B -m unittest test_atlasquant_aion_witness_architecture_review_reference_v1.py -v
