name: A295 dual local authority contract LAB

on:
  pull_request:
    paths:
      - 'labs/a295_dual_local_authority_contract_lab.py'
      - 'labs/test_a295_dual_local_authority_contract_lab.py'
      - 'docs/lab/aion_a295_dual_local_authority_contract_lab.md'
      - '.github/workflows/aion-a295-dual-local-authority-lab.yml'
      - 'aion_chat/store.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-lab:
    name: A295 synthetic dual-authority — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A295 dual-authority and A294-A290 regressions
        run: |
          python -m unittest -v labs.test_a295_dual_local_authority_contract_lab labs.test_a294_volatile_witness_sim_lab labs.test_a293_host_sqlite_boundary_lab labs.test_a292_staged_chat_write_inventory_lab labs.test_a291_chat_write_gate_commit_fence_lab labs.test_a290_sqlite_local_write_gate_lab
