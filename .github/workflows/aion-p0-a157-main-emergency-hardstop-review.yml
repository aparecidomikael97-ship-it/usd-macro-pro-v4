name: AION P0 A157 MAIN Emergency Hardstop Review (Draft NO-GO)
on:
  push:
    branches:
      - lab/aion-p0-a157-main-emergency-hardstop-review-20261022
  pull_request:
    paths:
      - '.github/workflows/autopilot-v107.yml'
      - '.github/workflows/coleta_automatica.yml'
      - '.github/workflows/aion-runtime-checkpoint-bootstrap.yml'
      - '.github/workflows/aion-runtime-checkpoint-migrate.yml'
      - '.github/workflows/atlasquant-checkpoint.yml'
      - '.github/workflows/atlasquant-source-backup.yml'
      - 'tools/aion_p0_a157_main_hardstop_review_lab.py'
      - 'tests/test_aion_p0_a157_main_hardstop_review_lab.py'
      - '.github/workflows/aion-p0-a157-main-emergency-hardstop-review.yml'
permissions:
  contents: read
jobs:
  review-only-hardstop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AION_WORKER_ENABLED: '0'
      AION_EXTERNAL_EXECUTION_ENABLED: '0'
      AION_MAIN_HARDSTOP_DRAFT_ONLY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned YAML source-analysis library
        run: python -m pip install "PyYAML==6.0.2"
      - name: Verify 24 emergency workflow source-only mutation tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_a157_main_hardstop_review_lab.py -v
      - name: Enforce all six workflows' checked-in source shapes
        run: python -B tools/aion_p0_a157_main_hardstop_review_lab.py --enforce
