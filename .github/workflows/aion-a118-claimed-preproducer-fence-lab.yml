name: AION A118 LAB dirty claimed pre-producer-state denial

on:
  pull_request:
    branches: [lab/aion-v16-a117-historic-inflight-deny-contract-20261016]
    paths:
      - "atlasquant_aion_execution_outbox.py"
      - "test_atlasquant_aion_a118_claimed_dispatch_possible_effect_fence.py"
      - ".github/workflows/aion-a118-claimed-preproducer-fence-lab.yml"

permissions:
  contents: read

jobs:
  preproducer_fence:
    name: A118 dirty claim never becomes clean producer denial (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Existing pinned requirements
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A118 dirty-CLAIMED negative tests and A110 A113 A107 strict gates
        run: >-
          python -m unittest -q
          test_atlasquant_aion_a118_claimed_dispatch_possible_effect_fence
          test_atlasquant_aion_a113_expired_claim_quarantine
          test_atlasquant_aion_a110_outbox_ambiguous_block
          test_atlasquant_aion_a107_bounded_authority_claims
          test_atlasquant_aion_outbox_fifo_local_terminal_denial
          test_atlasquant_aion_outbox_missing_predecessor_denial
          test_atlasquant_aion_execution_outbox.AionUntrustedPositiveAdmissionRedTests
