name: AION P0 H0 real SQLite boot observer (ALWAYS NO-GO LAB)

on:
  push:
    branches: [lab/aion-p0-h0-boot-first-effect-readonly-20261019]
    paths:
      - atlasquant_aion_p0_h0_sqlite_startup_observer_lab.py
      - test_aion_p0_h0_sqlite_startup_observer_lab.py
      - .github/workflows/aion-p0-h0-sqlite-startup-observer-lab.yml

permissions:
  contents: read

jobs:
  h0_sqlite_boot:
    name: H0 SQLite boot 16 + restore/witness regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 70
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pin original A118 and previous safe LAB SQLite / producer gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse c62fab663c6349d7320f7843c8d09587c514426b:aion_chat/store.py)" = "6df8ad55673acaca6eeeb0bc3e3898d7a10b08ba"
          test "$(git hash-object aion_chat/store.py)" = "951428ac5e76a0185c58121aa4fdb6823271b5b7"
          test "$(git hash-object atlasquant_aion_execution_outbox.py)" = "cd78ed43ad63888408eb599e28379c193c541de2"
          test "$(git hash-object atlasquant_aion_global_worker_readiness.py)" = "cac8ebb73cba3f2495b8aa47846f82ac2a3e1a29"
          echo "H0_PREVIOUS_BARRIERS_PINNED"
      - name: Install tracked Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover exactly 16 real SQLite boot contracts
        run: |
          python -B -c "import unittest; s=unittest.defaultTestLoader.loadTestsFromName('test_aion_p0_h0_sqlite_startup_observer_lab'); assert s.countTestCases()==16, s.countTestCases(); print('P0_H0_BOOT_16_CASES')"
      - name: Execute 16 H0 SQLite manual rollback / forged witness / CLI cases
        run: python -B -m unittest -v test_aion_p0_h0_sqlite_startup_observer_lab
      - name: Preserve 13 SQLite execution-restore hardstop scenarios
        run: python -B -m unittest -v test_aion_p0_sqlite_execution_restore_hardstop_lab
      - name: Preserve 8 concurrent / original restored UNCERTAIN scenarios
        run: python -B -m unittest -v test_aion_p0_original_sqlite_compat_concurrency_restore_lab
      - name: Preserve 5 A73 independent witness readiness denials
        run: python -B -m unittest -v test_atlasquant_aion_readiness_source_witness_a73
      - name: Preserve actual A79 local causal no-effect denials
        run: |
          python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79.A79CausalDenialTests.test_first_intent_rollback_does_not_license_send test_atlasquant_aion_h0_causal_denial_a79.A79CausalDenialTests.test_reconcile_and_dispatch_on_unknown_race_stay_non_effectful test_atlasquant_aion_h0_causal_denial_a79.A79CausalDenialTests.test_contradictory_claims_same_attempt_neither_unlocks
