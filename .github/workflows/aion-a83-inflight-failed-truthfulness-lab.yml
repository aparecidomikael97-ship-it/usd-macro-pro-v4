name: AION A83 LAB untrusted FAILED receipt truthfulness

on:
  pull_request:
    branches: [lab/aion-v16-a82-core-stack-integration-rehearsal-20261014]
    paths:
      - "atlasquant_aion_global_worker_inflight_reconciliation.py"
      - "test_atlasquant_aion_convergence.py"
      - ".github/workflows/quality-tests.yml"
      - "test_atlasquant_aion_a83_untrusted_failed_receipt.py"
      - ".github/workflows/aion-a83-inflight-failed-truthfulness-lab.yml"

permissions:
  contents: read

jobs:
  targeted:
    name: A83 strict local FAILED denial (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install existing dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: A83 and original A58/A66/A71 negative safety contracts
        run: >-
          python -m unittest -v
          test_atlasquant_aion_a83_untrusted_failed_receipt
          test_atlasquant_aion_inflight_untrusted_receipts_a58
          test_atlasquant_aion_inflight_empty_witness_a66
          test_atlasquant_aion_inflight_receipt_safety_a71
          test_atlasquant_aion_convergence
          test_quality_workflow_coverage
