name: AION Paper Journal Private Source Contract

on:
  pull_request:
    branches:
      - audit/aion-autopilot-durable-claim-no-retry-20261011
    paths:
      - "test_atlasquant_setup_journal.py"
      - ".github/workflows/aion-paper-journal-private-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-source-gate:
    name: Paper journal local + deny private remote / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Complete setup journal regression suite
        run: python -B -m unittest -v test_atlasquant_setup_journal
      - name: Independent private read and tenant source regression
        run: python -B -m unittest -v test_atlasquant_private_read_gate_v1 test_atlasquant_legacy_remote_tenant_quarantine_v1
