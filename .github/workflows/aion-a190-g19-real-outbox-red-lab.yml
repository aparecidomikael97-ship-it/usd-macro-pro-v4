name: A190 G19 real AION outbox offline RED LAB
on:
  pull_request:
    paths:
      - 'labs/a190/test_g19_real_outbox_offline_red_lab.py'
      - '.github/workflows/aion-a190-g19-real-outbox-red-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g19-real-outbox:
    name: G19 real AION outbox offline RED / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Real local outbox, synthetic SQLite only, no provider dispatch
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g19_real_outbox_offline_red_lab.py' -v 2>&1 | tee g19_real_outbox.log
          grep -F 'Ran 5 tests' g19_real_outbox.log
          grep -F 'G19_REAL_OUTBOX_ROLLBACK_RED=OLD_DB_FORGETS_PRIOR_ENQUEUE' g19_real_outbox.log
          grep -F 'G19_REAL_OUTBOX_SEMANTIC_ALIAS_RED=TWO_REQUEST_REFS_TWO_KEYS' g19_real_outbox.log
      - name: Mandatory no-go
        shell: bash
        run: |
          echo 'RED means vulnerabilities are reproduced, NOT remediated.'
          echo 'No provider send, no external witness, no real effects.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
