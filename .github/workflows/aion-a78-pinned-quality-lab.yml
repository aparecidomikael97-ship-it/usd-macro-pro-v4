name: AION A78 LAB pinned-base and canonical Quality coverage

on:
  pull_request:
    branches: [lab/aion-v16-a76-activation-coverage-recovery-20261014]
    paths:
      - "test_atlasquant_aion_convergence.py"
      - ".github/workflows/quality-tests.yml"
      - ".github/workflows/aion-a78-pinned-quality-lab.yml"

permissions:
  contents: read

jobs:
  contract:
    name: A78 exact-parent provenance and Quality coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Existing pinned requirements only
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
      - name: Verify exact PR base and head, no synthetic GITHUB_BASE_REF
        shell: bash
        run: |
          test "$GITHUB_BASE_REF" = "lab/aion-v16-a76-activation-coverage-recovery-20261014"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Existing main-provenance and test-selection contracts
        run: python -m unittest -v test_atlasquant_aion_convergence test_quality_workflow_coverage test_atlasquant_aion_activation_denial_coverage_a76 test_atlasquant_aion_f1_t1_untrusted_witness_intake_a75
