name: AION P0 H0 Outbox Cross Scope SQL Join Fence LAB

on:
  push:
    branches: [lab/aion-p0-h0-outbox-cross-scope-sql-join-fence-20261021]

permissions:
  contents: read

jobs:
  scope_join:
    name: Real SQLite cross-scope decision isolation - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: Eleven real SQLite cross-scope tampering and isolation tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: Forty-four real Outbox read-only recovery and rollback tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: Eight real Outbox restore claim tests
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
      - name: Sixty-four H0 A79 causal-denial tests
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
      - name: Fourteen provider capability hardstop tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_twilio_provider_no_go_lab.py -v
