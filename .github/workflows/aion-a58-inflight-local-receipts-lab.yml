name: AION A58 LAB red-team inflight local receipts

on:
  pull_request:
    branches: [lab/aion-v16-a57-f1-cross-boundary-tests-20261014]
    paths:
      - test_atlasquant_aion_inflight_untrusted_receipts_a58.py
      - .github/workflows/aion-a58-inflight-local-receipts-lab.yml
      - atlasquant_aion_global_worker_inflight_reconciliation.py

permissions:
  contents: read

jobs:
  untrusted-terminal-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Pinned dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install -r requirements.txt
      - name: Run A58 negative tests with external sockets denied
        run: |
          git rev-parse HEAD
          python - <<'PY'
          import socket, unittest
          def deny(*args, **kwargs):
              raise AssertionError("A58_LAB_NETWORK_FORBIDDEN")
          socket.socket.connect = deny
          names = [
              "test_atlasquant_aion_inflight_untrusted_receipts_a58",
              "test_atlasquant_aion_global_worker_inflight_reconciliation.GlobalInflightReconciliationTests.test_missing_receipt_is_reported_as_ambiguous_not_retried",
              "test_atlasquant_aion_global_worker_inflight_resolution.GlobalInflightResolutionTests.test_ambiguous_execution_cannot_be_cleared_by_safe_ceremony",
              "test_atlasquant_aion_f1_cross_boundary_a57",
          ]
          r = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.loadTestsFromNames(names)
          )
          raise SystemExit(0 if r.wasSuccessful() else 1)
          PY
