name: AION B2B Owner Renewal Action Ceremony

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_b2b_owner_renewal_action_preflight.py"
      - "atlasquant_aion_b2b_owner_renewal_action_ceremony.py"
      - "test_atlasquant_aion_b2b_owner_renewal_action_ceremony.py"
      - "docs/aion/AION_B2B_OWNER_RENEWAL_ACTION_CEREMONY_V1.md"
      - ".github/workflows/aion-b2b-owner-renewal-action-ceremony.yml"

permissions:
  contents: read

jobs:
  owner-renewal-action-ceremony:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install crypto dependency
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Compile recurring business action ceremony
        run: |
          python -m py_compile \
            atlasquant_aion_b2b_owner_renewal_action_preflight.py \
            atlasquant_aion_b2b_owner_renewal_action_ceremony.py \
            test_atlasquant_aion_b2b_owner_renewal_action_ceremony.py
      - name: Run recurring business action ceremony tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_b2b_owner_renewal_action_preflight.py \
            test_atlasquant_aion_b2b_owner_renewal_action_ceremony.py
      - name: Assert signed intent is not execution authority
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_b2b_owner_renewal_action_ceremony.py"
          ).read_text(encoding="utf-8")
          for marker in (
              '"AUTHORIZE_BUSINESS_ACTION"',
              '"DENY_BUSINESS_ACTION"',
              '"action_record_persisted": False',
              '"business_action_authorized": False',
              '"renewal_authorized",',
              '"termination_authorized",',
              '"generic_chat_instruction_accepted_as_action_authorization": False',
              '"executes_action": False',
          ):
              assert marker in source, marker

          for banned in (
              "append_checkpoint_patch(",
              "save_runtime_checkpoint(",
              "requests.post(",
              "requests.put(",
              "httpx.post(",
              "subprocess.",
              "send_whatsapp(",
              "send_email(",
              "deploy_to_production(",
          ):
              assert banned not in source, banned
          PY
