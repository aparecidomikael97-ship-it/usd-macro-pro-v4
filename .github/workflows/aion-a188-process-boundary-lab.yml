name: A188 Subprocess SQLite Trust-Limit LAB (Ubuntu Windows)
on:
  pull_request:
    paths:
      - 'labs/a188/sqlite_process_boundary_lab.py'
      - 'test_atlasquant_aion_process_boundary_a188_lab.py'
      - '.github/workflows/quality-tests.yml'
      - '.github/workflows/aion-a188-process-boundary-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  a188-falsifiable-process-boundary:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: A188 7 synthetic IPC gates and deliberately RED security cases
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -B -m unittest -v test_atlasquant_aion_process_boundary_a188_lab 2>&1 | tee a188_lab.log
          grep -q 'Ran 7 tests' a188_lab.log
          grep -q 'A188_ARBITRARY_SQL_OVER_BROKER=DENIED' a188_lab.log
          grep -q 'A188_INVALID_LOCAL_TOKEN=DENIED' a188_lab.log
          grep -q 'A188_REQUEST_ID_CONFLICT=DENIED_LOCAL_ONLY' a188_lab.log
          grep -q 'A188_POST_COMMIT_ACK_LOSS=UNCERTAIN_ZERO_AUTO_RESEND' a188_lab.log
          grep -q 'A188_EVENT_ID_NOT_EXTERNALLY_ATTESTED_DUPLICATE=REPRODUCED' a188_lab.log
          grep -q 'A188_SAME_HOST_RAW_FILE_BYPASS=REPRODUCED' a188_lab.log
          grep -q 'A188_FULL_DB_ROLLBACK_WITHOUT_EXTERNAL_WITNESS=REPRODUCED' a188_lab.log
      - name: Recheck A187 and A186 local admission tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest -v test_atlasquant_aion_strict_connection_a187_lab test_atlasquant_aion_connection_factory_a186_lab 2>&1 | tee a188_regression.log
          grep -q 'Ran 14 tests' a188_regression.log
      - name: Record qualification
        shell: bash
        run: |
          echo 'GREEN=negative controls reproduced, NOT an independent authority.'
          echo 'Same-host raw SQLite, local DB rollback and duplicate semantic effect remain RED.'
          echo 'No broker integration into AION runtime, no external service, no real send.'
          echo '0 of 6 P0 homologated; HARD NO-GO; UNCERTAIN; ZERO_AUTO_RESEND.'
