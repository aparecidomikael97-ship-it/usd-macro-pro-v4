name: AION Chat Signed Full Request V2 Reference CI

on:
  pull_request:
    paths:
      - "atlasquant_aion_chat_signed_full_request_review_v2.py"
      - "tests/test_atlasquant_aion_chat_signed_full_request_review_v2.py"
      - "docs/aion/AION_CHAT_SIGNED_FULL_PROVIDER_REQUEST_REVIEW_V2.md"
      - ".github/workflows/aion-chat-signed-full-provider-request-v2.yml"

permissions:
  contents: read

jobs:
  signed-full-request:
    name: V2 signed full request math / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: Compile reference and safety static check
        run: |
          python -m py_compile atlasquant_aion_chat_signed_full_request_review_v2.py tests/test_atlasquant_aion_chat_signed_full_request_review_v2.py
          python -c "from pathlib import Path; s=Path('atlasquant_aion_chat_signed_full_request_review_v2.py').read_text(); assert all(x not in s for x in ['execute_openai_answer(', 'requests.post(', 'Ed25519PrivateKey(', 'subprocess.Popen(', 'socket.socket('])"
      - name: Run V2 math, V1 regressions, persisted pending turn, provider and router
        run: |
          python -m pytest -q tests/test_atlasquant_aion_chat_signed_full_request_review_v2.py tests/test_atlasquant_aion_chat_signed_turn_review_v1.py tests/test_atlasquant_aion_chat_pending_model_turn_v1.py tests/test_atlasquant_aion_provider_full_request_binding_v1.py test_atlasquant_aion_provider.py
