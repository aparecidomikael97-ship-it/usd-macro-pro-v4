name: A312 OS principal and SQLite file permission LAB

on:
  pull_request:
    paths:
      - 'labs/a312_os_principal_file_boundary_lab.py'
      - 'labs/test_a312_os_principal_file_boundary_lab.py'
      - 'docs/lab/aion_a312_os_principal_boundary_audit_lab.md'
      - '.github/workflows/aion-a312-os-principal-boundary-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  os-principal-boundary-lab:
    name: A312 real OS file permission negative probe — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real filesystem and subprocess boundary in LAB
        run: |
          python -m unittest -v labs.test_a312_os_principal_file_boundary_lab labs.test_a311_process_isolated_sqlite_lab labs.test_a310_optin_sqlite_authorizer_composition_lab labs.test_a309_optin_private_helper_write_fence_lab labs.test_a246_chat_commit_uncertainty labs.test_a247_commit_pending_restart_veto labs.test_a292_staged_chat_write_inventory_lab labs.test_a293_host_sqlite_boundary_lab labs.test_a299_sqlite_native_p0_5_6_gap_lab
