name: A311 ephemeral SQLite process isolation LAB

on:
  pull_request:
    paths:
      - 'labs/a311_process_isolated_sqlite_lab.py'
      - 'labs/test_a311_process_isolated_sqlite_lab.py'
      - 'docs/lab/aion_a311_process_boundary_lab.md'
      - '.github/workflows/aion-a311-disposable-process-boundary-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disposable-process-boundary-lab:
    name: A311 temporary subprocess SQLite boundary — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: A311 process-isolated synthetic boundary and A310-A299 regressions
        run: |
          python -m unittest -v labs.test_a311_process_isolated_sqlite_lab labs.test_a310_optin_sqlite_authorizer_composition_lab labs.test_a309_optin_private_helper_write_fence_lab labs.test_a246_chat_commit_uncertainty labs.test_a247_commit_pending_restart_veto labs.test_a292_staged_chat_write_inventory_lab labs.test_a293_host_sqlite_boundary_lab labs.test_a299_sqlite_native_p0_5_6_gap_lab
