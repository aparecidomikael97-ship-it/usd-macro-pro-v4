name: AION A265 Reconcile Adapter NO-QUERY LAB

on:
  pull_request:
    paths:
      - atlasquant_aion_execution_outbox.py
      - labs/a259_synthetic_outbox_fixture.py
      - labs/test_a204_outbox_stale_absence_confirmed.py
      - labs/test_a213_outbox_untrusted_positive_hard_nogo.py
      - labs/test_a265_outbox_reconcile_adapter_isolation.py
      - docs/lab/aion_a265_reconcile_adapter_isolation.md
      - .github/workflows/aion-a265-reconcile-adapter-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  callback-free-reconcile:
    name: A265 normal Outbox never queries adapter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - name: Checkout only, NEVER send, deploy or change repository settings
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only requirements
        run: python -m pip install cryptography==44.0.3 requests==2.32.3 PyYAML==6.0.2
      - name: A265 core refusal and historical synthetic outbox/saga tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a265_outbox_reconcile_adapter_isolation
          labs.test_a264_ruleset_blueprint_review
          labs.test_a263_main_policy_readonly
          labs.test_a260_offline_runtime_bundle
          labs.test_a259_synthetic_callback_isolation
          labs.test_a258_external_proof_admission
          labs.test_a257_monotonic_origin_gate
          labs.test_a256_one_time_challenge_lab
          labs.test_a255_two_party_reservation_binding
          labs.test_a254_synthetic_origin_event_identity
          labs.test_a204_outbox_stale_absence_confirmed
          labs.test_a205_unverified_adapter_absence_no_resend
          labs.test_a213_outbox_untrusted_positive_hard_nogo
          labs.test_a243_signed_first_attempt
          test_atlasquant_aion_execution_outbox
          test_atlasquant_aion_execution_saga
          test_atlasquant_aion_chaos_campaign
