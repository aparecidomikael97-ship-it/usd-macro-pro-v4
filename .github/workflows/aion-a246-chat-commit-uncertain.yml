name: AION A246 Chat Commit ACK Uncertain HARD NO-GO Lab

on:
  pull_request:
    paths:
      - aion_chat/store.py
      - labs/test_a246_chat_commit_uncertainty.py
      - docs/lab/aion_a246_chat_commit_uncertainty.md
      - .github/workflows/aion-a246-chat-commit-uncertain.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-commit-unknown:
    name: A246 commit ACK lost, no blind retry (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 12
    steps:
      - name: Checkout pinned source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: python -m pip install cryptography==44.0.3 requests==2.32.3
      - name: A246 write-uncertainty and previous SQLite regressions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m unittest -v
          labs.test_a246_chat_commit_uncertainty
          labs.test_a245_sqlite_connect_path_fence
          labs.test_a240_sqlite_pathname_fence
          labs.test_a241_outbox_store_binding
          labs.test_a242_first_attempt_guard
          labs.test_a233_native_sqlite_p0_repro
          test_atlasquant_aion_chat_staged_runtime_resilience
