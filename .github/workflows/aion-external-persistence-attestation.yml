name: AION External Persistence Attestation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlasquant_aion_memory.py"
      - "atlasquant_aion_checkpoint_master.py"
      - "atlasquant_aion_core_completion_review.py"
      - "atlasquant_aion_core_freeze_preflight.py"
      - "atlasquant_aion_external_persistence_attestation.py"
      - "test_atlasquant_aion_v221_core_completion_review.py"
      - "test_atlasquant_aion_v222_core_freeze_preflight.py"
      - "test_atlasquant_aion_v223_external_persistence_attestation.py"
      - "test_atlasquant_aion_memory.py"
      - "test_atlasquant_aion_v28_runtime_persistence_cas_recovery_redteam.py"
      - "docs/aion/AION_V223_EXTERNAL_PERSISTENCE_ATTESTATION.md"
      - "docs/adr/ADR-0022-external-checkpoint-persistence-attestation.md"
      - ".github/workflows/aion-external-persistence-attestation.yml"

permissions:
  contents: read

concurrency:
  group: aion-external-persistence-attestation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence-attestation:
    name: V2.23 persistence attestation and signature-preparation boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install deterministic attestation dependencies
        run: |
          python -m pip install pip==26.2.1
          pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Compile V2.21-V2.23 persistence chain
        run: |
          python -m py_compile \
            atlasquant_aion_memory.py \
            atlasquant_aion_checkpoint_master.py \
            atlasquant_aion_core_completion_review.py \
            atlasquant_aion_core_freeze_preflight.py \
            atlasquant_aion_external_persistence_attestation.py \
            test_atlasquant_aion_v221_core_completion_review.py \
            test_atlasquant_aion_v222_core_freeze_preflight.py \
            test_atlasquant_aion_v223_external_persistence_attestation.py \
            test_atlasquant_aion_memory.py \
            test_atlasquant_aion_v28_runtime_persistence_cas_recovery_redteam.py

      - name: Run V2.23 external persistence attestation red-team
        run: |
          python -m pytest -q -s test_atlasquant_aion_v223_external_persistence_attestation.py

      - name: Re-run V2.22 preflight boundary
        run: |
          python -m pytest -q -s test_atlasquant_aion_v222_core_freeze_preflight.py

      - name: Re-run V2.21 review chain
        run: |
          python -m pytest -q -s test_atlasquant_aion_v221_core_completion_review.py

      - name: Re-run Checkpoint Mestre and runtime persistence contracts
        run: |
          python -m pytest -q -s \
            test_atlasquant_aion_core_v23_memory_checkpoint.py \
            test_atlasquant_aion_memory.py \
            test_atlasquant_aion_v28_runtime_persistence_cas_recovery_redteam.py
