name: AION Runtime Source Binding Reference V1

on:
  pull_request:
    paths:
      - "atlasquant_aion_runtime_source_boundary_ref_v1.py"
      - "test_atlasquant_aion_runtime_source_boundary_ref_v1.py"
      - "docs/aion/AION_RUNTIME_SOURCE_BINDING_REFERENCE_20261010.md"
      - ".github/workflows/aion-runtime-source-binding-ref-v1.yml"

permissions:
  contents: read

jobs:
  source-binding-offline:
    name: Source origin negative offline / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install pinned crypto dependency only
        run: python -m pip install cryptography==50.0.2
      - name: Compile offline reference and tests
        run: python -B -m py_compile atlasquant_aion_runtime_source_boundary_ref_v1.py test_atlasquant_aion_runtime_source_boundary_ref_v1.py
      - name: Verify negative source-binding and monotonic floor contracts
        run: python -B -m unittest test_atlasquant_aion_runtime_source_boundary_ref_v1.py -v
