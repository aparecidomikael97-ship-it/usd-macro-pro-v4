name: A190 G37 authority-signed semantic custody LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g37_signed_semantic_witness_lab.py'
      - 'labs/a190/g37_real_outbox_authority_gate_lab.py'
      - 'labs/a190/g37_test_fixtures_lab.py'
      - 'labs/a190/test_g37_authority_witness_contract_lab.py'
      - 'labs/a190/test_g37_real_outbox_authority_recovery_lab.py'
      - '.github/workflows/aion-a190-g37-authority-semantic-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g37-separate-issuer:
    name: G37 signed semantic custody / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install test-only cryptography
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: G37 authority permit gate and real Outbox read-only recovery
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g37_*.py' -v 2>&1 | tee g37.log
          grep -F 'Ran 34 tests' g37.log
          grep -F 'G37_RAW_DIGEST_DENIED_GREEN=NO_HOST_SUPPLIED_SNAPSHOT_RESERVATION' g37.log
          grep -F 'G37_ISSUER_GATE_GREEN=AUTHORITY_SIGNATURE_REQUIRED' g37.log
          grep -F 'G37_SEMANTIC_DEDUP_GREEN=TWO_REQUEST_ALIASES_ONE_WITNESS_RESERVATION' g37.log
          grep -F 'G37_DOUBLE_PIN_RECOVERY_GREEN=MATCH_ONLY_UNCERTAIN_ZERO_SEND' g37.log
          grep -F 'G37_COROLLBACK_RED=SIGNATURES_VALID_AFTER_SAME_HOST_RESTORE' g37.log
          grep -F 'G37_HOST_WITNESS_ROLLBACK_RED=COUNTER_REUSED_AFTER_DB_RESTORE' g37.log
          grep -F 'G37_ISSUER_CAPTURE_RED=LOCAL_KEY_CAN_SIGN_FABRICATED_EVENT' g37.log
          grep -F 'G37_OUTBOX_ROLLBACK_RED=CERTIFICATE_ALONE_DOES_NOT_PIN_LATEST_STATE' g37.log
      - name: G36-G30 inherited adversarial regressions
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g36_*.py' -v 2>&1 | tee g36.log
          grep -F 'Ran 20 tests' g36.log
          python -B -m unittest discover -s labs/a190 -p 'test_g35_*.py' -v 2>&1 | tee g35.log
          grep -F 'Ran 18 tests' g35.log
          python -B -m unittest discover -s labs/a190 -p 'test_g34_*.py' -v 2>&1 | tee g34.log
          grep -F 'Ran 16 tests' g34.log
          python -B -m unittest discover -s labs/a190 -p 'test_g33_*.py' -v 2>&1 | tee g33.log
          grep -F 'Ran 24 tests' g33.log
          python -B -m unittest discover -s labs/a190 -p 'test_g32_*.py' -v 2>&1 | tee g32.log
          grep -F 'Ran 20 tests' g32.log
          python -B -m unittest discover -s labs/a190 -p 'test_g31_*.py' -v 2>&1 | tee g31.log
          grep -F 'Ran 18 tests' g31.log
          python -B -m unittest discover -s labs/a190 -p 'test_g30_*.py' -v 2>&1 | tee g30.log
          grep -F 'Ran 23 tests' g30.log
      - name: Mandatory independent trust NOT proven
        shell: bash
        run: |
          echo 'Keys and data originate from the same disposable test host.'
          echo 'Authority signature does not authenticate a real business event.'
          echo 'No real independent custody, antirollback, provider receipt or send.'
          echo 'No main/merge/deploy, Worker, spend, customers or P0 homologation.'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND.'
