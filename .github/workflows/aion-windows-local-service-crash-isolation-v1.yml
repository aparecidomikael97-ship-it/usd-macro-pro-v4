name: AION Windows Local Service Crash Isolation V1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "atlasquant_aion_windows_local_service_crash_isolation_v1.py"
      - "tests/test_atlasquant_aion_windows_local_service_crash_isolation_v1.py"
      - "docs/aion/AION_WINDOWS_LOCAL_SERVICE_CRASH_PROCESS_ISOLATION_V1.md"
      - ".github/workflows/aion-windows-local-service-crash-isolation-v1.yml"

permissions:
  contents: read

jobs:
  windows-local-service-crash-isolation-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned crypto runtime dependency
        run: |
          python -m pip install --disable-pip-version-check "cryptography==50.0.2"

      - name: Compile Windows local service isolation
        run: |
          python -m py_compile \
            atlasquant_aion_windows_local_service_crash_isolation_v1.py \
            tests/test_atlasquant_aion_windows_local_service_crash_isolation_v1.py

      - name: Run Windows local service isolation tests
        run: |
          python -m unittest discover -v -s tests \
            -p 'test_atlasquant_aion_windows_local_service_crash_isolation_v1.py'

      - name: Assert service layer remains non-installing and network-free
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path(
              "atlasquant_aion_windows_local_service_crash_isolation_v1.py"
          ).read_text(encoding="utf-8")

          forbidden_imports = (
              "import subprocess",
              "from subprocess",
              "import requests",
              "from requests",
              "urllib.request",
              "import socket",
              "import httpx",
              "from github",
              "import github",
              "import git",
              "from git",
              "win32service",
              "win32serviceutil",
              "win32api",
          )
          for marker in forbidden_imports:
              assert marker not in source, marker

          forbidden_live_material = (
              "api.github.com",
              "GITHUB_TOKEN",
              "GH_TOKEN",
          )
          for marker in forbidden_live_material:
              assert marker not in source, marker

          required = (
              '"windows_service_installed": False',
              '"scheduled_task_installed": False',
              '"process_spawned_by_this_module": False',
              '"system_account_allowed": False',
              '"local_system_allowed": False',
              '"atomic_lock_file_implemented": True',
              '"lock_file_auto_deleted_when_stale": False',
              '"stale_lock_requires_process_liveness_attestation": True',
              '"signed_owner_reopen_required_after_restart": True',
              '"tcp_listener_enabled": False',
              '"http_listener_enabled": False',
              '"remote_control_enabled": False',
              '"lan_control_enabled": False',
              '"command_dispatch_over_health_ipc_allowed": False',
              '"repository_mutation_dispatch_over_health_ipc_allowed": False',
              '"credential_exchange_over_health_ipc_allowed": False',
              '"automatic_restart_authorized": False',
              '"automatic_retry_allowed": False',
              '"repository_mutation_replay_allowed": False',
              '"consumed_authorization_auto_released": False',
              '"owner_private_key_loaded": False',
              '"real_github_credentials_loaded": False',
              '"github_api_called": False',
              '"network_called": False',
              '"live_repository_mutation_authorized": False',
              '"live_repository_mutation_performed": False',
              '"production_repository_mutation_performed": False',
              '"deploy_executed": False',
              '"worker_activated": False',
              '"provider_activated": False',
              '"production_persistence_activated": False',
          )
          for marker in required:
              assert marker in source, marker
          PY
