name: AION P0 LAB SQLite Pre19 Read Write Historical Candidates (NO-GO offline)

on:
  push:
    branches: [lab/aion-p0-sqlite-historical-candidate-read-write-20261020]

permissions:
  contents: read

jobs:
  lab_root_coverage:
    name: Execute every declared LAB-only root module (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Nine actual host cross-thread and Saga atomicity candidate diagnostics
        run: python -B -m unittest discover -s tests -p test_aion_p0_sqlite_pre19_read_write_candidates_lab.py -v
      - name: Original vs later SQLite Git commit parent-child causality (12)
        run: python -B -m unittest discover -s tests -p test_aion_p0_sqlite_original_vs_lab_commit_lineage.py -v
      - name: Exact six P0 exit evidence and historical Quality 50-to-51 provenance (12)
        run: python -B -m unittest discover -s tests -p test_aion_p0_six_exit_evidence_gap_lab.py -v
      - name: SQLite unchanged test-source red-green supporting evidence (8)
        run: python -B -m unittest discover -s tests -p test_aion_p0_sqlite_supporting_red_green_forensic_lab.py -v
      - name: Independent H0 IAM two-sided separation and highwater freshness (22)
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_iam_issuer_freshness_separation_lab.py -v
      - name: Independent S3 version readback and retention shape adversarial tests (22)
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_s3_version_readback_evidence_lab.py -v
      - name: NEW three-domain H0 rollback and actual Outbox lost-history cases (17)
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_three_domain_rollback_scenarios_lab.py -v
      - name: LAB root module 01 test_aion_m71_execution_fresh_source_denial_lab
        run: python -B -m unittest -v test_aion_m71_execution_fresh_source_denial_lab
      - name: LAB root module 02 test_aion_p0_h0_boundary_drift_mutations_lab
        run: python -B -m unittest -v test_aion_p0_h0_boundary_drift_mutations_lab
      - name: LAB root module 03 test_aion_p0_h0_custody_two_domain_model_lab
        run: python -B -m unittest -v test_aion_p0_h0_custody_two_domain_model_lab
      - name: LAB root module 04 test_aion_p0_h0_iam_finops_preflight_lab
