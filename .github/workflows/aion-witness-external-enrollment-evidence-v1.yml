name: AION Witness Owner Enrollment Evidence No-Go V1

on:
  pull_request:
    paths:
      - "docs/aion/AION_EXTERNAL_WITNESS_OWNER_DECISION_PLAN_20261010.md"
      - "docs/aion/evidence/AION_WITNESS_EXTERNAL_ENROLLMENT_GATE_V1.json"
      - "test_atlasquant_aion_witness_external_enrollment_evidence_v1.py"
      - ".github/workflows/aion-witness-external-enrollment-evidence-v1.yml"
      - "atlasquant_aion_global_worker_source_gate_v1.py"
      - "atlasquant_aion_global_worker.py"
      - "atlasquant_aion_global_worker_readiness.py"

permissions:
  contents: read

jobs:
  external-trust-not-assumed:
    name: P0 physical and provider evidence still blocked / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile static evidence manifest tests
        run: python -B -m py_compile test_atlasquant_aion_witness_external_enrollment_evidence_v1.py
      - name: Assert no external authority, no false budget quote and no Worker bypass
        run: python -B -m unittest test_atlasquant_aion_witness_external_enrollment_evidence_v1.py -v
