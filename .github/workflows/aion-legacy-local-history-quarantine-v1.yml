name: AION Legacy Local History Quarantine V1

on:
  pull_request:
    paths:
      - "usd_macro_pro_v4_cloud.py"
      - "test_atlasquant_legacy_local_history_quarantine_v1.py"
      - ".github/workflows/aion-legacy-local-history-quarantine-v1.yml"

permissions:
  contents: read

jobs:
  offline-quarantine:
    name: Local Parquet containment / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile isolated static tests (no application imports)
        run: python -B -m py_compile test_atlasquant_legacy_local_history_quarantine_v1.py usd_macro_pro_v4_cloud.py
      - name: Verify legacy private local history is quarantined and untouched
        run: python -B -m unittest test_atlasquant_legacy_local_history_quarantine_v1.py -v
