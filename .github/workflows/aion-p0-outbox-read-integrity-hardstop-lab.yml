name: AION P0 LAB Outbox Read Projection Integrity Hardstop

on:
  push:
    branches: [lab/aion-p0-outbox-read-integrity-fail-closed-20261021]

permissions:
  contents: read

jobs:
  read_integrity:
    name: Outbox read projections fail-closed on tampered local decisions - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked project dependencies
        run: python -m pip install -r requirements.txt
      - name: 26 tampered read projection, forensic quarantine and blocked callback cases
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_read_integrity_hardstop_lab.py -v
      - name: 9 parent transaction hardstop regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_parent_transaction_denial_lab.py -v
      - name: 9 Saga first-stage atomic CAS regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_atomic_scoped_stage_cas_lab.py -v
      - name: 12 internal Saga cross-scope helpers
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: 16 Saga and Outbox original state regressions
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: 11 Outbox scoped JOIN integrity regressions
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: 44 real SQLite Outbox recovery characterization
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 64 H0 A79 fail-closed denials
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
