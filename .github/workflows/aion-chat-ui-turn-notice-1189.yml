name: AION UI Turn Notice #1189

on:
  pull_request:
    branches: [main]
    paths:
      - "aion_chat/web/command-chat.js"
      - "aion_chat/web/command-chat.css"
      - "test_atlasquant_aion_chat_command_browser.py"
      - ".github/workflows/aion-chat-ui-turn-notice-1189.yml"
permissions:
  contents: read
jobs:
  truthful-turn-ui:
    name: AION turn notice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest==9.1.1 playwright==1.63.0
      - name: Install Chromium on Linux
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Validate authentic chat contract and responsive Chromium UX
        run: python -m pytest -q test_atlasquant_aion_chat_workspace_ui.py test_atlasquant_aion_chat_command_browser.py
