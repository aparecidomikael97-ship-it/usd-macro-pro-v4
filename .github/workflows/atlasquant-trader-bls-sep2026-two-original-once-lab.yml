name: AtlasQuant BLS September 2026 Two Original Releases LAB

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/atlasquant-trader-bls-sep2026-two-original-once-lab.yml"
  push:
    branches:
      - lab/trader-bls-sep2026-cpi-ppi-original-pair-20261115
    paths:
      - ".github/workflows/atlasquant-trader-bls-sep2026-two-original-once-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  september-cpi-ppi-originals-once:
    name: One BLS CPI + one BLS PPI GET, then replay (NO-GO)
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # runner.temp is only valid in a STEP env context.
    steps:
      - name: Checkout research branch without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Offline mock HTTP, time, original integrity and no-trade tests FIRST
        shell: bash
        run: |
          python -m unittest -q test_atlasquant_trader_us_bls_sep2026_original_pair_once_lab
      - name: Attempt exactly one HTTPS GET per OFFICIAL September release, after release
        env:
          ORIGINAL_ROOT: ${{ runner.temp }}/bls_sep2026_cpi_ppi_originals
        shell: bash
        run: |
          mkdir -p "$ORIGINAL_ROOT"
          python -m atlasquant_trader_us_bls_sep2026_original_pair_once_lab --capture-official --output-root "$ORIGINAL_ROOT"
      - name: Replay exact saved original bytes and print documentary-only provenance
        env:
          ORIGINAL_ROOT: ${{ runner.temp }}/bls_sep2026_cpi_ppi_originals
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timezone
          from atlasquant_trader_us_bls_sep2026_original_pair_once_lab import (
              SPECS,replay_sep2026_bls_original_pair_lab,
          )
          root=Path(os.environ["ORIGINAL_ROOT"])
          dirs=[p for p in root.iterdir() if p.is_dir() and
                p.name.startswith("US_BLS_SEP2026_CPI_PPI_")]
          assert len(dirs)==1,"MISSING_OR_DUPLICATED_BLS_SEP2026_PAIR"
          rec=json.loads((dirs[0]/"receipt.json").read_text("utf-8"))
          end=datetime.fromisoformat(rec["last_capture_utc"].replace("Z","+00:00")).astimezone(timezone.utc)
          checked=replay_sep2026_bls_original_pair_lab(
              output_root=root,archive_basename=dirs[0].name,as_of_utc=end)
          assert checked["documentary_original_count"]==2
          assert checked["paired_headline_sa_mom_pct"]=={"CPI":"0.6","PPI":"1.3"}
          assert checked["consensus_pre_event_authenticated"] is False
          assert checked["first_print_original_independently_authenticated"] is False
          assert checked["independent_fx_forecast_trials"]==0
          assert checked["out_of_sample_accuracy"] is None
          assert checked["trade_authorized"] is False
          assert checked["original_fx28_672_slots_modified"] is False
          print("LAB_BLS_SEP2026_TWO_REAL_POST_RELEASE_ORIGINALS_REPLAYED")
          print(json.dumps({
              "period":"2026-09",
              "publisher":"BLS",
              "capture_receipt_timestamp_utc_claim":rec["last_capture_utc"],
              "headlines_sa_mom_pct":checked["paired_headline_sa_mom_pct"],
              "source_sha256":checked["paired_original_source_sha256"],
              "original_byte_sizes":{k:rec["sources"][k]["raw_bytes"] for k in SPECS},
              "pre_event_consensus_verified":False,
              "pre_event_forecasts_verified":0,
              "new_oos_trials_verified":0,
              "fx28_slots_modified":False,
              "status":"LAB/AGUARDAR/HARD NO-GO",
          },indent=2,sort_keys=True))
          PY
      - name: Retain historical original source HTML and time receipts for 30 days
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: atlasquant-bls-sep2026-cpi-ppi-postrelease-originals-lab
          path: ${{ runner.temp }}/bls_sep2026_cpi_ppi_originals/US_BLS_SEP2026_CPI_PPI_*/
          if-no-files-found: error
          retention-days: 30

# No cron: this is a one-time post-event documentary collection only.
# Both historical releases were 14 and 15 October 2026 at 8:30 ET.
# No publisher first-seen attestation, pre-event consensus, first-print,
# forecast accuracy, broker certification, orders, or deploy. FX28 untouched.
