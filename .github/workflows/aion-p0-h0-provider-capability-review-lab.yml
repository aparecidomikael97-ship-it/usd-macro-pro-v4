name: AION P0 H0 LAB Provider Capability Claims Must Never Authorize (NO-GO)

on:
  push:
    branches: [lab/aion-p0-h0-provider-capability-triage-20261021]

permissions:
  contents: read

jobs:
  deny_caller_claims:
    name: Caller-supplied provider claims always denied - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies and test harness
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1
      - name: 44 adversarial supplier capability review tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_provider_capability_review_lab.py -v
      - name: 55 read-only real Outbox recovery triage tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 8 real Outbox restore and first-claim gap characterizations
        run: python -B -m unittest -v test_aion_p0_h0_real_outbox_restore_claim_negative_lab
