name: AION G75 external first-send containment LAB
on:
  pull_request:
    paths:
      - 'atlasquant_external_first_send_gate.py'
      - 'atlasquant_aion_provider.py'
      - 'atlasquant_neural_tts.py'
      - 'labs/a190/test_g74_operational_first_send_red_lab.py'
      - 'labs/a190/test_g75_external_first_send_lab.py'
      - '.github/workflows/aion-g75-external-first-send-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g75-negative-boundary:
    name: G75 deny by default / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned local test dependency
        shell: bash
        run: python -m pip install 'requests==2.34.2'
      - name: Offline denied first send tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest -v labs.a190.test_g74_operational_first_send_red_lab labs.a190.test_g75_external_first_send_lab 2>&1 | tee g75.log
          grep -F 'Ran 16 tests' g75.log
          grep -F 'OK' g75.log
