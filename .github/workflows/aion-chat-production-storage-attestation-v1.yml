name: AION Chat Production Storage Attestation V1

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "atlasquant_aion_chat_production_storage_attestation_v1.py"
      - "test_atlasquant_aion_chat_production_storage_attestation_v1.py"
      - "docs/aion/AION_CHAT_PRODUCTION_STORAGE_ATTESTATION_V1.md"
      - ".github/workflows/aion-chat-production-storage-attestation-v1.yml"
      - ".github/workflows/quality-tests.yml"

permissions:
  contents: read

jobs:
  production-storage-attestation-v1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Compile attestation contract
        run: |
          python -m py_compile \
            atlasquant_aion_chat_production_storage_attestation_v1.py \
            test_atlasquant_aion_chat_production_storage_attestation_v1.py
      - name: Run storage attestation design tests
        run: |
          python -m unittest -q \
            test_atlasquant_aion_chat_production_storage_attestation_v1.py
      - name: Assert zero provisioning or execution side effects
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("atlasquant_aion_chat_production_storage_attestation_v1.py").read_text(encoding="utf-8")
          for banned in (
              "import requests",
              "import socket",
              "import subprocess",
              "os.getenv(",
              "sqlite3.connect(",
              "psycopg",
              "sqlalchemy",
              "requests.post(",
              "subprocess.run(",
              "create_database(",
              "connect(",
          ):
              assert banned not in source, banned
          for marker in (
              '"READY_FOR_PRODUCTION_CHAT_STORAGE_ATTESTATION_REVIEW"',
              '"SUPPLY_ATTESTED_STORAGE_TO_PRODUCTION_CHAT_ACTIVATION"',
              '"EPHEMERAL_RUNTIME_FILESYSTEM_FORBIDDEN"',
              '"database_created"',
              '"connection_opened"',
              '"external_action_executed"',
          ):
              assert marker in source, marker
          PY
