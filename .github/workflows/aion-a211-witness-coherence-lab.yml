name: AION A211 Independent Witness Coherence LAB

on:
  pull_request:
    paths:
      - "labs/a211_claimed_witness_coherence.py"
      - "labs/test_a211_claimed_witness_coherence.py"
      - "docs/lab/aion_a211_independent_witness_architecture.md"
      - ".github/workflows/aion-a211-witness-coherence-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-witness-consistency:
    name: A211 offline comparison is NOT independent attestation / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install regression import dependency
        run: python -m pip install requests==2.34.2
      - name: A211 plus A210 A209 A208 and A206 regressions (A207 RED stays independent)
        run: python -B -m unittest -v labs.test_a211_claimed_witness_coherence labs.test_a210_offline_root_rotation_proposal labs.test_a209_root_provenance_failclosed labs.test_a208_independent_receipt_preflight labs.test_a206_late_send_outcome_cas
