name: AION P0 H0 LAB Claim Release Post CAS Atomic Integrity

on:
  push:
    branches: [lab/aion-p0-h0-post-cas-claim-release-atomic-fence-20261021]

permissions:
  contents: read

jobs:
  claim_release:
    name: Claim + expired lease post-CAS SQLite rollback - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      AION_WORKER_ENABLED: "0"
      AION_EXTERNAL_EXECUTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install tracked dependencies
        run: python -m pip install -r requirements.txt
      - name: 31 RED-first actual SQLite post-CAS claim and release tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_post_cas_claim_release_atomic_lab.py -v
      - name: 14 first attempt Saga reentry denial tests
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_saga_existing_first_intent_reentry_lab.py -v
      - name: 15 Outbox Saga staging atomicity
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_enqueue_commit_integrity_lab.py -v
      - name: 16 expired lease integrity pre-update checks
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_expired_lease_integrity_fence_lab.py -v
      - name: 26 Outbox forensic quarantine
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_read_integrity_hardstop_lab.py -v
      - name: 9 Outbox parent transaction denial
        run: python -B -m unittest discover -s tests -p test_aion_p0_outbox_parent_transaction_denial_lab.py -v
      - name: 9 Saga stage CAS
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_atomic_scoped_stage_cas_lab.py -v
      - name: 12 Saga scoped internal helper guards
        run: python -B -m unittest discover -s tests -p test_aion_p0_saga_scoped_internal_helpers_lab.py -v
      - name: 16 Saga Outbox local state tests
        run: python -B -m unittest -v test_aion_p0_outbox_saga_internal_state_lab
      - name: 11 Outbox scoped SQL joins
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_outbox_cross_scope_sql_join_fence_lab.py -v
      - name: 44 SQLite recovery triage
        run: python -B -m unittest discover -s tests -p test_aion_p0_h0_recovery_triage_readonly_lab.py -v
      - name: 64 H0 A79 causal denial
        run: python -B -m unittest -v test_atlasquant_aion_h0_causal_denial_a79
