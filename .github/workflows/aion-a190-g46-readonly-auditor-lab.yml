name: A190 G46 scoped orphan and strict read-only JSON LAB
on:
  pull_request:
    paths:
      - 'labs/a190/g43_projection_readonly_auditor_lab.py'
      - 'labs/a190/test_g46_readonly_adversarial_lab.py'
      - '.github/workflows/aion-a190-g46-readonly-auditor-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g46-auditor:
    name: G46 immutable SQLite audit / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install minimal LAB dependency only
        shell: bash
        run: python -m pip install 'cryptography==46.0.3'
      - name: Run ten G46 read-only adversarial tests
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g46_*.py' -v 2>&1 | tee g46.log
          grep -F 'Ran 10 tests' g46.log
          grep -F 'G46_ORPHAN_OWNER_GREEN=SCOPED_JOIN' g46.log
          grep -F 'G46_ORPHAN_TENANT_GREEN=SCOPED_JOIN' g46.log
          grep -F 'G46_ORPHAN_WORKSPACE_GREEN=SCOPED_JOIN' g46.log
          grep -F 'G46_DUPLICATE_STATE_GREEN=AMBIGUOUS_JSON_DENIED' g46.log
          grep -F 'G46_NEGATIVE_ATTEMPTS_GREEN=SQL_INVARIANT_INDEPENDENT' g46.log
          grep -F 'G46_BOOL_ATTEMPTS_GREEN=STRICT_TYPE' g46.log
          grep -F 'G46_READONLY_GREEN=NO_REPAIR_NO_PAYLOAD' g46.log
      - name: Existing G45 G44 G43 regression
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s labs/a190 -p 'test_g45_*.py' -v 2>&1 | tee g45.log
          grep -F 'Ran 7 tests' g45.log
          python -B -m unittest discover -s labs/a190 -p 'test_g44_*.py' -v 2>&1 | tee g44.log
          grep -F 'Ran 39 tests' g44.log
          python -B -m unittest discover -s labs/a190 -p 'test_g43_*.py' -v 2>&1 | tee g43.log
          grep -F 'Ran 32 tests' g43.log
      - name: Hard no-go authority declaration
        shell: bash
        run: |
          echo 'G46 is diagnostic only; NOT trusted receipt, permission or provider proof'
          echo 'External authority, independent custodian and H0 rollback remain unproven'
          echo 'No merge, main, deploy, Worker, customer, provider send, secret or spend'
          echo '0/6 P0 | HARD NO-GO | UNCERTAIN | ZERO_AUTO_RESEND'
